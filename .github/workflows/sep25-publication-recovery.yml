name: Sep25 publication runtime audit
on:
  push:
    branches: [vm-ops-control]
    paths: [.github/workflows/sep25-publication-recovery.yml]
permissions:
  contents: read
concurrency:
  group: index-production-vm-ops-v2
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'BeBoop-Beep/EVRCalculator' && github.ref == 'refs/heads/vm-ops-control'
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 3
    steps:
      - name: Read-only runtime and publication identity
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git fetch origin main --quiet
          export PYTHONPATH="$PWD"
          .venv/bin/python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from backend.alerts.post_scrape_publication_watchdog import _default_all_publication_processes, _lock_is_held, PUBLICATION_LOCK_PATH
          from backend.db.clients.supabase_client import create_service_role_client
          def git(*args):
              p=subprocess.run(['git',*args],capture_output=True,text=True)
              return p.stdout.strip() if p.returncode==0 else 'UNAVAILABLE'
          target='0ca31bab086f63f48b472d8119741619ad43d7ee'
          paths=['backend/db/services/market_publication_sources.py','backend/scripts/build_pokemon_explore_set_value_snapshot.py','backend/scripts/repair_missing_market_set_value_history.py','backend/scripts/refresh_stale_public_snapshots.py','backend/alerts/post_scrape_publication_watchdog.py']
          print('runtime_identity='+json.dumps({'head':git('rev-parse','HEAD'),'branch':git('branch','--show-current'),'originMain':git('rev-parse','origin/main'),'recentCommits':git('log','-4','--format=%h %s'),'localOnlyCommits':git('log','origin/main..HEAD','--format=%h %s'),'trackedDirty':git('status','--porcelain','--untracked-files=no'),'differentPaths':git('diff','--name-only','origin/main','HEAD').splitlines(),'targetAncestorExit':subprocess.run(['git','merge-base','--is-ancestor',target,'HEAD']).returncode}),flush=True)
          print('runtime_blobs='+json.dumps({path:{'local':git('hash-object',path),'target':git('rev-parse',target+':'+path)} for path in paths}),flush=True)
          print('publication_identity='+json.dumps({'held':_lock_is_held(PUBLICATION_LOCK_PATH),'processes':_default_all_publication_processes()}),flush=True)
          c=create_service_role_client()
          print('global='+json.dumps(c.table('pokemon_explore_set_value_snapshot_latest').select('market_date,set_count,market_count,updated_at').eq('tcg','pokemon').eq('scope','market').limit(1).execute().data),flush=True)
          p=Path('publication.log')
          if p.exists():
              with p.open('rb') as f:
                  f.seek(max(0,p.stat().st_size-45000)); lines=f.read().decode('utf-8',errors='replace').splitlines()
              signals=[s[:900] for s in lines if 'HTTP Request:' not in s and len(s)<1800]
              print('recent_signals:\n'+'\n'.join(signals[-22:]),flush=True)
          PY
