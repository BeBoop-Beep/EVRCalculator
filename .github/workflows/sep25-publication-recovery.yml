name: Sep25 post-upgrade publication verification
on:
  push:
    branches: [vm-ops-control]
    paths: [.github/workflows/sep25-publication-recovery.yml]
permissions:
  contents: read
concurrency:
  group: index-production-vm-ops-v2
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'BeBoop-Beep/EVRCalculator' && github.ref == 'refs/heads/vm-ops-control'
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 3
    steps:
      - name: Prove fresh runtime, active publication and bounded summary reads
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          export PYTHONPATH="$PWD"
          .venv/bin/python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from backend.alerts.post_scrape_publication_watchdog import _default_all_publication_processes, _lock_is_held, PUBLICATION_LOCK_PATH
          from backend.db.clients.supabase_client import create_service_role_client
          from backend.db.services.market_publication_sources import load_compact_market_index_summaries
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head=='0ca31bab086f63f48b472d8119741619ad43d7ee'
          c=create_service_role_client()
          global_rows=c.table('pokemon_explore_set_value_snapshot_latest').select('market_date,set_count,market_count,updated_at').eq('tcg','pokemon').eq('scope','market').limit(1).execute().data or []
          processes=_default_all_publication_processes()
          report={'runtimeHead':head,'publicationLockHeld':_lock_is_held(PUBLICATION_LOCK_PATH),'processes':processes,'global':global_rows}
          print('post_upgrade_receipt='+json.dumps(report),flush=True)
          ids=[r['id'] for r in c.table('sets').select('id,name').in_('name',['Cosmic Eclipse','Skyridge']).execute().data or []]
          assert len(ids)==2
          summaries=load_compact_market_index_summaries(c,ids)
          assert len(summaries)==2
          evidence=[]
          for row in summaries:
              index=row['cardsMarket']['marketIndex']
              assert index.get('currentValue') is not None
              evidence.append({'setId':row['set_id'],'dashboardDate':row['latest_market_date'],'indexAsOf':index.get('asOf'),'indexValue':index['currentValue'],'movement7d':(index.get('movements') or {}).get('7d')})
          print('compact_index_projection_smoke='+json.dumps(evidence),flush=True)
          p=Path('publication.log')
          if p.exists():
              with p.open('rb') as f:
                  f.seek(max(0,p.stat().st_size-50000)); lines=f.read().decode('utf-8',errors='replace').splitlines()
              signals=[line[:850] for line in lines if 'HTTP Request:' not in line and len(line)<1800]
              print('recent_publication_signals:\n'+'\n'.join(signals[-25:]),flush=True)
          published=bool(global_rows and global_rows[0]['market_date']=='2026-09-25')
          assert published or (processes and all(p['market_date']=='2026-09-25' for p in processes) and report['publicationLockHeld']), 'Publisher stopped before Market date advanced'
          print('runtime_and_projection_verified=true; publication_complete='+str(published).lower(),flush=True)
          PY
