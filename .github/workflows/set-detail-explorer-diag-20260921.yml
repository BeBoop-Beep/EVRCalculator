name: Inspect live client-only bundles

on:
  push:
    branches:
      - ops/set-detail-explorer-diag-20260921

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Probe correct Explorer and redirect behavior
        shell: bash
        run: |
          set -euo pipefail
          for url in             'https://inthedex.io/Market/Explorer'             'https://inthedex.io/TCGs/Pokemon/Sets/pitch-black'
          do
            echo "=== $url ==="
            curl -sS -L --max-time 30               -w 'effective=%{url_effective} http=%{http_code} start=%{time_starttransfer} total=%{time_total} bytes=%{size_download}\n'               -o /tmp/live-page.html "$url"
            echo "loader_set=$(grep -o 'Loading set intelligence' /tmp/live-page.html | wc -l)"
            echo "loader_root=$(grep -o 'Loading Rip Statistics\|Loading inDex' /tmp/live-page.html | wc -l)"
            echo "errors=$(grep -o 'ChunkLoadError\|Something went wrong\|RIP Statistics unavailable' /tmp/live-page.html | wc -l)"
          done

          echo "=== static chunk redirect example ==="
          src="$(grep -oE '<script[^>]+src="[^"]+"' /tmp/live-page.html | head -n1 | sed -E 's/.*src="([^"]+)"/\1/')"
          echo "src=$src"
          curl -sS -D - -o /dev/null --max-time 20 "https://inthedex.io$src" | sed -n '1,20p'
          echo "followed:"
          curl -sS -L -D - -o /dev/null --max-time 20 "https://inthedex.io$src" | sed -n '1,35p'

      - name: Inspect set-page route chunk and webpack runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://inthedex.io/TCGs/Pokemon/Sets/pitch-black -o /tmp/pitch.html
          python3 - <<'PY'
          import re,subprocess,urllib.parse
          html=open('/tmp/pitch.html',encoding='utf-8',errors='ignore').read()
          srcs=sorted(set(re.findall(r'<script[^>]+src="([^"]+)"',html)))
          page=[s for s in srcs if '/app/TCGs/Pokemon/Sets/%5BsetSlug%5D/page-' in s]
          runtime=[s for s in srcs if '/webpack-' in s]
          print('page_chunk',page)
          print('runtime_chunk',runtime)
          for label,arr in [('page',page),('runtime',runtime)]:
              for src in arr:
                  url=urllib.parse.urljoin('https://inthedex.io/',src)
                  out=f'/tmp/{label}.js'
                  p=subprocess.run(['curl','-fsSL','--max-time','30',url,'-o',out])
                  print(label,'download_exit',p.returncode)
                  if p.returncode==0:
                      data=open(out,encoding='utf-8',errors='ignore').read()
                      print(label,'bytes',len(data))
                      for token in ['PokemonSetRichPageClient','Loading set intelligence','ChunkLoadError','__webpack_require__','static/chunks']:
                          print(label,token,token in data)
                      ids=sorted(set(re.findall(r'\.e\((\d+)\)',data)))
                      print(label,'async_chunk_ids',ids[:80])
          PY

      - name: Check available browser runtimes
        shell: bash
        run: |
          set -euo pipefail
          for cmd in chromium chromium-browser google-chrome google-chrome-stable firefox node npm; do
            printf '%s=' "$cmd"
            command -v "$cmd" || true
          done
