name: Inspect live frontend deployment consistency

on:
  push:
    branches:
      - ops/set-detail-explorer-diag-20260921

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Deployment identity and nav target
        shell: bash
        run: |
          set -euo pipefail
          echo "=== live deployment identity ==="
          curl -fsSL --max-time 20 https://inthedex.io/api/sentinel/build
          echo

          echo "=== catalog Explorer href ==="
          tmp="$(mktemp)"
          curl -fsSL --max-time 30 https://inthedex.io/TCGs/Pokemon/Sets -o "$tmp"
          python3 - "$tmp" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding="utf-8",errors="ignore").read()
          for m in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', text, re.S):
              label=re.sub(r'<[^>]+>',' ',m.group(2))
              label=' '.join(label.split())
              if 'Explorer' in label:
                  print("explorer_href",m.group(1),"label",label[:120])
          PY
          rm -f "$tmp"

      - name: Check every Pitch Black script chunk
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl -fsSL --max-time 30 https://inthedex.io/TCGs/Pokemon/Sets/pitch-black -o "$tmp"
          python3 - "$tmp" <<'PY'
          import re,sys,subprocess,urllib.parse
          text=open(sys.argv[1],encoding="utf-8",errors="ignore").read()
          srcs=sorted(set(re.findall(r'<script[^>]+src="([^"]+)"',text)))
          print("script_count",len(srcs))
          bad=[]
          for src in srcs:
              url=urllib.parse.urljoin("https://inthedex.io/TCGs/Pokemon/Sets/pitch-black",src)
              p=subprocess.run([
                  "curl","-sS","-o","/tmp/chunk.body","-w",
                  "%{http_code} %{time_total} %{size_download}",
                  "--max-time","20",url
              ],capture_output=True,text=True)
              line=f"{p.stdout.strip()} {src}"
              print(line)
              if not p.stdout.startswith("200 "):
                  bad.append(line)
          print("bad_script_count",len(bad))
          if bad:
              print("bad_scripts",bad)
          print("html_error_markers")
          for pattern in [
              r'ChunkLoadError.{0,300}',
              r'TimeoutError.{0,300}',
              r'Failed to load.{0,300}',
              r'NEXT_[A-Z_]+.{0,300}',
              r'"digest":"[^"]+"',
          ]:
              hits=re.findall(pattern,text,re.I|re.S)
              if hits:
                  print(pattern, hits[:10])
          PY
          rm -f "$tmp"

      - name: Probe Next RSC responses
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"; url="$2"; tmp="$(mktemp)"
            echo "=== $label ==="
            set +e
            curl --max-time 35 -sS               -H 'RSC: 1'               -H 'Next-Url: /TCGs/Pokemon/Sets'               -H 'Accept: */*'               -w 'http=%{http_code} type=%{content_type} start=%{time_starttransfer} total=%{time_total} bytes=%{size_download}\n'               -o "$tmp" "$url"
            code=$?
            set -e
            echo "curl_exit=$code"
            echo "body_head:"
            head -c 1600 "$tmp" || true
            echo
            rm -f "$tmp"
          }
          probe "Pitch Black RSC" 'https://inthedex.io/TCGs/Pokemon/Sets/pitch-black?_rsc=diag1'
          probe "Catalog RSC" 'https://inthedex.io/TCGs/Pokemon/Sets?_rsc=diag2'
