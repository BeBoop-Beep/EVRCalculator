name: Bucket B3 VM Calibration

on:
  push:
    branches:
      - ops/bucket-b3-vm-20260929
    paths:
      - ".bucket-b3-vm/request.txt"
      - ".github/workflows/bucket-b3-vm.yml"

permissions:
  contents: read

concurrency:
  group: bucket-b3-vm
  cancel-in-progress: false

jobs:
  vm:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 60
    env:
      RELEASE_SHA: c383c7fcdaf5f1a904f45f36951d02c44a0d3d09
      VM_REQUEST_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Resolve fixed operation
        shell: bash
        run: |
          set -euo pipefail
          case "$VM_REQUEST_MESSAGE" in
            "bucket-b3-vm: noop") OP=noop ;;
            "bucket-b3-vm: preflight") OP=preflight ;;
            "bucket-b3-vm: run") OP=run ;;
            *) echo "REFUSING: invalid fixed operation"; exit 2 ;;
          esac
          echo "OP=$OP" >> "$GITHUB_ENV"
          echo "operation=$OP release_sha=$RELEASE_SHA"

      - name: Execute fixed operation
        shell: bash
        run: |
          set -euo pipefail

          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/tmp/EVRCalculator-bucket-b3
          PY="$REPO/.venv/bin/python"
          HOLD=/home/ubuntu/state/db-safety/hold.json

          cleanup() {
            if [ -d "$WT" ]; then
              git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true
              rm -rf "$WT" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          prepare_release() {
            test -d "$REPO/.git" || { echo "REFUSING: production repo missing"; exit 2; }
            test -x "$PY" || { echo "REFUSING: shared Python runtime missing"; exit 2; }
            git -C "$REPO" fetch origin develop --quiet
            git -C "$REPO" cat-file -e "$RELEASE_SHA^{commit}" || {
              echo "REFUSING: reviewed B3 release unavailable"; exit 2;
            }
            if [ -e "$WT" ]; then
              git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || rm -rf "$WT"
            fi
            git -C "$REPO" worktree add --detach "$WT" "$RELEASE_SHA"
            test "$(git -C "$WT" rev-parse HEAD)" = "$RELEASE_SHA" || {
              echo "REFUSING: B3 worktree SHA mismatch"; exit 2;
            }
            set -a
            . "$REPO/backend/.env"
            set +a
            export PYTHONPATH="$WT"
          }

          case "$OP" in
            noop)
              echo "BUCKET_B3_VM_NOOP=PASS"
              ;;

            preflight)
              prepare_release
              cd "$WT"
              "$PY" -m backend.scripts.run_market_microstructure_bucket_b3                 --preflight                 --pass-count 5                 --total-credit-cap 3000
              ;;

            run)
              prepare_release
              [ ! -e "$HOLD" ] && [ ! -L "$HOLD" ] || {
                echo "BUCKET_B3_DB_SAFETY_HOLD"; exit 75;
              }

              exec 6>/tmp/active-supply-panel.lock
              /usr/bin/flock -n 6 || { echo "BUCKET_B3_ACTIVE_SUPPLY_BUSY"; exit 75; }

              exec 8>/tmp/pkmnprices-api.lock
              /usr/bin/flock -n 8 || { echo "BUCKET_B3_PROVIDER_BUSY"; exit 75; }

              exec 9>/tmp/pokemon-post-scrape-publication.lock
              /usr/bin/flock -n 9 || { echo "BUCKET_B3_HEAVY_PUBLISHER_BUSY"; exit 75; }

              [ ! -e "$HOLD" ] && [ ! -L "$HOLD" ] || {
                echo "BUCKET_B3_DB_SAFETY_HOLD"; exit 75;
              }

              cd "$WT"
              "$PY" -m backend.scripts.run_market_microstructure_bucket_b3                 --commit-calibration                 --pass-count 5                 --total-credit-cap 3000
              ;;
          esac
