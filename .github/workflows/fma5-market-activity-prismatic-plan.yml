name: FMA-5 Prismatic Activity Plan

on:
  push:
    branches:
      - ops/fma5-market-activity-prismatic-plan-20260930
    paths:
      - ".github/workflows/fma5-market-activity-prismatic-plan.yml"

permissions:
  contents: read

concurrency:
  group: fma5-prismatic-activity-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      MARKET_KEY: set:7a3dd188-4375-41af-94de-c5247fe0b1a6
      MARKET_AS_OF: "2026-09-29"
      PLAN_OUT: /tmp/fma5-prismatic-plan.json

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install focused runtime
        run: |
          python -m pip install --disable-pip-version-check -q             supabase==2.28.3 python-dotenv==1.2.2

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_ANON_KEY"
          echo "fma5_required_secrets_present=true"

      - name: Verify FMA schema and target roster
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import json
          from backend.db.clients.supabase_client import create_service_role_client
          c=create_service_role_client()
          serving=list(c.table("pokemon_market_explorer_surface_serving_v2").select("generation_id").eq("singleton",1).limit(1).execute().data or [])
          if not serving: raise RuntimeError("no Explorer V2 serving generation")
          generation=str(serving[0]["generation_id"])
          total=list(c.table("pokemon_market_explorer_surface_constituent_totals_v2").select("total_count,asset").eq("generation_id",generation).eq("market_key","set:7a3dd188-4375-41af-94de-c5247fe0b1a6").limit(1).execute().data or [])
          if not total or total[0].get("asset")!="cards": raise RuntimeError("Prismatic Evolutions prepared roster unavailable")
          for table in ("market_activity_generations_v1","market_activity_rosters_v1","market_activity_market_serving_v1"):
              c.table(table).select("*").limit(1).execute()
          print(json.dumps({"surfaceGenerationId":generation,"rosterCount":total[0]["total_count"],"target":"Prismatic Evolutions"},sort_keys=True))
          PY

      - name: Build read-only production evidence plan
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -m backend.scripts.build_market_activity_projection             --plan             --market-key "$MARKET_KEY"             --as-of "$MARKET_AS_OF" | tee "$PLAN_OUT"
          grep -q '"state": "VALIDATED"' "$PLAN_OUT"
          grep -q '"productionWrites":' "$PLAN_OUT" || true
          echo "FMA5_PRISMATIC_PLAN_OK"

      - name: Upload plan receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fma5-prismatic-activity-plan
          path: /tmp/fma5-prismatic-plan.json
          if-no-files-found: warn
          retention-days: 14
