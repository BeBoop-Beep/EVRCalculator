name: Treatment Joint Triangle V1

on:
  push:
    branches:
      - research/treatment-panel-recovery-v2-current-20261001
    paths:
      - 'backend/scripts/research_treatment_triangle_joint_v1.py'
      - '.github/workflows/treatment-joint-triangle-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q numpy==2.4.3 python-dotenv==1.2.2 supabase==2.28.3
      - name: Download SIR-Ultra artifact
        uses: actions/download-artifact@v4
        with:
          name: treatment-panel-gate-expansion-v2-vm
          path: backend/artifacts/treatment_triangle/input/sir_ultra
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 36961641617
      - name: Download Double Rare-SIR artifact
        uses: actions/download-artifact@v4
        with:
          name: treatment-double-rare-sir-v1
          path: backend/artifacts/treatment_triangle/input/double_sir
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 37048441071
      - name: Download partial Double Rare-Ultra artifact
        uses: actions/download-artifact@v4
        with:
          name: treatment-double-rare-ultra-v1
          path: backend/artifacts/treatment_triangle/input/double_ultra
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 37048883942
      - name: Estimate joint triangle
        run: |
          python backend/scripts/research_treatment_triangle_joint_v1.py \
            --sir-ultra backend/artifacts/treatment_triangle/input/sir_ultra/gate_expansion.json \
            --double-sir backend/artifacts/treatment_triangle/input/double_sir/gate_expansion_double_rare_sir.json \
            --double-ultra-partial backend/artifacts/treatment_triangle/input/double_ultra/gate_expansion_double_rare_ultra.json \
            --output backend/artifacts/treatment_triangle/pure_treatment_triangle_joint_v1.json \
            --report backend/artifacts/treatment_triangle/PURE_TREATMENT_TRIANGLE_JOINT_V1.md
      - name: Upload triangle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pure-treatment-triangle-joint-v1
          path: |
            backend/artifacts/treatment_triangle/pure_treatment_triangle_joint_v1.json
            backend/artifacts/treatment_triangle/PURE_TREATMENT_TRIANGLE_JOINT_V1.md
          if-no-files-found: error
