name: Market Explorer UI Closure 2026-09-21

on:
  push:
    branches: [fix/market-explorer-ui-closure-20260921]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Focused frontend contracts
        working-directory: frontend
        run: |
          npx tsx --test             components/explore/MarketExplorerBucket2.contract.test.mjs             components/explore/MarketExplorerInformationArchitecture.contract.test.mjs             components/explore/MarketExplorerPrompt4.contract.test.mjs             components/explore/MarketExplorerBrowse.test.jsx             components/explore/MarketExplorerClient.contract.test.jsx             lib/explore/marketExplorerConstituents.test.mjs             app/Market/Explorer/MarketExplorerPage.contract.test.mjs
      - name: Backend constituent contract
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q backend/tests/unit/domain/pokemon/test_constituent_movement.py
      - name: Production frontend build
        working-directory: frontend
        run: npm run build
