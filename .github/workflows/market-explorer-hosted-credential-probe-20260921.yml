name: Market Explorer Hosted Credential Probe 2026-09-21

on:
  push:
    branches: [ops/market-explorer-hosted-finish-20260921]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Report credential presence only
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_URL:-}" ] && echo "supabase_url_present=true" || echo "supabase_url_present=false"
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && echo "service_role_present=true" || echo "service_role_present=false"
          if [ -n "${DATABASE_URL:-}" ] || [ -n "${SUPABASE_DB_URL:-}" ]; then
            echo "direct_db_present=true"
          else
            echo "direct_db_present=false"
          fi
