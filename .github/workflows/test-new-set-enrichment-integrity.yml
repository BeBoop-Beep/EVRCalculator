name: New Set Enrichment Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/scripts/refresh_due_pokemon_catalog_sets.py'
      - 'backend/scripts/build_pokemon_set_desirability_inputs.py'
      - 'backend/scripts/operationalize_historical_rip.py'
      - 'backend/services/pokemon_set_onboarding_service.py'
      - 'backend/db/services/pokemon_tcg_image_sync_service.py'
      - 'backend/tests/unit/scripts/test_refresh_due_pokemon_catalog_sets.py'
      - 'backend/tests/unit/scripts/test_build_pokemon_set_desirability_inputs.py'
      - 'backend/tests/unit/scripts/test_operationalize_historical_rip.py'
      - 'backend/tests/unit/services/test_pokemon_set_onboarding_service.py'
      - 'backend/tests/unit/db/services/test_pokemon_tcg_image_sync_service.py'
      - '.github/workflows/test-new-set-enrichment-integrity.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-only-placeholder
      SUPABASE_ANON_KEY: test-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Compile changed modules
        run: |
          python -m py_compile \
            backend/scripts/refresh_due_pokemon_catalog_sets.py \
            backend/scripts/build_pokemon_set_desirability_inputs.py \
            backend/scripts/operationalize_historical_rip.py \
            backend/services/pokemon_set_onboarding_service.py \
            backend/db/services/pokemon_tcg_image_sync_service.py
      - name: Run focused regressions
        run: |
          python -m pytest -q \
            backend/tests/unit/scripts/test_refresh_due_pokemon_catalog_sets.py \
            backend/tests/unit/scripts/test_build_pokemon_set_desirability_inputs.py \
            backend/tests/unit/scripts/test_operationalize_historical_rip.py \
            backend/tests/unit/services/test_pokemon_set_onboarding_service.py \
            backend/tests/unit/db/services/test_pokemon_tcg_image_sync_service.py
