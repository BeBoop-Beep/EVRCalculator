name: Treatment Direct Preference Pair Manifest V1

on:
  push:
    branches:
      - research/treatment-panel-recovery-v2-current-20261001
    paths:
      - 'backend/scripts/research_treatment_direct_preference_pair_manifest_v1.py'
      - '.github/workflows/treatment-direct-preference-pair-manifest-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q numpy==2.4.3 python-dotenv==1.2.2 supabase==2.28.3
      - name: Build price-independent candidate pair manifest
        run: |
          python backend/scripts/research_treatment_direct_preference_pair_manifest_v1.py             --market-date 2026-09-29             --output backend/artifacts/treatment_direct_preference_v1/pair_manifest.json             --report backend/artifacts/treatment_direct_preference_v1/PAIR_MANIFEST_REPORT.md
      - name: Upload pair manifest
        uses: actions/upload-artifact@v4
        with:
          name: treatment-direct-preference-pair-manifest-v1
          path: |
            backend/artifacts/treatment_direct_preference_v1/pair_manifest.json
            backend/artifacts/treatment_direct_preference_v1/PAIR_MANIFEST_REPORT.md
          if-no-files-found: error
