name: 30th Scrydex Syntax Gate

on:
  push:
    branches: [fix/30th-scrydex-market-sync-20260922]
    paths:
      - '.github/workflows/test-30th-scrydex-syntax.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/30th-scrydex-market-sync-20260922
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python modules and tests
        run: |
          python -m py_compile             backend/db/clients/scrydex_pokemon_client.py             backend/db/services/pokemon_tcg_image_sync_service.py             backend/scripts/sync_pokemon_images.py             backend/scripts/ingest_pokemon_canonical_cards.py             backend/scripts/build_pokemon_set_desirability_inputs.py             backend/services/pokemon_tcg_api_set_service.py             backend/services/pokemon_set_onboarding_service.py             backend/constants/tcg/pokemon/otherEra/me30thCelebration.py             backend/constants/tcg/pokemon/megaEvolutionEra/me30thCelebrationClassicCollection.py             backend/tests/unit/db/clients/test_scrydex_pokemon_client.py             backend/tests/unit/db/services/test_pokemon_tcg_image_sync_service.py             backend/tests/unit/services/test_pokemon_tcg_api_set_service.py             backend/tests/unit/services/test_pokemon_set_onboarding_service.py             backend/tests/unit/scripts/test_build_pokemon_set_desirability_inputs.py
