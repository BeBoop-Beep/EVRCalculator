name: Sep22 Current Run Status

on:
  push:
    branches: [ops/sep22-current-status-20260922]
    paths:
      - '.github/workflows/sep22-current-run-status.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sep22-current-run-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/sep22-current-status-20260922
      - name: Capture repair status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > /tmp/runs.json
          mkdir -p ops/assistant
          python - <<'PY'
import json
from pathlib import Path
p=json.load(open("/tmp/runs.json"))
want={"Repair Sep22 Market Publication","Sep22 Market Publication Repair"}
rows=[{
  "id":r.get("id"),"name":r.get("name"),"status":r.get("status"),"conclusion":r.get("conclusion"),
  "head_sha":r.get("head_sha"),"head_branch":r.get("head_branch"),"created_at":r.get("created_at"),
  "updated_at":r.get("updated_at"),"run_attempt":r.get("run_attempt")
} for r in (p.get("workflow_runs") or []) if r.get("name") in want][:20]
print(json.dumps(rows,indent=2,sort_keys=True))
Path("ops/assistant/sep22-current-run-status.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n")
PY
          git config user.name "inDex status probe"
          git config user.email "actions@users.noreply.github.com"
          git add ops/assistant/sep22-current-run-status.json
          git commit -m "ops: capture Sep22 repair run status"
          git push origin HEAD:ops/sep22-current-status-20260922
