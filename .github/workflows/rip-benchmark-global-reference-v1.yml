name: RIP Benchmark global reference DB
on:
  push:
    branches: [feat/rip-benchmark-global-reference-v1-20260926]
  pull_request:
    paths:
      - 'backend/db/migrations/*_rip_benchmark_global_reference_v1.sql'
      - 'supabase/migrations/*_rip_benchmark_global_reference_v1.sql'
      - 'backend/tests/integration/rip_benchmark_global_reference_v1_postgres.py'
      - '.github/workflows/rip-benchmark-global-reference-v1.yml'
permissions:
  contents: read
concurrency:
  group: rip-benchmark-global-reference-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: isolated-reference-test-only
          POSTGRES_DB: benchmark_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d benchmark_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated-reference-test-only
      PGDATABASE: benchmark_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify additive migration mirrors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-test-output
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -name '*_rip_benchmark_global_reference_v1.sql')
          test "${#migrations[@]}" -eq 1
          migration="${migrations[0]}"
          cmp "$migration" "backend/db/migrations/$(basename "$migration")"
          printf '%s\n' "$(basename "$migration")" | tee benchmark-test-output/reference-migration-name.txt
          echo "RIP_REFERENCE_MIGRATION=$migration" >> "$GITHUB_ENV"
          cp "$migration" benchmark-test-output/
          cp backend/tests/integration/rip_benchmark_global_reference_v1_postgres.py benchmark-test-output/
          sha256sum "$migration" | tee benchmark-test-output/reference-migration-sha256.txt
      - name: Existing backend core regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==8.3.5
          python -m pytest -q --confcutdir=backend/tests/benchmark_v1 backend/tests/benchmark_v1/test_core.py | tee benchmark-test-output/backend-core-tests.log
      - name: Foundation and global reference PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          python -m backend.tests.integration.rip_benchmark_global_reference_v1_postgres 2>&1 | tee benchmark-test-output/global-reference-tests.log
      - name: Retain exact tested SQL and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rip-benchmark-global-reference-v1-evidence
          path: benchmark-test-output/
