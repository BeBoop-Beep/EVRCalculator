name: Treatment Set-Relative Expansion V2 Capture

on:
  push:
    branches:
      - research/treatment-panel-recovery-v2-current-20261001
    paths:
      - '.github/workflows/treatment-set-relative-expansion-v2-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treatment-set-relative-expansion-v2-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Capture frozen 56-triad expansion on VM
        shell: bash
        run: |
          set -euo pipefail

          exec 9>/tmp/pkmnprices-api.lock
          flock -w 300 9 || { echo "PkmnPrices API lock remained held"; exit 21; }

          REPO=/home/ubuntu/repos/EVRCalculator
          PY="$REPO/.venv/bin/python"
          WT=/tmp/EVRCalculator-treatment-set-relative-v2
          REF=origin/research/treatment-panel-recovery-v2-current-20261001
          OUT="$WT/backend/artifacts/treatment_set_relative_v2/capture.json"

          cd "$REPO"
          git fetch origin research/treatment-panel-recovery-v2-current-20261001 --quiet
          rm -rf "$WT"
          git worktree add --detach "$WT" "$REF"
          trap 'git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true; rm -rf "$WT"' EXIT

          set -a
          . "$REPO/backend/.env"
          set +a
          test -n "${PKMNPRICES_API_KEY:-}" || { echo "PKMNPRICES_API_KEY missing on VM"; exit 20; }
          test -n "${SUPABASE_URL:-}" || { echo "SUPABASE_URL missing on VM"; exit 20; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "SUPABASE_SERVICE_ROLE_KEY missing on VM"; exit 20; }

          export PYTHONPATH="$WT"
          cd "$WT"

          echo "== provider availability probe =="
          "$PY" - <<'PY'
          from backend.pricing_pipeline.pkmnprices_client import PkmnPricesClient, PkmnPricesAPIError
          from backend.pricing_pipeline.pkmnprices_credentials import load_pkmnprices_credentials
          creds = load_pkmnprices_credentials(allow_frontend_fallback=False)
          client = PkmnPricesClient(creds.api_key, min_request_interval=.55, timeout=10, max_retries=0)
          try:
              client.card(156926)
          except PkmnPricesAPIError as exc:
              print(f"provider_probe=FAILED status={exc.status} code={exc.code}")
              raise
          print(
              "provider_probe=OK "
              f"probe_credits={client.credits_charged} "
              f"credit_limit={client.credits_limit} "
              f"rate_remaining={client.rate_remaining}"
          )
          PY

          echo "== frozen Set-relative V2 capture =="
          set +e
          "$PY" backend/scripts/research_treatment_set_relative_expansion_panel_v2.py \
            --market-date 2026-09-29 \
            --period 180d \
            --credit-cap 22000 \
            --capture \
            --output "$OUT"
          code=$?
          set -e

          mkdir -p "$GITHUB_WORKSPACE"
          if [ -f "$OUT" ]; then
            cp "$OUT" "$GITHUB_WORKSPACE/capture.json"
          fi
          printf '%s\n' "$code" > "$GITHUB_WORKSPACE/capture_exit_code.txt"
          echo "capture_exit_code=$code"
      - name: Upload capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treatment-set-relative-expansion-v2-capture
          path: |
            capture.json
            capture_exit_code.txt
          if-no-files-found: warn
      - name: Enforce capture result
        if: always()
        shell: bash
        run: |
          if [ ! -f capture_exit_code.txt ]; then
            echo "capture did not start"
            exit 1
          fi
          code="$(cat capture_exit_code.txt)"
          exit "$code"
