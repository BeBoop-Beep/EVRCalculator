name: B5 Variant Scope Fix

on:
  push:
    branches:
      - fix/b5-variant-scoped-readiness-20260930
    paths:
      - "backend/scripts/run_market_microstructure_bucket_b5.py"
      - "backend/tests/unit/scripts/test_market_microstructure_bucket_b5.py"
      - ".github/workflows/b5-variant-scope-fix.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 10
    steps:
      - name: Validate exact branch
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/tmp/EVRCalculator-b5-variant-scope-test
          PY="$REPO/.venv/bin/python"
          SHA="${{ github.sha }}"
          git -C "$REPO" fetch origin "$SHA" --quiet || git -C "$REPO" fetch origin fix/b5-variant-scoped-readiness-20260930 --quiet
          if [ -e "$WT" ]; then
            git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || rm -rf "$WT"
          fi
          git -C "$REPO" worktree add --detach "$WT" "$SHA"
          trap 'git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true; rm -rf "$WT" >/dev/null 2>&1 || true' EXIT
          export PYTHONPATH="$WT"
          cd "$WT"
          "$PY" -m py_compile backend/scripts/run_market_microstructure_bucket_b5.py
          "$PY" -m pytest -q backend/tests/unit/scripts/test_market_microstructure_bucket_b5.py
