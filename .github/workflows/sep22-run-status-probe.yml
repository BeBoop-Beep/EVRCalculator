name: Sep22 Active Run Status

on:
  push:
    branches: [ops/sep22-run-status-20260922]
    paths:
      - '.github/workflows/sep22-run-status-probe.yml'

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/sep22-run-status-20260922
          fetch-depth: 1
      - name: Capture all active runs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > /tmp/runs.json
          mkdir -p ops/assistant
          python -c 'import json; from pathlib import Path; p=json.loads(Path("/tmp/runs.json").read_text()); rows=[{"id":r.get("id"),"name":r.get("name"),"status":r.get("status"),"conclusion":r.get("conclusion"),"head_branch":r.get("head_branch"),"head_sha":r.get("head_sha"),"event":r.get("event"),"created_at":r.get("created_at"),"updated_at":r.get("updated_at"),"run_attempt":r.get("run_attempt")} for r in (p.get("workflow_runs") or []) if r.get("status") in {"queued","in_progress","waiting","pending"}]; print(json.dumps(rows,indent=2,sort_keys=True)); Path("ops/assistant/sep22-active-runs.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n")'
          git config user.name "inDex Sep22 status"
          git config user.email "actions@users.noreply.github.com"
          git add ops/assistant/sep22-active-runs.json
          git commit -m "ops: capture active runs" || true
          git push origin HEAD:ops/sep22-run-status-20260922
