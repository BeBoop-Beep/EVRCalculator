name: Sep22 Queue Prune

on:
  push:
    branches: [ops/sep22-run-status-20260922]
    paths:
      - '.github/workflows/sep22-run-status-probe.yml'

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel superseded Sep22 self-hosted runs
        shell: bash
        run: |
          set -euo pipefail
          for RUN_ID in 35775902401 35775704760 35776191682 35772330826; do
            CODE="$(curl --silent --show-error -o /tmp/cancel-$RUN_ID.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/cancel" || true)"
            echo "cancel_run=$RUN_ID http=$CODE body=$(cat /tmp/cancel-$RUN_ID.txt 2>/dev/null || true)"
          done
