name: Sentinel Runtime Backstop

on:
  workflow_dispatch:
  schedule:
    # Independent failure domain: GitHub-hosted, not the production VM.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: sentinel-runtime-backstop
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SENTINEL_WATCH_HOST: tcgplayer-scraper-pokemon-v2
      SENTINEL_HEARTBEAT_MAX_AGE_SECONDS: '900'
    steps:
      - name: Verify production Sentinel heartbeat independently
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "SUPABASE_URL secret missing"; exit 2; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "SUPABASE_SERVICE_ROLE_KEY secret missing"; exit 2; }

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          host = os.environ["SENTINEL_WATCH_HOST"]
          max_age = int(os.environ["SENTINEL_HEARTBEAT_MAX_AGE_SECONDS"])

          params = urllib.parse.urlencode({
              "select": "component,host,build_sha,heartbeat_at",
              "component": "eq.sentinel_vm",
              "host": f"eq.{host}",
              "order": "heartbeat_at.desc",
              "limit": "1",
          })
          request = urllib.request.Request(
              f"{base}/rest/v1/sentinel_component_heartbeats?{params}",
              headers={
                  "apikey": key,
                  "Authorization": "Bearer " + key,
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              rows = json.loads(response.read().decode("utf-8"))

          if not rows:
              raise SystemExit("production Sentinel heartbeat is missing")

          row = rows[0]
          heartbeat = datetime.fromisoformat(
              str(row["heartbeat_at"]).replace("Z", "+00:00")
          ).astimezone(timezone.utc)
          age = max(0.0, (datetime.now(timezone.utc) - heartbeat).total_seconds())
          print(json.dumps({
              "component": row.get("component"),
              "host": row.get("host"),
              "build_sha": row.get("build_sha"),
              "heartbeat_at": heartbeat.isoformat(),
              "age_seconds": round(age, 1),
              "max_age_seconds": max_age,
          }, sort_keys=True))
          if age > max_age:
              raise SystemExit(
                  f"production Sentinel heartbeat stale: {age:.1f}s > {max_age}s"
              )
          print("SENTINEL_INDEPENDENT_HEARTBEAT=PASS")
          PY
