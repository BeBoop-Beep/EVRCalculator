name: Sentinel Runtime Backstop

on:
  workflow_dispatch:
  schedule:
    # Independent scheduler/failure domain for the VM crontab. Runs every 15 minutes.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: sentinel-runtime-backstop
  cancel-in-progress: false

jobs:
  independent-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SENTINEL_COMPONENT: sentinel_github_backstop
      SENTINEL_RUNNER_HOST: github-hosted-sentinel-backstop
      SENTINEL_WATCH_COMPONENT: sentinel_vm
      SENTINEL_WATCH_HOST: tcgplayer-scraper-pokemon-v2
      SENTINEL_STATE_WRITES_ENABLED: 'false'
      SENTINEL_PERSISTENCE_SCHEMA_READY: 'false'
      SENTINEL_RECOVERY_ENABLED: 'false'
      SENTINEL_RECOVERY_EXECUTION_READY: 'false'
      SENTINEL_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent observer runtime
        run: python -m pip install -q supabase==2.28.3 python-dotenv==1.2.2 requests
      - name: Observe production VM heartbeat
        run: python -m backend.sentinel.operational --profile independent

  fast-recovery-backstop:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 20
    steps:
      - name: Run bounded Fast recovery backstop
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          PY="$REPO/.venv/bin/python"
          HOLD=/home/ubuntu/state/db-safety/hold.json
          test -d "$REPO/.git"
          test -x "$PY"

          if [ -e "$HOLD" ] || [ -L "$HOLD" ]; then
            echo "database_safety_hold_active=true"
            echo "Sentinel backstop intentionally defers while the production DB safety hold is active."
            exit 0
          fi

          cd "$REPO"
          export PYTHONPATH="$REPO"

          set +e
          /usr/bin/flock -n /tmp/index-sentinel-fast.lock -c \
            "cd '$REPO' && set -a && . backend/.env && set +a && SENTINEL_RUNNER_BUILD_SHA=\$(git rev-parse HEAD) '$PY' -m backend.sentinel.operational --profile fast"
          FAST_RC=$?
          set -e
          echo "fast_backstop_rc=$FAST_RC"
          test "$FAST_RC" -eq 0
          echo "SENTINEL_RUNTIME_BACKSTOP=PASS"
