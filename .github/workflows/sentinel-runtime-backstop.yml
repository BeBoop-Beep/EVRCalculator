name: Sentinel Runtime Backstop

on:
  workflow_dispatch:
  schedule:
    # Independent failure domain: GitHub-hosted, not the production VM.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: sentinel-runtime-backstop
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SENTINEL_STATE_WRITES_ENABLED: 'true'
      SENTINEL_PERSISTENCE_SCHEMA_READY: 'true'
      SENTINEL_RECOVERY_ENABLED: 'false'
      SENTINEL_RECOVERY_EXECUTION_READY: 'false'
      SENTINEL_COMPONENT: sentinel_github_backstop
      SENTINEL_WATCH_COMPONENT: sentinel_vm
      SENTINEL_WATCH_HOST: tcgplayer-scraper-pokemon-v2
      SENTINEL_HEARTBEAT_MAX_AGE_SECONDS: '900'
      SENTINEL_RUNNER_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent Sentinel runtime
        run: python -m pip install -q supabase==2.28.3 python-dotenv==1.2.2 requests
      - name: Verify production Sentinel heartbeat independently
        run: python -m backend.sentinel.operational --profile independent
