name: Sentinel Runtime Backstop

on:
  workflow_dispatch:
  schedule:
    # Independent failure domain: GitHub-hosted, not the production VM.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: sentinel-runtime-backstop
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SENTINEL_STATE_WRITES_ENABLED: 'true'
      SENTINEL_PERSISTENCE_SCHEMA_READY: 'true'
      SENTINEL_RECOVERY_ENABLED: 'false'
      SENTINEL_RECOVERY_EXECUTION_READY: 'false'
      SENTINEL_COMPONENT: sentinel_github_backstop
      SENTINEL_WATCH_COMPONENT: sentinel_vm
      SENTINEL_WATCH_HOST: tcgplayer-scraper-pokemon-v2
      SENTINEL_HEARTBEAT_MAX_AGE_SECONDS: '900'
      SENTINEL_RUNNER_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent Sentinel runtime
        run: python -m pip install -q supabase==2.28.3 python-dotenv==1.2.2 requests
      - name: Verify production Sentinel heartbeat independently
        shell: bash
        run: |
          set +e
          python -m backend.sentinel.operational --profile independent
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::warning::Sentinel observed an unhealthy persisted state; incident state owns alerting."
            exit 0
          fi
          exit "$code"


  vm-fast-backstop:
    # GitHub's scheduler is independent of the VM crontab. If cron loses
    # Sentinel but the self-hosted runner is still alive, this one Fast pass
    # detects sentinel.runtime_scheduler and reinstalls the managed block.
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 20
    steps:
      - name: Run bounded Fast recovery outside VM cron
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          PY="$REPO/.venv/bin/python"
          HOLD=/home/ubuntu/state/db-safety/hold.json
          test -d "$REPO/.git"
          test -x "$PY"
          if [ -e "$HOLD" ] || [ -L "$HOLD" ]; then
            echo "database_safety_hold_active=true"
            exit 0
          fi
          cd "$REPO"
          set -a
          . backend/.env
          set +a
          export PYTHONPATH="$REPO"
          set +e
          SENTINEL_RUNNER_BUILD_SHA="$(git rev-parse HEAD)" "$PY" -m backend.sentinel.operational --profile fast
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::warning::Sentinel observed an unhealthy persisted state; incident state owns alerting."
            exit 0
          fi
          exit "$code"
