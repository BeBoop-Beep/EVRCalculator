name: Sep22 Live Status

on:
  push:
    branches: [ops/sep22-live-status-20260922]
    paths:
      - '.github/workflows/sep22-live-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/sep22-live-status-20260922
          fetch-depth: 1
      - name: Capture relevant runs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > /tmp/runs.json
          python - <<'PY'
import json
from pathlib import Path
p=json.load(open("/tmp/runs.json"))
names={
 "Repair Sep22 Market Publication",
 "Sep22 Market Publication Repair",
 "Repair Sep21 Market Publication",
 "External Pokemon Market Freshness Dead-Man",
 "Opening Simulation Recovery Watchdog",
}
rows=[]
for r in p.get("workflow_runs") or []:
    if r.get("name") in names or r.get("status") in {"queued","in_progress","pending","waiting"}:
        rows.append({
          "id":r.get("id"),"name":r.get("name"),"status":r.get("status"),"conclusion":r.get("conclusion"),
          "head_branch":r.get("head_branch"),"head_sha":r.get("head_sha"),"event":r.get("event"),
          "created_at":r.get("created_at"),"updated_at":r.get("updated_at"),"run_attempt":r.get("run_attempt")
        })
Path("ops/assistant").mkdir(parents=True,exist_ok=True)
Path("ops/assistant/sep22-live-status.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n")
print(json.dumps(rows,indent=2,sort_keys=True))
PY
          git config user.name "inDex Sep22 status"
          git config user.email "actions@users.noreply.github.com"
          git add ops/assistant/sep22-live-status.json
          git commit -m "ops: record Sep22 live status" || true
          git push origin HEAD:ops/sep22-live-status-20260922
