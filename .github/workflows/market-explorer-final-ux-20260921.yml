name: Market Explorer Final UX 2026-09-21

on:
  push:
    branches: [ui/market-explorer-final-ux-20260921]
    paths:
      - 'frontend/**'
      - 'backend/domain/pokemon/constituent_movement.py'
      - 'backend/db/services/market_explorer_constituent_movement.py'
      - 'backend/scripts/provision_market_explorer_maintained_cards_axes.py'
      - 'backend/tests/unit/db/services/test_market_explorer_constituent_movement.py'
      - 'backend/tests/unit/scripts/test_provision_market_explorer_maintained_cards_axes.py'
      - '.github/workflows/market-explorer-final-ux-20260921.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend focused tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest supabase==2.28.3 python-dotenv==1.2.2
          python -m pytest -q             backend/tests/unit/db/services/test_market_explorer_constituent_movement.py             backend/tests/unit/scripts/test_provision_market_explorer_maintained_cards_axes.py
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend focused tests
        working-directory: frontend
        run: |
          npx tsx --test             lib/explore/marketExplorerConstituents.test.mjs             components/explore/MarketExplorerClient.contract.test.jsx             components/explore/MarketExplorerBucket2.contract.test.mjs             components/explore/MarketExplorerSidebarUsability.contract.test.mjs             components/explore/MarketExplorerInformationArchitecture.contract.test.mjs             components/explore/MarketExplorerQueryBuilder.contract.test.mjs             components/explore/MarketExplorerConstituentsQueryPaging.contract.test.jsx             app/Market/Explorer/MarketExplorerPage.contract.test.mjs
      - name: Production build
        working-directory: frontend
        run: npm run build
