name: Vintage Hosted Credential Presence

on:
  push:
    branches:
      - ops/market-vintage-hosted-cutover-20260925
    paths:
      - ".github/workflows/market-vintage-hosted-credential-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - name: Presence flags only
        shell: bash
        run: |
          for key in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DATABASE_URL SUPABASE_DB_URL POSTGRES_URL SUPABASE_DATABASE_URL; do
            if [ -n "${!key:-}" ]; then echo "$key=true"; else echo "$key=false"; fi
          done
