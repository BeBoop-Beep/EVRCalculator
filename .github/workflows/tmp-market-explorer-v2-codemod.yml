name: Temporary Market Explorer V2 codemod

on:
  push:
    branches:
      - 'fix/market-explorer-v2-runtime-cutover-20260910'
    paths:
      - '.github/workflows/tmp-market-explorer-v2-codemod.yml'

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/market-explorer-v2-runtime-cutover-20260910
          fetch-depth: 0
      - name: Apply exact V2-only query-service codemod
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          service_path = Path('backend/db/services/pokemon_market_explorer_query_service.py')
          s = service_path.read_text()

          # Runtime constants: V1 has no physical daily-state authority anymore.
          s = s.replace('V1_DAILY_PROJECTION_RPC = "get_pokemon_market_explorer_filtered_cohort_daily_candidate"\n', '')
          s = s.replace('V1_MATERIALIZED_CHUNK_DAYS = 3\n', '')

          route = '''def resolve_materialized_history_route(
              client: Any, set_ids: Sequence[str], *, start_date: str, end_date: str,
          ) -> tuple[str, str | None]:
              """Choose bounded V2 daily materialization or V2 interval fallback.

              V1 daily-state storage is retired. Every requested set must have V2
              coverage through ``end_date`` and the requested start must be inside
              the retained V2 daily window; otherwise the complete range is rebuilt
              point-in-time from V2 interval authority.
              """
              wanted = {str(value) for value in set_ids}
              if not wanted:
                  return "interval_fallback", None
              try:
                  rows = list((client.table(V2_COVERAGE_TABLE)
                               .select("set_id,retained_from,computed_through")
                               .in_("set_id", sorted(wanted)).execute()).data or [])
                  by_id = {str(row.get("set_id")): row for row in rows if row.get("set_id")}
                  if set(by_id) != wanted:
                      return "interval_fallback", None
                  if any(str((by_id[set_id] or {}).get("computed_through") or "")[:10]
                         < str(end_date)[:10] for set_id in wanted):
                      return "interval_fallback", None
                  retained = [str((by_id[set_id] or {}).get("retained_from") or "")[:10]
                              for set_id in wanted]
                  if any(not value for value in retained):
                      return "interval_fallback", None
                  boundary = max(retained)
                  if str(start_date)[:10] >= boundary:
                      return "v2_daily", boundary
                  return "interval_fallback", boundary
              except Exception:
                  return "interval_fallback", None


          def load_filtered_daily_cohort_rows('''
          s, count = re.subn(
              r'def resolve_materialized_history_route\(.*?\n\ndef load_filtered_daily_cohort_rows\(',
              route,
              s,
              count=1,
              flags=re.S,
          )
          assert count == 1, f'route replacement count={count}'

          old_chunk = '''    if rpc_name == V1_DAILY_PROJECTION_RPC:
                  chunk_days = min(int(chunk_days), V1_MATERIALIZED_CHUNK_DAYS)
              elif rpc_name == V2_DAILY_PROJECTION_RPC:
                  chunk_days = min(int(chunk_days), V2_MATERIALIZED_CHUNK_DAYS)
          '''
          # Indentation in source is 4/8 spaces; use regex to avoid whitespace fragility.
          s, count = re.subn(
              r'    if rpc_name == V1_DAILY_PROJECTION_RPC:\n        chunk_days = min\(int\(chunk_days\), V1_MATERIALIZED_CHUNK_DAYS\)\n    elif rpc_name == V2_DAILY_PROJECTION_RPC:\n        chunk_days = min\(int\(chunk_days\), V2_MATERIALIZED_CHUNK_DAYS\)\n',
              '    if rpc_name == V2_DAILY_PROJECTION_RPC:\n        chunk_days = min(int(chunk_days), V2_MATERIALIZED_CHUNK_DAYS)\n',
              s,
              count=1,
          )
          assert count == 1, f'chunk branch replacement count={count}'

          s = s.replace(
              'if (rpc_name in (V1_DAILY_PROJECTION_RPC, V2_DAILY_PROJECTION_RPC)\n            and len(set_ids) > 100',
              'if (rpc_name == V2_DAILY_PROJECTION_RPC\n            and len(set_ids) > 100',
          )
          s = s.replace(
              'if (rpc_name in (V1_DAILY_PROJECTION_RPC, V2_DAILY_PROJECTION_RPC)\n                    and (chunk_end < last or not include_latest_basket)):',
              'if (rpc_name == V2_DAILY_PROJECTION_RPC\n                    and (chunk_end < last or not include_latest_basket)):',
          )
          s = s.replace(
              'batch_payload["p_use_v2"] = rpc_name == V2_DAILY_PROJECTION_RPC',
              'batch_payload["p_use_v2"] = True',
          )

          covers = '''def daily_projection_covers(client: Any, set_ids: Sequence[str], *,
                                      start_date: str, end_date: str) -> bool:
              """True only when V2 daily coverage contains the entire requested range."""
              wanted = {str(value) for value in set_ids}
              if not wanted:
                  return False
              try:
                  rows = list((client.table(V2_COVERAGE_TABLE)
                               .select("set_id,retained_from,computed_through")
                               .in_("set_id", sorted(wanted)).execute()).data or [])
              except Exception:
                  return False
              by_id = {str(row.get("set_id")): row for row in rows if row.get("set_id")}
              if set(by_id) != wanted:
                  return False
              return all(
                  str((by_id[set_id] or {}).get("retained_from") or "")[:10] <= str(start_date)[:10]
                  and str((by_id[set_id] or {}).get("computed_through") or "")[:10] >= str(end_date)[:10]
                  for set_id in wanted
              )


          def _is_statement_timeout'''
          s, count = re.subn(
              r'def daily_projection_covers\(.*?\n\ndef _is_statement_timeout',
              covers,
              s,
              count=1,
              flags=re.S,
          )
          assert count == 1, f'coverage replacement count={count}'

          start_marker = '    if execution_engine == "materialized_hybrid" and bridge_date:'
          end_marker = '    if not cohort_rows:'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          assert start >= 0 and end > start, (start, end)
          replacement = '''    rpc_by_engine = {
                  "v2_daily": V2_DAILY_PROJECTION_RPC,
                  "interval_fallback": V2_INTERVAL_FALLBACK_RPC,
              }
              cohort_rows, basket_rows = load_filtered_daily_cohort_rows(
                  client, scope_set_ids, start_date=effective_start, end_date=effective_end,
                  rpc_name=rpc_by_engine[execution_engine], **load_kwargs,
              )
          '''
          s = s[:start] + replacement + s[end:]

          forbidden = [
              'V1_DAILY_PROJECTION_RPC',
              'V1_MATERIALIZED_CHUNK_DAYS',
              '"pokemon_market_explorer_card_daily_coverage"',
              '"v1_daily"',
              '"materialized_hybrid"',
          ]
          for token in forbidden:
              assert token not in s, f'forbidden runtime token remains: {token}'
          service_path.write_text(s)

          # Rewrite only the transition-era routing tests; the market math tests
          # stay unchanged.
          test_path = Path('backend/tests/unit/db/services/test_pokemon_market_explorer_query_service.py')
          t = test_path.read_text()
          t = t.replace('                    svc.V1_DAILY_PROJECTION_RPC, svc.V2_DAILY_PROJECTION_RPC,\n',
                        '                    svc.V2_DAILY_PROJECTION_RPC,\n')
          t = t.replace('price_segment_ids=["obtainable"], rpc_name=svc.V1_DAILY_PROJECTION_RPC,',
                        'price_segment_ids=["obtainable"], rpc_name=svc.V2_DAILY_PROJECTION_RPC,')
          t = t.replace('(svc.V1_DAILY_PROJECTION_RPC, "2026-05-21", "2026-05-21"),',
                        '(svc.V2_DAILY_PROJECTION_RPC, "2026-05-21", "2026-05-21"),')
          t = t.replace('assert name == "pokemon_market_explorer_card_daily_coverage"',
                        'assert name == svc.V2_COVERAGE_TABLE')

          # V2 coverage requires the requested range to be inside retained_from.
          t = t.replace(
              '{"set_id": "set-a", "first_market_date": "2026-04-11", "computed_through": "2026-08-31"},\n                {"set_id": "set-b", "first_market_date": "2026-04-11", "computed_through": "2026-08-31"},',
              '{"set_id": "set-a", "retained_from": "2026-04-11", "computed_through": "2026-08-31"},\n                {"set_id": "set-b", "retained_from": "2026-04-11", "computed_through": "2026-08-31"},',
          )
          t = t.replace('"first_market_date": "2026-04-11",\n                 "computed_through": "2026-08-31"',
                        '"retained_from": "2026-04-11",\n                 "computed_through": "2026-08-31"')
          t = t.replace('"first_market_date": "2026-04-23",\n                 "computed_through": "2026-08-31"',
                        '"retained_from": "2026-04-11",\n                 "computed_through": "2026-08-31"')
          t = t.replace('"first_market_date": "2026-08-01",\n                 "computed_through": "2026-08-31"',
                        '"retained_from": "2026-04-11",\n                 "computed_through": "2026-08-31"')
          t = t.replace('"first_market_date": "2026-04-23",\n                 "computed_through": "2026-08-30"',
                        '"retained_from": "2026-04-11",\n                 "computed_through": "2026-08-30"')

          block_start = t.index('class _MaterializedCoverageClient:')
          block_end = t.index('def test_an_unrelated_database_error_still_propagates():', block_start)
          new_tests = '''class _MaterializedCoverageClient:
              def __init__(self, *, v2=True, retained="2026-05-30", through="2026-09-06"):
                  self.v2 = v2
                  self.retained = retained
                  self.through = through

              def table(self, name):
                  if name == svc.V2_COVERAGE_TABLE:
                      return _Query([{"set_id": "set-a", "retained_from": self.retained,
                                      "computed_through": self.through}] if self.v2 else [])
                  raise AssertionError(name)


          @pytest.mark.parametrize(("start", "end", "expected"), [
              ("2026-05-30", "2026-09-06", "v2_daily"),
              ("2026-04-07", "2026-05-30", "interval_fallback"),
              ("2026-04-07", "2026-09-06", "interval_fallback"),
          ])
          def test_materialized_route_is_v2_daily_or_interval_only(start, end, expected):
              route, boundary = svc.resolve_materialized_history_route(
                  _MaterializedCoverageClient(), ["set-a"], start_date=start, end_date=end,
              )
              assert route == expected
              assert boundary == "2026-05-30"


          def test_materialized_route_uses_interval_when_v2_coverage_is_missing():
              route, boundary = svc.resolve_materialized_history_route(
                  _MaterializedCoverageClient(v2=False), ["set-a"],
                  start_date="2026-04-07", end_date="2026-09-06",
              )
              assert (route, boundary) == ("interval_fallback", None)


          def test_materialized_route_uses_interval_when_v2_is_stale():
              route, boundary = svc.resolve_materialized_history_route(
                  _MaterializedCoverageClient(through="2026-09-05"), ["set-a"],
                  start_date="2026-05-30", end_date="2026-09-06",
              )
              assert (route, boundary) == ("interval_fallback", None)


          '''
          t = t[:block_start] + new_tests + t[block_end:]
          assert 'svc.V1_DAILY_PROJECTION_RPC' not in t
          assert 'materialized_hybrid' not in t
          assert '"v1_daily"' not in t
          test_path.write_text(t)
          PY

          python3 -m py_compile \
            backend/db/services/pokemon_market_explorer_query_service.py \
            backend/db/services/market_explorer_constituent_movement.py \
            backend/scripts/publish_market_explorer_daily_projection.py \
            backend/scripts/run_market_explorer_daily_publication.py \
            backend/scripts/check_market_explorer_maintained_cache_health.py

          git diff --check
          grep -n 'V1_DAILY_PROJECTION_RPC\|materialized_hybrid\|"v1_daily"' \
            backend/db/services/pokemon_market_explorer_query_service.py && exit 1 || true

      - name: Run focused query-service tests
        run: |
          python3 -m pip install --disable-pip-version-check -q pytest supabase==2.28.3 python-dotenv==1.2.2
          python3 -m pytest -q backend/tests/unit/db/services/test_pokemon_market_explorer_query_service.py

      - name: Commit codemod if clean
        run: |
          git config user.name 'inDex V2 Cutover'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/db/services/pokemon_market_explorer_query_service.py \
                  backend/tests/unit/db/services/test_pokemon_market_explorer_query_service.py
          git diff --cached --exit-code && exit 0
          git commit -m 'Cut Market Explorer query routing to V2 only'
          git push origin HEAD:fix/market-explorer-v2-runtime-cutover-20260910
