name: Repair Sep22 Market Publication
# Explicit retry after 13:56 Phoenix verification; uses stale-publisher recovery + bounded Set Value repair.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-sep22-market-publication.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Recover stale publisher, repair Set Value, and republish Sep22
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/home/ubuntu/repos/EVRCalculator
          PY="$LIVE/.venv/bin/python"
          TARGET=2026-09-22
          PUB_LOCK=/tmp/pokemon-post-scrape-publication.lock

          cd "$LIVE"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin main --quiet
          git reset --hard origin/main
          echo "live_head=$(git rev-parse HEAD)"
          echo "origin_main=$(git rev-parse origin/main)"

          set -a
          . backend/.env
          set +a

          echo "=== recover only a demonstrably stale canonical publisher ==="
          if ! /usr/bin/flock -n "$PUB_LOCK" -c true; then
            "$PY" - <<'PY'
          import os, signal, subprocess, sys, time
          from backend.db.clients.supabase_client import create_service_role_client

          lock="/tmp/pokemon-post-scrape-publication.lock"
          client=create_service_role_client()
          rows=list(
              client.table("pokemon_explore_set_value_snapshot_latest")
              .select("market_date")
              .eq("tcg","pokemon").eq("scope","market").limit(1)
              .execute().data or []
          )
          public_day=str((rows[0] if rows else {}).get("market_date") or "")[:10]
          print("global_market_before_recovery", public_day)
          if public_day >= "2026-09-22":
              raise SystemExit("global Market is already current; refusing publisher termination")

          raw=subprocess.run(
              ["ps","-eo","pid=,ppid=,etimes=,args="],
              capture_output=True,text=True,check=True
          ).stdout.splitlines()
          procs=[]
          for line in raw:
              parts=line.strip().split(None,3)
              if len(parts)!=4:
                  continue
              try:
                  pid,ppid,age=map(int,parts[:3])
              except ValueError:
                  continue
              procs.append({"pid":pid,"ppid":ppid,"age":age,"args":parts[3]})

          wrappers=[
              p for p in procs
              if "backend/scripts/rebuild_snapshots_after_scrape.sh" in p["args"]
              and ("2026-09-21" in p["args"] or "2026-09-22" in p["args"])
          ]
          refresh=[
              p for p in procs
              if "backend/scripts/refresh_stale_public_snapshots.py" in p["args"]
              and "--commit" in p["args"]
              and ("2026-09-21" in p["args"] or "2026-09-22" in p["args"])
          ]
          print("canonical_wrappers", wrappers)
          print("canonical_refresh", refresh)

          if len(wrappers) != 1:
              raise SystemExit(f"ambiguous canonical publisher wrapper count={len(wrappers)}")
          wrapper=wrappers[0]
          if wrapper["age"] < 1800:
              raise SystemExit(f"canonical publisher age={wrapper['age']}s is below stale threshold; refusing termination")

          for p in sorted(refresh, key=lambda x:x["age"], reverse=True):
              try:
                  os.kill(p["pid"], signal.SIGTERM)
                  print("sigterm_refresh", p)
              except ProcessLookupError:
                  pass
          time.sleep(5)
          try:
              os.kill(wrapper["pid"], signal.SIGTERM)
              print("sigterm_wrapper", wrapper)
          except ProcessLookupError:
              pass
          PY
            RECOVERY_RC=$?
            echo "stale_publisher_recovery_rc=$RECOVERY_RC"
            if [ "$RECOVERY_RC" -ne 0 ]; then
              echo "No safe stale-publisher recovery was performed; waiting for lock."
            fi
          fi

          FREE=0
          for i in $(seq 1 60); do
            if /usr/bin/flock -n "$PUB_LOCK" -c true; then
              FREE=1
              echo "publication_lock_free_after_seconds=$(( (i-1) * 10 ))"
              break
            fi
            if [ "$i" -eq 1 ] || [ $((i % 6)) -eq 0 ]; then
              echo "publication_lock_wait_seconds=$(( (i-1) * 10 ))"
              ps -eo pid=,ppid=,etimes=,args= | grep -E 'rebuild_snapshots_after_scrape|refresh_stale_public_snapshots|repair_missing_market_set_value_history' | grep -v grep || true
            fi
            sleep 10
          done
          [ "$FREE" -eq 1 ] || { echo "FATAL publication lock did not clear"; exit 40; }

          echo "=== explicit missing Set Value repair ==="
          "$PY" -m backend.scripts.repair_missing_market_set_value_history             --market-date "$TARGET"             --commit             --max-passes 5             --sleep-seconds 3

          echo "=== verify Market-root Set Value coverage ==="
          "$PY" - <<'PY'
          from backend.db.clients.supabase_client import create_service_role_client
          from backend.scripts.repair_missing_market_set_value_history import missing_market_root_set_ids
          c=create_service_role_client()
          missing=missing_market_root_set_ids(c, market_date="2026-09-22")
          print("missing_market_root_set_values", len(missing), missing[:20])
          if missing:
              raise SystemExit(41)
          PY

          echo "=== canonical Sep22 publication ==="
          bash backend/scripts/rebuild_snapshots_after_scrape.sh "$TARGET"

          echo "=== verify database authorities ==="
          "$PY" - <<'PY'
          from backend.db.clients.supabase_client import create_service_role_client
          c=create_service_role_client()
          target="2026-09-22"

          q=list(c.table("pokemon_market_date_quality")
                 .select("status,cohort_set_count,qualifying_set_count,contract_version")
                 .eq("tcg","pokemon").eq("market_date",target)
                 .order("evaluated_at",desc=True).limit(1).execute().data or [])
          print("quality", q)
          if not q or q[0].get("status") not in {"READY","LEGACY_VERIFIED"}:
              raise SystemExit(42)

          gm=list(c.table("pokemon_explore_set_value_snapshot_latest")
                  .select("market_date,set_count,updated_at")
                  .eq("tcg","pokemon").eq("scope","market").limit(1).execute().data or [])
          print("global_market", gm)
          if not gm or str(gm[0].get("market_date"))[:10] != target:
              raise SystemExit(43)

          dash=list(c.table("pokemon_set_market_dashboard_snapshot_latest")
                    .select("set_id,latest_market_date")
                    .eq("window_key","365d").execute().data or [])
          dcur=[r for r in dash if str(r.get("latest_market_date") or "")[:10] == target]
          print("dashboard_current", len(dcur), "of", len(dash))
          if len(dcur) < 156:
              raise SystemExit(44)

          cov=list(c.table("pokemon_market_explorer_card_daily_coverage_v2_shadow")
                   .select("set_id,computed_through").limit(1000).execute().data or [])
          ccur=[r for r in cov if str(r.get("computed_through") or "")[:10] >= target]
          print("explorer_v2_current", len(ccur), "of", len(cov))
          if len(ccur) != len(cov) or len(cov) < 167:
              raise SystemExit(45)
          PY

          echo "=== verify public Market ==="
          CURRENT=0
          for i in $(seq 1 18); do
            BODY="$(mktemp)"
            CODE="$(curl --silent --show-error --max-time 45 -o "$BODY" -w '%{http_code}' https://evrcalculator.onrender.com/explore/set-value-market || true)"
            DATE="$("$PY" -c 'import json,sys; p=json.load(open(sys.argv[1])); m=p.get("meta") or {}; s=m.get("snapshot") or {}; print(str(p.get("marketDate") or m.get("marketDate") or s.get("marketDate") or p.get("market_date") or ""))' "$BODY" 2>/dev/null || true)"
            COUNT="$("$PY" -c 'import json,sys; p=json.load(open(sys.argv[1])); x=p.get("sets"); print(len(x) if isinstance(x,list) else -1)' "$BODY" 2>/dev/null || true)"
            rm -f "$BODY"
            echo "public_poll=$i http=$CODE date=$DATE sets=$COUNT"
            if [ "$CODE" = "200" ] && [ "$DATE" = "$TARGET" ]; then
              CURRENT=1
              break
            fi
            sleep 10
          done
          [ "$CURRENT" -eq 1 ] || exit 46

          echo "REPAIR_SEP22_MARKET_PUBLICATION=PASS"
