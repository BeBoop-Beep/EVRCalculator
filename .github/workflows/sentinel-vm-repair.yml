name: Sentinel VM Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sentinel-vm-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reconcile VM and resume Sep 21 publication
        shell: bash
        run: |
          set +e
          set -u
          LIVE=/home/ubuntu/repos/EVRCalculator
          PY=$LIVE/.venv/bin/python
          LOCK=/tmp/pokemon-post-scrape-publication.lock
          MARKET_DATE=2026-09-21

          cd "$LIVE" || exit 1
          echo "=== preconditions ==="
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          TRACKED="$(git status --porcelain --untracked-files=no)"
          printf 'tracked_status=%s\n' "$TRACKED"
          git fetch origin main --quiet || exit 2
          echo "origin_main=$(git rev-parse origin/main)"

          if [ "$(git branch --show-current)" != "main" ]; then echo "FATAL non-main"; exit 3; fi
          if [ -n "$TRACKED" ]; then echo "FATAL tracked changes"; exit 4; fi
          if ! /usr/bin/flock -n "$LOCK" -c true; then echo "FATAL publication active"; exit 5; fi

          echo "=== preserve divergent local commit ==="
          AHEAD="$(git rev-list --count origin/main..HEAD)"
          BEHIND="$(git rev-list --count HEAD..origin/main)"
          echo "ahead=$AHEAD behind=$BEHIND"
          if [ "$AHEAD" -gt 0 ]; then
            command -v gh >/dev/null 2>&1 || exit 6
            gh auth setup-git || exit 6
            git push origin HEAD:refs/heads/backup/vm-pre-sync-20260921 || exit 6
          fi

          echo "=== sync to canonical main ==="
          git reset --hard origin/main || exit 7
          echo "live_head=$(git rev-parse HEAD)"
          echo "tracked_after=$(git status --porcelain --untracked-files=no)"

          echo "=== install canonical cron ==="
          crontab infra/oracle/tcgplayer-scraper-pokemon.crontab || exit 8
          crontab -l | grep -E 'post-scrape-publication-watchdog|sentinel'
          crontab -l > /tmp/sentinel-repair-current.cron
          diff -u /tmp/sentinel-repair-current.cron infra/oracle/tcgplayer-scraper-pokemon.crontab
          echo "cron_diff_rc=$?"

          echo "=== focused code validation ==="
          "$PY" -m pytest -q backend/tests/unit/sentinel/test_state_persistence_retry.py
          TEST_RC=$?
          echo "sentinel_state_tests_rc=$TEST_RC"
          if [ "$TEST_RC" -ne 0 ]; then exit 9; fi
          "$PY" -m py_compile backend/sentinel/state.py backend/alerts/post_scrape_publication_watchdog.py backend/db/services/price_storage_v2_projection_gate.py
          COMPILE_RC=$?
          echo "compile_rc=$COMPILE_RC"
          if [ "$COMPILE_RC" -ne 0 ]; then exit 10; fi

          echo "=== rearm exact pre-fix terminal projection row ==="
          (
            set -a
            . backend/.env
            set +a
            "$PY" -c 'from datetime import datetime,timezone; from backend.db.clients.supabase_client import create_service_role_client; c=create_service_role_client(); now=datetime.now(timezone.utc).isoformat(); r=c.table("price_storage_v2_shadow_queue").update({"status":"pending","attempts":0,"started_at":None,"completed_at":None,"last_error":"rearmed after staged Price Storage V2 worker deployment","updated_at":now}).eq("id",377635).eq("set_id","75cd439d-aaa2-41cb-86f3-2fefa5b26e29").eq("market_date","2026-09-21").eq("status","failed").eq("attempts",5).execute(); print("rearmed_rows="+str(len(r.data or [])))'
          )
          REARM_RC=$?
          echo "rearm_rc=$REARM_RC"
          if [ "$REARM_RC" -ne 0 ]; then exit 11; fi

          echo "=== advance Price Storage V2 ==="
          READY=0
          for round in $(seq 1 12); do
            echo "projection_round=$round"
            (
              set -a
              . backend/.env
              set +a
              "$PY" -c 'import json; from backend.db.clients.supabase_client import create_service_role_client; from backend.db.services.price_storage_v2_projection_gate import advance_price_projection_once; c=create_service_role_client(); r=advance_price_projection_once(c,"2026-09-21",process_limit=20); a=r.get("after") or {}; print("PROJECTION_AFTER="+json.dumps(a,sort_keys=True)); print("PROJECTION_READY="+("1" if a.get("ready") else "0")); print("PROJECTION_TERMINAL="+str(a.get("terminal_failed_set_count",0)))'
            ) | tee /tmp/projection-round.txt
            ADV_RC=$?
            echo "projection_advance_rc=$ADV_RC"
            if [ "$ADV_RC" -ne 0 ]; then sleep 10; continue; fi
            if grep -q 'PROJECTION_TERMINAL=[1-9]' /tmp/projection-round.txt; then echo "FATAL terminal projection remains"; exit 12; fi
            if grep -q 'PROJECTION_READY=1' /tmp/projection-round.txt; then READY=1; echo "projection_ready_round=$round"; break; fi
            sleep 5
          done
          if [ "$READY" -ne 1 ]; then echo "FATAL projection not ready after bounded rounds"; exit 13; fi

          echo "=== launch canonical publication ==="
          (
            set -a
            . backend/.env
            set +a
            "$PY" -m backend.alerts.post_scrape_publication_watchdog --recover-stalled --recover-superseded
          )
          echo "post_scrape_watchdog_rc=$?"

          echo "=== wait for Sep 21 public authority ==="
          CURRENT=0
          for i in $(seq 1 40); do
            DATE="$(curl --fail --silent --show-error --max-time 45 https://evrcalculator.onrender.com/explore/set-value-market | "$PY" -c 'import json,sys; p=json.load(sys.stdin); m=p.get("meta") or {}; s=m.get("snapshot") or {}; print(str(p.get("marketDate") or m.get("marketDate") or s.get("marketDate") or p.get("market_date") or ""))' 2>/dev/null)"
            echo "public_market_poll=$i date=$DATE"
            if [ "$DATE" = "$MARKET_DATE" ]; then CURRENT=1; break; fi
            if /usr/bin/flock -n "$LOCK" -c true; then echo "publication_lock=free"; else echo "publication_lock=held"; fi
            tail -n 8 publication.log 2>/dev/null || true
            sleep 30
          done
          echo "public_market_current=$CURRENT"

          echo "=== Sentinel canaries ==="
          (
            set -a
            . backend/.env
            set +a
            SENTINEL_RUNNER_BUILD_SHA="$(git rev-parse HEAD)" SENTINEL_RECOVERY_ENABLED=false SENTINEL_RECOVERY_EXECUTION_READY=false "$PY" -m backend.sentinel.operational --profile fast
          )
          echo "sentinel_fast_rc=$?"
          (
            set -a
            . backend/.env
            set +a
            SENTINEL_RUNNER_BUILD_SHA="$(git rev-parse HEAD)" SENTINEL_RECOVERY_ENABLED=false SENTINEL_RECOVERY_EXECUTION_READY=false "$PY" -m backend.sentinel.operational --profile public
          )
          echo "sentinel_public_rc=$?"

          echo "=== final ==="
          echo "live_head=$(git rev-parse HEAD)"
          echo "origin_main=$(git rev-parse origin/main)"
          if /usr/bin/flock -n "$LOCK" -c true; then echo "publication_lock_final=free"; else echo "publication_lock_final=held"; fi
          curl --fail --silent --show-error --max-time 45 https://evrcalculator.onrender.com/explore/set-value-market | "$PY" -c 'import json,sys; p=json.load(sys.stdin); m=p.get("meta") or {}; s=m.get("snapshot") or {}; print("public_market_date="+str(p.get("marketDate") or m.get("marketDate") or s.get("marketDate") or p.get("market_date"))); print("public_market_set_count="+str(len(p.get("sets") or [])))'
          tail -n 40 publication.log 2>/dev/null || true
