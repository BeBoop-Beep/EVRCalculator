name: Probe 30th Collector Repair Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-30th-collector-repair-status-20260922.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture runner and repair status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners"             > /tmp/runners.json
          curl -fsS             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100"             > /tmp/runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          runners=json.load(open("/tmp/runners.json"))
          runs=json.load(open("/tmp/runs.json"))
          keep=[]
          for r in runs.get("workflow_runs") or []:
              if r.get("name") in {
                  "Repair 30th Collector Enrichment",
                  "Repair 30th Images and Collector Enrichment",
              } or r.get("status") in {"queued","in_progress","waiting","pending"}:
                  keep.append({
                      "id":r.get("id"),
                      "name":r.get("name"),
                      "status":r.get("status"),
                      "conclusion":r.get("conclusion"),
                      "head_branch":r.get("head_branch"),
                      "head_sha":r.get("head_sha"),
                      "event":r.get("event"),
                      "created_at":r.get("created_at"),
                      "updated_at":r.get("updated_at"),
                      "run_attempt":r.get("run_attempt"),
                  })
          out={
              "runners":[{
                  "id":x.get("id"),
                  "name":x.get("name"),
                  "status":x.get("status"),
                  "busy":x.get("busy"),
                  "labels":[y.get("name") for y in (x.get("labels") or [])],
              } for x in (runners.get("runners") or [])],
              "runs":keep,
          }
          Path("ops/assistant").mkdir(parents=True,exist_ok=True)
          Path("ops/assistant/repair-30th-collector-live-status.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          PY
          git config user.name "inDex hosted probe"
          git config user.email "actions@users.noreply.github.com"
          git add ops/assistant/repair-30th-collector-live-status.json
          git commit -m "ops: record 30th collector repair live status"
          git push origin HEAD:main
