name: Fair Value Shadow Ledger Postgres

on:
  push:
    branches:
      - research/index-fair-value-sold-clearing-anchor-v1-20261001
    paths:
      - "backend/db/migrations/20261002060000_fair_value_shadow_ledger_v1.sql"
      - "supabase/migrations/20261002060000_fair_value_shadow_ledger_v1.sql"
      - "backend/tests/unit/scripts/test_index_fair_value_shadow_s3.py"
      - ".github/workflows/fv-shadow-ledger-postgres.yml"

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fv_shadow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fv_shadow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fv_shadow_test
    steps:
      - uses: actions/checkout@v4

      - name: Verify migration mirrors and terminal integrity
        shell: bash
        run: |
          set -euo pipefail
          cmp -s backend/db/migrations/20261002060000_fair_value_shadow_ledger_v1.sql supabase/migrations/20261002060000_fair_value_shadow_ledger_v1.sql
          python3 - <<'PY'
          from pathlib import Path
          p=Path("supabase/migrations/20261002060000_fair_value_shadow_ledger_v1.sql")
          s=p.read_text(encoding="utf-8").replace("\r\n","\n")
          assert s.endswith("COMMIT;\n")
          assert s.count("BEGIN;")==1
          assert s.count("COMMIT;")==1
          tables=[
            "fair_value_shadow_anchor_publications_v1",
            "fair_value_shadow_anchor_members_v1",
            "fair_value_shadow_component_observations_v1",
            "fair_value_shadow_evaluation_outcomes_v1",
          ]
          assert all(s.count(f"CREATE TABLE public.{t} (")==1 for t in tables)
          assert s.count("CREATE OR REPLACE FUNCTION public.publish_fair_value_shadow_anchor_v1(")==1
          assert s.count("AS $$")==4
          assert s.count("\n$$;")==4
          print("migration_static_integrity=PASS")
          PY

      - name: Prepare minimal production-authority fixture
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE public.pokemon_canonical_cards (
            id uuid PRIMARY KEY
          );
          CREATE TABLE public.card_variants (
            id uuid PRIMARY KEY
          );
          CREATE TABLE public.pkmnprices_ebay_sold_evidence_v1 (
            provider_listing_id bigint NOT NULL,
            provider_card_id bigint NOT NULL,
            PRIMARY KEY (provider_listing_id, provider_card_id)
          );
          SQL

      - name: Apply real migration on PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261002060000_fair_value_shadow_ledger_v1.sql
          echo "migration_apply=PASS"

      - name: Verify schema, RPC idempotence and append-only enforcement
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.pokemon_canonical_cards(id) VALUES ('11111111-1111-1111-1111-111111111111');
          INSERT INTO public.card_variants(id) VALUES ('22222222-2222-2222-2222-222222222222');

          DO $$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n
              FROM pg_class c JOIN pg_namespace nsp ON nsp.oid=c.relnamespace
             WHERE nsp.nspname='public'
               AND c.relname IN (
                 'fair_value_shadow_anchor_publications_v1',
                 'fair_value_shadow_anchor_members_v1',
                 'fair_value_shadow_component_observations_v1',
                 'fair_value_shadow_evaluation_outcomes_v1'
               )
               AND c.relkind='r';
            IF n <> 4 THEN RAISE EXCEPTION 'expected four shadow tables, got %', n; END IF;
          END $$;

          SET ROLE service_role;
          SELECT public.publish_fair_value_shadow_anchor_v1(
            jsonb_build_object(
              'publication_id','33333333-3333-3333-3333-333333333333',
              'schema_version','fv_shadow_anchor_publication_v1',
              'rule_version','EXPLICIT_NM_SOLD_CLEARING_ANCHOR_V1',
              'canonical_card_id','11111111-1111-1111-1111-111111111111',
              'card_variant_id','22222222-2222-2222-2222-222222222222',
              'evaluation_date',current_date::text,
              'information_cutoff',(current_date::text || 'T00:00:00Z'),
              'evidence_cutoff',(current_date::text || 'T00:00:00Z'),
              'status','INSUFFICIENT_COMPS',
              'evidence_status','PROSPECTIVE_AS_KNOWN_AT_CUTOFF',
              'enrichment_policy','FIRST_SEEN_PROVIDER_ENRICHMENT_RESEARCH_ONLY',
              'selected_window_days',NULL,
              'eligible_comp_count',0,
              'eligible_counts_by_window','{"7":0,"30":0,"60":0,"90":0,"180":0}'::jsonb,
              'sold_at_min',NULL,
              'sold_at_max',NULL,
              'collected_at_max',NULL,
              'ingested_at_max',NULL,
              'median',NULL,
              'median_usd_2dp',NULL,
              'q1',NULL,'q3',NULL,'iqr',NULL,'mad',NULL,
              'distinct_transaction_days',NULL,
              'membership_fingerprint',repeat('a',64),
              'evidence_fingerprint',repeat('b',64),
              'content_fingerprint',repeat('c',64),
              'exclusion_counts','{}'::jsonb,
              'input_fingerprints','{}'::jsonb,
              'rows_offered',0,
              'generated_at',clock_timestamp()::text,
              'source_commit','9fca814'
            ),
            '[]'::jsonb
          ) AS first_publish \gset
          \if :{?first_publish}
          \else
            \quit 41
          \endif

          SELECT public.publish_fair_value_shadow_anchor_v1(
            jsonb_build_object(
              'publication_id','33333333-3333-3333-3333-333333333333',
              'schema_version','fv_shadow_anchor_publication_v1',
              'rule_version','EXPLICIT_NM_SOLD_CLEARING_ANCHOR_V1',
              'canonical_card_id','11111111-1111-1111-1111-111111111111',
              'card_variant_id','22222222-2222-2222-2222-222222222222',
              'evaluation_date',current_date::text,
              'information_cutoff',(current_date::text || 'T00:00:00Z'),
              'evidence_cutoff',(current_date::text || 'T00:00:00Z'),
              'status','INSUFFICIENT_COMPS',
              'evidence_status','PROSPECTIVE_AS_KNOWN_AT_CUTOFF',
              'enrichment_policy','FIRST_SEEN_PROVIDER_ENRICHMENT_RESEARCH_ONLY',
              'selected_window_days',NULL,
              'eligible_comp_count',0,
              'eligible_counts_by_window','{"7":0,"30":0,"60":0,"90":0,"180":0}'::jsonb,
              'sold_at_min',NULL,'sold_at_max',NULL,
              'collected_at_max',NULL,'ingested_at_max',NULL,
              'median',NULL,'median_usd_2dp',NULL,
              'q1',NULL,'q3',NULL,'iqr',NULL,'mad',NULL,
              'distinct_transaction_days',NULL,
              'membership_fingerprint',repeat('a',64),
              'evidence_fingerprint',repeat('b',64),
              'content_fingerprint',repeat('c',64),
              'exclusion_counts','{}'::jsonb,
              'input_fingerprints','{}'::jsonb,
              'rows_offered',0,
              'generated_at',clock_timestamp()::text,
              'source_commit','9fca814'
            ),
            '[]'::jsonb
          ) AS second_publish \gset

          INSERT INTO public.fair_value_shadow_component_observations_v1(
            publication_id,schema_version,content_fingerprint,canonical_card_id,evaluation_date,
            evidence_status,enrichment_policy,shadow_status,current_tcgplayer_market_price_usd,
            market_price_date,explicit_nm_sold_clearing_anchor_v1_usd,structural_baseline_usd,
            structural_baseline_source,pull_probability,negative_ln_pull_probability,scarcity_source,
            collector_appeal,collector_appeal_source,comp_count,selected_window_days,iqr,mad,
            evidence_age_days_since_newest_sale,divergence_sold_anchor_minus_current_market,
            divergence_structural_minus_current_market,divergence_sold_anchor_minus_structural,blended_value
          ) VALUES (
            '33333333-3333-3333-3333-333333333333','fv_shadow_component_observation_v1',repeat('d',64),
            '11111111-1111-1111-1111-111111111111',current_date,'PROSPECTIVE_AS_KNOWN_AT_CUTOFF',
            'FIRST_SEEN_PROVIDER_ENRICHMENT_RESEARCH_ONLY','ANCHOR_INSUFFICIENT',NULL,current_date,
            NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,0,NULL,NULL,NULL,NULL,'{}','{}','{}',NULL
          );

          INSERT INTO public.fair_value_shadow_evaluation_outcomes_v1(
            publication_id,horizon_days,schema_version,content_fingerprint,comparison_date,
            comparison_market_price_usd,comparison_price_source,baseline_market_price_usd,
            anchor_usd_at_publication,abs_error_usd,signed_pct_error,abs_pct_error,
            forward_market_change_pct,divergence_at_publication,outcome_status
          ) VALUES (
            '33333333-3333-3333-3333-333333333333',0,'fv_shadow_evaluation_outcome_v1',repeat('e',64),
            current_date,NULL,'TCGPlayer',NULL,NULL,NULL,NULL,NULL,NULL,NULL,'ANCHOR_INSUFFICIENT'
          );
          RESET ROLE;

          DO $$
          BEGIN
            BEGIN
              UPDATE public.fair_value_shadow_anchor_publications_v1
                 SET source_commit='abcdef0'
               WHERE publication_id='33333333-3333-3333-3333-333333333333';
              RAISE EXCEPTION 'UPDATE unexpectedly succeeded';
            EXCEPTION WHEN integrity_constraint_violation THEN NULL; END;
            BEGIN
              DELETE FROM public.fair_value_shadow_component_observations_v1
               WHERE publication_id='33333333-3333-3333-3333-333333333333';
              RAISE EXCEPTION 'DELETE unexpectedly succeeded';
            EXCEPTION WHEN integrity_constraint_violation THEN NULL; END;
            BEGIN
              TRUNCATE public.fair_value_shadow_evaluation_outcomes_v1;
              RAISE EXCEPTION 'TRUNCATE unexpectedly succeeded';
            EXCEPTION WHEN integrity_constraint_violation THEN NULL; END;
          END $$;

          DO $$
          BEGIN
            IF NOT has_table_privilege('service_role','public.fair_value_shadow_anchor_publications_v1','SELECT') THEN
              RAISE EXCEPTION 'service_role lacks SELECT';
            END IF;
            IF NOT has_table_privilege('service_role','public.fair_value_shadow_anchor_publications_v1','INSERT') THEN
              RAISE EXCEPTION 'service_role lacks INSERT';
            END IF;
            IF has_table_privilege('service_role','public.fair_value_shadow_anchor_publications_v1','UPDATE')
               OR has_table_privilege('service_role','public.fair_value_shadow_anchor_publications_v1','DELETE') THEN
              RAISE EXCEPTION 'service_role has mutation privilege';
            END IF;
            IF has_table_privilege('anon','public.fair_value_shadow_anchor_publications_v1','SELECT')
               OR has_table_privilege('authenticated','public.fair_value_shadow_anchor_publications_v1','SELECT') THEN
              RAISE EXCEPTION 'API role unexpectedly has table access';
            END IF;
            IF NOT has_function_privilege('service_role','public.publish_fair_value_shadow_anchor_v1(jsonb,jsonb)','EXECUTE') THEN
              RAISE EXCEPTION 'service_role lacks publication RPC execute';
            END IF;
          END $$;

          SELECT CASE WHEN :'first_publish'='INSERTED' THEN 1 ELSE 1/0 END;
          SELECT CASE WHEN :'second_publish'='IDEMPOTENT_NOOP' THEN 1 ELSE 1/0 END;
          SELECT 'FV_SHADOW_LEDGER_POSTGRES=PASS' AS result;
          SQL
