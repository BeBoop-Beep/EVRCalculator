name: Market Sep21 Immediate Cutover

on:
  push:
    branches: [ops/market-explorer-finish-20260921]
    paths:
      - '.github/workflows/market-sep21-immediate-cutover.yml'

permissions:
  contents: read

jobs:
  cutover:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Recover stale watchdog lock and advance public Market
        shell: bash
        run: |
          set -uo pipefail
          LIVE=/home/ubuntu/repos/EVRCalculator
          PY="$LIVE/.venv/bin/python"
          TARGET=2026-09-21
          WATCH_LOCK=/tmp/post-scrape-publication-watchdog.lock
          PUB_LOCK=/tmp/pokemon-post-scrape-publication.lock
          cd "$LIVE" || exit 1

          echo "=== preflight ==="
          echo "utc=$(date -u +%FT%TZ)"
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          echo "watchdog_lock_before=$(/usr/bin/flock -n "$WATCH_LOCK" -c true && echo free || echo held)"
          echo "publication_lock_before=$(/usr/bin/flock -n "$PUB_LOCK" -c true && echo free || echo held)"
          ps -eo pid=,ppid=,etimes=,args= | grep -E 'post_scrape_publication_watchdog|rebuild_snapshots_after_scrape|refresh_stale_public_snapshots' | grep -v grep || true

          if ! /usr/bin/flock -n "$WATCH_LOCK" -c true; then
            if ! /usr/bin/flock -n "$PUB_LOCK" -c true; then
              echo "FATAL both watchdog and publication locks are held; refusing ambiguous recovery"
              exit 20
            fi
            "$PY" -c 'import os,signal,subprocess,sys,time; lock="/tmp/post-scrape-publication-watchdog.lock"; module="backend.alerts.post_scrape_publication_watchdog"; rows=[]; raw=subprocess.run(["ps","-eo","pid=,ppid=,etimes=,args="],capture_output=True,text=True,check=True).stdout.splitlines(); [(lambda p: rows.append({"pid":int(p[0]),"ppid":int(p[1]),"age":int(p[2]),"args":p[3]}))(line.strip().split(None,3)) for line in raw if len(line.strip().split(None,3))==4 and all(x.isdigit() for x in line.strip().split(None,3)[:3])]; py=[r for r in rows if module in r["args"] and " -m " in (" "+r["args"]+" ")]; fl=[r for r in rows if lock in r["args"] and "flock" in r["args"] and module in r["args"]]; print("canonical_watchdog_python="+repr(py)); print("canonical_watchdog_flock="+repr(fl)); (len(py)==1 or (_ for _ in ()).throw(SystemExit(21))); (py[0]["age"]>=600 or (_ for _ in ()).throw(SystemExit(22))); os.kill(py[0]["pid"],signal.SIGTERM); print("watchdog_sigterm_pid="+str(py[0]["pid"])+" age="+str(py[0]["age"])); time.sleep(5); [(os.kill(r["pid"],signal.SIGTERM),print("watchdog_flock_sigterm_pid="+str(r["pid"]))) for r in fl if r["age"]>=600 and r["pid"]!=os.getpid()]'
            RECOVER_RC=$?
            echo "watchdog_recovery_rc=$RECOVER_RC"
            [ "$RECOVER_RC" -eq 0 ] || exit "$RECOVER_RC"
            RELEASED=0
            for i in $(seq 1 12); do
              if /usr/bin/flock -n "$WATCH_LOCK" -c true; then
                RELEASED=1
                echo "watchdog_lock_released_after_seconds=$((i*5))"
                break
              fi
              sleep 5
            done
            [ "$RELEASED" -eq 1 ] || exit 23
          fi

          echo "=== acquire coordination locks ==="
          exec 8>"$WATCH_LOCK"
          flock -w 60 8 || exit 24
          exec 9>"$PUB_LOCK"
          flock -w 60 9 || exit 25

          echo "=== sync live checkout ==="
          test "$(git branch --show-current)" = "main" || exit 26
          test -z "$(git status --porcelain --untracked-files=no)" || exit 27
          git fetch origin main --quiet || exit 28
          AHEAD="$(git rev-list --count origin/main..HEAD)"
          echo "ahead_of_origin_main=$AHEAD"
          [ "$AHEAD" -eq 0 ] || exit 29
          git reset --hard origin/main || exit 30
          echo "live_head=$(git rev-parse HEAD)"
          echo "origin_main=$(git rev-parse origin/main)"

          set -a
          . backend/.env
          set +a

          echo "=== require Price Storage V2 ready ==="
          "$PY" -c 'import json; from backend.db.clients.supabase_client import create_service_role_client; from backend.db.services.price_storage_v2_projection_gate import evaluate_price_projection_gate; c=create_service_role_client(); d=evaluate_price_projection_gate(c,"2026-09-21"); print("price_projection="+json.dumps(d.to_dict(),sort_keys=True,default=str)); raise SystemExit(0 if d.ready else 31)'
          [ "$?" -eq 0 ] || exit 31

          echo "=== require Market quality READY ==="
          STATUS="$("$PY" -c 'from backend.db.clients.supabase_client import create_service_role_client; c=create_service_role_client(); r=list(c.table("pokemon_market_date_quality").select("status").eq("tcg","pokemon").eq("market_date","2026-09-21").limit(1).execute().data or []); print(str((r[0] if r else {}).get("status") or ""))')"
          echo "market_quality=$STATUS"
          if [ "$STATUS" != "READY" ] && [ "$STATUS" != "LEGACY_VERIFIED" ]; then exit 32; fi

          echo "=== require all tracked Set Value histories current ==="
          "$PY" -c 'import json; from backend.db.clients.supabase_client import create_service_role_client; c=create_service_role_client(); day="2026-09-21"; rows=list(c.rpc("get_pokemon_market_explorer_set_history_coverage_v1",{"p_set_ids":None}).execute().data or []); cur=[r for r in rows if str(r.get("latest_snapshot_date") or "")[:10]>=day]; out={"total":len(rows),"current":len(cur),"stale":len(rows)-len(cur),"minLatest":min((str(r.get("latest_snapshot_date") or "")[:10] for r in rows),default=None),"maxLatest":max((str(r.get("latest_snapshot_date") or "")[:10] for r in rows),default=None)}; print("set_history="+json.dumps(out,sort_keys=True)); raise SystemExit(0 if rows and len(cur)==len(rows) else 33)'
          [ "$?" -eq 0 ] || exit 33

          echo "=== publish compact Set Value authority ==="
          "$PY" -m backend.scripts.build_pokemon_explore_set_value_snapshot --commit --market-date "$TARGET"
          SET_VALUE_RC=$?
          echo "set_value_snapshot_rc=$SET_VALUE_RC"
          [ "$SET_VALUE_RC" -eq 0 ] || exit 34

          echo "=== advance Explorer V2 ==="
          "$PY" -m backend.scripts.run_market_explorer_daily_publication --commit --market-date "$TARGET"
          EXPLORER_RC=$?
          echo "explorer_v2_rc=$EXPLORER_RC"
          [ "$EXPLORER_RC" -eq 0 ] || exit 35

          echo "=== verify exact Explorer V2 coverage ==="
          "$PY" -c 'import json; from backend.db.clients.supabase_client import create_service_role_client; c=create_service_role_client(); day="2026-09-21"; tracked=list(c.rpc("get_pokemon_market_explorer_set_history_coverage_v1",{"p_set_ids":None}).execute().data or []); expected={str(r.get("set_id")) for r in tracked if r.get("set_id")}; rows=list(c.table("pokemon_market_explorer_card_daily_coverage_v2_shadow").select("set_id,computed_through,row_count,retention_days").limit(1000).execute().data or []); by={str(r.get("set_id")):r for r in rows if r.get("set_id")}; stale=sorted(s for s in expected if str((by.get(s) or {}).get("computed_through") or "")[:10]<day); missing=sorted(expected-set(by)); extra=sorted(set(by)-expected); bad=[r for r in rows if int(r.get("retention_days") or 0)!=100 or int(r.get("row_count") or 0)<0]; out={"expected":len(expected),"rows":len(rows),"stale":len(stale),"missing":len(missing),"extra":len(extra),"bad":len(bad)}; print("explorer_v2_coverage="+json.dumps(out,sort_keys=True)); raise SystemExit(0 if expected and not stale and not missing and not extra and not bad else 36)'
          [ "$?" -eq 0 ] || exit 36

          flock -u 9
          flock -u 8

          echo "=== public cutover ==="
          CURRENT=0
          for i in $(seq 1 12); do
            BODY="$(mktemp)"
            CODE="$(curl --silent --show-error --max-time 45 -o "$BODY" -w '%{http_code}' https://evrcalculator.onrender.com/explore/set-value-market || true)"
            DATE="$("$PY" -c 'import json,sys; p=json.load(open(sys.argv[1])); m=p.get("meta") or {}; s=m.get("snapshot") or {}; print(str(p.get("marketDate") or m.get("marketDate") or s.get("marketDate") or p.get("market_date") or ""))' "$BODY" 2>/dev/null || true)"
            COUNT="$("$PY" -c 'import json,sys; p=json.load(open(sys.argv[1])); x=p.get("sets"); print(len(x) if isinstance(x,list) else -1)' "$BODY" 2>/dev/null || true)"
            rm -f "$BODY"
            echo "public_poll=$i http=$CODE date=$DATE sets=$COUNT"
            if [ "$CODE" = "200" ] && [ "$DATE" = "$TARGET" ]; then CURRENT=1; break; fi
            sleep 10
          done
          echo "public_market_current=$CURRENT"
          [ "$CURRENT" -eq 1 ] || exit 37

          echo "=== Sentinel observation canaries ==="
          SENTINEL_RUNNER_BUILD_SHA="$(git rev-parse HEAD)" SENTINEL_RECOVERY_ENABLED=false SENTINEL_RECOVERY_EXECUTION_READY=false "$PY" -m backend.sentinel.operational --profile fast
          FAST_RC=$?
          echo "sentinel_fast_rc=$FAST_RC"
          SENTINEL_RUNNER_BUILD_SHA="$(git rev-parse HEAD)" SENTINEL_RECOVERY_ENABLED=false SENTINEL_RECOVERY_EXECUTION_READY=false "$PY" -m backend.sentinel.operational --profile public
          PUBLIC_RC=$?
          echo "sentinel_public_rc=$PUBLIC_RC"
          if [ "$FAST_RC" -ne 0 ] || [ "$PUBLIC_RC" -ne 0 ]; then exit 38; fi

          echo "MARKET_SEP21_IMMEDIATE_CUTOVER=PASS"
