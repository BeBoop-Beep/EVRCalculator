name: Raw Parent Edition Stable Cutover

on:
  push:
    branches:
      - fix/raw-parent-edition-stable-20260927
    paths:
      - '.github/workflows/raw-parent-edition-stable-cutover.yml'

permissions:
  contents: read

concurrency:
  group: raw-parent-edition-stable-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Prepare isolated fix worktree
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/tmp/EVRCalculator-raw-parent-edition-stable
          HOLD=/home/ubuntu/state/db-safety/hold.json
          test -d "$REPO/.git"
          test ! -e "$HOLD" || { echo "database safety hold active"; exit 41; }
          git -C "$REPO" fetch origin fix/raw-parent-edition-stable-20260927
          if [ -d "$WT" ]; then
            git -C "$REPO" worktree remove --force "$WT" || rm -rf "$WT"
          fi
          git -C "$REPO" worktree add --detach "$WT" origin/fix/raw-parent-edition-stable-20260927
          ACTUAL_SHA="$(git -C "$WT" rev-parse HEAD)"
          echo "worktree_sha=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test -x "$REPO/.venv/bin/python"

      - name: Verify serving Explorer Raw is edition-stable
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/tmp/EVRCalculator-raw-parent-edition-stable
          PY="$REPO/.venv/bin/python"
          set -a
          . "$REPO/backend/.env"
          set +a
          PYTHONPATH="$WT" "$PY" - <<'PY'
          import json
          from backend.db.clients.supabase_client import create_service_role_client

          c=create_service_role_client()
          serving=list(
              c.table("pokemon_market_explorer_surface_serving_v2")
              .select("generation_id").eq("singleton",1).limit(1).execute().data or []
          )
          if not serving:
              raise RuntimeError("serving generation missing")
          generation=str(serving[0]["generation_id"])
          raw=list(
              c.table("pokemon_market_explorer_surface_directory_v2")
              .select("source_kind,current_tracked_value,current_index_value,constituent_count,metadata")
              .eq("generation_id",generation).eq("market_key","raw").limit(1).execute().data or []
          )
          if not raw:
              raise RuntimeError("serving Raw directory missing")
          row=raw[0]
          meta=row.get("metadata") or {}
          if row.get("source_kind")!="pokemon_market_raw_edition_stable_daily_history_v1":
              raise RuntimeError(f"Raw source is not edition-stable: {row}")
          if meta.get("editionStable") is not True or meta.get("legacyGenericVintageExcluded") is not True:
              raise RuntimeError(f"Raw metadata not edition-stable: {meta}")
          if int(row.get("constituent_count") or 0)!=19952:
              raise RuntimeError(f"unexpected Raw leaf count: {row}")
          print(json.dumps({
              "status":"EXPLORER_RAW_STABLE",
              "generationId":generation,
              "basketValue":row.get("current_tracked_value"),
              "indexValue":row.get("current_index_value"),
              "leafCount":row.get("constituent_count"),
          },sort_keys=True))
          PY

      - name: Rebuild public Market snapshot from stable Raw authority
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/tmp/EVRCalculator-raw-parent-edition-stable
          PY="$REPO/.venv/bin/python"
          cd "$WT"
          set -a
          . "$REPO/backend/.env"
          set +a
          export PYTHONPATH="$WT"
          export SUPABASE_SERVICE_ROLE_POSTGREST_TIMEOUT_SECONDS=180
          export PUBLICATION_BUILD_SHA="$EXPECTED_SHA"
          "$PY" -m backend.scripts.build_pokemon_explore_set_value_snapshot \
            --market-date 2026-09-27 --commit

      - name: Verify public Market snapshot uses edition-stable Raw
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/tmp/EVRCalculator-raw-parent-edition-stable
          PY="$REPO/.venv/bin/python"
          set -a
          . "$REPO/backend/.env"
          set +a
          PYTHONPATH="$WT" "$PY" - <<'PY'
          import json
          from backend.db.clients.supabase_client import create_service_role_client

          c=create_service_role_client()
          rows=list(
              c.table("pokemon_explore_set_value_snapshot_latest")
              .select("market_date,payload_json")
              .eq("tcg","pokemon").eq("scope","market").limit(1).execute().data or []
          )
          if not rows:
              raise RuntimeError("public Market snapshot missing")
          payload=rows[0].get("payload_json") or {}
          overview=payload.get("marketOverview") or {}
          method=overview.get("methodology") or {}
          coverage=overview.get("coverage") or {}
          raw=overview.get("raw") or {}
          if method.get("editionStableRaw") is not True:
              raise RuntimeError(f"public Raw methodology is not stable: {method}")
          if method.get("rawMethodologyVersion")!="edition_stable_market_identity_chain_v1":
              raise RuntimeError(f"wrong public Raw methodology version: {method}")
          expected={
              "rawMarketCount":158,
              "rawRootCount":154,
              "rawCardCount":19952,
          }
          for key,value in expected.items():
              if int(coverage.get(key) or 0)!=value:
                  raise RuntimeError(f"{key} mismatch: {coverage}")
          if round(float(raw.get("basketValue")),2)!=434954.97:
              raise RuntimeError(f"Raw basket mismatch: {raw}")
          if abs(float(raw.get("indexValue"))-119.63674934197023)>1e-8:
              raise RuntimeError(f"Raw index mismatch: {raw}")
          diagnostics=(payload.get("meta") or {}).get("publicationDiagnostics") or {}
          stable_receipt=diagnostics.get("rawEditionStable") or {}
          if stable_receipt.get("status")!="READY":
              raise RuntimeError(f"stable publication receipt missing: {diagnostics}")

          print(json.dumps({
              "status":"RAW_EDITION_STABLE_CUTOVER_PASS",
              "marketDate":rows[0]["market_date"],
              "rawBasketValue":raw.get("basketValue"),
              "rawIndexValue":raw.get("indexValue"),
              "rawMarketCount":coverage.get("rawMarketCount"),
              "rawRootCount":coverage.get("rawRootCount"),
              "rawCardCount":coverage.get("rawCardCount"),
          },sort_keys=True))
          PY

      - name: Clean isolated worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/tmp/EVRCalculator-raw-parent-edition-stable
          if [ -d "$WT" ]; then
            git -C "$REPO" worktree remove --force "$WT" || rm -rf "$WT"
          fi
