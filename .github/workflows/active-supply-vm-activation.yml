name: Active Supply VM Activation

on:
  push:
    branches:
      - ops/active-supply-vm-activation-20260929
    paths:
      - ".active-supply-vm/request.txt"
      - ".github/workflows/active-supply-vm-activation.yml"

permissions:
  contents: read

concurrency:
  group: active-supply-vm-activation
  cancel-in-progress: false

jobs:
  vm:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 45
    env:
      RELEASE_SHA: d008a943ba66ad4f0738c2fd779d58e637df2880
      VM_REQUEST_MESSAGE: ${{ github.event.head_commit.message }}
      ACTIONS_SELLER_HASH_KEY: ${{ secrets.ACTIVE_SUPPLY_SELLER_HASH_KEY }}
    steps:
      - name: Resolve fixed operation
        shell: bash
        run: |
          set -euo pipefail
          case "$VM_REQUEST_MESSAGE" in
            "active-supply-vm: noop") OP=noop ;;
            "active-supply-vm: hostkeys") OP=hostkeys ;;
            "active-supply-vm: credential-status") OP=credential-status ;;
            "active-supply-vm: db-target-status") OP=db-target-status ;;
            "active-supply-vm: db-schema-status") OP=db-schema-status ;;
            "active-supply-vm: install-credential") OP=install-credential ;;
            "active-supply-vm: installer-verify") OP=installer-verify ;;
            "active-supply-vm: installer-apply") OP=installer-apply ;;
            "active-supply-vm: first-run") OP=first-run ;;
            "active-supply-vm: health") OP=health ;;
            *) echo "REFUSING: invalid fixed operation"; exit 2 ;;
          esac
          echo "OP=$OP" >> "$GITHUB_ENV"
          echo "operation=$OP release_sha=$RELEASE_SHA"

      - name: Execute fixed operation
        shell: bash
        run: |
          set -euo pipefail

          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/tmp/EVRCalculator-active-supply-activation
          STATE=/home/ubuntu/state/active_supply_panel

          prepare_release() {
            test -d "$REPO/.git" || { echo "REFUSING: production repo missing"; exit 2; }
            git -C "$REPO" fetch origin develop --quiet
            git -C "$REPO" cat-file -e "$RELEASE_SHA^{commit}" || {
              echo "REFUSING: reviewed release SHA unavailable"; exit 2;
            }
            if [ -e "$WT" ]; then
              git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || rm -rf "$WT"
            fi
            git -C "$REPO" worktree add --detach "$WT" "$RELEASE_SHA"
            test "$(git -C "$WT" rev-parse HEAD)" = "$RELEASE_SHA" || {
              echo "REFUSING: release worktree SHA mismatch"; exit 2;
            }
          }

          cleanup() {
            if [ -d "$WT" ]; then
              git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true
              rm -rf "$WT" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          case "$OP" in
            noop)
              echo "ACTIVE_SUPPLY_VM_NOOP=PASS"
              ;;

            hostkeys)
              echo "hostname=$(hostname)"
              echo "architecture=$(uname -m)"
              for key in /etc/ssh/ssh_host_*_key.pub; do
                [ -r "$key" ] || continue
                sudo ssh-keygen -lf "$key" -E sha256
              done
              ;;

            credential-status)
              ACTIONS_PRESENT=false
              [ -n "${ACTIONS_SELLER_HASH_KEY:-}" ] && ACTIONS_PRESENT=true
              echo "actions_active_supply_seller_hash_key_present=$ACTIONS_PRESENT"
              python3 - <<'PY'
          import os
          import re
          path = "/home/ubuntu/repos/EVRCalculator/backend/.env"
          assign = re.compile(rb"^\s*(?:export\s+)?ACTIVE_SUPPLY_SELLER_HASH_KEY\s*=(.*)$")
          present = False
          if os.path.isfile(path):
              with open(path, "rb") as handle:
                  for line in handle.read().splitlines():
                      m = assign.match(line)
                      if m and len(m.group(1).strip().strip(b"'\"")) >= 32:
                          present = True
                          break
          print("vm_active_supply_seller_hash_key_present=" + ("true" if present else "false"))
          state = "/home/ubuntu/state/active_supply_panel/release.sha"
          if os.path.isfile(state):
              value = open(state, encoding="utf-8").read().strip()
              print("runtime_release_pin_present=true")
              print("runtime_release_pin_matches_reviewed=" + ("true" if value == os.environ["RELEASE_SHA"] else "false"))
          else:
              print("runtime_release_pin_present=false")
              print("runtime_release_pin_matches_reviewed=false")
          PY
              ;;

            db-target-status)
              set -a
              . "$REPO/backend/.env"
              set +a
              "$REPO/.venv/bin/python" - <<'PY'
          import os
          from urllib.parse import urlparse
          import psycopg
          from psycopg.conninfo import conninfo_to_dict

          supabase_url = os.environ.get("SUPABASE_URL") or os.environ.get("NEXT_PUBLIC_SUPABASE_URL") or ""
          dsn = os.environ.get("DATABASE_URL") or os.environ.get("SUPABASE_DB_URL") or ""

          if supabase_url:
              parsed_url = urlparse(supabase_url)
              host = parsed_url.hostname or ""
              ref = host.split(".")[0] if host.endswith(".supabase.co") else "unknown"
              print("rest_host=" + host)
              print("rest_project_ref=" + ref)
          else:
              print("rest_host=MISSING")
              print("rest_project_ref=MISSING")

          if not dsn:
              print("db_dsn=MISSING")
              raise SystemExit(2)

          info = conninfo_to_dict(dsn)
          db_host = info.get("host") or ""
          db_user = info.get("user") or ""
          db_name = info.get("dbname") or ""
          db_port = str(info.get("port") or "")
          if "." in db_user:
              db_ref = db_user.split(".")[-1]
          elif db_host.startswith("db.") and db_host.endswith(".supabase.co"):
              db_ref = db_host.split(".")[1]
          else:
              db_ref = "unknown"
          print("db_host=" + db_host)
          print("db_port=" + db_port)
          print("db_user_kind=" + ("pooled_project_user" if "." in db_user else "direct_or_other"))
          print("db_project_ref=" + db_ref)
          print("db_name=" + db_name)

          with psycopg.connect(dsn, connect_timeout=10) as conn, conn.cursor() as cur:
              cur.execute("select current_database(), current_user, current_setting('server_version')")
              database, user, version = cur.fetchone()
              print("db_connected=true")
              print("db_current_database=" + str(database))
              print("db_current_user_kind=" + ("pooled_project_user" if "." in str(user) else "direct_or_other"))
              print("db_server_version=" + str(version))
              cur.execute("""
                  select column_name
                  from information_schema.columns
                  where table_schema='public'
                    and table_name='market_active_supply_listing_observations_v1'
                    and column_name in (
                      'landed_price','listing_updated_at','provider_snapshot_at',
                      'seller_rating','seller_sales_count'
                    )
                  order by column_name
              """)
              columns = [row[0] for row in cur.fetchall()]
              print("typed_columns_present=" + ",".join(columns))
              print("typed_column_count=" + str(len(columns)))
          PY
              ;;

            db-schema-status)
              set -a
              . "$REPO/backend/.env"
              set +a
              "$REPO/.venv/bin/python" - <<'PY'
          import os
          import psycopg

          dsn = os.environ.get("DATABASE_URL") or os.environ.get("SUPABASE_DB_URL") or ""
          if not dsn:
              raise SystemExit("database dsn missing")

          expected = {
              "landed_price",
              "listing_updated_at",
              "provider_snapshot_at",
              "seller_rating",
              "seller_sales_count",
          }

          with psycopg.connect(dsn, connect_timeout=10) as conn, conn.cursor() as cur:
              cur.execute("select current_user, session_user, current_setting('is_superuser', true)")
              current_user, session_user, is_superuser = cur.fetchone()
              print("current_user=" + str(current_user))
              print("session_user=" + str(session_user))
              print("is_superuser=" + str(is_superuser))

              cur.execute("select to_regclass('public.market_active_supply_listing_observations_v1')")
              print("table_regclass=" + str(cur.fetchone()[0]))

              cur.execute("""
                  select attname
                  from pg_catalog.pg_attribute
                  where attrelid='public.market_active_supply_listing_observations_v1'::regclass
                    and attnum > 0
                    and not attisdropped
                  order by attnum
              """)
              catalog_columns = [row[0] for row in cur.fetchall()]
              print("pg_attribute_expected_present=" + ",".join(sorted(expected & set(catalog_columns))))
              print("pg_attribute_expected_count=" + str(len(expected & set(catalog_columns))))

              cur.execute("""
                  select column_name
                  from information_schema.columns
                  where table_schema='public'
                    and table_name='market_active_supply_listing_observations_v1'
                  order by ordinal_position
              """)
              info_columns = [row[0] for row in cur.fetchall()]
              print("information_schema_column_count=" + str(len(info_columns)))
              print("information_schema_expected_count=" + str(len(expected & set(info_columns))))

              cur.execute("""
                  select
                    has_table_privilege(current_user,'public.market_active_supply_listing_observations_v1','SELECT'),
                    has_table_privilege(current_user,'public.market_active_supply_listing_observations_v1','INSERT'),
                    has_table_privilege(current_user,'public.market_active_supply_listing_observations_v1','UPDATE')
              """)
              select_ok, insert_ok, update_ok = cur.fetchone()
              print("current_user_select=" + str(select_ok).lower())
              print("current_user_insert=" + str(insert_ok).lower())
              print("current_user_update=" + str(update_ok).lower())
          PY
              ;;

            install-credential)
              [ -n "${ACTIONS_SELLER_HASH_KEY:-}" ] || {
                echo "REFUSING: repository secret ACTIVE_SUPPLY_SELLER_HASH_KEY is missing"; exit 4;
              }
              prepare_release
              ACTIVE_SUPPLY_ENV_REPO="$REPO"               ACTIVE_SUPPLY_SELLER_HASH_KEY_INSTALL="$ACTIONS_SELLER_HASH_KEY"                 "$WT/infra/oracle/install_active_supply_credentials.sh" --apply
              ;;

            installer-verify)
              prepare_release
              ACTIVE_SUPPLY_ENV_REPO="$REPO"                 "$WT/infra/oracle/install_active_supply_panel_cron.sh"
              ;;

            installer-apply)
              prepare_release
              ACTIVE_SUPPLY_ENV_REPO="$REPO"                 "$WT/infra/oracle/install_active_supply_panel_cron.sh" --apply
              ;;

            first-run)
              test -x "$STATE/runtime/infra/oracle/run_active_supply_panel.sh" || {
                echo "REFUSING: active-supply runtime not installed"; exit 2;
              }
              "$STATE/runtime/infra/oracle/run_active_supply_panel.sh"
              ;;

            health)
              test -x "$STATE/runtime/infra/oracle/run_active_supply_health.sh" || {
                echo "REFUSING: active-supply runtime not installed"; exit 2;
              }
              "$STATE/runtime/infra/oracle/run_active_supply_health.sh"
              ;;
          esac
