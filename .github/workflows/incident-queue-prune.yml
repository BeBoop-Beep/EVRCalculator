name: Incident Queue Inspect

on:
  push:
    branches: [ops/incident-status-20260921]
    paths:
      - '.github/workflows/incident-queue-prune.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/incident-queue-prune.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List active workflow runs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            > /tmp/runs.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/runs.json"))
          rows=[]
          for r in p.get("workflow_runs") or []:
              if r.get("status") in {"queued","in_progress","waiting","pending"}:
                  rows.append({
                      "id":r.get("id"),
                      "name":r.get("name"),
                      "status":r.get("status"),
                      "event":r.get("event"),
                      "head_branch":r.get("head_branch"),
                      "head_sha":r.get("head_sha"),
                      "created_at":r.get("created_at"),
                      "updated_at":r.get("updated_at"),
                      "run_attempt":r.get("run_attempt"),
                  })
          print(json.dumps(rows,indent=2,sort_keys=True))
          PY
