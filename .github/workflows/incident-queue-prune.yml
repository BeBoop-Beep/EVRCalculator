name: Incident Queue Prune

on:
  push:
    branches: [ops/incident-status-20260921]
    paths:
      - '.github/workflows/incident-queue-prune.yml'

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stale self-hosted repair runs
        shell: bash
        run: |
          set -uo pipefail
          for RUN_ID in 35681710512 35681757053 35682692679 35685879879 35685886884; do
            CODE="$(curl --silent --show-error -o /tmp/cancel-$RUN_ID.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/cancel" || true)"
            echo "cancel_run=$RUN_ID http=$CODE body=$(cat /tmp/cancel-$RUN_ID.txt 2>/dev/null || true)"
          done
