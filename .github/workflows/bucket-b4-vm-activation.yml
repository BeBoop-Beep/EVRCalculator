name: Bucket B4 VM Activation

on:
  push:
    branches:
      - ops/bucket-b4-vm-activation-20260929
    paths:
      - ".bucket-b4-vm-activation/request.txt"
      - ".github/workflows/bucket-b4-vm-activation.yml"

permissions:
  contents: read

concurrency:
  group: bucket-b4-vm-activation
  cancel-in-progress: false

jobs:
  vm:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 45
    env:
      RELEASE_SHA: 852ef644547c730ac9cb3dc0fd3904d14e7bfb60
      VM_REQUEST_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Resolve fixed operation
        shell: bash
        run: |
          set -euo pipefail
          case "$VM_REQUEST_MESSAGE" in
            "bucket-b4-activate: noop") OP=noop ;;
            "bucket-b4-activate: preflight") OP=preflight ;;
            "bucket-b4-activate: installer-verify") OP=installer-verify ;;
            "bucket-b4-activate: installer-apply") OP=installer-apply ;;
            "bucket-b4-activate: status") OP=status ;;
            *) echo "REFUSING: invalid fixed operation"; exit 2 ;;
          esac
          echo "OP=$OP" >> "$GITHUB_ENV"
          echo "operation=$OP release_sha=$RELEASE_SHA"

      - name: Execute fixed operation
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/tmp/EVRCalculator-bucket-b4-activation
          STATE=/home/ubuntu/state/market_microstructure_b4
          PY="$REPO/.venv/bin/python"

          cleanup() {
            if [ -d "$WT" ]; then
              git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true
              rm -rf "$WT" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          prepare_release() {
            test -d "$REPO/.git" || { echo "REFUSING: production repo missing"; exit 2; }
            test -x "$PY" || { echo "REFUSING: shared Python runtime missing"; exit 2; }
            git -C "$REPO" fetch origin develop --quiet
            git -C "$REPO" cat-file -e "$RELEASE_SHA^{commit}" || {
              echo "REFUSING: reviewed B4 release unavailable"; exit 2;
            }
            if [ -e "$WT" ]; then
              git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || rm -rf "$WT"
            fi
            git -C "$REPO" worktree add --detach "$WT" "$RELEASE_SHA"
            test "$(git -C "$WT" rev-parse HEAD)" = "$RELEASE_SHA" || {
              echo "REFUSING: B4 worktree SHA mismatch"; exit 2;
            }
          }

          case "$OP" in
            noop)
              echo "BUCKET_B4_ACTIVATION_NOOP=PASS"
              ;;

            preflight)
              prepare_release
              set -a
              . "$REPO/backend/.env"
              set +a
              export PYTHONPATH="$WT"
              cd "$WT"
              "$PY" -m backend.scripts.run_market_microstructure_bucket_b4                 --preflight --credit-cap 8000
              ;;

            installer-verify)
              prepare_release
              MARKET_B4_ENV_REPO="$REPO"                 /bin/bash "$WT/infra/oracle/install_market_microstructure_bucket_b4_cron.sh"
              ;;

            installer-apply)
              prepare_release
              MARKET_B4_ENV_REPO="$REPO"                 /bin/bash "$WT/infra/oracle/install_market_microstructure_bucket_b4_cron.sh" --apply
              ;;

            status)
              echo "reviewed_release_sha=$RELEASE_SHA"
              if [ -r "$STATE/release.sha" ]; then
                PIN="$(tr -d '[:space:]' < "$STATE/release.sha")"
                echo "release_pin_present=true"
                [ "$PIN" = "$RELEASE_SHA" ] && echo "release_pin_matches_reviewed=true" || echo "release_pin_matches_reviewed=false"
              else
                echo "release_pin_present=false"
                echo "release_pin_matches_reviewed=false"
              fi
              echo "== managed B4 cron =="
              crontab -l 2>/dev/null | grep 'run_market_microstructure_bucket_b4.sh' || true
              ;;
          esac
