name: Treatment Hyper Full Family V2

on:
  push:
    branches:
      - research/treatment-panel-recovery-v2-current-20261001
    paths:
      - 'backend/scripts/research_treatment_hyper_full_family_estimator_v2.py'
      - '.github/workflows/treatment-hyper-full-family-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q numpy==2.4.3 python-dotenv==1.2.2 supabase==2.28.3
      - name: Download exhaustive Hyper family artifact
        uses: actions/download-artifact@v4
        with:
          name: treatment-full-hyper-ultra-sir-v1-vm
          path: backend/artifacts/treatment_panel_recovery_v2/input_hyper_full
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 37045816266
      - name: Fit Set-first exhaustive Hyper hierarchy
        run: |
          python backend/scripts/research_treatment_hyper_full_family_estimator_v2.py \
            --artifact backend/artifacts/treatment_panel_recovery_v2/input_hyper_full/full_hyper_ultra_sir_v1.json \
            --output backend/artifacts/treatment_panel_recovery_v2/treatment_hyper_full_family_v2.json \
            --report backend/artifacts/treatment_panel_recovery_v2/TREATMENT_HYPER_FULL_FAMILY_V2.md
      - name: Upload Hyper estimator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: treatment-hyper-full-family-v2
          path: |
            backend/artifacts/treatment_panel_recovery_v2/treatment_hyper_full_family_v2.json
            backend/artifacts/treatment_panel_recovery_v2/TREATMENT_HYPER_FULL_FAMILY_V2.md
          if-no-files-found: error
