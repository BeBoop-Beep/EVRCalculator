name: Inspect Actions Queue 20260922

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-actions-queue-20260922.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List repair and active runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > /tmp/runs.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/runs.json"))
          for r in p.get("workflow_runs") or []:
              if "30th Enrichment" in str(r.get("name")) or r.get("status") in {"queued","in_progress","waiting","pending"}:
                  print(json.dumps({
                      "id":r.get("id"),"name":r.get("name"),"status":r.get("status"),
                      "conclusion":r.get("conclusion"),"event":r.get("event"),
                      "head_branch":r.get("head_branch"),"head_sha":r.get("head_sha"),
                      "created_at":r.get("created_at"),"updated_at":r.get("updated_at")
                  },sort_keys=True))
          PY
