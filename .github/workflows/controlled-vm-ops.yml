            { crontab -l 2>/dev/null || true; } | awk -v b="$PRICING_BEGIN" -v e="$PRICING_END" '
              $0==b { blocks++; inblock=1; next }
              $0==e { inblock=0; next }
              /^[[:space:]]*#/ { next }
              /run_daily_multi_source_card_pricing/ {
                if (inblock) managed_run++; else unmanaged_run++
                if ($0 ~ /^10 4 \* \* \* /) primary++
                else if ($0 ~ /^40 4,5,7-20 \* \* \* /) retry++
              }
              /check_multi_source_pricing_health/ { if (inblock) managed_health++; else unmanaged_health++ }
              END {
