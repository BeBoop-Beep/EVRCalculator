name: Controlled VM Ops

on:
  push:
    branches:
      - vm-ops-control
    paths:
      - ".vm-ops/request.json"

permissions:
  contents: read

concurrency:
  group: index-production-vm-ops-v2
  cancel-in-progress: false

jobs:
  vm-ops:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 120
    env:
      VM_REQUEST_MESSAGE: ${{ github.event.head_commit.message }}
      ACTIONS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACTIONS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ACTIONS_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      ACTIONS_SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re

          message = os.environ.get("VM_REQUEST_MESSAGE", "").strip()
          match = re.fullmatch(
              r"vm-op:\s*(status|market-explorer-cutover-status|market-explorer-direct-worker-test|market-explorer-install-db-env|market-explorer-worker-cutover|market-explorer-db-diagnose|market-explorer-sync-db-password|market-explorer-cron-audit|market-explorer-cron-observe|market-explorer-projection-audit|market-explorer-currency-source-audit|market-explorer-manual-one-shot|market-explorer-coverage-rpc-tests|market-explorer-durable-tests|market-explorer-coverage-rpc-smoke|market-explorer-coverage-direct-smoke|market-explorer-currency-tests|market-explorer-currency-cutover|market-explorer-pipeline-runtime-cutover|market-explorer-v2-repair|market-explorer-coverage-rpc-cutover|sync-main|sync-main-preserve-payload-debug|pytest-cards-market|pytest-cards-market-pr239|set-market-snapshot|explorer-prewarm-one|market-dashboard-set|repair-cards-market-errors|refresh-explorer-and-audit|repair-sep22-base-publication|repair-sep22-market-publication-direct|sep22-publication-status|scrape-cycle-status|scrape-create-missing-batch|scrape-kill-stuck-dispatcher|stop-stale-sep22-publisher|pricing-status|pricing-health|pricing-install-cron|pricing-run-controlled|pricing-replay-verify|pricing-runtime-preflight|pricing-deploy-runtime)"
              r"(?:\s+market_date=(\d{4}-\d{2}-\d{2}))?"
              r"(?:\s+set_id=([A-Za-z0-9._:-]{1,128}))?"
              r"(?:\s+request_id=([A-Za-z0-9._:-]{1,128}))?",
              message,
          )
          if not match:
              raise SystemExit(f"invalid controlled VM request message: {message!r}")

          op, market_date, set_id, request_id = match.groups()
          market_date = market_date or ""
          set_id = set_id or ""
          request_id = request_id or ""

          if op in {"set-market-snapshot", "explorer-prewarm-one", "market-dashboard-set", "repair-cards-market-errors", "repair-sep22-base-publication", "repair-sep22-market-publication-direct", "scrape-create-missing-batch", "scrape-kill-stuck-dispatcher"} and not market_date:
              raise SystemExit(f"{op} requires market_date")
          if op == "market-dashboard-set" and not set_id:
              raise SystemExit("market-dashboard-set requires set_id")
          if op.startswith("pricing-") and (market_date or set_id):
              raise SystemExit(f"{op} accepts no market_date or set_id")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"VM_OPERATION={op}\n")
              env.write(f"VM_MARKET_DATE={market_date}\n")
              env.write(f"VM_SET_ID={set_id}\n")
              env.write(f"VM_REQUEST_ID={request_id}\n")

          print({
              "operation": op,
              "market_date": market_date,
              "set_id": set_id,
              "request_id": request_id,
          })
          PY

      - name: Execute approved operation
        shell: bash
        run: |
          set -euo pipefail

          REPO="/home/ubuntu/repos/EVRCalculator"
          PY="$REPO/.venv/bin/python"

          test -d "$REPO/.git" || { echo "Production repo missing: $REPO"; exit 2; }
          test -x "$PY" || { echo "Production venv Python missing: $PY"; exit 2; }

          # ---- multi-source pricing helpers (fixed constants; no request-supplied values reach these) ----
          STATE="/home/ubuntu/state/multi_source_pricing"
          PRICING_LOCK="/tmp/multi-source-pricing.lock"
          PRICING_CAP=300
          PRICING_FILES="backend/scripts/run_daily_multi_source_card_pricing.py backend/scripts/check_multi_source_pricing_health.py infra/oracle/install_multi_source_pricing_cron.sh infra/oracle/multi-source-pricing.crontab"
          PRICING_BEGIN="# BEGIN multi-source-pricing (managed by install_multi_source_pricing_cron.sh)"
          PRICING_END="# END multi-source-pricing"

          pricing_runtime_present() {
            [ -d backend/pricing_pipeline ] || return 1
            for f in $PRICING_FILES; do [ -f "$f" ] || return 1; done
            return 0
          }

          pricing_host_timezone() {
            timedatectl show -p Timezone --value 2>/dev/null || cat /etc/timezone 2>/dev/null || true
          }

          pricing_lock_state() {
            if [ ! -e "$1" ]; then echo free_absent; elif /usr/bin/flock -n "$1" -c true; then echo free; else echo held; fi
          }

          pricing_cron_report() {
            { crontab -l 2>/dev/null || true; } | awk -v b="$PRICING_BEGIN" -v e="$PRICING_END" '
              $0==b { blocks++; inblock=1; next }
              $0==e { inblock=0; next }
              /^[[:space:]]*#/ { next }
              /run_daily_multi_source_card_pricing/ {
                if (inblock) managed_run++; else unmanaged_run++
                if ($0 ~ /^10 4 \* \* \* /) primary++
                else if ($0 ~ /^40 4,5,7-20 \* \* \* /) retry++
              }
              /check_multi_source_pricing_health/ { if (inblock) managed_health++; else unmanaged_health++ }
              END {
                printf "managed_blocks=%d\nmanaged_run_entries=%d\nprimary_entries=%d\nretry_entries=%d\nmanaged_health_entries=%d\nunmanaged_pricing_run_entries=%d\nunmanaged_pricing_health_entries=%d\n", blocks, managed_run, primary, retry, managed_health, unmanaged_run, unmanaged_health
              }'
          }

          pricing_crontab_outside_block_hash() {
            { crontab -l 2>/dev/null || true; } \
              | awk -v b="$PRICING_BEGIN" -v e="$PRICING_END" '$0==b{s=1} !s{print} $0==e{s=0}' \
              | { grep -v '^[[:space:]]*$' || true; } \
              | sha256sum | cut -c1-16
          }

          pricing_credentials_probe() {
            "$PY" - <<'PY'
          import os, sys
          from pathlib import Path
          try:
              from dotenv import load_dotenv
              load_dotenv(Path("backend/.env"), override=False)
          except Exception:
              pass
          try:
              from backend.pricing_pipeline.ebay_credentials import load_ebay_credentials, CredentialsUnavailable
          except Exception as exc:
              print("ebay_credential_authority_importable=false", type(exc).__name__)
              sys.exit(3)
          rc = 0
          try:
              c = load_ebay_credentials(allow_frontend_fallback=False)
              print("EBAY_CLIENT_ID=present")
              print("EBAY_CLIENT_SECRET=present")
              print("credential_source=" + str(c.source))
              print("ebay_environment=" + str(c.environment))
          except CredentialsUnavailable:
              print("EBAY_CLIENT_ID/EBAY_CLIENT_SECRET=unresolved_with_frontend_fallback_disabled")
              rc = 4
          for key in ("SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY"):
              print(key + "=" + ("present" if os.environ.get(key) else "missing"))
          sys.exit(rc)
          PY
          }

          pricing_counts() {
            PRICING_MD="$1" "$PY" - <<'PY'
          import json, os
          from backend.db.clients.supabase_client import create_service_role_client
          from backend.scripts.freeze_ebay_active_ask_v1 import VERSION as ESTIMATOR_VERSION

          md = os.environ["PRICING_MD"]
          c = create_service_role_client()

          def count(table, **eq):
              q = c.table(table).select("run_id" if table.startswith("ebay_card") else "market_date", count="exact")
              for key, value in eq.items():
                  q = q.eq(key, value)
              return q.limit(1).execute().count

          runs = c.table("pokemon_multi_source_pricing_runs_v1").select(
              "run_id,status,stage,policy_version,requests_attempted,target_count,ebay_pricing_run_id,updated_at,finished_at"
          ).eq("market_date", md).limit(5).execute().data or []
          out = {"market_date": md, "pricing_runs": runs}
          ebay_run_ids = sorted({r["ebay_pricing_run_id"] for r in runs if r.get("ebay_pricing_run_id")})
          out["evidence_rows_by_run"] = {rid: count("ebay_card_listing_evidence_v1", run_id=rid) for rid in ebay_run_ids}
          out["summary_rows_by_run"] = {rid: count("ebay_card_pricing_run_summary_v1", run_id=rid) for rid in ebay_run_ids}
          out["estimate_rows"] = count("ebay_active_ask_price_estimates_v1", market_date=md, estimator_version=ESTIMATOR_VERSION)
          out["shadow_decision_rows"] = count("pokemon_multi_source_card_prices_v1", market_date=md)
          out["ledger_v1"] = c.table("ebay_browse_request_ledger_v1").select("requests_reserved,daily_limit").eq("budget_day", md).limit(1).execute().data or []
          out["ledger_v2_latest_windows"] = c.table("ebay_api_request_budget_v2").select(
              "resource_bucket,provider_window_end,requests_reserved"
          ).order("provider_window_end", desc=True).limit(4).execute().data or []
          print(json.dumps(out, sort_keys=True, default=str, indent=2))
          PY
          }

          # ---- pinned pricing runtime overlay (reviewed manifest; nothing here is request-supplied) ----
          PRICING_SOURCE_SHA="c8acb916bf147dd446e3dc1e492100470a39ce53"
          SENTINEL_PRICING_SHA="6313116b62845e1211e93215393a9609701a935c"
          PRICING_OVERLAY_PRICE_PATHS="
            backend/pricing_pipeline/__init__.py
            backend/pricing_pipeline/budget.py
            backend/pricing_pipeline/budget_v2.py
            backend/pricing_pipeline/builder.py
            backend/pricing_pipeline/collector.py
            backend/pricing_pipeline/contracts.py
            backend/pricing_pipeline/ebay_credentials.py
            backend/pricing_pipeline/ebay_quota_policy.py
            backend/pricing_pipeline/estimates.py
            backend/pricing_pipeline/evidence.py
            backend/pricing_pipeline/health.py
            backend/pricing_pipeline/locking.py
            backend/pricing_pipeline/orchestrator.py
            backend/pricing_pipeline/store.py
            backend/pricing_pipeline/targets.py
            backend/pricing_pipeline/variants.py
            backend/scripts/run_daily_multi_source_card_pricing.py
            backend/scripts/check_multi_source_pricing_health.py
            backend/scripts/audit_ebay_quota_and_sold_access.py
            backend/scripts/ebay_english_price_eligibility_v1.py
            backend/scripts/ebay_language_policy_v1.py
            backend/scripts/freeze_ebay_active_ask_v1.py
            backend/scripts/index_fair_value_ebay_evidence_collector.py
            backend/scripts/run_ebay_p4a_adaptive_development.py
            backend/scripts/pokemon_multi_source_card_price_v1.py
            backend/scripts/p5b_cohort_builder.py
            infra/oracle/install_multi_source_pricing_cron.sh
            infra/oracle/multi-source-pricing.crontab
          "
          PRICING_OVERLAY_SENTINEL_PATHS="
            backend/sentinel/checks/pricing.py
            backend/sentinel/checks/registry.py
          "
          PRICING_TEST_PRICE_PATHS="
            backend/tests/unit/pricing_pipeline/test_budget_v2.py
            backend/tests/unit/pricing_pipeline/test_daily_multi_source_pipeline.py
            backend/tests/unit/pricing_pipeline/test_ebay_quota_and_credentials.py
          "
          PRICING_TEST_SENTINEL_PATHS="backend/tests/unit/sentinel/test_pricing_registration.py"
          PRICING_TEST_SUPPORT_PATHS="
            backend/db/migrations/20260921000000_p6_pipeline_runs_and_browse_budget_ledger.sql
            backend/db/migrations/20260921010000_p5b_multi_source_card_prices_shadow_v1.sql
            backend/db/migrations/20260921020000_p6_restrict_ebay_estimate_privileges.sql
            supabase/migrations/20260921000000_p6_pipeline_runs_and_browse_budget_ledger.sql
            supabase/migrations/20260921010000_p5b_multi_source_card_prices_shadow_v1.sql
            supabase/migrations/20260921020000_p6_restrict_ebay_estimate_privileges.sql
          "
          PRICING_SENTINEL_KEYS="pricing.canonical.source_guard pricing.ebay.budget_health pricing.ebay.estimator_freshness pricing.ebay.evidence_freshness pricing.ebay.quota_authority_v2 pricing.multi_source.policy_drift pricing.multi_source.run_freshness pricing.multi_source.shadow_freshness pricing.multi_source.target_freshness"
          PRICING_WT="/tmp/EVRCalculator-pricing-runtime-preflight"
          PRICING_PREFLIGHT_STATE="/tmp/index-pricing-preflight-state"
          PRICING_PYTEST_DEPS="/tmp/evr-pytest-deps"
          PRICING_FAILED_STAGES=""

          pricing_overlay_manifest() {
            printf '%s\n' $PRICING_OVERLAY_PRICE_PATHS $PRICING_OVERLAY_SENTINEL_PATHS | sort
          }

          pricing_overlay_source_for() {
            case " $(echo $PRICING_OVERLAY_SENTINEL_PATHS) " in *" $1 "*) echo "$SENTINEL_PRICING_SHA" ;; *) echo "$PRICING_SOURCE_SHA" ;; esac
          }

          pricing_source_check() {
            local sha f listed expected
            for sha in "$PRICING_SOURCE_SHA" "$SENTINEL_PRICING_SHA"; do
              git cat-file -e "$sha^{commit}" 2>/dev/null || { echo "REFUSING: pinned commit $sha is not in the production object store"; return 1; }
            done
            listed=$(git ls-tree -r --name-only "$PRICING_SOURCE_SHA" -- backend/pricing_pipeline/ | sort)
            expected=$(printf '%s\n' $PRICING_OVERLAY_PRICE_PATHS | grep '^backend/pricing_pipeline/' | sort)
            if [ "$listed" != "$expected" ]; then
              echo "REFUSING: backend/pricing_pipeline/ at PRICING_SOURCE_SHA differs from the reviewed file list"
              diff <(echo "$expected") <(echo "$listed") || true
              return 1
            fi
            for f in $PRICING_OVERLAY_PRICE_PATHS $PRICING_OVERLAY_SENTINEL_PATHS; do
              git rev-parse -q --verify "$(pricing_overlay_source_for "$f"):$f" >/dev/null || { echo "REFUSING: $f is missing at its pinned source"; return 1; }
            done
            echo "pinned_sources_ok pricing=$PRICING_SOURCE_SHA sentinel=$SENTINEL_PRICING_SHA"
          }

          pricing_candidate_prepare() {
            local changed manifest unexpected f src want got
            pricing_source_check || return 1
            git worktree prune
            if [ -e "$PRICING_WT" ]; then
              git worktree remove --force "$PRICING_WT" >/dev/null 2>&1 || rm -rf "$PRICING_WT"
              git worktree prune
            fi
            git worktree add --detach "$PRICING_WT" HEAD >/dev/null || return 1
            git -C "$PRICING_WT" checkout "$PRICING_SOURCE_SHA" -- $PRICING_OVERLAY_PRICE_PATHS || return 1
            git -C "$PRICING_WT" checkout "$SENTINEL_PRICING_SHA" -- $PRICING_OVERLAY_SENTINEL_PATHS || return 1
            echo "candidate_base_main_sha=$(git rev-parse HEAD)"
            echo "pricing_source_sha=$PRICING_SOURCE_SHA"
            echo "sentinel_source_sha=$SENTINEL_PRICING_SHA"
            echo "-- candidate git status --short --"
            git -C "$PRICING_WT" status --short
            changed=$(git -C "$PRICING_WT" diff --name-only HEAD | sort)
            manifest=$(pricing_overlay_manifest)
            unexpected=$(comm -23 <(echo "$changed") <(echo "$manifest") | grep . || true)
            if [ -n "$unexpected" ]; then
              echo "REFUSING: candidate differs from production main outside the reviewed manifest:"
              echo "$unexpected"
              return 1
            fi
            for f in $PRICING_OVERLAY_PRICE_PATHS $PRICING_OVERLAY_SENTINEL_PATHS; do
              src=$(pricing_overlay_source_for "$f")
              want=$(git rev-parse "$src:$f")
              got=$(git hash-object "$PRICING_WT/$f")
              [ "$want" = "$got" ] || { echo "REFUSING: candidate blob for $f differs from its pinned source"; return 1; }
              echo "overlay path=$f source=${src:0:8} blob=$got production_main_blob=$(git rev-parse -q --verify "HEAD:$f" || echo ABSENT)"
            done
            git -C "$PRICING_WT" diff --check HEAD || { echo "REFUSING: git diff --check failed on the candidate"; return 1; }
            echo "candidate_overlay_path_count=$(echo "$manifest" | grep -c .)"
            echo "candidate_changed_path_count=$(echo "$changed" | grep -c . || true)"
            echo "candidate_diff_equals_manifest_exactly=$([ "$changed" = "$manifest" ] && echo true || echo false)"
          }

          pricing_cpy() {
            ( cd "$PRICING_WT" && PYTHONPATH="$PRICING_WT" "$PY" "$@" )
          }

          pricing_candidate_compile() {
            local pyfiles
            pyfiles=$(printf '%s\n' $PRICING_OVERLAY_PRICE_PATHS $PRICING_OVERLAY_SENTINEL_PATHS | grep '\.py$')
            pricing_cpy -m py_compile $pyfiles
          }

          pricing_candidate_tests() {
            git -C "$PRICING_WT" checkout "$PRICING_SOURCE_SHA" -- $PRICING_TEST_PRICE_PATHS || return 1
            git -C "$PRICING_WT" checkout "$SENTINEL_PRICING_SHA" -- $PRICING_TEST_SENTINEL_PATHS || return 1
            git -C "$PRICING_WT" checkout "$PRICING_SOURCE_SHA" -- $PRICING_TEST_SUPPORT_PATHS || return 1
            if ! PYTHONPATH="$PRICING_PYTEST_DEPS" "$PY" -c 'import pytest' 2>/dev/null; then
              echo "pytest unavailable; installing into $PRICING_PYTEST_DEPS (never into the production venv)"
              "$PY" -m pip install --disable-pip-version-check -q --target "$PRICING_PYTEST_DEPS" pytest || return 1
            fi
            ( cd "$PRICING_WT" \
              && SUPABASE_URL="http://127.0.0.1:54321" SUPABASE_SERVICE_ROLE_KEY="test-service-role-key" SUPABASE_ANON_KEY="test-anon-key" \
                 PYTHONPATH="$PRICING_WT:$PRICING_PYTEST_DEPS" "$PY" -m pytest -q -p no:cacheprovider \
                 backend/tests/unit/pricing_pipeline/ backend/tests/unit/sentinel/test_pricing_registration.py ) 2>&1 | tail -40
          }

          pricing_candidate_env() {
            ( umask 077; cp "$REPO/backend/.env" "$PRICING_WT/backend/.env" ) || return 1
            chmod 600 "$PRICING_WT/backend/.env"
            echo "candidate_env_copied=true (contents never printed; removed before exit)"
          }

          pricing_candidate_imports() {
            pricing_cpy - <<'PY'
          import importlib, os, sys

          wt = os.path.realpath(os.getcwd())
          mods = [
              "backend.pricing_pipeline.orchestrator",
              "backend.pricing_pipeline.budget_v2",
              "backend.pricing_pipeline.health",
              "backend.scripts.run_daily_multi_source_card_pricing",
              "backend.scripts.check_multi_source_pricing_health",
              "backend.sentinel.checks.pricing",
              "backend.sentinel.checks.registry",
          ]
          bad = []
          for name in mods:
              mod = importlib.import_module(name)
              path = os.path.realpath(mod.__file__)
              print(name, "->", path)
              if not path.startswith(wt + os.sep):
                  bad.append(name)
          if bad:
              print("IMPORTS RESOLVED OUTSIDE THE CANDIDATE:", bad)
              sys.exit(1)
          print("candidate_imports_resolve_from_worktree=true")
          PY
          }

          pricing_candidate_credentials() {
            ( cd "$PRICING_WT" && export PYTHONPATH="$PRICING_WT" && pricing_credentials_probe )
          }

          pricing_candidate_schema() {
            pricing_cpy - <<'PY'
          import sys
          from backend.db.clients.supabase_client import create_service_role_client
          from backend.pricing_pipeline.store import SupabaseStore

          ok = SupabaseStore(create_service_role_client()).schema_ready()
          print("pricing_schema_ready=" + str(ok).lower())
          sys.exit(0 if ok else 5)
          PY
          }

          pricing_candidate_dry_run() {
            rm -rf "$PRICING_PREFLIGHT_STATE"; mkdir -p "$PRICING_PREFLIGHT_STATE"
            pricing_cpy - <<'PY' || return 1
          import inspect, sys
          from backend.pricing_pipeline.orchestrator import Orchestrator

          src = inspect.getsource(Orchestrator.preview_targets) + inspect.getsource(Orchestrator._build_manifest)
          banned = ("create_run", "update_run", ".rpc(", ".insert(", ".upsert(", ".update(", ".delete(", ".reserve(", "fetch_token", "BrowseHTTP", "http_factory")
          hits = [b for b in banned if b in src]
          print("dry_run_write_or_ebay_markers=" + (",".join(hits) if hits else "none"))
          sys.exit(1 if hits else 0)
          PY
            ( cd "$PRICING_WT" && EVR_PRICING_STATE_DIR="$PRICING_PREFLIGHT_STATE" PYTHONPATH="$PRICING_WT" timeout 300 \
              "$PY" -m backend.scripts.run_daily_multi_source_card_pricing --dry-run --json --no-frontend-env-fallback ) || { rm -rf "$PRICING_PREFLIGHT_STATE"; return 1; }
            rm -rf "$PRICING_PREFLIGHT_STATE"
          }

          pricing_candidate_health() {
            pricing_cpy -m backend.scripts.check_multi_source_pricing_health
          }

          pricing_candidate_sentinel() {
            local out key n total
            out=$(pricing_cpy -m backend.sentinel.operational --profile fast --list-checks 2>&1) || { echo "$out" | tail -20; return 1; }
            for key in $PRICING_SENTINEL_KEYS; do
              n=$(grep -c "\"$key\"" <<<"$out" || true)
              echo "sentinel_key $key count=$n"
              [ "$n" -eq 1 ] || return 1
            done
            total=$(grep -c '"pricing\.' <<<"$out" || true)
            echo "sentinel_pricing_total=$total"
            [ "$total" -eq 9 ]
          }

          pricing_stage() {
            local name="$1"; shift
            echo "== stage: $name =="
            if "$@"; then
              echo "stage_result $name=PASS"
            else
              echo "stage_result $name=FAIL"
              PRICING_FAILED_STAGES="$PRICING_FAILED_STAGES $name"
            fi
            return 0
          }

          pricing_candidate_validate() {
            PRICING_FAILED_STAGES=""
            pricing_stage compile pricing_candidate_compile
            pricing_stage tests pricing_candidate_tests
            pricing_stage env_copy pricing_candidate_env
            pricing_stage imports pricing_candidate_imports
            pricing_stage credentials pricing_candidate_credentials
            pricing_stage schema pricing_candidate_schema
            pricing_stage dry_run pricing_candidate_dry_run
            pricing_stage health pricing_candidate_health
            pricing_stage sentinel pricing_candidate_sentinel
            [ -z "$PRICING_FAILED_STAGES" ]
          }

          PRICING_CLEANED=0
          pricing_candidate_cleanup() {
            [ "$PRICING_CLEANED" -eq 0 ] || return 0
            PRICING_CLEANED=1
            rm -f "$PRICING_WT/backend/.env" 2>/dev/null || true
            rm -rf "$PRICING_PREFLIGHT_STATE" 2>/dev/null || true
            if [ -e "$PRICING_WT" ]; then
              git -C "$REPO" worktree remove --force "$PRICING_WT" >/dev/null 2>&1 || rm -rf "$PRICING_WT"
            fi
            git -C "$REPO" worktree prune >/dev/null 2>&1 || true
            echo "candidate_worktree_removed=$([ -e "$PRICING_WT" ] && echo false || echo true) candidate_env_removed=true"
            if [ -n "${PRICING_ASSERT_HEAD:-}" ]; then
              if [ "$(git -C "$REPO" rev-parse HEAD)" = "$PRICING_ASSERT_HEAD" ] \
                 && [ "$(git -C "$REPO" status --porcelain --untracked-files=no | sha256sum | cut -c1-16)" = "$PRICING_ASSERT_STATUS" ]; then
                echo "PRODUCTION_CHECKOUT_UNCHANGED=true"
              else
                echo "PRODUCTION_CHECKOUT_UNCHANGED=false"
