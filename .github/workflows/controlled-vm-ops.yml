name: Controlled VM Ops

on:
  push:
    branches:
      - vm-ops-control
    paths:
      - ".vm-ops/request.json"

permissions:
  contents: read

concurrency:
  group: index-production-vm-ops-v2
  cancel-in-progress: true

jobs:
  vm-ops:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 120
    env:
      VM_REQUEST_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re

          message = os.environ.get("VM_REQUEST_MESSAGE", "").strip()
          match = re.fullmatch(
              r"vm-op:\s*(status|sync-main|sync-main-preserve-payload-debug|pytest-cards-market|pytest-cards-market-pr239|set-market-snapshot|explorer-prewarm-one|market-dashboard-set|repair-cards-market-errors|refresh-explorer-and-audit)"
              r"(?:\s+market_date=(\d{4}-\d{2}-\d{2}))?"
              r"(?:\s+set_id=([A-Za-z0-9._:-]{1,128}))?"
              r"(?:\s+request_id=([A-Za-z0-9._:-]{1,128}))?",
              message,
          )
          if not match:
              raise SystemExit(f"invalid controlled VM request message: {message!r}")

          op, market_date, set_id, request_id = match.groups()
          market_date = market_date or ""
          set_id = set_id or ""
          request_id = request_id or ""

          if op in {"set-market-snapshot", "explorer-prewarm-one", "market-dashboard-set", "repair-cards-market-errors"} and not market_date:
              raise SystemExit(f"{op} requires market_date")
          if op == "market-dashboard-set" and not set_id:
              raise SystemExit("market-dashboard-set requires set_id")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"VM_OPERATION={op}\n")
              env.write(f"VM_MARKET_DATE={market_date}\n")
              env.write(f"VM_SET_ID={set_id}\n")
              env.write(f"VM_REQUEST_ID={request_id}\n")

          print({
              "operation": op,
              "market_date": market_date,
              "set_id": set_id,
              "request_id": request_id,
          })
          PY

      - name: Execute approved operation
        shell: bash
        run: |
          set -euo pipefail

          REPO="/home/ubuntu/repos/EVRCalculator"
          PY="$REPO/.venv/bin/python"

          test -d "$REPO/.git" || { echo "Production repo missing: $REPO"; exit 2; }
          test -x "$PY" || { echo "Production venv Python missing: $PY"; exit 2; }

          case "$VM_OPERATION" in
            status)
              cd "$REPO"
              echo "== request =="
              echo "request_id=$VM_REQUEST_ID"
              echo "== git =="
              git status --short
              git log -1 --oneline
              echo "== host =="
              hostname
              uname -m
              free -h
              df -h /
              ;;

            sync-main)
              cd "$REPO"
              if [ -n "$(git status --porcelain)" ]; then
                echo "Refusing to switch a dirty production checkout."
                git status --short
                exit 3
              fi
              git fetch origin main
              git switch --detach origin/main
              git status --short
              git log -1 --oneline
              ;;

            sync-main-preserve-payload-debug)
              cd "$REPO"
              git fetch origin main
              DIRTY_PATHS="$(git status --porcelain | sed -E 's/^.. //')"
              if [ -n "$DIRTY_PATHS" ] && [ "$DIRTY_PATHS" != "payload_debug.json" ]; then
                echo "Refusing safe sync: unexpected dirty paths:"
                git status --short
                exit 3
              fi
              if [ -n "$DIRTY_PATHS" ] && ! git diff --quiet HEAD..origin/main -- payload_debug.json; then
                echo "Refusing safe sync: origin/main changes payload_debug.json."
                exit 3
              fi
              git switch --detach origin/main
              git status --short
              git log -1 --oneline
              ;;

            pytest-cards-market)
              cd "$REPO"
              SUPABASE_URL="http://127.0.0.1:54321" \
              SUPABASE_SERVICE_ROLE_KEY="test-service-role-key" \
              SUPABASE_ANON_KEY="test-anon-key" \
              PYTHONPATH="/tmp/evr-pytest-deps:$REPO" \
              "$PY" -m pytest \
                backend/tests/unit/db/services/test_pokemon_set_cards_market_analytics_service.py \
                -q
              ;;

            pytest-cards-market-pr239)
              cd "$REPO"
              WT="/tmp/EVRCalculator-vmops-pr239"
              git fetch origin fix/cards-market-adaptive-timeout-split-20260919
              if [ -d "$WT" ]; then
                git worktree remove --force "$WT" || rm -rf "$WT"
              fi
              git worktree add --detach "$WT" dc2b9f68d72014c7ab1c3d46372eef53c2fc26c3
              cd "$WT"
              SUPABASE_URL="http://127.0.0.1:54321" \
              SUPABASE_SERVICE_ROLE_KEY="test-service-role-key" \
              SUPABASE_ANON_KEY="test-anon-key" \
              PYTHONPATH="/tmp/evr-pytest-deps:$WT" \
              "$PY" -m pytest \
                backend/tests/unit/db/services/test_pokemon_set_cards_market_analytics_service.py \
                -q
              ;;

            set-market-snapshot)
              cd "$REPO"
              "$PY" backend/scripts/build_pokemon_explore_set_value_snapshot.py \
                --commit \
                --market-date "$VM_MARKET_DATE"
              ;;

            explorer-prewarm-one)
              cd "$REPO"
              "$PY" -m backend.scripts.run_market_explorer_maintained_cache_prewarm \
                --commit \
                --market-date "$VM_MARKET_DATE" \
                --max-caches 1
              ;;

            market-dashboard-set)
              cd "$REPO"
              "$PY" backend/scripts/build_pokemon_market_dashboard_snapshots.py \
                --set-id "$VM_SET_ID" \
                --commit \
                --market-date "$VM_MARKET_DATE"
              ;;

            repair-cards-market-errors)
              cd "$REPO"
              TOTAL=5
              INDEX=0
              FAILED=0

              for SET_ID in \
                1b3250bb-f123-47d8-b090-499e5879eda7 \
                c56fe006-6d9a-4b26-a4e0-6726138edecb \
                50c5370b-a5e7-4fbc-98fe-efc35e05ff80 \
                537d3312-9622-4015-9ef2-66e16a27287c \
                846787ce-2e12-4dab-b941-886f95cd16f8 \
              ; do
                INDEX=$((INDEX + 1))
                echo "===== cards-market repair $INDEX/$TOTAL set_id=$SET_ID ====="

                set +e
                "$PY" backend/scripts/build_pokemon_market_dashboard_snapshots.py \
                  --set-id "$SET_ID" \
                  --commit \
                  --market-date "$VM_MARKET_DATE"
                STATUS=$?
                set -e

                if [ "$STATUS" -ne 0 ]; then
                  FAILED=$((FAILED + 1))
                  echo "repair command failed set_id=$SET_ID status=$STATUS"
                fi

                sleep 10
              done

              echo "===== cards-market repair command summary ====="
              echo "total=$TOTAL command_failures=$FAILED"
              ;;

            refresh-explorer-and-audit)
              cd "$REPO"
              echo "===== refresh prepared Explorer ====="
              "$PY" -c 'from backend.db.clients.supabase_client import create_service_role_client; c=create_service_role_client(); print(c.rpc("refresh_pokemon_market_explorer_prepared_directory_v1", {}).execute().data)'

              echo "===== final Explorer audit ====="
              "$PY" -c 'from backend.db.clients.supabase_client import create_service_role_client; c=create_service_role_client(); d=list((c.table("pokemon_market_explorer_prepared_directory_v1").select("market_type,comparison_as_of,source_as_of,history_available,history_point_count").execute()).data or []); h=list((c.table("pokemon_market_explorer_prepared_history_v1").select("market_date").order("market_date", desc=True).limit(1).execute()).data or []); m=list((c.table("pokemon_set_market_dashboard_snapshot_latest").select("set_id,latest_market_date,payload_json").eq("window_key","365d").gte("latest_market_date","2026-09-18").execute()).data or []); sets=[r for r in d if r.get("market_type")=="set"]; errors=[r for r in m if ((r.get("payload_json") or {}).get("cardsMarket") or {}).get("reason")=="error"]; print({"directoryRows":len(d),"setRows":len(sets),"setsWithHistory":sum(1 for r in sets if r.get("history_available") is True),"setsWithoutHistory":sum(1 for r in sets if r.get("history_available") is not True),"comparisonAsOf":sorted({str(r.get("comparison_as_of")) for r in d if r.get("comparison_as_of")}),"sourceAsOf":sorted({str(r.get("source_as_of")) for r in d if r.get("source_as_of")}),"maxPreparedHistoryDate":(h[0].get("market_date") if h else None),"remainingDashboardErrors":len(errors)})'
              ;;

            *)
              echo "Unexpected operation after validation: $VM_OPERATION"
              exit 4
              ;;
          esac
