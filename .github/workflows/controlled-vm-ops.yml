              "ebay_active_ask_price_estimates_v1": latest("ebay_active_ask_price_estimates_v1", "market_date,estimator_version", "market_date"),
              "pokemon_multi_source_card_prices_v1": latest("pokemon_multi_source_card_prices_v1", "market_date,policy_version,pipeline_run_id", "market_date"),
          }, indent=2, default=str))
          PY
              exit "$HEALTH_RC"
              ;;

            pricing-install-cron)
              # MUTATING: fail-closed gates first; cron is written ONLY by the canonical installer with --apply.
              cd "$REPO"
              echo "== gates =="
              git fetch --all --prune || { echo "REFUSING: git fetch failed"; exit 20; }
              echo "head=$(git rev-parse HEAD)"
              if git status --porcelain --untracked-files=no | sed -E 's/^.. //' | grep -vFx -e "payload_debug.json" -e "backend/constants/tcg/pokemon/pokemon_era_set_sync_report.json" | grep -q .; then
                echo "REFUSING: unexpected tracked modifications:"
                git status --short
                exit 21
              fi
              pricing_runtime_present || { echo "REFUSING: pricing runtime files missing from production checkout"; exit 22; }
              [ "$(pricing_host_timezone)" = "America/Phoenix" ] || { echo "REFUSING: host timezone is not America/Phoenix"; exit 23; }
              pricing_credentials_probe || { echo "REFUSING: eBay credentials unresolved (frontend fallback disabled)"; exit 24; }
              [ "$(pricing_lock_state "$PRICING_LOCK")" != "held" ] || { echo "REFUSING: pricing lock held"; exit 25; }
              [ "$(pricing_lock_state "$STATE/daily_multi_source_pricing.lock")" != "held" ] || { echo "REFUSING: pipeline state lock held"; exit 25; }
              REPORT_BEFORE=$(pricing_cron_report)
              echo "$REPORT_BEFORE"
              UNMANAGED=$(grep -E '^unmanaged_pricing_(run|health)_entries=' <<<"$REPORT_BEFORE" | grep -vc '=0$' || true)
              [ "${UNMANAGED:-0}" -eq 0 ] || { echo "REFUSING: unmanaged pricing schedule entries exist outside the managed block"; exit 26; }
              timeout 600 bash infra/oracle/install_multi_source_pricing_cron.sh || { echo "REFUSING: installer verify mode failed"; exit 27; }
              OUTSIDE_BEFORE=$(pricing_crontab_outside_block_hash)

              echo "== apply (canonical installer only) =="
              timeout 600 bash infra/oracle/install_multi_source_pricing_cron.sh --apply

              echo "== post-install proof =="
              REPORT_AFTER=$(pricing_cron_report)
              echo "$REPORT_AFTER"
              OUTSIDE_AFTER=$(pricing_crontab_outside_block_hash)
              echo "crontab_outside_managed_block_hash before=$OUTSIDE_BEFORE after=$OUTSIDE_AFTER"
              grep -qx 'managed_blocks=1' <<<"$REPORT_AFTER" || { echo "PROOF FAILED: managed block count != 1"; exit 30; }
              grep -qx 'primary_entries=1' <<<"$REPORT_AFTER" || { echo "PROOF FAILED: primary 04:10 entry count != 1"; exit 31; }
              grep -qx 'retry_entries=1' <<<"$REPORT_AFTER" || { echo "PROOF FAILED: retry entry count != 1"; exit 32; }
              grep -qx 'managed_run_entries=2' <<<"$REPORT_AFTER" || { echo "PROOF FAILED: managed run entry count != 2"; exit 33; }
              grep -qx 'managed_health_entries=1' <<<"$REPORT_AFTER" || { echo "PROOF FAILED: health entry count != 1"; exit 34; }
              grep -qx 'unmanaged_pricing_run_entries=0' <<<"$REPORT_AFTER" || { echo "PROOF FAILED: unmanaged pricing run entries"; exit 35; }
              grep -qx 'unmanaged_pricing_health_entries=0' <<<"$REPORT_AFTER" || { echo "PROOF FAILED: unmanaged pricing health entries"; exit 35; }
              [ "$OUTSIDE_BEFORE" = "$OUTSIDE_AFTER" ] || { echo "PROOF FAILED: crontab outside the managed block changed"; exit 36; }
              echo "PRICING_CRON_INSTALLED=PASS"
              ;;

            pricing-run-controlled)
              # MUTATING: one bounded real run through the canonical entrypoint. Cap is hard-coded (PRICING_CAP).
              cd "$REPO"
              echo "== gates =="
              pricing_runtime_present || { echo "REFUSING: pricing runtime files missing from production checkout"; exit 20; }
              [ "$(pricing_host_timezone)" = "America/Phoenix" ] || { echo "REFUSING: host timezone is not America/Phoenix"; exit 21; }
              pricing_credentials_probe || { echo "REFUSING: eBay credentials unresolved (frontend fallback disabled)"; exit 22; }
              [ "$(pricing_lock_state "$PRICING_LOCK")" != "held" ] || { echo "REFUSING: pricing lock held"; exit 23; }
              mkdir -p "$STATE"
              echo "request_cap=$PRICING_CAP (fixed; the pipeline can only lower its own pool ceiling)"
              echo "NOTE: the cap is stored on today's run row; if this run completes, that market date is COMPLETE at this reduced scale and the scheduled job replays it as a no-op."
              set +e
              /usr/bin/flock -n --conflict-exit-code 99 "$PRICING_LOCK" -c "cd '$REPO' && EVR_PRICING_STATE_DIR='$STATE' '$PY' -m backend.scripts.run_daily_multi_source_card_pricing --json --resume --no-frontend-env-fallback --max-requests $PRICING_CAP"
              RC=$?
              set -e
              echo "pipeline_exit_code=$RC"
              case "$RC" in
                0) echo "PRICING_RUN_CONTROLLED=PASS" ;;
                75) echo "PRICING_RUN_CONTROLLED=WAITING_FOR_COMPLETED_TCG_BATCH" ;;
                99) echo "PRICING_RUN_CONTROLLED=LOCK_HELD_NOTHING_RUN" ;;
                *) echo "PRICING_RUN_CONTROLLED=NOT_COMPLETE_SEE_RECEIPT" ;;
              esac
              exit "$RC"
              ;;

            pricing-replay-verify)
              # Replays the latest COMPLETE run (current policy version) via the canonical pipeline; must be a strict no-op.
              cd "$REPO"
              echo "== gates =="
              pricing_runtime_present || { echo "REFUSING: pricing runtime files missing from production checkout"; exit 20; }
              pricing_credentials_probe || { echo "REFUSING: eBay credentials unresolved (frontend fallback disabled)"; exit 22; }
              [ "$(pricing_lock_state "$PRICING_LOCK")" != "held" ] || { echo "REFUSING: pricing lock held"; exit 23; }
              MD=$("$PY" - <<'PY'
          from backend.db.clients.supabase_client import create_service_role_client
          from backend.scripts import pokemon_multi_source_card_price_v1 as policy

          rows = create_service_role_client().table("pokemon_multi_source_pricing_runs_v1").select("market_date").eq(
              "status", "COMPLETE").eq("policy_version", policy.POLICY_VERSION).order("market_date", desc=True).limit(1).execute().data or []
          print(rows[0]["market_date"] if rows else "")
          PY
              )
              [[ "$MD" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "REFUSING: no COMPLETE run for the current policy version to replay"; exit 30; }
              echo "replay_market_date=$MD"
              BEFORE=$(mktemp); AFTER=$(mktemp); RECEIPT=$(mktemp)
              pricing_counts "$MD" > "$BEFORE"
              echo "== counts BEFORE =="; cat "$BEFORE"
              set +e
              /usr/bin/flock -n --conflict-exit-code 99 "$PRICING_LOCK" -c "cd '$REPO' && EVR_PRICING_STATE_DIR='$STATE' '$PY' -m backend.scripts.run_daily_multi_source_card_pricing --market-date '$MD' --json --resume --no-frontend-env-fallback --max-requests $PRICING_CAP" > "$RECEIPT"
              RC=$?
              set -e
              echo "replay_pipeline_exit_code=$RC"
              cat "$RECEIPT"
              pricing_counts "$MD" > "$AFTER"
              echo "== counts AFTER =="; cat "$AFTER"
              [ "$RC" -eq 0 ] || { echo "REPLAY FAILED: pipeline exit $RC"; exit 31; }
              grep -q '"idempotent_replay": true' "$RECEIPT" || { echo "REPLAY NOT A NO-OP: receipt lacks idempotent_replay=true"; exit 32; }
              cmp -s "$BEFORE" "$AFTER" || { echo "REPLAY MUTATED STATE: before/after counts differ"; diff "$BEFORE" "$AFTER" || true; exit 33; }
              echo "no_new_ebay_requests=true no_duplicate_evidence=true no_duplicate_estimates=true no_duplicate_decisions=true"
              echo "PRICING_REPLAY_VERIFY=PASS"
              ;;

            pricing-runtime-preflight)
              # Production checkout, cron, DB rows and configuration are NOT modified. A temporary worktree and a temporary
              # copy of backend/.env (mode 600, never printed) exist under /tmp only while candidate validation runs.
              cd "$REPO"
              set +e
              trap 'pricing_candidate_cleanup' EXIT
              echo "== production identity =="
              echo "request_id=$VM_REQUEST_ID"
              echo "hostname=$(hostname)"
              echo "phoenix_now=$(TZ=America/Phoenix date '+%F %T %Z')"
              git fetch --all --prune
              echo "fetch_exit=$?"
              PRE_BRANCH=$(git branch --show-current)
              PRE_HEAD=$(git rev-parse HEAD)
              echo "branch=$PRE_BRANCH"
              echo "head=$PRE_HEAD"
              echo "origin_main=$(git rev-parse origin/main 2>/dev/null)"
              echo "head_equals_origin_main=$([ "$PRE_HEAD" = "$(git rev-parse origin/main 2>/dev/null)" ] && echo true || echo false)"
              echo "tracked_modification_count=$(git status --porcelain --untracked-files=no | wc -l)"
              git status --porcelain --untracked-files=no | head -20
              echo "-- untracked (informational; never touched) --"
              git status --porcelain | grep '^??' | head -20
              PRICING_ASSERT_HEAD="$PRE_HEAD"
              PRICING_ASSERT_STATUS=$(git status --porcelain --untracked-files=no | sha256sum | cut -c1-16)
              PREFLIGHT_OK=1
              [ "$PRE_BRANCH" = "main" ] || { echo "PREFLIGHT_BLOCKER: production branch is not main"; PREFLIGHT_OK=0; }

              echo "== runtime provenance =="
              pricing_provenance_report

              echo "== candidate = production HEAD + pinned pricing overlay + pinned Sentinel integration =="
              if pricing_candidate_prepare; then
                echo "-- candidate overlay paths --"
                pricing_overlay_manifest
                if ! pricing_candidate_validate; then
                  echo "failed_stages=$PRICING_FAILED_STAGES"
                  PREFLIGHT_OK=0
                fi
              else
                echo "PREFLIGHT_BLOCKER: candidate could not be built or failed the exact-diff gate"
                PREFLIGHT_OK=0
              fi

              pricing_candidate_cleanup
              if [ "$PREFLIGHT_OK" -eq 1 ]; then echo "PRICING_RUNTIME_PREFLIGHT=PASS"; exit 0; fi
              echo "PRICING_RUNTIME_PREFLIGHT=FAIL"
              exit 1
              ;;

            pricing-deploy-runtime)
              # MUTATING (local overlay commit on production main; never pushed). Does not install cron, call eBay, or write pricing rows.
              cd "$REPO"
              trap 'pricing_candidate_cleanup' EXIT
              echo "== hard gates =="
              echo "request_id=$VM_REQUEST_ID"
              [ "$(git branch --show-current)" = "main" ] || { echo "REFUSING: production branch is not main"; exit 20; }
              git fetch --all --prune || { echo "REFUSING: git fetch failed"; exit 21; }
              PRE_HEAD=$(git rev-parse HEAD)
              echo "pre_deploy_head=$PRE_HEAD"
              if git status --porcelain --untracked-files=no | sed -E 's/^.. //' | grep -vFx -e "payload_debug.json" -e "backend/constants/tcg/pokemon/pokemon_era_set_sync_report.json" | grep -q .; then
                echo "REFUSING: unexpected tracked modifications:"; git status --short; exit 22
              fi
              for f in $(pricing_overlay_manifest); do
                [ ! -e "$f" ] || { echo "REFUSING: $f already exists; the runtime is already present (use pricing-runtime-preflight)"; exit 23; }
              done
              MANIFEST_PATH=$(pricing_env_value SENTINEL_RUNTIME_OVERLAY_MANIFEST)
              if [ -n "$MANIFEST_PATH" ] && [ -f "$MANIFEST_PATH" ]; then
                APPROVED_BASE=$("$PY" -c 'import json,sys; print(json.load(open(sys.argv[1]))["approvedMainSha"])' "$MANIFEST_PATH")
              else
                APPROVED_BASE=$(git rev-parse origin/main)
              fi
              echo "approved_base=$APPROVED_BASE"
              git merge-base --is-ancestor "$APPROVED_BASE" HEAD || { echo "REFUSING: approved production base is not an ancestor of HEAD"; exit 24; }
              if pgrep -f 'run_daily_multi_source_card_pricing|check_multi_source_pricing_health' >/dev/null; then echo "REFUSING: a pricing process is running"; exit 25; fi
              [ "$(pricing_lock_state "$PRICING_LOCK")" != "held" ] || { echo "REFUSING: pricing lock held"; exit 25; }
              CRON_BEFORE=$(pricing_cron_report)
              echo "$CRON_BEFORE"
              grep -qx 'managed_blocks=0' <<<"$CRON_BEFORE" && grep -qx 'unmanaged_pricing_run_entries=0' <<<"$CRON_BEFORE" && grep -qx 'unmanaged_pricing_health_entries=0' <<<"$CRON_BEFORE" \
                || { echo "REFUSING: a pricing schedule already exists"; exit 26; }
              echo "== runtime provenance gate =="
              PROV=$(pricing_provenance_report)
              echo "$PROV"
              if grep -qx 'runtime_provenance_configured=true' <<<"$PROV"; then
                grep -qx 'existing_manifest_covers_candidate=true' <<<"$PROV" \
                  || { echo "REFUSING: the active overlay manifest does not authorize every candidate path; a separate reviewed manifest update is required"; exit 40; }
              fi
              COUNTS_BEFORE=$(pricing_table_counts) || { echo "REFUSING: pricing tables unreadable"; exit 27; }
              echo "pricing_table_counts_before=$COUNTS_BEFORE"

              echo "== candidate validation (fresh worktree; must pass in full) =="
              pricing_candidate_prepare || { echo "REFUSING: candidate build/exact-diff gate failed"; exit 30; }
              if ! pricing_candidate_validate; then echo "REFUSING: candidate validation failed: $PRICING_FAILED_STAGES"; exit 31; fi
              pricing_candidate_cleanup

              echo "== apply reviewed overlay (production stays on main; local commit only, never pushed) =="
              git checkout "$PRICING_SOURCE_SHA" -- $PRICING_OVERLAY_PRICE_PATHS || { pricing_overlay_rollback; echo "apply failed; rolled back"; exit 50; }
              git checkout "$SENTINEL_PRICING_SHA" -- $PRICING_OVERLAY_SENTINEL_PATHS || { pricing_overlay_rollback; echo "apply failed; rolled back"; exit 50; }
              STAGED=$(git diff --cached --name-only | sort)
              echo "-- staged files --"
              echo "$STAGED"
              git diff --check --cached || { pricing_overlay_rollback; echo "diff --check failed; rolled back"; exit 51; }
              [ "$STAGED" = "$(pricing_overlay_manifest)" ] || { pricing_overlay_rollback; echo "staged set != reviewed manifest; rolled back"; exit 52; }
              git -c user.name="index-vm-ops" -c user.email="vm-ops@index.invalid" commit -q \
                -m "ops(pricing): install pinned multi-source pricing runtime overlay" \
                -m "pricing source $PRICING_SOURCE_SHA; sentinel source $SENTINEL_PRICING_SHA; local production overlay commit, not pushed." \
                || { pricing_overlay_rollback; echo "commit failed; rolled back"; exit 53; }
              echo "overlay_commit=$(git rev-parse HEAD)"

              echo "== post-deploy validation =="
              POST_FAIL=0
              [ "$(git branch --show-current)" = "main" ] && echo "branch=main" || { echo "FAIL: branch"; POST_FAIL=1; }
              [ "$(git diff --name-only "$PRE_HEAD" HEAD | sort)" = "$(pricing_overlay_manifest)" ] && echo "overlay_path_set_exact=true" || { echo "FAIL: overlay path set"; POST_FAIL=1; }
              pricing_runtime_present && echo "pricing_runtime_files_present=true" || { echo "FAIL: runtime files"; POST_FAIL=1; }
              pricing_credentials_probe || { echo "FAIL: credential probe"; POST_FAIL=1; }
              rm -rf "$PRICING_PREFLIGHT_STATE"; mkdir -p "$PRICING_PREFLIGHT_STATE"
              EVR_PRICING_STATE_DIR="$PRICING_PREFLIGHT_STATE" timeout 300 "$PY" -m backend.scripts.run_daily_multi_source_card_pricing --dry-run --json --no-frontend-env-fallback || { echo "FAIL: dry run"; POST_FAIL=1; }
              rm -rf "$PRICING_PREFLIGHT_STATE"
              timeout 300 "$PY" -m backend.scripts.check_multi_source_pricing_health || { echo "FAIL: pricing health"; POST_FAIL=1; }
              SENTINEL_OUT=$(timeout 300 "$PY" -m backend.sentinel.operational --profile fast --list-checks 2>&1 || true)
              SENTINEL_TOTAL=$(grep -c '"pricing\.' <<<"$SENTINEL_OUT" || true)
              echo "sentinel_pricing_check_count=$SENTINEL_TOTAL"
              for key in $PRICING_SENTINEL_KEYS; do
                [ "$(grep -c "\"$key\"" <<<"$SENTINEL_OUT" || true)" -eq 1 ] || { echo "FAIL: sentinel key $key"; POST_FAIL=1; }
              done
              CRON_AFTER=$(pricing_cron_report)
              echo "$CRON_AFTER"
              grep -qx 'managed_blocks=0' <<<"$CRON_AFTER" && echo "cron_still_absent=true" || { echo "FAIL: cron unexpectedly present"; POST_FAIL=1; }
              if pgrep -f 'run_daily_multi_source_card_pricing' >/dev/null; then echo "FAIL: pricing process running"; POST_FAIL=1; else echo "no_real_pricing_run_occurred=true"; fi
              COUNTS_AFTER=$(pricing_table_counts)
              echo "pricing_table_counts_after=$COUNTS_AFTER"
              [ "$COUNTS_BEFORE" = "$COUNTS_AFTER" ] && echo "pricing_tables_unchanged=true" || { echo "FAIL: pricing table counts changed"; POST_FAIL=1; }
              pricing_provenance_report
              if [ "$POST_FAIL" -ne 0 ]; then
                echo "POST_DEPLOY_VALIDATION=FAIL (overlay commit remains for inspection; nothing was scheduled or run)"
                exit 60
              fi
              echo "PRICING_RUNTIME_DEPLOYED=PASS"
              if grep -qx 'runtime_provenance_configured=false' <<<"$PROV"; then echo "RUNTIME_PROVENANCE_PROFILE_NOT_CONFIGURED"; fi
              ;;

            *)
              echo "Unexpected operation after validation: $VM_OPERATION"
              exit 4
              ;;
          esac
