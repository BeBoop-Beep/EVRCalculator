            backend/scripts/ebay_language_policy_v1.py
            backend/scripts/freeze_ebay_active_ask_v1.py
            backend/scripts/index_fair_value_ebay_evidence_collector.py
            backend/scripts/run_ebay_p4a_adaptive_development.py
