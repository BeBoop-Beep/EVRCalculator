          pricing_source_check() {
            local sha f listed expected
            for sha in "$PRICING_SOURCE_SHA" "$PRICING_TEST_SOURCE_SHA" "$SENTINEL_PRICING_SHA"; do
              git cat-file -e "$sha^{commit}" 2>/dev/null || { echo "REFUSING: pinned commit $sha is not in the production object store"; return 1; }
            done
            listed=$(git ls-tree -r --name-only "$PRICING_SOURCE_SHA" -- backend/pricing_pipeline/ | sort)
            expected=$(printf '%s\n' $PRICING_OVERLAY_PRICE_PATHS | grep '^backend/pricing_pipeline/' | sort)
            if [ "$listed" != "$expected" ]; then
              echo "REFUSING: backend/pricing_pipeline/ at PRICING_SOURCE_SHA differs from the reviewed file list"
              diff <(echo "$expected") <(echo "$listed") || true
              return 1
            fi
            for f in $PRICING_OVERLAY_PRICE_PATHS $PRICING_OVERLAY_SENTINEL_PATHS; do
              git rev-parse -q --verify "$(pricing_overlay_source_for "$f"):$f" >/dev/null || { echo "REFUSING: $f is missing at its pinned source"; return 1; }
            done
            echo "pinned_sources_ok pricing=$PRICING_SOURCE_SHA sentinel=$SENTINEL_PRICING_SHA"
