          pricing_candidate_prepare() {
            local changed manifest unexpected f src want got
            pricing_source_check || return 1
            git worktree prune
            if [ -e "$PRICING_WT" ]; then
              git worktree remove --force "$PRICING_WT" >/dev/null 2>&1 || rm -rf "$PRICING_WT"
              git worktree prune
            fi
            git worktree add --detach "$PRICING_WT" HEAD >/dev/null || return 1
            git -C "$PRICING_WT" checkout "$PRICING_SOURCE_SHA" -- $PRICING_OVERLAY_PRICE_PATHS || return 1
            git -C "$PRICING_WT" checkout "$SENTINEL_PRICING_SHA" -- $PRICING_OVERLAY_SENTINEL_PATHS || return 1
            echo "candidate_base_main_sha=$(git rev-parse HEAD)"
            echo "pricing_source_sha=$PRICING_SOURCE_SHA"
            echo "sentinel_source_sha=$SENTINEL_PRICING_SHA"
            echo "-- candidate git status --short --"
            git -C "$PRICING_WT" status --short
            changed=$(git -C "$PRICING_WT" diff --name-only HEAD | sort)
            manifest=$(pricing_overlay_manifest)
            unexpected=$(comm -23 <(echo "$changed") <(echo "$manifest") | grep . || true)
            if [ -n "$unexpected" ]; then
              echo "REFUSING: candidate differs from production main outside the reviewed manifest:"
              echo "$unexpected"
              return 1
            fi
            for f in $PRICING_OVERLAY_PRICE_PATHS $PRICING_OVERLAY_SENTINEL_PATHS; do
              src=$(pricing_overlay_source_for "$f")
              want=$(git rev-parse "$src:$f")
              got=$(git hash-object "$PRICING_WT/$f")
              [ "$want" = "$got" ] || { echo "REFUSING: candidate blob for $f differs from its pinned source"; return 1; }
              echo "overlay path=$f source=${src:0:8} blob=$got production_main_blob=$(git rev-parse -q --verify "HEAD:$f" || echo ABSENT)"
            done
            git -C "$PRICING_WT" diff --check HEAD || { echo "REFUSING: git diff --check failed on the candidate"; return 1; }
            echo "candidate_overlay_path_count=$(echo "$manifest" | grep -c .)"
            echo "candidate_changed_path_count=$(echo "$changed" | grep -c . || true)"
            echo "candidate_diff_equals_manifest_exactly=$([ "$changed" = "$manifest" ] && echo true || echo false)"
          }

