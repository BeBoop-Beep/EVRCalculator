name: Controlled VM Ops

on:
  push:
    branches:
      - vm-ops-control
    paths:
      - ".vm-ops/request.json"

permissions:
  contents: read
  issues: write

concurrency:
  group: index-production-vm-ops-v2
  cancel-in-progress: false

jobs:
  vm-ops:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 120
    env:
      VM_REQUEST_MESSAGE: ${{ github.event.head_commit.message }}
      ACTIONS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACTIONS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ACTIONS_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      ACTIONS_SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      VM_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re

          message = os.environ.get("VM_REQUEST_MESSAGE", "").strip()
          match = re.fullmatch(
              r"vm-op:\s*(status|fv-shadow-publish-dry-run|fv-shadow-publish-once|fv-shadow-foundation-tests|fv-shadow-ops-tests|fv-shadow-ops-install-cron|fv-shadow-ops-status|fv-forward-bindings-dry-run|fv-forward-bindings-backfill|fv-core-panel-activation-tests|fv-core-panel-plan|fv-core-panel-preflight|fv-core-panel-install-cron|fv-core-panel-run-now|fv-core-panel-status|vm-cleanup-stale-tmp|db-safety-empty-hold-repair|fv-canary-empty-diagnose|sync-main-reviewed|code-red-db-load-shed|code-red-db-load-restore-audit|code-red-db-load-restore-merge|code-red-db-load-restore|db-safety-guard-repair|sentinel-reliability-tests|sentinel-explorer-convergence-dry-run|market-explorer-cutover-status|market-explorer-direct-worker-test|market-explorer-install-db-env|market-explorer-worker-cutover|market-explorer-db-diagnose|market-explorer-sync-db-password|market-explorer-cron-audit|market-explorer-cron-observe|market-explorer-cache-cron-disable|market-explorer-projection-audit|market-explorer-currency-source-audit|market-explorer-manual-one-shot|market-explorer-coverage-rpc-tests|market-explorer-durable-tests|market-explorer-coverage-rpc-smoke|market-explorer-coverage-direct-smoke|market-explorer-currency-tests|market-explorer-currency-cutover|market-explorer-pipeline-runtime-cutover|market-explorer-v2-repair|market-explorer-coverage-rpc-cutover|sync-main|wait-sync-main-after-publication|sync-main-preserve-payload-debug|sync-main-preserve-untracked-artifacts|pytest-cards-market|pytest-cards-market-pr239|pytest-post-scrape-watchdog-pr363|pytest-publication-detach-fix|pytest-global-market-deferred-segments-fix|pytest-refresh-target-fastpath-pr368|pytest-projection-gate-pr369|post-scrape-recovery-now|rip-benchmark-publish|market-vintage-db-migrate|market-vintage-cutover|supabase-project-restart|set-market-snapshot|sealed-market-snapshots-all|explorer-prewarm-one|explorer-prewarm-five|market-dashboard-set|repair-cards-market-errors|refresh-explorer-and-audit|repair-sep22-base-publication|repair-sep22-market-publication-direct|sep22-publication-status|publication-live-debug|scrape-cycle-status|scrape-catalog-set-refresh|scrape-set-refresh|scrape-create-missing-batch|scrape-kill-stuck-dispatcher|scrape-hard-kill-stuck-dispatcher|scrape-hard-kill-live-stale-dispatcher|stop-stale-sep22-publisher|stop-sep24-global-card-segment-publisher|restart-sep24-publisher-optimized|sync-launch-sep24-publisher-optimized|run-sep24-publisher-optimized|treatment-panel-preflight|treatment-panel-pilot|pricing-status|pricing-health|pricing-install-cron|pricing-run-controlled|pricing-replay-verify|pricing-runtime-preflight|pricing-deploy-runtime|pricing-credential-status|pricing-install-credentials|pkmnprices-credential-status|pkmnprices-install-credential|pkmnprices-probe|pkmnprices-migration-scaffold|pricing-sync-main|pricing-run-full-now|sentinel-status|sentinel-audit-now|sentinel-enable-recovery|treatment-panel-recovery-v2)"
              r"(?:\s+market_date=(\d{4}-\d{2}-\d{2}))?"
              r"(?:\s+set_id=([A-Za-z0-9._:-]{1,128}))?"
              r"(?:\s+request_id=([A-Za-z0-9._:-]{1,128}))?",
              message,
          )
          if not match:
              raise SystemExit(f"invalid controlled VM request message: {message!r}")

          op, market_date, set_id, request_id = match.groups()
          market_date = market_date or ""
          set_id = set_id or ""
          request_id = request_id or ""

          if op in {"set-market-snapshot", "explorer-prewarm-one", "explorer-prewarm-five", "market-dashboard-set", "repair-cards-market-errors", "repair-sep22-base-publication", "repair-sep22-market-publication-direct", "scrape-create-missing-batch", "scrape-kill-stuck-dispatcher", "scrape-hard-kill-stuck-dispatcher", "scrape-hard-kill-live-stale-dispatcher", "stop-sep24-global-card-segment-publisher", "restart-sep24-publisher-optimized", "sync-launch-sep24-publisher-optimized", "run-sep24-publisher-optimized", "rip-benchmark-publish"} and not market_date:
              raise SystemExit(f"{op} requires market_date")
          if op == "market-dashboard-set" and not set_id:
              raise SystemExit("market-dashboard-set requires set_id")
          if op == "scrape-catalog-set-refresh" and not set_id:
              raise SystemExit("scrape-catalog-set-refresh requires set_id=<canonical_key>")
          if op == "scrape-set-refresh" and not set_id:
              raise SystemExit("scrape-set-refresh requires set_id=<canonical_key>")
          if (op.startswith("pricing-") or op.startswith("pkmnprices-") or op == "treatment-panel-recovery-v2") and (market_date or set_id):
              raise SystemExit(f"{op} accepts no market_date or set_id")
          if op.startswith("fv-") and (market_date or set_id):
              raise SystemExit(f"{op} accepts no market_date or set_id")
          if op == "treatment-panel-recovery-v2" and (not request_id or not request_id.isdigit()):
              raise SystemExit("treatment-panel-recovery-v2 requires numeric request_id=<issue number>")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"VM_OPERATION={op}\n")
              env.write(f"VM_MARKET_DATE={market_date}\n")
              env.write(f"VM_SET_ID={set_id}\n")
              env.write(f"VM_REQUEST_ID={request_id}\n")

          print({
              "operation": op,
              "market_date": market_date,
              "set_id": set_id,
              "request_id": request_id,
          })
          PY

      - name: Execute credential operation
        if: ${{ env.VM_OPERATION == 'pricing-credential-status' || env.VM_OPERATION == 'pricing-install-credentials' || env.VM_OPERATION == 'pkmnprices-credential-status' || env.VM_OPERATION == 'pkmnprices-install-credential' || env.VM_OPERATION == 'pkmnprices-probe' }}
        shell: bash
        env:
          ACTIONS_EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          ACTIONS_EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          ACTIONS_PKMNPRICES_API_KEY: ${{ secrets.PKMNPRICES_API_KEY }}
        run: |
          set -euo pipefail

          REPO="/home/ubuntu/repos/EVRCalculator"
          test -d "$REPO/.git" || { echo "Production repo missing: $REPO"; exit 2; }
          echo "request_id=$VM_REQUEST_ID"

          case "$VM_OPERATION" in
            pkmnprices-credential-status)
              # READ ONLY: presence only; never print value, prefix, length, or hash.
              python3 - <<'PY'
          import os,re
          path="/home/ubuntu/repos/EVRCalculator/backend/.env"
          secret=os.environ.get("ACTIONS_PKMNPRICES_API_KEY","")
          print("actions_pkmnprices_api_key_present=" + ("true" if secret else "false"))
          found=False
          assign=re.compile(rb"^\s*(?:export\s+)?PKMNPRICES_API_KEY\s*=(.*)$")
          if os.path.isfile(path):
              with open(path,"rb") as h:
                  for line in h.read().splitlines():
                      m=assign.match(line)
                      if m and m.group(1).strip().strip(b"'\"").strip():
                          found=True
          print("backend_env_pkmnprices_api_key_present=" + ("true" if found else "false"))
          PY
              ;;

            pkmnprices-install-credential)
              # MUTATING: atomically installs only PKMNPRICES_API_KEY into backend/.env.
              cd "$REPO"
              git fetch origin main --quiet
              PRE_BRANCH="$(git branch --show-current)"
              [ -z "$PRE_BRANCH" ] || [ "$PRE_BRANCH" = "main" ] || { echo "REFUSING: unexpected production branch $PRE_BRANCH"; exit 20; }
              [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "REFUSING: production HEAD is not current origin/main"; exit 21; }
              [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "REFUSING: tracked production changes exist"; git status --short --untracked-files=no; exit 22; }
              python3 - <<'PY'
          import os,pwd,re,sys,tempfile,subprocess
          repo="/home/ubuntu/repos/EVRCalculator"
          path=repo+"/backend/.env"
          key=os.environ.get("ACTIONS_PKMNPRICES_API_KEY","")
          if not key:
              raise SystemExit("REFUSING: PKMNPRICES_API_KEY Actions secret is empty")
          if "\n" in key or "\r" in key:
              raise SystemExit("REFUSING: PKMNPRICES_API_KEY contains a newline")
          if not re.fullmatch(r"[A-Za-z0-9._:/+=@-]+",key):
              raise SystemExit("REFUSING: PKMNPRICES_API_KEY contains characters unsafe for .env")
          request=(os.environ.get("VM_REQUEST_MESSAGE","")+"\n"+os.environ.get("VM_REQUEST_ID",""))
          if key in request:
              raise SystemExit("REFUSING: credential value appears in request metadata")
          if not os.path.isfile(path):
              raise SystemExit("REFUSING: backend/.env does not exist")
          st=os.stat(path)
          if pwd.getpwuid(st.st_uid).pw_name!="ubuntu" or os.geteuid()!=st.st_uid:
              raise SystemExit("REFUSING: backend/.env ownership mismatch")
          if st.st_mode & 0o004:
              raise SystemExit("REFUSING: backend/.env is world-readable")
          with open(path,"rb") as h:
              original=h.read()
          assign=re.compile(rb"^\s*(?:export\s+)?PKMNPRICES_API_KEY\s*=(.*)$")
          def strip_key(data):
              return b"".join(line for line in data.splitlines(keepends=True) if not assign.match(line.rstrip(b"\r\n")))
          eol=b"\r\n" if b"\r\n" in original else b"\n"
          base=strip_key(original)
          if base and not base.endswith(b"\n"):
              base+=eol
          new=base+b"PKMNPRICES_API_KEY="+key.encode()+eol
          fd,tmp=tempfile.mkstemp(prefix=".env.pkmnprices.",dir=os.path.dirname(path))
          try:
              with os.fdopen(fd,"wb") as h:
                  h.write(new); h.flush(); os.fsync(h.fileno())
              os.chmod(tmp,st.st_mode & 0o7777)
              ts=os.stat(tmp)
              if ts.st_uid!=st.st_uid or ts.st_gid!=st.st_gid:
                  os.chown(tmp,st.st_uid,st.st_gid)
              os.replace(tmp,path)
          except BaseException:
              try: os.unlink(tmp)
              except FileNotFoundError: pass
              raise
          with open(path,"rb") as h:
              after=h.read()
          matches=[m for line in after.splitlines() if (m:=assign.match(line))]
          if len(matches)!=1 or not matches[0].group(1).strip():
              raise SystemExit("PKMNPRICES_INSTALL_VERIFY=FAIL assignment")
          if strip_key(after)!=base:
              raise SystemExit("PKMNPRICES_INSTALL_VERIFY=FAIL non-provider content changed")
          ast=os.stat(path)
          if (ast.st_mode & 0o7777)!=(st.st_mode & 0o7777) or ast.st_uid!=st.st_uid or ast.st_gid!=st.st_gid:
              raise SystemExit("PKMNPRICES_INSTALL_VERIFY=FAIL metadata")
          print("PKMNPRICES_CREDENTIAL_INSTALLED=PASS")
          PY
              ;;

            pkmnprices-probe)
              # READ ONLY provider probe except provider-side credit usage (<=2 credits).
              cd "$REPO"
              python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          from pathlib import Path
          def dotenv_value(path,key):
              if not path.is_file():
                  return ""
              for raw in path.read_text(encoding="utf-8-sig").splitlines():
                  line=raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  k,v=line.split("=",1)
                  k=k.strip()
                  if k.startswith("export "):
                      k=k[len("export "):].strip()
                  if k==key:
                      return v.strip().strip('"').strip("'")
              return ""
          key=dotenv_value(Path("backend/.env"),"PKMNPRICES_API_KEY")
          if not key:
              raise SystemExit("PKMNPRICES_PROBE=FAIL credential_missing")
          base="https://api.pkmnprices.com"
          def get(path):
              req=urllib.request.Request(base+path,headers={"X-API-Key":key,"Accept":"application/json","User-Agent":"inDex-PkmnPrices/1"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,json.load(r)
          status,cards=get("/v1/cards?tcg_player_id=89168&language=English&per_page=1")
          rows=cards.get("data") or []
          if status!=200 or len(rows)!=1:
              raise SystemExit("PKMNPRICES_PROBE=FAIL card_lookup")
          card=rows[0]
          cid=str(card.get("id"))
          status,sales=get("/v1/cards/"+urllib.parse.quote(cid,safe="")+"/listings/ebay?graded=false&limit=1")
          if status!=200:
              raise SystemExit("PKMNPRICES_PROBE=FAIL sold_endpoint")
          sold=sales.get("data") or []
          attrs=sorted({str(x.get("attribution")) for x in sold if x.get("attribution")})
          print(json.dumps({
              "status":"PASS",
              "card_lookup_count":len(rows),
              "pkmnprices_card_id":cid,
              "tcg_player_id":card.get("tcg_player_id"),
              "sold_rows_returned":len(sold),
              "attribution_states":attrs,
              "has_more":bool((sales.get("pagination") or {}).get("has_more")),
          },sort_keys=True))
          print("PKMNPRICES_PROBE=PASS")
          PY
              ;;

            pricing-credential-status)
              # READ ONLY: reports presence flags only; no values, lengths, prefixes or hashes.
              python3 - <<'PY'
          import os
          import re

          PATH = "/home/ubuntu/repos/EVRCalculator/backend/.env"
          ASSIGN = re.compile(rb"^\s*(?:export\s+)?(EBAY_CLIENT_ID|EBAY_CLIENT_SECRET)\s*=(.*)$")


          def flag(value):
              return "true" if value else "false"


          client_id = os.environ.get("ACTIONS_EBAY_CLIENT_ID", "")
          client_secret = os.environ.get("ACTIONS_EBAY_CLIENT_SECRET", "")
          print("actions_ebay_client_id_present=" + flag(client_id))
          print("actions_ebay_client_secret_present=" + flag(client_secret))
          print("actions_ebay_pair_complete=" + flag(client_id and client_secret))
          if not client_id:
              environment = "MISSING"
          elif "-PRD-" in client_id:
              environment = "PRODUCTION"
          elif "-SBX-" in client_id:
              environment = "SANDBOX"
          else:
              environment = "UNKNOWN"
          print("actions_ebay_environment=" + environment)

          exists = os.path.isfile(PATH)
          found = {"EBAY_CLIENT_ID": False, "EBAY_CLIENT_SECRET": False}
          if exists:
              with open(PATH, "rb") as handle:
                  for line in handle.read().splitlines():
                      match = ASSIGN.match(line)
                      if match and match.group(2).strip().strip(b"'\"").strip():
                          found[match.group(1).decode()] = True
          print("backend_env_exists=" + flag(exists))
          print("backend_env_ebay_client_id_present=" + flag(found["EBAY_CLIENT_ID"]))
          print("backend_env_ebay_client_secret_present=" + flag(found["EBAY_CLIENT_SECRET"]))
          print("backend_env_ebay_pair_complete=" + flag(all(found.values())))
          print("process_ebay_client_id_present=" + flag(os.environ.get("EBAY_CLIENT_ID")))
          print("process_ebay_client_secret_present=" + flag(os.environ.get("EBAY_CLIENT_SECRET")))
          PY
              ;;

            pricing-install-credentials)
              # MUTATING: changes only backend/.env (the two eBay keys) via an atomic replace with backup and rollback.
              [ "$(git -C "$REPO" branch --show-current)" = "main" ] || { echo "REFUSING: production branch is not main"; exit 20; }
              python3 - <<'PY'
          import os
          import pwd
          import re
          import subprocess
          import sys
          import tempfile

          REPO = "/home/ubuntu/repos/EVRCalculator"
          PATH = REPO + "/backend/.env"
          EXPECTED_OWNER = "ubuntu"
          KEYS = ("EBAY_CLIENT_ID", "EBAY_CLIENT_SECRET")
          ASSIGN = re.compile(rb"^\s*(?:export\s+)?(EBAY_CLIENT_ID|EBAY_CLIENT_SECRET)\s*=(.*)$")
          SAFE_VALUE = re.compile(r"^[A-Za-z0-9._:/+=@-]+$")
          PROBE = (
              "from backend.pricing_pipeline.ebay_credentials import load_ebay_credentials\n"
              "c = load_ebay_credentials(allow_frontend_fallback=False)\n"
              "print('credential_source=' + str(c.source))\n"
              "print('ebay_environment=' + str(c.environment))\n"
          )


          def refuse(reason):
              print("REFUSING: " + reason)
              sys.exit(10)


          client_id = os.environ.get("ACTIONS_EBAY_CLIENT_ID", "")
          client_secret = os.environ.get("ACTIONS_EBAY_CLIENT_SECRET", "")
          if not client_id or not client_secret:
              refuse("one or both Actions secrets are empty")
          for value in (client_id, client_secret):
              if "\n" in value or "\r" in value:
                  refuse("a credential contains a newline or carriage return")
              if not SAFE_VALUE.match(value):
                  refuse("a credential contains characters unsafe for .env and shell sourcing")
          if "-PRD-" not in client_id:
              refuse("the client id is not a production (-PRD-) credential")
          request_text = os.environ.get("VM_REQUEST_MESSAGE", "") + "\n" + os.environ.get("VM_REQUEST_ID", "")
          if client_id in request_text or client_secret in request_text or "-PRD-" in request_text or "-SBX-" in request_text:
              refuse("credential-like data is present in the request")

          if not os.path.isfile(PATH):
              refuse("backend/.env does not exist")
          st = os.stat(PATH)
          owner = pwd.getpwuid(st.st_uid).pw_name
          if owner != EXPECTED_OWNER:
              refuse("backend/.env is not owned by the runtime user")
          if st.st_mode & 0o004:
              refuse("backend/.env is world-readable")
          if os.geteuid() != st.st_uid:
              refuse("the workflow user is not the owner of backend/.env")

          with open(PATH, "rb") as handle:
              original = handle.read()


          def strip_ebay(data):
              return b"".join(line for line in data.splitlines(keepends=True) if not ASSIGN.match(line.rstrip(b"\r\n")))


          eol = b"\r\n" if b"\r\n" in original else b"\n"
          base = strip_ebay(original)
          if base and not base.endswith(b"\n"):
              base += eol
          new = base + b"EBAY_CLIENT_ID=" + client_id.encode() + eol + b"EBAY_CLIENT_SECRET=" + client_secret.encode() + eol

          backup_fd, backup_path = tempfile.mkstemp(prefix="evr-env-backup-", dir="/tmp")
          os.fchmod(backup_fd, 0o600)
          with os.fdopen(backup_fd, "wb") as handle:
              handle.write(original)


          def atomic_write(data):
              fd, tmp = tempfile.mkstemp(prefix=".env.tmp.", dir=os.path.dirname(PATH))
              try:
                  with os.fdopen(fd, "wb") as handle:
                      handle.write(data)
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.chmod(tmp, st.st_mode & 0o7777)
                  tmp_stat = os.stat(tmp)
                  if tmp_stat.st_uid != st.st_uid or tmp_stat.st_gid != st.st_gid:
                      os.chown(tmp, st.st_uid, st.st_gid)
                  os.replace(tmp, PATH)
              except BaseException:
                  try:
                      os.unlink(tmp)
                  except FileNotFoundError:
                      pass
                  raise


          def verify():
              failures = []
              with open(PATH, "rb") as handle:
                  after = handle.read()
              counts = {key: 0 for key in KEYS}
              empty = False
              for line in after.splitlines():
                  match = ASSIGN.match(line.rstrip(b"\r\n"))
                  if match:
                      counts[match.group(1).decode()] += 1
                      empty = empty or not match.group(2).strip()
              if sum(counts.values()) != 2 or any(count != 1 for count in counts.values()) or empty:
                  failures.append("ebay_assignment_count_or_empty_value")
              if strip_ebay(after) != base:
                  failures.append("non_ebay_content_changed")
              after_stat = os.stat(PATH)
              if (after_stat.st_mode & 0o7777) != (st.st_mode & 0o7777) or after_stat.st_uid != st.st_uid or after_stat.st_gid != st.st_gid:
                  failures.append("mode_or_owner_changed")
              return failures


          runtime = os.path.isfile(REPO + "/backend/pricing_pipeline/ebay_credentials.py") and os.path.isfile(REPO + "/.venv/bin/python")
          probe_lines = []
          restored = None
          try:
              try:
                  atomic_write(new)
                  failures = verify()
                  if not failures and runtime:
                      child_env = {k: v for k, v in os.environ.items() if not k.startswith("ACTIONS_EBAY")}
                      probe = subprocess.run([REPO + "/.venv/bin/python", "-c", PROBE], cwd=REPO, env=child_env, capture_output=True, text=True, timeout=120)
                      probe_lines = [l for l in probe.stdout.splitlines() if l.startswith(("credential_source=", "ebay_environment="))]
                      if probe.returncode != 0:
                          failures.append("canonical_credential_probe_failed")
              except Exception as exc:
                  failures = ["install_error_" + type(exc).__name__]
              if failures:
                  try:
                      atomic_write(original)
                      with open(PATH, "rb") as handle:
                          restored = handle.read() == original
                  except Exception:
                      restored = False
                  print("credential_install=FAIL failures=" + ",".join(failures))
                  print("original_restored=" + str(bool(restored)).lower())
                  sys.exit(1)
          finally:
              if restored is False:
                  print("backup_retained_at=" + backup_path)
              else:
                  try:
                      os.unlink(backup_path)
                  except FileNotFoundError:
                      pass

          print("backend_env_ebay_pair_complete=true")
          print("ebay_key_assignment_count=2")
          print("non_ebay_env_content_preserved=true")
          print("backend_env_mode=" + format(os.stat(PATH).st_mode & 0o7777, "o"))
          print("backend_env_owner=" + pwd.getpwuid(os.stat(PATH).st_uid).pw_name)
          if runtime:
              print("canonical_credential_probe=PASS")
              for line in probe_lines:
                  print(line)
          else:
              print("canonical_credential_probe=SKIPPED_RUNTIME_NOT_PRESENT")
          print("credential_install=PASS")
          PY
              ;;

            *)
              echo "Unexpected credential operation: $VM_OPERATION"
              exit 4
              ;;
          esac

      - name: Execute Supabase project restart
        if: ${{ env.VM_OPERATION == 'supabase-project-restart' }}
        shell: bash
        env:
          ACTIONS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ACTIONS_SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN Actions secret missing"; exit 5; }
          PROJECT_REF="zwxzxuuawalvwioadhmf"
          RESPONSE_FILE="/tmp/supabase-project-restart-response.json"

          echo "== request Supabase project restart =="
          CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/restart" \
            -H "Authorization: Bearer $ACTIONS_SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json")"
          echo "restart_http_status=$CODE"
          if [ "$CODE" != "200" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/supabase-project-restart-response.json")
          try:
              obj = json.loads(p.read_text(encoding="utf-8"))
          except Exception:
              obj = {}
          safe = {k: obj.get(k) for k in ("message","error","statusCode","code") if obj.get(k) is not None}
          print("restart_error=" + json.dumps(safe, sort_keys=True))
          PY
            exit 6
          fi
          rm -f "$RESPONSE_FILE"

          echo "== wait for database connectivity =="
          ACTIONS_DATABASE_URL="$ACTIONS_DATABASE_URL" "/home/ubuntu/repos/EVRCalculator/.venv/bin/python" - <<'PY'
          import os
          import time
          import psycopg

          dsn = os.environ["ACTIONS_DATABASE_URL"]
          last = None
          for attempt in range(1, 31):
              try:
                  with psycopg.connect(
                      dsn,
                      connect_timeout=5,
                      application_name="supabase_restart_probe",
                      prepare_threshold=None,
                  ) as conn:
                      with conn.cursor() as cur:
                          cur.execute("select current_database(), current_setting('server_version')")
                          db, version = cur.fetchone()
                          print(f"database_reachable=true attempt={attempt} db={db} version={version}", flush=True)
                          raise SystemExit(0)
              except Exception as exc:
                  last = (type(exc).__name__, getattr(exc, "sqlstate", None))
                  print(f"database_reachable=false attempt={attempt} error={last[0]} sqlstate={last[1]}", flush=True)
                  time.sleep(5)
          raise SystemExit(f"database did not recover after restart; last_error={last}")
          PY
          echo "SUPABASE_PROJECT_RESTART=PASS"

      - name: Execute approved operation
        if: ${{ env.VM_OPERATION != 'pricing-credential-status' && env.VM_OPERATION != 'pricing-install-credentials' && env.VM_OPERATION != 'pkmnprices-credential-status' && env.VM_OPERATION != 'pkmnprices-install-credential' && env.VM_OPERATION != 'pkmnprices-probe' && env.VM_OPERATION != 'supabase-project-restart' }}
        shell: bash
