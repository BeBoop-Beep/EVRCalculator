name: Collector V8 ANCHOR25 Shadow

on:
  push:
    branches:
      - research/collector-v8-anchor25-shadow-20260929
    paths:
      - "backend/scripts/research_collector_v8_anchor25_shadow.py"
      - "backend/tests/unit/scripts/test_research_collector_v8_anchor25_shadow.py"
      - "docs/research/collector_appeal/v8_anchor25_shadow/frozen_overall_v12_authority.json"
      - ".github/workflows/collector-v8-anchor25-shadow.yml"

permissions:
  contents: write

concurrency:
  group: collector-v8-anchor25-shadow
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/collector-v8-anchor25-shadow-20260929
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest==8.3.5

      - name: Run shadow contract tests
        run: |
          python -m pytest -q             backend/tests/unit/scripts/test_research_collector_cross_domain_calibration_v1.py             backend/tests/unit/scripts/test_research_collector_cross_domain_temporal_v1.py             backend/tests/unit/scripts/test_research_collector_v8_anchor25_shadow.py

      - name: Run Collector V8 shadow
        run: python backend/scripts/research_collector_v8_anchor25_shadow.py

      - name: Verify research-only result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("docs/research/collector_appeal/v8_anchor25_shadow")
          decision=json.loads((root/"decision.json").read_text())
          overall=json.loads((root/"overall_shadow.json").read_text())
          sets=json.loads((root/"set_shadow.json").read_text())
          assert decision["productionMutations"] == "NONE"
          assert decision["promotionPerformed"] is False
          assert decision["gates"]["v7SetReplay"] is True
          assert decision["gates"]["v12OverallReplay"] is True
          assert len(overall["rows"]) == 276
          assert sets["replay"]["passed"] is True
          print(json.dumps(decision, indent=2))
          PY

      - name: Commit shadow artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/research/collector_appeal/v8_anchor25_shadow/FINAL_REPORT.md             docs/research/collector_appeal/v8_anchor25_shadow/set_shadow.json             docs/research/collector_appeal/v8_anchor25_shadow/overall_shadow.json             docs/research/collector_appeal/v8_anchor25_shadow/decision.json
          if git diff --cached --quiet; then
            echo "No shadow artifact changes to commit."
          else
            git commit -m "research: record Collector V8 ANCHOR25 shadow"
            git push origin HEAD:research/collector-v8-anchor25-shadow-20260929
          fi
