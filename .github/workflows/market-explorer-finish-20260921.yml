name: Market Explorer Finish 2026-09-21

on:
  push:
    branches: [ops/market-explorer-finish-20260921]
    paths:
      - '.github/workflows/market-explorer-finish-20260921.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            pytest supabase==2.28.3 python-dotenv==1.2.2
      - name: Validate rebased Explorer runtime
        run: |
          python -m pytest -q \
            backend/tests/unit/db/services/test_market_explorer_query_planner.py \
            backend/tests/unit/db/services/test_pokemon_market_explorer_query_service.py \
            backend/tests/unit/db/services/test_post_scrape_publication_trigger.py \
            backend/tests/unit/scripts/test_publish_post_scrape_if_needed.py \
            backend/tests/unit/scripts/test_run_market_explorer_maintained_cache_prewarm.py \
            backend/tests/unit/scripts/test_rebuild_snapshots_after_scrape_shell_contract.py
          python -m py_compile \
            backend/db/services/market_explorer_query_planner.py \
            backend/db/services/pokemon_market_explorer_query_service.py \
            backend/db/services/post_scrape_publication_trigger.py \
            backend/scripts/publish_post_scrape_if_needed.py \
            backend/scripts/run_market_explorer_maintained_cache_prewarm.py
          git diff --check origin/main...HEAD

  inspect:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Inspect production VM and public market state
        shell: bash
        run: |
          set +e
          set -u
          LIVE=/home/ubuntu/repos/EVRCalculator
          PUB_LOCK=/tmp/pokemon-post-scrape-publication.lock
          WATCH_LOCK=/tmp/post-scrape-publication-watchdog.lock
          cd "$LIVE" || exit 1

          echo "=== git ==="
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          git fetch origin main --quiet
          echo "origin_main=$(git rev-parse origin/main)"
          echo "tracked_status_begin"
          git status --porcelain --untracked-files=no
          echo "tracked_status_end"

          echo "=== locks ==="
          if /usr/bin/flock -n "$PUB_LOCK" -c true; then echo "publication_lock=free"; else echo "publication_lock=held"; fi
          if /usr/bin/flock -n "$WATCH_LOCK" -c true; then echo "watchdog_lock=free"; else echo "watchdog_lock=held"; fi

          echo "=== relevant processes ==="
          pgrep -af 'rebuild_snapshots_after_scrape|refresh_pokemon_market_snapshots|publish_post_scrape|post_scrape_publication|market_explorer|run_market_explorer|recover_price_projection' || true

          echo "=== public set-value market ==="
          BODY="$(mktemp)"
          CODE="$(curl --silent --show-error --max-time 45 -o "$BODY" -w '%{http_code}' https://evrcalculator.onrender.com/explore/set-value-market)"
          echo "http_code=$CODE"
          if [ -s "$BODY" ]; then
            "$LIVE/.venv/bin/python" -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); m=p.get("meta") or {}; s=m.get("snapshot") or {}; print("public_market_date="+str(p.get("marketDate") or m.get("marketDate") or s.get("marketDate") or p.get("market_date") or "")); print("public_market_set_count="+str(len(p.get("sets") or []))); print("public_keys="+",".join(sorted(p.keys())))' "$BODY" || { echo "public_parse_failed"; head -c 2000 "$BODY"; echo; }
          fi
          rm -f "$BODY"

          echo "=== publication log tail ==="
          tail -n 80 publication.log 2>/dev/null || true
