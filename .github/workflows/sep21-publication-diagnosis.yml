name: Validate publication supersession recovery

on:
  push:
    branches:
      - 'ops/sep21-publication-diagnosis-20260921'
    paths:
      - '.github/workflows/sep21-publication-diagnosis.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - name: Checkout supersession branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/publication-supersession-recovery-20260921
          persist-credentials: false
      - name: Compile and run watchdog tests
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          "$PY" -m py_compile backend/alerts/post_scrape_publication_watchdog.py
          "$PY" -m pytest -q backend/tests/unit/alerts/test_post_scrape_publication_watchdog.py
          grep -F -- '--recover-stalled --recover-superseded' infra/oracle/tcgplayer-scraper-pokemon.crontab >/dev/null
          echo 'supersession_cron_flag=PASS'
