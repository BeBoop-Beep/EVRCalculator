name: Validate staged Price Storage worker

on:
  push:
    branches:
      - 'ops/sep21-publication-diagnosis-20260921'
    paths:
      - '.github/workflows/sep21-publication-diagnosis.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - name: Checkout staged worker branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/price-projection-transient-retry-20260921
          persist-credentials: false
      - name: Run focused projection suite
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          "$PY" -m py_compile backend/db/services/price_storage_v2_projection_gate.py backend/tests/unit/db/services/test_price_storage_v2_projection_gate.py
          "$PY" -m pytest -q backend/tests/unit/db/services/test_price_storage_v2_projection_gate.py
