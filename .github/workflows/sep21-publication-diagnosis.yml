name: Inspect active Sep 20 publisher

on:
  push:
    branches:
      - 'ops/sep21-publication-diagnosis-20260921'
    paths:
      - '.github/workflows/sep21-publication-diagnosis.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect current lock owner progress
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          date
          echo '=== PROCESS ==='
          ps -p 184482,184500 -o pid,ppid,lstart,etime,time,%cpu,%mem,state,wchan:32,args || true
          echo
          echo '=== CURRENT RUN SECTION ==='
          START="$(grep -n '\[post-scrape-publication\].*started_at=' publication.log 2>/dev/null | tail -1 | cut -d: -f1 || true)"
          echo "start_line=${START:-missing}"
          if [ -n "${START:-}" ]; then
            tail -n +"$START" publication.log > /tmp/current-pub.log
            grep '\[post-scrape-publication\].*resolved market_date=' /tmp/current-pub.log | head -1 || true
            echo "plan_last=$(grep '\[refresh-plan\] checked' /tmp/current-pub.log | tail -1 || true)"
            echo "plan_complete=$(grep -c '\[refresh-plan\] complete' /tmp/current-pub.log || true)"
            echo "cards_upserts=$(grep -c 'upserted pokemon_set_cards_snapshot_latest' /tmp/current-pub.log || true)"
            echo "dashboard_upserts=$(grep -c 'upserted pokemon_set_market_dashboard_snapshot_latest' /tmp/current-pub.log || true)"
            echo "setpage_upserts=$(grep -c 'upserted pokemon_set_page_snapshot_latest' /tmp/current-pub.log || true)"
            echo "refresh_exit=$(grep 'refresh exit_status=' /tmp/current-pub.log | tail -1 || true)"
            echo "audit_exit=$(grep 'audit exit_status=' /tmp/current-pub.log | tail -1 || true)"
            echo "final_exit=$(grep 'final exit_status=' /tmp/current-pub.log | tail -1 || true)"
            echo '=== RECENT PHASE/ERROR LINES ==='
            grep -E '\[refresh-plan\]|\[refresh-phase\]|failed coordinated|ERROR|FAILED|Traceback|refresh exit_status|audit exit_status|post-scrape publication COMPLETE|final exit_status' /tmp/current-pub.log | tail -160 || true
            echo '=== TAIL ==='
            tail -100 /tmp/current-pub.log || true
          fi
