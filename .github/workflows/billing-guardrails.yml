name: Billing Guardrails

on:
  pull_request:
    paths:
      - "backend/db/services/billing_service.py"
      - "backend/domain/billing/**"
      - "backend/tests/unit/db/services/test_billing_service*.py"
      - "backend/tests/unit/domain/billing/**"
      - "frontend/components/account/**"
      - "frontend/components/pricing/**"
      - "frontend/lib/billing/**"
      - ".github/workflows/billing-guardrails.yml"
  push:
    paths:
      - "backend/db/services/billing_service.py"
      - "backend/domain/billing/**"
      - "backend/tests/unit/db/services/test_billing_service*.py"
      - "backend/tests/unit/domain/billing/**"
      - "frontend/components/account/**"
      - "frontend/components/pricing/**"
      - "frontend/lib/billing/**"
      - ".github/workflows/billing-guardrails.yml"

jobs:
  backend-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused billing test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest stripe==15.4.0 supabase==2.28.3 python-dotenv==1.2.2

      - name: Run billing domain and service tests
        run: |
          python -m pytest -q \
            backend/tests/unit/domain/billing/test_plan_change.py \
            backend/tests/unit/db/services/test_billing_service.py \
            backend/tests/unit/db/services/test_billing_service_plan_change.py \
            backend/tests/unit/db/services/test_billing_service_plan_change_matrix.py

  frontend-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run focused billing presentation and pricing tests
        run: |
          npx tsx --test \
            components/account/MembershipBillingSection.contract.test.mjs \
            components/pricing/PricingPageClient.planChange.test.mjs \
            lib/billing/billingPresentation.planChange.test.mjs \
            lib/billing/billingClient.planChange.test.mjs
