name: Fair Value Sold Signal Pilot

on:
  push:
    branches:
      - research/index-fair-value-sold-signal-pilot-20260929
    paths:
      - "backend/scripts/run_index_fair_value_sold_signal_pilot.py"
      - ".github/workflows/index-fair-value-sold-signal-pilot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-fair-value-sold-signal-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Run isolated sold-signal research pilot
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          PY="$REPO/.venv/bin/python"
          WT=/tmp/EVRCalculator-index-fair-value-sold-pilot
          REF=origin/research/index-fair-value-sold-signal-pilot-20260929
          HOLD=/home/ubuntu/state/db-safety/hold.json

          [ ! -e "$HOLD" ] && [ ! -L "$HOLD" ] || {
            echo "database safety hold active; refusing research pilot"
            exit 20
          }

          exec 9>/tmp/pkmnprices-api.lock
          flock -w 300 9 || { echo "PkmnPrices API lock remained held"; exit 21; }

          cd "$REPO"
          git fetch origin research/index-fair-value-sold-signal-pilot-20260929 --quiet
          rm -rf "$WT"
          git worktree add --detach "$WT" "$REF"
          trap 'git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true; rm -rf "$WT"' EXIT

          set -a
          . "$REPO/backend/.env"
          set +a
          test -n "${PKMNPRICES_API_KEY:-}" || {
            echo "PKMNPRICES_API_KEY missing on VM"
            exit 22
          }

          export PYTHONPATH="$WT"
          cd "$WT"

          echo "== no-credit code gates =="
          "$PY" -m py_compile             backend/scripts/run_index_fair_value_sold_signal_pilot.py             backend/pricing_pipeline/pkmnprices_client.py             backend/pricing_pipeline/pkmnprices_sold.py
          "$PY" -m pytest -q backend/tests/unit/pricing_pipeline/test_pkmnprices.py

          test -s backend/artifacts/index_fair_value/index_fair_value_f1_dataset.json
          test -s backend/artifacts/index_fair_value/index_fair_value_f2_oof_predictions.csv
          test -s backend/artifacts/index_fair_value/index_fair_value_f2r_target_blind_predictions.csv

          echo "== bounded live pilot =="
          "$PY" backend/scripts/run_index_fair_value_sold_signal_pilot.py             --per-band 30             --max-sold-per-card 20             --credit-cap 4500             --cutoff-date 2026-09-28

          echo "== research receipt =="
          cat backend/artifacts/index_fair_value/sold_signal_pilot_v1/pilot_report.json

          echo "== persist aggregate research artifact =="
          git config user.name "inDex Fair Value Research"
          git config user.email "actions@users.noreply.github.com"
          git add             backend/artifacts/index_fair_value/sold_signal_pilot_v1/pilot_report.json             backend/artifacts/index_fair_value/sold_signal_pilot_v1/sample_features.csv
          git commit -m "research(fair-value): record sold-signal pilot results" || true
          git push origin HEAD:research/index-fair-value-sold-signal-pilot-20260929

          echo "INDEX_FAIR_VALUE_SOLD_SIGNAL_PILOT=PASS"
