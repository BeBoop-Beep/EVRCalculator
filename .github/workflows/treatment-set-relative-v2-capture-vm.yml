name: Treatment Set Relative V2 Capture VM

on:
  push:
    branches:
      - vm-ops-control
    paths:
      - '.vm-ops/treatment-set-relative-v2-capture.json'

permissions:
  contents: read

concurrency:
  group: treatment-set-relative-v2-capture-vm
  cancel-in-progress: false

jobs:
  capture:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 120
    steps:
      - name: Checkout pinned execution branch
        uses: actions/checkout@v4
        with:
          ref: research/treatment-set-relative-v2-execution-20261002
          fetch-depth: 1
      - name: Verify pinned research SHA
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="0a980914817c71d963cecfedbdd3690143caa32b"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "research_sha=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Capture frozen Set-relative V2 expansion
        shell: bash
        run: |
          set -euo pipefail
          PROD_REPO="/home/ubuntu/repos/EVRCalculator"
          PY="$PROD_REPO/.venv/bin/python"
          test -x "$PY"
          test -f "$PROD_REPO/backend/.env"
          set -a
          . "$PROD_REPO/backend/.env"
          set +a
          test -n "${PKMNPRICES_API_KEY:-}"
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          mkdir -p backend/artifacts/treatment_set_relative_v2
          "$PY" backend/scripts/research_treatment_set_relative_expansion_panel_v2.py \
            --market-date 2026-09-29 \
            --period 180d \
            --credit-cap 35000 \
            --capture \
            --output backend/artifacts/treatment_set_relative_v2/capture.json
      - name: Upload frozen V2 capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treatment-set-relative-v2-capture
          path: backend/artifacts/treatment_set_relative_v2/capture.json
          if-no-files-found: warn
