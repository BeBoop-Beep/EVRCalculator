name: Vintage Market Main Hotfix Guardrails

on:
  push:
    paths:
      - 'backend/db/services/pokemon_explore_set_value_service.py'
      - 'backend/db/services/pokemon_set_market_service.py'
      - 'backend/scripts/build_pokemon_explore_set_value_snapshot.py'
      - 'backend/scripts/audit_pokemon_market_publication.py'
      - 'backend/db/migrations/20260925161052_explicit_vintage_market_scopes.sql'
      - 'supabase/migrations/20260925161052_explicit_vintage_market_scopes.sql'
      - 'backend/tests/unit/db/services/test_pokemon_explore_set_value_service.py'
      - 'backend/tests/unit/scripts/test_audit_pokemon_market_publication.py'
      - 'backend/tests/unit/db/services/test_pokemon_set_market_scope_sanitizer.py'
      - 'backend/tests/unit/db/test_explicit_vintage_market_scopes_migration.py'
      - 'backend/tests/unit/scripts/test_market_vintage_scope_override.py'
      - '.github/workflows/market-vintage-main-guardrails.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/db/services/pokemon_explore_set_value_service.py'
      - 'backend/db/services/pokemon_set_market_service.py'
      - 'backend/scripts/build_pokemon_explore_set_value_snapshot.py'
      - 'backend/scripts/audit_pokemon_market_publication.py'
      - 'backend/tests/unit/db/services/test_pokemon_explore_set_value_service.py'
      - 'backend/tests/unit/scripts/test_audit_pokemon_market_publication.py'
      - 'backend/tests/unit/db/services/test_pokemon_set_market_scope_sanitizer.py'
      - 'backend/tests/unit/db/test_explicit_vintage_market_scopes_migration.py'
      - 'backend/tests/unit/scripts/test_market_vintage_scope_override.py'
      - '.github/workflows/market-vintage-main-guardrails.yml'

permissions:
  contents: read

jobs:
  vintage-market-main-hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            pytest supabase==2.28.3 python-dotenv==1.2.2 pandas
      - name: Compile scoped runtime
        run: |
          python -m py_compile \
            backend/db/services/pokemon_explore_set_value_service.py \
            backend/db/services/pokemon_set_market_service.py \
            backend/scripts/build_pokemon_explore_set_value_snapshot.py \
            backend/scripts/audit_pokemon_market_publication.py
      - name: Run vintage scope regression suite
        run: |
          python -m pytest -q \
            backend/tests/unit/db/services/test_pokemon_explore_set_value_service.py \
            backend/tests/unit/scripts/test_audit_pokemon_market_publication.py \
            backend/tests/unit/db/services/test_pokemon_set_market_scope_sanitizer.py \
            backend/tests/unit/db/test_explicit_vintage_market_scopes_migration.py \
            backend/tests/unit/scripts/test_market_vintage_scope_override.py
