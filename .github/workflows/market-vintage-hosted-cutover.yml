name: Vintage Market Hosted Cutover

on:
  push:
    branches:
      - ops/market-vintage-hosted-cutover-20260925
    paths:
      - ".github/workflows/market-vintage-hosted-cutover.yml"

permissions:
  contents: read

concurrency:
  group: market-vintage-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ACTIONS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PUBLICATION_BUILD_SHA: ${{ github.sha }}
      CANDIDATE_PATH: /tmp/market-vintage-candidate.json
      BACKUP_PATH: /tmp/market-vintage-precutover.json

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 46f11e21dfb46ed4bc51a806467aff9952d52f65

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install focused runtime
        run: |
          python -m pip install --disable-pip-version-check -q \
            supabase==2.28.3 python-dotenv==1.2.2 pandas==2.2.3 numpy==2.4.3 \
            requests==2.32.5 "psycopg[binary]==3.3.6"

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$ACTIONS_DATABASE_URL"
          echo "required_secrets_present=true"

      - name: Build and validate scoped snapshot candidate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import json
          import os
          from pathlib import Path

          from backend.db.clients.supabase_client import create_service_role_client
          from backend.scripts.build_pokemon_explore_set_value_snapshot import build

          client = create_service_role_client()
          quality = list(
              client.table("pokemon_market_date_quality")
              .select("market_date,status,contract_version,cohort_set_count,qualifying_set_count")
              .eq("tcg", "pokemon")
              .in_("status", ["READY", "LEGACY_VERIFIED"])
              .order("market_date", desc=True)
              .limit(1)
              .execute().data or []
          )
          if not quality:
              raise RuntimeError("no approved Pokemon Market Date exists")

          day = str(quality[0]["market_date"])[:10]
          if int(quality[0].get("cohort_set_count") or 0) != 156:
              raise RuntimeError(f"approved root cohort is not 156: {quality[0]}")
          if int(quality[0].get("qualifying_set_count") or 0) != 156:
              raise RuntimeError(f"approved qualifying cohort is not 156: {quality[0]}")

          row = build(client=client, market_date=day, commit=False)
          payload = row.get("payload_json") or {}
          markets = payload.get("sets") or []
          roots = {str(x.get("setId") or "") for x in markets if x.get("setId")}
          keys = [str(x.get("marketKey") or "") for x in markets]
          scoped = [x for x in markets if str(x.get("marketScope") or "standard") != "standard"]
          scoped_roots = {str(x.get("setId")) for x in scoped}
          generic_vintage = [
              x for x in markets
              if str(x.get("setId")) in scoped_roots
              and str(x.get("marketScope") or "standard") == "standard"
          ]
          unavailable = [x for x in scoped if x.get("currentSetValue") is None]
          bad_keys = []
          for x in markets:
              set_id = str(x.get("setId") or "")
              scope = str(x.get("marketScope") or "standard")
              expected = f"set:{set_id}" if scope == "standard" else f"set:{set_id}:{scope}"
              if str(x.get("marketKey") or "") != expected:
                  bad_keys.append((x.get("marketKey"), expected))

          checks = {
              "approvedMarketDate": day,
              "setCount": row.get("set_count"),
              "marketCount": row.get("market_count"),
              "payloadRows": len(markets),
              "rootSets": len(roots),
              "uniqueMarketKeys": len(set(keys)),
              "scopedMarkets": len(scoped),
              "genericVintageMarkets": len(generic_vintage),
              "unavailableScopedMarkets": len(unavailable),
              "badMarketKeys": len(bad_keys),
          }
          print(json.dumps(checks, sort_keys=True), flush=True)
          expected = {
              "setCount": 156,
              "marketCount": 167,
              "payloadRows": 167,
              "rootSets": 156,
              "uniqueMarketKeys": 167,
              "scopedMarkets": 21,
              "genericVintageMarkets": 0,
              "unavailableScopedMarkets": 6,
              "badMarketKeys": 0,
          }
          for key, value in expected.items():
              if checks[key] != value:
                  raise RuntimeError(
                      f"candidate invariant failed: {key}={checks[key]!r} expected={value!r}"
                  )

          persisted = {k: v for k, v in row.items() if not str(k).startswith("_")}
          Path(os.environ["CANDIDATE_PATH"]).write_text(
              json.dumps({"approvedMarketDate": day, "row": persisted}, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Atomically publish scoped snapshot and Explorer generation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import psycopg
          from psycopg.conninfo import conninfo_to_dict, make_conninfo

          candidate = json.loads(Path(os.environ["CANDIDATE_PATH"]).read_text(encoding="utf-8"))
          row = candidate["row"]
          day = candidate["approvedMarketDate"]
          dsn = os.environ["ACTIONS_DATABASE_URL"]

          parsed = conninfo_to_dict(dsn)
          user = parsed.get("user") or ""
          project_ref = user.split(".")[-1] if "." in user else "zwxzxuuawalvwioadhmf"
          direct_user = user.split(".")[0] if "." in user else user
          base_kwargs = {
              "dbname": parsed.get("dbname") or "postgres",
              "password": parsed.get("password") or "",
              "sslmode": parsed.get("sslmode") or "require",
              "connect_timeout": 15,
              "application_name": "market_vintage_hosted_cutover",
          }

          routes = [("configured_session_pooler", dsn)]
          pooler_host = parsed.get("host")
          if pooler_host:
              routes.append((
                  "transaction_pooler_6543",
                  make_conninfo(host=pooler_host, port=6543, user=user, **base_kwargs),
              ))
          routes.append((
              "direct_project_5432",
              make_conninfo(
                  host=f"db.{project_ref}.supabase.co",
                  port=5432,
                  user=direct_user,
                  **base_kwargs,
              ),
          ))

          conn = None
          failures = []
          for label, candidate_dsn in routes:
              try:
                  conn = psycopg.connect(candidate_dsn, prepare_threshold=None)
                  print(f"database_route={label}", flush=True)
                  break
              except Exception as exc:
                  failures.append((label, type(exc).__name__, getattr(exc, "sqlstate", None)))
                  print(json.dumps({
                      "databaseRouteFailed": label,
                      "errorType": type(exc).__name__,
                      "sqlstate": getattr(exc, "sqlstate", None),
                  }, sort_keys=True), flush=True)
          if conn is None:
              raise RuntimeError(f"all database routes failed: {failures}")

          backup = {}
          with conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout = '900s'")
                  cur.execute("set lock_timeout = '20s'")
                  cur.execute("select pg_advisory_xact_lock(hashtext('market-vintage-cutover'))")

                  cur.execute(
                      "select "
                      "exists(select 1 from supabase_migrations.schema_migrations "
                      "where name='explicit_vintage_market_scopes'), "
                      "exists(select 1 from information_schema.columns where table_schema='public' "
                      "and table_name='pokemon_explore_set_value_snapshot_latest' and column_name='market_count'), "
                      "to_regclass('public.pokemon_market_set_scope_contract_v1') is not null, "
                      "to_regprocedure('public.get_pokemon_market_root_set_card_prices_as_of_v1(uuid,text,date)') is not null"
                  )
                  migration_applied, market_count_exists, scope_contract_exists, scoped_asof_rpc_exists = map(bool, cur.fetchone())
                  if not all((migration_applied, market_count_exists, scope_contract_exists, scoped_asof_rpc_exists)):
                      raise RuntimeError(
                          "vintage scope DB migration is not fully applied: "
                          f"history={migration_applied} market_count={market_count_exists} "
                          f"scope_contract={scope_contract_exists} scoped_asof_rpc={scoped_asof_rpc_exists}"
                      )

                  cur.execute(
                      "select to_jsonb(s) from public.pokemon_explore_set_value_snapshot_latest s "
                      "where s.tcg='pokemon' and s.scope='market' limit 1"
                  )
                  previous_snapshot_row = cur.fetchone()
                  previous_snapshot = previous_snapshot_row[0] if previous_snapshot_row else None

                  cur.execute(
                      "select generation_id from public.pokemon_market_explorer_prepared_serving_v1 where singleton"
                  )
                  previous_generation = cur.fetchone()[0]

                  cur.execute(
                      "select to_jsonb(a) from public.pokemon_market_set_scope_activation_v1 a "
                      "where a.singleton=true limit 1"
                  )
                  previous_activation_row = cur.fetchone()
                  previous_activation = previous_activation_row[0] if previous_activation_row else None

                  backup = {
                      "capturedAt": datetime.now(timezone.utc).isoformat(),
                      "approvedMarketDate": day,
                      "previousGenerationId": str(previous_generation),
                      "previousSnapshot": previous_snapshot,
                      "previousActivation": previous_activation,
                  }
                  Path(os.environ["BACKUP_PATH"]).write_text(
                      json.dumps(backup, default=str, separators=(",", ":")),
                      encoding="utf-8",
                  )

                  cur.execute(
                      "insert into public.pokemon_explore_set_value_snapshot_latest "
                      "(tcg,scope,payload_json,market_date,set_count,market_count,"
                      "source_generation_fingerprint,payload_size_bytes) "
                      "values (%s,%s,%s::jsonb,%s::date,%s,%s,%s,%s) "
                      "on conflict (tcg,scope) do update set "
                      "payload_json=excluded.payload_json,market_date=excluded.market_date,"
                      "set_count=excluded.set_count,market_count=excluded.market_count,"
                      "source_generation_fingerprint=excluded.source_generation_fingerprint,"
                      "payload_size_bytes=excluded.payload_size_bytes",
                      (
                          row["tcg"], row["scope"],
                          json.dumps(row["payload_json"], separators=(",", ":")),
                          row["market_date"], row["set_count"], row["market_count"],
                          row["source_generation_fingerprint"], row["payload_size_bytes"],
                      ),
                  )

                  cur.execute(
                      "select public.run_market_explorer_guarded_publisher_v1(%s::date)",
                      (day,),
                  )
                  publisher_result = cur.fetchone()[0]
                  print(
                      "publisher_result=" +
                      json.dumps(publisher_result, default=str, sort_keys=True),
                      flush=True,
                  )

                  cur.execute(
                      "select generation_id from public.pokemon_market_explorer_prepared_serving_v1 where singleton"
                  )
                  serving_generation = cur.fetchone()[0]

                  cur.execute(
                      "select count(*)::int,"
                      "count(*) filter(where market_type='set')::int,"
                      "count(*) filter(where market_type<>'set')::int,"
                      "count(distinct market_key)::int,min(comparison_as_of),max(comparison_as_of),"
                      "count(*) filter(where market_type='era')::int,"
                      "count(*) filter(where market_type='curated')::int,"
                      "count(*) filter(where market_type='prepared_rarity')::int,"
                      "count(*) filter(where market_type='prepared_format')::int "
                      "from public.pokemon_market_explorer_prepared_serving_directory_v1"
                  )
                  counts = cur.fetchone()
                  if tuple(counts[:4]) != (204, 167, 37, 204):
                      raise RuntimeError(
                          f"serving directory count mismatch: {counts[:4]} expected={(204,167,37,204)}"
                      )
                  if str(counts[4]) != day or str(counts[5]) != day:
                      raise RuntimeError(
                          f"comparison watermark mismatch: min={counts[4]} max={counts[5]} approved={day}"
                      )
                  if tuple(counts[6:10]) != (17, 6, 9, 5):
                      raise RuntimeError(
                          f"non-Set market regression: eras/curated/rarity/sealed={counts[6:10]}"
                      )

                  cur.execute(
                      "select "
                      "count(*) filter(where d.market_type='set' and coalesce(d.metadata->>'marketScope','standard')<>'standard')::int,"
                      "count(*) filter(where d.market_type='set' and coalesce(d.metadata->>'marketScope','standard')<>'standard' and d.current_value is null)::int,"
                      "count(*) filter(where d.market_type='set' and r.set_id is not null and d.market_key='set:'||d.set_id::text)::int "
                      "from public.pokemon_market_explorer_prepared_serving_directory_v1 d "
                      "left join public.pokemon_edition_split_root_sets_v2 r on r.set_id=d.set_id"
                  )
                  scoped_counts = cur.fetchone()
                  if tuple(scoped_counts) != (21, 6, 0):
                      raise RuntimeError(f"scoped directory invariant failed: {scoped_counts}")

                  cur.execute(
                      "select count(*)::int from public.pokemon_market_explorer_prepared_serving_history_v1 h "
                      "join public.pokemon_market_explorer_prepared_serving_directory_v1 d "
                      "on d.generation_id=h.generation_id and d.market_key=h.market_key "
                      "join public.pokemon_market_scoped_history_market_certification_v1 c "
                      "on c.set_id=d.set_id and c.market_scope=d.metadata->>'marketScope' "
                      "where c.history_publishable=false"
                  )
                  if cur.fetchone()[0] != 0:
                      raise RuntimeError("withheld scoped history appeared in serving generation")

                  cur.execute(
                      "select count(*)::int from public.pokemon_market_explorer_prepared_constituents_v1 c "
                      "join public.pokemon_market_explorer_prepared_serving_directory_v1 d "
                      "on d.generation_id=c.generation_id and d.market_key=c.market_key "
                      "where d.market_type='set' and coalesce(d.metadata->>'marketScope','standard')<>'standard' "
                      "and (c.price_as_of is distinct from d.source_as_of or "
                      "case d.metadata->>'marketScope' "
                      "when 'first_edition' then c.item->>'edition'<>'1st-edition' "
                      "when 'unlimited' then c.item->>'edition'<>'unlimited' "
                      "when 'shadowless' then c.item->>'edition'<>'shadowless' "
                      "else true end)"
                  )
                  if cur.fetchone()[0] != 0:
                      raise RuntimeError("scoped constituent edition/as-of mismatch")

                  cur.execute(
                      "select s.set_count,s.market_count,jsonb_array_length(s.payload_json->'sets'),"
                      "count(distinct (e->>'setId')::uuid),count(distinct e->>'marketKey') "
                      "from public.pokemon_explore_set_value_snapshot_latest s "
                      "cross join lateral jsonb_array_elements(s.payload_json->'sets') e "
                      "where s.tcg='pokemon' and s.scope='market' "
                      "group by s.set_count,s.market_count,s.payload_json"
                  )
                  snap = cur.fetchone()
                  if tuple(snap) != (156, 167, 167, 156, 167):
                      raise RuntimeError(f"published snapshot count contract failed: {snap}")

                  cur.execute(
                      "select active,contract_version,activated_market_date,"
                      "activated_root_set_count,activated_market_count,activated_at "
                      "from public.pokemon_market_set_scope_activation_v1 where singleton=true"
                  )
                  activation = cur.fetchone()
                  if not activation or activation[0] is not True:
                      raise RuntimeError(f"scope activation latch did not activate: {activation}")
                  if (
                      activation[1] != "pokemon-set-market-scope-v1"
                      or str(activation[2]) != day
                      or activation[3] != 156
                      or activation[4] != 167
                  ):
                      raise RuntimeError(f"scope activation contract mismatch: {activation}")

                  cur.execute(
                      "select to_regprocedure('public.get_pokemon_market_explorer_prepared_constituents_v3(text,uuid,integer,integer)') is not null"
                  )
                  if not cur.fetchone()[0]:
                      raise RuntimeError("prepared constituent v3 serving function is missing")

                  print(json.dumps({
                      "status": "validated_before_commit",
                      "approvedMarketDate": day,
                      "previousGenerationId": str(previous_generation),
                      "servingGenerationId": str(serving_generation),
                      "directoryCounts": {
                          "total": counts[0], "sets": counts[1], "nonSets": counts[2],
                          "eras": counts[6], "curated": counts[7],
                          "rarities": counts[8], "sealed": counts[9],
                      },
                      "snapshotCounts": {
                          "setCount": snap[0], "marketCount": snap[1],
                          "payloadRows": snap[2], "rootSets": snap[3],
                          "uniqueMarketKeys": snap[4],
                      },
                      "scopeActivation": {
                          "contractVersion": activation[1],
                          "marketDate": str(activation[2]),
                          "rootSetCount": activation[3],
                          "marketCount": activation[4],
                          "activatedAt": str(activation[5]),
                      },
                  }, sort_keys=True), flush=True)

          # Fresh read after transaction commit.
          with conn.cursor() as cur:
              cur.execute(
                  "select market_date,set_count,market_count from public.pokemon_explore_set_value_snapshot_latest "
                  "where tcg='pokemon' and scope='market' limit 1"
              )
              committed_snapshot = cur.fetchone()
              cur.execute(
                  "select generation_id from public.pokemon_market_explorer_prepared_serving_v1 where singleton"
              )
              committed_generation = cur.fetchone()[0]
              print(json.dumps({
                  "status": "committed",
                  "snapshot": [str(committed_snapshot[0]), committed_snapshot[1], committed_snapshot[2]],
                  "servingGenerationId": str(committed_generation),
              }, sort_keys=True), flush=True)

          print("MARKET_VINTAGE_HOSTED_CUTOVER=PASS", flush=True)
          PY

      - name: Upload rollback state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-vintage-precutover
          path: /tmp/market-vintage-precutover.json
          if-no-files-found: warn
          retention-days: 14
