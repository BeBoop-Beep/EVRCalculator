name: VM Stale Tmp Cleanup

on:
  push:
    branches:
      - vm-ops-control
    paths:
      - ".vm-ops/tmp-cleanup-request.json"

permissions:
  contents: read
  issues: write

concurrency:
  group: index-production-vm-ops-v2
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 30
    env:
      REQUEST_MESSAGE: ${{ github.event.head_commit.message }}
      RECEIPT_ISSUE: "530"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate fixed cleanup request
        shell: bash
        run: |
          set -euo pipefail
          [ "$REQUEST_MESSAGE" = "vm-cleanup: stale tmp workspaces" ] || {
            echo "REFUSING unexpected request: $REQUEST_MESSAGE"
            exit 2
          }

      - name: Delete only idle stale EVR tmp workspaces
        shell: bash
        run: |
          set -euo pipefail
          command -v lsof >/dev/null || { echo "REFUSING lsof missing"; exit 10; }
          BEFORE_AVAIL=$(df -B1 --output=avail / | tail -1 | tr -d ' ')
          BEFORE_USE=$(df -h / | tail -1)
          echo "before=$BEFORE_USE"

          shopt -s nullglob
          CANDIDATES=(
            /tmp/EVRCalculator-*
            /tmp/index-*
            /tmp/pokemon-opening-v3-*
          )

          deleted=0
          skipped_recent=0
          skipped_busy=0
          deleted_bytes=0

          for d in "${CANDIDATES[@]}"; do
            [ -d "$d" ] || continue
            [ ! -L "$d" ] || { echo "skip_symlink=$d"; continue; }
            real=$(realpath -e "$d") || { echo "skip_unresolved=$d"; continue; }
            case "$real" in
              /tmp/EVRCalculator-*|/tmp/index-*|/tmp/pokemon-opening-v3-*) ;;
              *) echo "REFUSING unexpected resolved path=$real"; exit 11 ;;
            esac

            # Leave anything modified in the last 30 minutes alone.
            if find "$real" -mmin -30 -print -quit | grep -q .; then
              echo "skip_recent=$real"
              skipped_recent=$((skipped_recent+1))
              continue
            fi

            # Fail closed on any open file anywhere under the tree.
            if lsof +D "$real" 2>/dev/null | tail -n +2 | grep -q .; then
              echo "skip_busy=$real"
              skipped_busy=$((skipped_busy+1))
              continue
            fi

            bytes=$(du -sb "$real" 2>/dev/null | awk '{print $1}')
            bytes=${bytes:-0}
            echo "delete=$real bytes=$bytes"
            rm -rf --one-file-system -- "$real"
            [ ! -e "$real" ] || { echo "REFUSING deletion incomplete=$real"; exit 12; }
            deleted=$((deleted+1))
            deleted_bytes=$((deleted_bytes+bytes))
          done

          AFTER_AVAIL=$(df -B1 --output=avail / | tail -1 | tr -d ' ')
          AFTER_USE=$(df -h / | tail -1)
          RECLAIMED=$((AFTER_AVAIL-BEFORE_AVAIL))
          echo "after=$AFTER_USE"
          echo "deleted_dirs=$deleted"
          echo "skipped_recent=$skipped_recent"
          echo "skipped_busy=$skipped_busy"
          echo "deleted_tree_bytes=$deleted_bytes"
          echo "filesystem_reclaimed_bytes=$RECLAIMED"

          mkdir -p /home/ubuntu/state/fv_provider_canary
          cat > /home/ubuntu/state/fv_provider_canary/tmp-cleanup-receipt.md <<EOF
## VM stale tmp cleanup receipt
before: `$BEFORE_USE`
after: `$AFTER_USE`
deleted_dirs: $deleted
skipped_recent: $skipped_recent
skipped_busy: $skipped_busy
deleted_tree_bytes: $deleted_bytes
filesystem_reclaimed_bytes: $RECLAIMED
scope: /tmp/EVRCalculator-*, /tmp/index-*, /tmp/pokemon-opening-v3-*
db_safety_hold_touched: false
state_directories_touched: false
actions_runner_work_touched: false
EOF

      - name: Post sanitized cleanup receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          FILE=/home/ubuntu/state/fv_provider_canary/tmp-cleanup-receipt.md
          [ -f "$FILE" ] || printf '## VM stale tmp cleanup receipt\nstatus: failed before receipt\n' > "$FILE"
          python3 - <<'PY'
          import json,os,urllib.request
          body=open("/home/ubuntu/state/fv_provider_canary/tmp-cleanup-receipt.md",encoding="utf-8").read()
          req=urllib.request.Request(
              "https://api.github.com/repos/BeBoop-Beep/EVRCalculator/issues/"+os.environ["RECEIPT_ISSUE"]+"/comments",
              data=json.dumps({"body":body}).encode(),
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json"},
              method="POST")
          with urllib.request.urlopen(req,timeout=30) as resp:
              print("receipt_post_status="+str(resp.status))
          PY
