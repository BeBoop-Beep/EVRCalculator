name: Repair 30th Images and Collector Enrichment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repair-30th-enrichment-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-30th-enrichment-20260922
  cancel-in-progress: false

jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Hydrate images and rebuild Collector membership
        shell: bash
        run: |
          set -euo pipefail

          LIVE=/home/ubuntu/repos/EVRCalculator
          PY="$LIVE/.venv/bin/python"

          exec 9>/tmp/pokemon-30th-enrichment-repair.lock
          flock -w 1800 9
          exec 8>/tmp/pokemon-post-scrape-publication.lock
          flock -w 1800 8

          cd "$LIVE"
          git restore -- payload_debug.json backend/constants/tcg/pokemon/pokemon_era_set_sync_report.json 2>/dev/null || true
          git fetch origin main --quiet
          git switch main
          test -z "$(git status --porcelain --untracked-files=no)"
          git reset --hard origin/main
          echo "live_head=$(git rev-parse HEAD)"

          set -a
          . backend/.env
          set +a

          echo "=== hydrate card + variant artwork ==="
          "$PY" backend/scripts/sync_pokemon_images.py \
            --sets "ME: 30th Celebration" "ME: 30th Celebration Classic Collection" \
            --apply

          echo "=== rebuild canonical/static desirability inputs ==="
          "$PY" backend/scripts/build_pokemon_set_desirability_inputs.py \
            --set me30thCelebration --commit --log-level INFO
          "$PY" backend/scripts/build_pokemon_set_desirability_inputs.py \
            --set me30thCelebrationClassicCollection --commit --log-level INFO

          echo "=== rebuild frozen Collector V7 membership from current source authority ==="
          "$PY" backend/scripts/operationalize_historical_rip.py \
            --as-of-date 2026-09-22 \
            --commit \
            --force-model-rebuild \
            --reuse-current-source-authority

          echo "=== refresh target card snapshots ==="
          "$PY" backend/scripts/build_pokemon_set_cards_snapshots.py \
            --set-id me30thCelebration --commit
          "$PY" backend/scripts/build_pokemon_set_cards_snapshots.py \
            --set-id me30thCelebrationClassicCollection --commit

          echo "=== acceptance ==="
          "$PY" - <<'PY'
          from backend.db.clients.supabase_client import create_service_role_client

          c = create_service_role_client()
          keys = ["me30thCelebration", "me30thCelebrationClassicCollection"]
          sets = list(
              c.table("sets")
              .select("id,name,canonical_key,is_subset,parent_opening_set_id")
              .in_("canonical_key", keys)
              .execute().data or []
          )
          by = {row["canonical_key"]: row for row in sets}
          assert set(by) == set(keys), by

          current = (
              c.table("pokemon_collector_appeal_current")
              .select("model_run_id,model_version,as_of_date")
              .eq("scope", "pokemon")
              .single()
              .execute().data
          )
          assert current and current.get("model_run_id"), current
          model_run_id = str(current["model_run_id"])
          print("collector_current", current)

          expected = {
              "me30thCelebration": 158,
              "me30thCelebrationClassicCollection": 30,
          }

          for key, expected_count in expected.items():
              row = by[key]
              sid = str(row["id"])
              cards = list(
                  c.table("cards")
                  .select("id,image_small_url,image_large_url")
                  .eq("set_id", sid)
                  .limit(500)
                  .execute().data or []
              )
              card_ids = [str(x["id"]) for x in cards]
              variants = []
              for start in range(0, len(card_ids), 150):
                  variants.extend(
                      c.table("card_variants")
                      .select("id,image_small_url,image_large_url")
                      .in_("card_id", card_ids[start:start+150])
                      .execute().data or []
                  )
              canonical = list(
                  c.table("pokemon_canonical_cards")
                  .select("id,source,image_small_url,image_large_url")
                  .eq("set_id", sid)
                  .limit(500)
                  .execute().data or []
              )
              card_ca = list(
                  c.table("pokemon_card_collector_appeal_scores")
                  .select("pokemon_canonical_card_id,score_status")
                  .eq("model_run_id", model_run_id)
                  .eq("set_id", sid)
                  .limit(500)
                  .execute().data or []
              )
              set_d = list(
                  c.table("pokemon_set_collector_desirability_scores")
                  .select("set_id,collector_desirability_score")
                  .eq("model_run_id", model_run_id)
                  .eq("set_id", sid)
                  .limit(5)
                  .execute().data or []
              )
              set_ca = list(
                  c.table("pokemon_set_collector_appeal_scores")
                  .select("set_id,collector_appeal_score,score_status")
                  .eq("model_run_id", model_run_id)
                  .eq("set_id", sid)
                  .limit(5)
                  .execute().data or []
              )

              report = {
                  "key": key,
                  "is_subset": bool(row.get("is_subset")),
                  "cards": len(cards),
                  "cards_with_images": sum(bool(x.get("image_small_url") or x.get("image_large_url")) for x in cards),
                  "variants": len(variants),
                  "variants_with_images": sum(bool(x.get("image_small_url") or x.get("image_large_url")) for x in variants),
                  "canonical": len(canonical),
                  "canonical_with_images": sum(bool(x.get("image_small_url") or x.get("image_large_url")) for x in canonical),
                  "canonical_sources": sorted({str(x.get("source") or "") for x in canonical}),
                  "card_collector_rows": len(card_ca),
                  "set_collector_desirability_rows": len(set_d),
                  "set_collector_appeal_rows": len(set_ca),
                  "set_collector_appeal_status": [x.get("score_status") for x in set_ca],
              }
              print("acceptance", report)

              assert len(cards) == expected_count, report
              assert report["cards_with_images"] == expected_count, report
              assert report["variants_with_images"] == report["variants"], report
              assert len(canonical) == expected_count, report
              assert report["canonical_with_images"] == expected_count, report
              assert report["card_collector_rows"] == expected_count, report

              if key == "me30thCelebration":
                  assert report["set_collector_desirability_rows"] >= 1, report
                  assert report["set_collector_appeal_rows"] >= 1, report
              else:
                  # Classic Collection contributes to the parent opening/value
                  # universe and must not become an independent Market root.
                  # A standalone set-level Collector row is optional by model
                  # cohort policy, but its card-level Collector rows are required.
                  pass

              snap = list(
                  c.table("pokemon_set_cards_snapshot_latest")
                  .select("cards_json,updated_at")
                  .eq("set_id", sid)
                  .limit(1)
                  .execute().data or []
              )
              assert snap, (key, "missing cards snapshot")
              payload = str(snap[0].get("cards_json") or {})
              assert ("assets.tcgdex.net" in payload or "images.scrydex.com" in payload), (
                  key, "snapshot has no hydrated artwork"
              )

          print("THIRTIETH_ENRICHMENT_REPAIR=PASS")
          PY
