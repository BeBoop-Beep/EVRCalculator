name: Catalog recheck job-id field tests

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Test catalog recheck job-id branch
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/home/ubuntu/repos/catalog-recheck-job-id-test
          BRANCH=fix/catalog-recheck-job-id-field-20260921

          cd "$REPO"
          git fetch origin "$BRANCH"
          if [ -d "$WT" ]; then
            git worktree remove --force "$WT" || true
          fi
          git worktree add --detach "$WT" "origin/$BRANCH"
          ln -s /home/ubuntu/repos/EVRCalculator/backend/.env "$WT/backend/.env"

          cd "$WT"
          /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m py_compile             backend/services/pokemon_set_onboarding_recheck_service.py             backend/scripts/refresh_due_pokemon_catalog_sets.py

          /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m pytest -q             backend/tests/unit/scripts/test_refresh_due_pokemon_catalog_sets.py             backend/tests/unit/services/test_pokemon_set_onboarding_recheck_service.py

          rm -f "$WT/backend/.env"
          cd "$REPO"
          git worktree remove --force "$WT"
