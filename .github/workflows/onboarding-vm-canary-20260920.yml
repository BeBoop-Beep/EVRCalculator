name: Onboarding VM readiness audit 2026-09-20

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  readiness:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect production checkout and wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          git status --short
          echo "=== payload_debug diffstat ==="
          git diff --stat -- payload_debug.json || true
          echo "=== payload_debug diff head ==="
          git diff -- payload_debug.json | sed -n '1,120p' || true
          echo "=== installed wrapper ==="
          if [ -f /home/ubuntu/bin/run_pokemon_onboarding_worker.sh ]; then
            sha256sum /home/ubuntu/bin/run_pokemon_onboarding_worker.sh
            sed -n '1,220p' /home/ubuntu/bin/run_pokemon_onboarding_worker.sh
          else
            echo "installed wrapper missing"
          fi
          echo "=== repo wrapper ==="
          sha256sum /home/ubuntu/repos/EVRCalculator/infra/oracle/run_pokemon_onboarding_worker.sh
