name: Check browser tooling on VM

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check installed browser tooling
        shell: bash
        run: |
          set -euo pipefail
          command -v node || true
          command -v npm || true
          command -v chromium || true
          command -v chromium-browser || true
          command -v google-chrome || true
          /home/ubuntu/repos/EVRCalculator/.venv/bin/python - <<'PY'
          import importlib.util
          for name in ("playwright","selenium","pyppeteer"):
              print(name, bool(importlib.util.find_spec(name)))
          PY
