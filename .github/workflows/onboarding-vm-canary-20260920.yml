name: Pokemon new-set final production audit

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Audit VM config and production target state
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git fetch origin main
          git switch main
          git reset --hard origin/main
          ./.venv/bin/python - <<'PY'
          import json
          from dotenv import dotenv_values
          from backend.db.clients.supabase_client import create_service_role_client

          env = dotenv_values("backend/.env")
          poke_key = str(env.get("POKEMON_TCG_API_KEY") or "").strip()
          print(json.dumps({
              "pokemon_tcg_api_key_present": bool(poke_key),
              "pokemon_tcg_api_key_length": len(poke_key),
          }))

          client = create_service_role_client()
          keys = [
              "me06DeltaReign",
              "me30thCelebration",
              "me30thCelebrationClassicCollection",
          ]
          sets = list(
              client.table("sets")
              .select(
                  "id,name,canonical_key,catalog_only,ready_for_daily_scrape,"
                  "supports_opening_simulation,is_subset,parent_opening_set_id,"
                  "release_date,pokemon_api_set_id,logo_image_url,symbol_image_url"
              )
              .in_("canonical_key", keys)
              .execute()
              .data
              or []
          )

          out = []
          for row in sorted(sets, key=lambda x: x["canonical_key"]):
              sid = str(row["id"])
              cards = list(client.table("cards").select("id").eq("set_id", sid).execute().data or [])
              canonical = list(client.table("pokemon_canonical_cards").select("id").eq("set_id", sid).execute().data or [])
              sealed = list(client.table("sealed_products").select("id").eq("set_id", sid).execute().data or [])

              cards_snap = list(
                  client.table("pokemon_set_cards_snapshot_latest")
                  .select("updated_at,payload_json")
                  .eq("set_id", sid).limit(1).execute().data or []
              )
              sealed_snap = list(
                  client.table("pokemon_set_sealed_market_snapshot_latest")
                  .select("market_date,updated_at")
                  .eq("set_id", sid).limit(1).execute().data or []
              )
              page_snap = list(
                  client.table("pokemon_set_page_snapshot_latest")
                  .select("as_of,updated_at,payload_json")
                  .eq("set_id", sid).limit(1).execute().data or []
              )
              appeal = list(
                  client.table("pokemon_set_collector_appeal_current_v")
                  .select("*")
                  .eq("set_id", sid).limit(1).execute().data or []
              )

              card_count_snapshot = None
              if cards_snap:
                  payload = cards_snap[0].get("payload_json") or {}
                  vals = payload.get("cards")
                  if isinstance(vals, list):
                      card_count_snapshot = len(vals)

              out.append({
                  "set": row,
                  "cards": len(cards),
                  "canonical_cards": len(canonical),
                  "sealed_products": len(sealed),
                  "cards_snapshot": {
                      "present": bool(cards_snap),
                      "updated_at": cards_snap[0].get("updated_at") if cards_snap else None,
                      "card_count": card_count_snapshot,
                  },
                  "sealed_snapshot": {
                      "present": bool(sealed_snap),
                      "market_date": sealed_snap[0].get("market_date") if sealed_snap else None,
                      "updated_at": sealed_snap[0].get("updated_at") if sealed_snap else None,
                  },
                  "page_snapshot": {
                      "present": bool(page_snap),
                      "as_of": page_snap[0].get("as_of") if page_snap else None,
                      "updated_at": page_snap[0].get("updated_at") if page_snap else None,
                  },
                  "collector_appeal_present": bool(appeal),
                  "collector_appeal_row": appeal[0] if appeal else None,
              })

          print(json.dumps({"targets": out}, default=str))
          PY

      - name: Verify live catalog HTML
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl -fsSL --max-time 30 'https://inthedex.io/TCGs/Pokemon/Sets' -o "$tmp"
          echo "PUBLIC_DELTA_PRESENT=$(grep -q 'Delta Reign' "$tmp" && echo true || echo false)"
          echo "PUBLIC_30TH_PRESENT=$(grep -q 'ME: 30th Celebration' "$tmp" && echo true || echo false)"
          echo "PUBLIC_CLASSIC_ROOT_PRESENT=$(grep -q 'ME: 30th Celebration Classic Collection' "$tmp" && echo true || echo false)"
          echo "html_bytes=$(wc -c < "$tmp")"
