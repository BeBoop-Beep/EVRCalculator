name: Pokemon catalog refresh final commit

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  refresh:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Sync current main
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git fetch origin main
          git switch main
          git reset --hard origin/main
          echo "VM_SHA=$(git rev-parse HEAD)"

      - name: Wait for short dispatcher gap and refresh
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator

          exec 9>/tmp/pokemon-catalog-recheck.lock
          flock -n 9

          for n in $(seq 1 30); do
            exec 8>/tmp/pokemon-scrape-dispatcher.lock
            exec 7>/tmp/pokemon-post-scrape-publication.lock

            if flock -n 8 && flock -n 7; then
              echo "LOCKS_ACQUIRED=true attempt=$n"
              ./.venv/bin/python backend/scripts/refresh_due_pokemon_catalog_sets.py                 --commit                 --limit 25                 --max-provider-requests 50
              exit $?
            fi

            exec 8>&-
            exec 7>&-
            sleep 2
          done

          echo "No safe lock gap found within 60s" >&2
          exit 77

      - name: Final state
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          echo "dirty_count=$(git status --porcelain | wc -l)"
          git status --short
