name: Diagnose Pokemon dispatcher lock

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Inspect dispatcher lock owner
        shell: bash
        run: |
          set -euo pipefail
          date -Is

          echo "=== lslocks ==="
          lslocks -o PID,COMMAND,PATH,TYPE,MODE,SIZE 2>/dev/null | grep -E 'pokemon-scrape-dispatcher|pokemon-post-scrape-publication' || true

          echo "=== fuser dispatcher ==="
          fuser -v /tmp/pokemon-scrape-dispatcher.lock 2>&1 || true

          echo "=== relevant processes ==="
          pgrep -af 'run_next_scrape_job|pokemon_set_scrape|publish_post_scrape|refresh_stale_public_snapshots' || true

          for pid in $(fuser /tmp/pokemon-scrape-dispatcher.lock 2>/dev/null || true); do
            echo "=== PID $pid ==="
            ps -o pid,ppid,lstart,etime,stat,%cpu,%mem,wchan:28,cmd -p "$pid" || true
            echo "--- children ---"
            pgrep -P "$pid" | xargs -r ps -o pid,ppid,lstart,etime,stat,%cpu,%mem,wchan:28,cmd -p || true
            echo "--- io ---"
            sudo cat "/proc/$pid/io" 2>/dev/null || true
          done

          echo "=== dispatcher log tail ==="
          tail -n 160 /home/ubuntu/repos/EVRCalculator/backend/logs/cron_dispatcher.log 2>/dev/null || true

          echo "=== lock tests ==="
          if flock -n /tmp/pokemon-scrape-dispatcher.lock -c 'true'; then
            echo "DISPATCHER_LOCK_FREE=true"
          else
            echo "DISPATCHER_LOCK_FREE=false"
          fi
          if flock -n /tmp/pokemon-post-scrape-publication.lock -c 'true'; then
            echo "PUBLICATION_LOCK_FREE=true"
          else
            echo "PUBLICATION_LOCK_FREE=false"
          fi
