name: Onboarding autonomy audit 2026-09-20

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  autonomy-audit:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect onboarding schedule
        shell: bash
        run: |
          set -euo pipefail
          echo "=== crontab ==="
          crontab -l || true
          echo "=== onboarding enable marker ==="
          if [ -f /home/ubuntu/.pokemon_onboarding_enabled ]; then
            echo "ONBOARDING_ENABLED=true"
          else
            echo "ONBOARDING_ENABLED=false"
          fi
          echo "=== wrapper ==="
          ls -l /home/ubuntu/repos/EVRCalculator/infra/oracle/run_pokemon_onboarding_worker.sh
          echo "=== related processes ==="
          pgrep -af 'run_pending_pokemon_set_onboarding|discover_new_pokemon_sets|recheck_pokemon_set_onboarding_catalog' || true
