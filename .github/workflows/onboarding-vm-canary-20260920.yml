name: Catalog-only cards snapshot canary 2026-09-20

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  cards-canary:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Build Classic Collection cards snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git fetch origin main
          git switch main
          git reset --hard origin/main
          ./.venv/bin/python backend/scripts/build_pokemon_set_cards_snapshots.py             --set-id me30thCelebrationClassicCollection             --commit             --market-date 2026-09-20
