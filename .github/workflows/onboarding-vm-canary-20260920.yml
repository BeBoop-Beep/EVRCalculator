name: Public route warm probe after slim directory repair

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe warm live routes
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            label="$1"
            url="$2"
            echo "=== $label ==="
            rm -f body.out headers.out
            set +e
            curl -sS -L -D headers.out -o body.out               --connect-timeout 5               --max-time 40               -w 'http=%{http_code} start=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}\n'               "$url"
            code=$?
            set -e
            echo "curl_exit=$code"
            grep -Ei '^(HTTP/|x-vercel-cache:|x-matched-path:|cache-control:|content-type:)' headers.out | tail -n 20 || true
            if [ -f body.out ]; then
              echo "body_bytes=$(wc -c < body.out)"
              echo "route_loader=$(grep -qi 'Loading Rip Statistics' body.out && echo true || echo false)"
              echo "set_client=$(grep -qi 'set-detail-glass-scope\|RIP Statistics unavailable\|Loading set intelligence' body.out && echo true || echo false)"
              echo "market_explorer=$(grep -qi 'data-market-explorer-workspace\|Market Directory\|Build Your Market' body.out && echo true || echo false)"
            fi
          }

          # Run twice to distinguish a cold shared dependency from a per-set one.
          probe pitch-1 "https://inthedex.io/TCGs/Pokemon/Sets/pitch-black"
          probe pitch-2 "https://inthedex.io/TCGs/Pokemon/Sets/pitch-black"
          probe delta-1 "https://inthedex.io/TCGs/Pokemon/Sets/me06-delta-reign"
          probe delta-2 "https://inthedex.io/TCGs/Pokemon/Sets/me06-delta-reign"
          probe explorer-1 "https://inthedex.io/Market/Explorer"
          probe explorer-2 "https://inthedex.io/Market/Explorer"
