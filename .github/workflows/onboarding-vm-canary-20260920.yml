name: Pokemon targeted API retry tests

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pokemon-targeted-api-retries-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install focused dependencies
        run: python -m pip install requests pytest
      - name: Run targeted metadata tests
        run: |
          python -m py_compile backend/services/pokemon_tcg_api_set_service.py
          python -m pytest -q backend/tests/unit/services/test_pokemon_tcg_api_set_service.py
