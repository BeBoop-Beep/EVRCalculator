name: Pokemon keyless API patch tests

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Test keyless API patch in isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/home/ubuntu/repos/pokemon-keyless-api-test
          BRANCH=fix/pokemon-api-keyless-onboarding-20260921

          cd "$REPO"
          git fetch origin "$BRANCH"
          if [ -d "$WT" ]; then
            git worktree remove --force "$WT" || true
          fi
          git worktree add --detach "$WT" "origin/$BRANCH"
          ln -s /home/ubuntu/repos/EVRCalculator/backend/.env "$WT/backend/.env"

          cd "$WT"
          /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m py_compile             backend/services/pokemon_tcg_api_set_service.py             backend/db/clients/pokemon_tcg_api_client.py

          /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m pytest -q             backend/tests/unit/services/test_pokemon_tcg_api_set_service.py             backend/tests/unit/db/clients/test_pokemon_tcg_api_client.py             backend/tests/unit/services/test_pokemon_set_onboarding_service.py

          rm -f "$WT/backend/.env"
          cd "$REPO"
          git worktree remove --force "$WT"

      - name: Live keyless targeted metadata probe
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          ./.venv/bin/python - <<'PY'
          import json
          from backend.services.pokemon_tcg_api_set_service import fetch_targeted_sets

          for name in (
              "ME06: Delta Reign",
              "ME: 30th Celebration",
              "ME: 30th Celebration Classic Collection",
          ):
              try:
                  rows=fetch_targeted_sets(name, "", timeout_seconds=20)
                  print(json.dumps({
                      "name":name,
                      "count":len(rows),
                      "rows":rows,
                  }))
              except Exception as exc:
                  print(json.dumps({
                      "name":name,
                      "error":type(exc).__name__,
                      "message":str(exc),
                  }))
          PY
