name: Install browser diagnostics and reproduce production failure

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  browser:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Install isolated Python Playwright if needed
        shell: bash
        run: |
          set -euo pipefail
          VENV=/home/ubuntu/browser-diagnostics-venv
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
          fi
          "$VENV/bin/pip" install -q --upgrade pip
          "$VENV/bin/pip" install -q playwright
          "$VENV/bin/python" -m playwright install chromium
          "$VENV/bin/python" - <<'PY'
          import playwright
          print("PLAYWRIGHT_READY=true")
          PY

      - name: Capture browser console and failed requests
        shell: bash
        run: |
          set -euo pipefail
          /home/ubuntu/browser-diagnostics-venv/bin/python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          cases = [
              ("catalog", "https://www.inthedex.io/TCGs/Pokemon/Sets"),
              ("pitch", "https://www.inthedex.io/TCGs/Pokemon/Sets/pitch-black"),
              ("delta", "https://www.inthedex.io/TCGs/Pokemon/Sets/me06-delta-reign"),
              ("30th", "https://www.inthedex.io/TCGs/Pokemon/Sets/me-30th-celebration"),
              ("rankings", "https://www.inthedex.io/Rankings"),
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for name, url in cases:
                  page = browser.new_page(viewport={"width": 1440, "height": 900})
                  console = []
                  errors = []
                  failed = []
                  responses = []

                  def on_console(msg):
                      if msg.type in ("error", "warning"):
                          console.append({"type": msg.type, "text": msg.text})

                  page.on("console", on_console)
                  page.on("pageerror", lambda exc: errors.append(str(exc)))
                  page.on("requestfailed", lambda req: failed.append({
                      "url": req.url,
                      "resource_type": req.resource_type,
                      "failure": req.failure,
                  }))
                  page.on("response", lambda res: responses.append({
                      "url": res.url,
                      "status": res.status,
                      "resource_type": res.request.resource_type,
                  }) if res.status >= 400 else None)

                  goto_error = None
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=60000)
                      page.wait_for_timeout(15000)
                  except Exception as exc:
                      goto_error = str(exc)

                  state = page.evaluate("""() => {
                    const text = document.body?.innerText || "";
                    return {
                      href: location.href,
                      title: document.title,
                      bodyTextLength: text.length,
                      bodyTextHead: text.slice(0, 2000),
                      setContextShell: !!document.querySelector('[data-set-context-shell]'),
                      ariaBusy: Array.from(document.querySelectorAll('[aria-busy="true"]')).map(el => ({
                        label: el.getAttribute('aria-label'),
                        text: (el.innerText || '').slice(0, 200),
                      })),
                      scripts: Array.from(document.scripts).map(s => s.src).filter(Boolean),
                    };
                  }""")

                  print(json.dumps({
                      "case": name,
                      "goto_error": goto_error,
                      "state": state,
                      "page_errors": errors,
                      "console": console[-50:],
                      "failed_requests": failed[-50:],
                      "bad_responses": responses[-50:],
                  }))
                  page.close()
              browser.close()
          PY
