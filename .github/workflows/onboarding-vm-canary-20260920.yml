name: Pokemon catalog refresh after publication

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  refresh:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Sync current main
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git fetch origin main
          git switch main
          git reset --hard origin/main
          echo "VM_SHA=$(git rev-parse HEAD)"

      - name: Check lock and run real catalog refresh
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator

          if ! flock -n /tmp/pokemon-post-scrape-publication.lock -c 'true'; then
            echo "POST_SCRAPE_LOCK_FREE=false"
            exit 75
          fi
          if ! flock -n /tmp/pokemon-scrape-dispatcher.lock -c 'true'; then
            echo "SCRAPE_DISPATCHER_LOCK_FREE=false"
            exit 76
          fi

          echo "LOCKS_FREE=true"
          exec 9>/tmp/pokemon-catalog-recheck.lock
          flock -n 9

          ./.venv/bin/python backend/scripts/refresh_due_pokemon_catalog_sets.py             --commit             --limit 25             --max-provider-requests 50

      - name: Final state
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          echo "dirty_count=$(git status --porcelain | wc -l)"
          git status --short
