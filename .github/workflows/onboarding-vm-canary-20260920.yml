name: ME30th final VM cleanliness

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Sync clean production checkout
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git restore --             payload_debug.json             backend/constants/tcg/pokemon/pokemon_era_set_sync_report.json             backend/constants/tcg/pokemon/pokemon_set_scrape_run_report.json 2>/dev/null || true
          git fetch origin main
          git switch main
          git reset --hard origin/main
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          echo "status:"
          git status --short
          test -z "$(git status --porcelain)"
          echo "CLEAN=true"
          echo "scrape_report_tracked=$(git ls-files --error-unmatch backend/constants/tcg/pokemon/pokemon_set_scrape_run_report.json >/dev/null 2>&1 && echo true || echo false)"
          echo "scrape_report_ignored=$(git check-ignore -q backend/constants/tcg/pokemon/pokemon_set_scrape_run_report.json && echo true || echo false)"
