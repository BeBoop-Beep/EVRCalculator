name: Reproduce Explorer and set-detail browser failure

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  browser-repro:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Sync current main
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git fetch origin main
          git switch main
          git reset --hard origin/main
          echo "VM_SHA=$(git rev-parse HEAD)"

      - name: Run production browser probes
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator/frontend

          node - <<'NODE'
          const { chromium } = require("playwright");

          const cases = [
            ["pitch-black", "https://www.inthedex.io/TCGs/Pokemon/Sets/pitch-black"],
            ["delta-reign", "https://www.inthedex.io/TCGs/Pokemon/Sets/me06-delta-reign"],
            ["30th", "https://www.inthedex.io/TCGs/Pokemon/Sets/me-30th-celebration"],
            ["explorer", "https://www.inthedex.io/Explorer"],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const [name, url] of cases) {
                const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
                const consoleErrors = [];
                const pageErrors = [];
                const failed = [];
                const badResponses = [];

                page.on("console", msg => {
                  if (["error", "warning"].includes(msg.type())) {
                    consoleErrors.push({ type: msg.type(), text: msg.text() });
                  }
                });
                page.on("pageerror", err => pageErrors.push(err.stack || err.message || String(err)));
                page.on("requestfailed", req => failed.push({
                  url: req.url(),
                  method: req.method(),
                  failure: req.failure()?.errorText || null,
                  resourceType: req.resourceType(),
                }));
                page.on("response", res => {
                  if (res.status() >= 400) {
                    badResponses.push({
                      status: res.status(),
                      url: res.url(),
                      resourceType: res.request().resourceType(),
                    });
                  }
                });

                const started = Date.now();
                let gotoError = null;
                try {
                  await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
                  await page.waitForTimeout(12000);
                } catch (err) {
                  gotoError = err.stack || err.message || String(err);
                }

                const state = await page.evaluate(() => {
                  const text = document.body?.innerText || "";
                  return {
                    title: document.title,
                    pathname: location.pathname,
                    href: location.href,
                    bodyTextHead: text.slice(0, 1600),
                    bodyTextLength: text.length,
                    setContextShell: Boolean(document.querySelector("[data-set-context-shell]")),
                    loaders: Array.from(document.querySelectorAll('[aria-busy="true"]')).map(el => ({
                      label: el.getAttribute("aria-label"),
                      text: (el.innerText || "").slice(0, 200),
                    })),
                    nextError: Boolean(document.querySelector("nextjs-portal")),
                  };
                }).catch(err => ({ evaluateError: err.message }));

                console.log(JSON.stringify({
                  case: name,
                  url,
                  elapsedMs: Date.now() - started,
                  gotoError,
                  state,
                  pageErrors,
                  consoleErrors: consoleErrors.slice(-30),
                  failedRequests: failed.slice(-30),
                  badResponses: badResponses.slice(-50),
                }));

                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
