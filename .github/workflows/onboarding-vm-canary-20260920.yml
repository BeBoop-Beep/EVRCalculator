name: Onboarding frontend verification 2026-09-20

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  frontend-verify:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Verify public catalog HTML
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          for n in 1 2 3; do
            if curl -fsSL --max-time 30 'https://inthedex.io/TCGs/Pokemon/Sets' -o "$tmp"; then
              break
            fi
            sleep 5
          done
          echo "http_bytes=$(wc -c < "$tmp")"
          echo "delta_count=$(grep -o 'Delta Reign' "$tmp" | wc -l)"
          echo "30th_count=$(grep -o '30th Celebration' "$tmp" | wc -l)"
          echo "mega_heading_count=$(grep -o 'Mega Evolution' "$tmp" | wc -l)"
          if grep -q 'Delta Reign' "$tmp"; then
            echo "PUBLIC_DELTA_PRESENT=true"
          else
            echo "PUBLIC_DELTA_PRESENT=false"
          fi
          if grep -q 'ME: 30th Celebration' "$tmp"; then
            echo "PUBLIC_30TH_PRESENT=true"
          else
            echo "PUBLIC_30TH_PRESENT=false"
          fi
