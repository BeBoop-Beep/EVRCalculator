name: Onboarding Git write audit 2026-09-20

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  write-audit:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify Git push credential without mutation
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo "credential_helper=$(git config --get credential.helper || true)"
          set +e
          out="$(git push --dry-run origin HEAD:refs/heads/automation/credential-probe-should-not-create 2>&1)"
          code=$?
          set -e
          echo "push_dry_run_exit=$code"
          if [ "$code" -eq 0 ]; then
            echo "git_write_authenticated=true"
          else
            echo "git_write_authenticated=false"
            printf '%s\n' "$out" | sed -E 's#https://[^/@]+@github.com#https://[REDACTED]@github.com#g' | tail -n 8
          fi
