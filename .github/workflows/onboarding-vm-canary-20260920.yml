name: Onboarding Git credential audit 2026-09-20

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  credential-audit:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect GitHub CLI credential availability without secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "gh_config_exists=$(test -f /home/ubuntu/.config/gh/hosts.yml && echo true || echo false)"
          echo "git_remote=$(cd /home/ubuntu/repos/EVRCalculator && git remote get-url origin)"
          echo "git_push_test_access:"
          cd /home/ubuntu/repos/EVRCalculator
          git ls-remote --exit-code origin HEAD >/dev/null && echo "git_remote_read=true"
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -T git@github.com 2>&1 | grep -q 'successfully authenticated'; then
            echo "github_ssh_authenticated=true"
          else
            echo "github_ssh_authenticated=false"
          fi
          echo "sudo_noninteractive=$(sudo -n true 2>/dev/null && echo true || echo false)"
