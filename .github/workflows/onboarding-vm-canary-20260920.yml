name: Diagnose stale publication process progress

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Inspect live publication process progress
        shell: bash
        run: |
          set -euo pipefail
          date -Is

          PIDS="$(fuser /tmp/pokemon-post-scrape-publication.lock 2>/dev/null || true)"
          echo "lock_pids=$PIDS"

          for pid in $PIDS; do
            echo "=== PID $pid ==="
            ps -o pid,ppid,lstart,etime,stat,%cpu,%mem,wchan:28,cmd -p "$pid" || true
            echo "--- /proc/$pid/io ---"
            sudo cat "/proc/$pid/io" 2>/dev/null || true
            echo "--- fd targets ---"
            sudo ls -l "/proc/$pid/fd" 2>/dev/null | tail -n 40 || true
          done

          echo "=== publication.log metadata ==="
          if [ -f /home/ubuntu/repos/EVRCalculator/publication.log ]; then
            stat -c 'size=%s mtime=%y' /home/ubuntu/repos/EVRCalculator/publication.log
            echo "=== publication.log tail ==="
            tail -n 220 /home/ubuntu/repos/EVRCalculator/publication.log
          else
            echo "publication.log missing"
          fi

          echo "=== lock state ==="
          if flock -n /tmp/pokemon-post-scrape-publication.lock -c 'true'; then
            echo "POST_SCRAPE_LOCK_FREE=true"
          else
            echo "POST_SCRAPE_LOCK_FREE=false"
          fi
