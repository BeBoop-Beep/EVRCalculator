name: Probe merged keyless Pokemon API

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe keyless set metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request

          base="https://api.pokemontcg.io/v2/sets"
          for name in (
              "ME06: Delta Reign",
              "ME: 30th Celebration",
              "ME: 30th Celebration Classic Collection",
          ):
              q=urllib.parse.urlencode({"q": f'name:"{name}"', "pageSize": 50})
              req=urllib.request.Request(
                  base+"?"+q,
                  headers={"Accept":"application/json","User-Agent":"EVRCalculator/1.0"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      payload=json.load(resp)
                      rows=[]
                      for item in payload.get("data") or []:
                          rows.append({
                              "id":item.get("id"),
                              "name":item.get("name"),
                              "series":item.get("series"),
                              "releaseDate":item.get("releaseDate"),
                              "printedTotal":item.get("printedTotal"),
                              "total":item.get("total"),
                              "images":item.get("images"),
                          })
                      print(json.dumps({
                          "query":name,
                          "status":resp.status,
                          "count":len(rows),
                          "rows":rows,
                          "rate_limit":{
                              "limit":resp.headers.get("X-Rate-Limit-Limit"),
                              "remaining":resp.headers.get("X-Rate-Limit-Remaining"),
                          },
                      }))
              except Exception as exc:
                  print(json.dumps({
                      "query":name,
                      "error":type(exc).__name__,
                      "message":str(exc),
                  }))
          PY
