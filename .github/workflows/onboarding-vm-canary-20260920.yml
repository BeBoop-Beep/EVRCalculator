name: Onboarding Git mode audit 2026-09-20

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  git-mode-audit:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect non-secret onboarding Git settings
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          ./.venv/bin/python - <<'PY'
          from dotenv import dotenv_values
          v = dotenv_values("backend/.env")
          keys = [
              "POKEMON_ONBOARDING_GIT_MODE",
              "POKEMON_ONBOARDING_WORKTREE_DIR",
              "POKEMON_ONBOARDING_BASE_BRANCH",
              "POKEMON_ONBOARDING_AUTO_MERGE",
              "POKEMON_ONBOARDING_AUTO_DEPLOY",
          ]
          for k in keys:
              print(f"{k}={v.get(k)!r}")
          PY
          echo "gh_available=$(command -v gh >/dev/null && echo true || echo false)"
          if command -v gh >/dev/null; then
            gh auth status 2>&1 | sed -E 's/(Token: ).*/\1[REDACTED]/' || true
          fi
