name: Immediate Pokemon catalog refresh probe

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Sync main and attempt refresh once
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git fetch origin main
          git switch main
          git reset --hard origin/main
          echo "VM_SHA=$(git rev-parse HEAD)"

          exec 8>/tmp/pokemon-scrape-dispatcher.lock
          exec 7>/tmp/pokemon-post-scrape-publication.lock

          if ! flock -n 8; then
            echo "SCRAPE_LOCK_FREE=false"
            fuser -v /tmp/pokemon-scrape-dispatcher.lock 2>&1 || true
            exit 0
          fi

          if ! flock -n 7; then
            echo "POST_SCRAPE_LOCK_FREE=false"
            fuser -v /tmp/pokemon-post-scrape-publication.lock 2>&1 || true
            pgrep -af 'rebuild_snapshots_after_scrape|refresh_stale_public_snapshots' || true
            exit 0
          fi

          echo "LOCKS_ACQUIRED=true"
          ./.venv/bin/python backend/scripts/refresh_due_pokemon_catalog_sets.py             --commit             --limit 25             --max-provider-requests 50
