name: Pokemon onboarding final scheduler cutover

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  cutover:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Sync VM and install canonical crontab
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git fetch origin main
          git switch main
          git reset --hard origin/main
          crontab infra/oracle/tcgplayer-scraper-pokemon.crontab
          rm -f /home/ubuntu/.pokemon_onboarding_enabled
          echo "VM_SHA=$(git rev-parse HEAD)"
          echo "legacy_onboarding_cron_count=$(crontab -l | grep -c 'run_pokemon_onboarding_worker.sh commit' || true)"
          echo "enable_marker=$(test -f /home/ubuntu/.pokemon_onboarding_enabled && echo present || echo absent)"
          test "$(crontab -l | grep -c 'run_pokemon_onboarding_worker.sh commit' || true)" -eq 0
          test ! -f /home/ubuntu/.pokemon_onboarding_enabled

      - name: Run real catalog recheck refresh canary
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          success=0
          for n in $(seq 1 12); do
            echo "catalog canary attempt $n/12"
            set +e
            /usr/bin/flock -n /tmp/pokemon-scrape-dispatcher.lock               /usr/bin/flock -n /tmp/pokemon-post-scrape-publication.lock               ./.venv/bin/python backend/scripts/refresh_due_pokemon_catalog_sets.py                 --commit                 --limit 25                 --max-provider-requests 50
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              success=1
              break
            fi
            sleep 15
          done
          test "$success" -eq 1

      - name: Final VM scheduler state
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          echo "dirty_count=$(git status --porcelain | wc -l)"
          git status --short
          echo "onboarding GitHub workflow installed:"
          test -f .github/workflows/pokemon-onboarding-autonomous.yml
          echo "catalog recheck GitHub workflow installed:"
          test -f .github/workflows/pokemon-catalog-recheck-refresh.yml
