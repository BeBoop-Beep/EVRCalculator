name: Inspect production route dynamic chunks

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Probe actual Explorer route
        shell: bash
        run: |
          set -euo pipefail
          tmp=/tmp/explore.html
          curl -L --max-time 45 -sS -D /tmp/explore.headers -o "$tmp" "https://www.inthedex.io/Explore"
          echo "=== headers ==="
          cat /tmp/explore.headers
          echo "bytes=$(wc -c < "$tmp")"
          echo "loader_count=$(grep -o 'Loading inDex\|Loading Rip Statistics\|Loading rankings\|Loading' "$tmp" | wc -l)"
          echo "title=$(grep -o '<title>[^<]*</title>' "$tmp" | head -1 || true)"
          echo "scripts:"
          grep -oE 'src="[^"]+\.js[^"]*"' "$tmp" | sed 's/^src="//;s/"$//' | sort -u

      - name: Inspect set route bundle and all referenced chunk ids
        shell: bash
        run: |
          set -euo pipefail
          html=/tmp/pitch.html
          curl -L --max-time 45 -fsS "https://www.inthedex.io/TCGs/Pokemon/Sets/pitch-black" -o "$html"

          route_src="$(grep -oE 'src="[^"]+app/TCGs/Pokemon/Sets/%5BsetSlug%5D/page-[^"]+\.js[^"]*"' "$html" | head -1 | sed 's/^src="//;s/"$//')"
          echo "route_src=$route_src"
          test -n "$route_src"
          curl -L --max-time 20 -fsS "https://www.inthedex.io$route_src" -o /tmp/set-route.js

          echo "route_chunk_bytes=$(wc -c < /tmp/set-route.js)"
          echo "=== route chunk strings ==="
          grep -aoE 'PokemonSetRichPageClient|PokemonSetPageClient|Loading set intelligence|Loading Rip Statistics|[0-9]{3,6}:[^,}]+' /tmp/set-route.js | head -n 120 || true

          echo "=== route chunk head ==="
          head -c 12000 /tmp/set-route.js
          echo

          echo "=== numeric chunk ids near dynamic loader ==="
          grep -aoE '\.e\([0-9]+\)|\[([0-9]+(,[0-9]+)*)\]' /tmp/set-route.js | sort -u | head -n 100 || true

      - name: Verify candidate secondary chunks from webpack mapping
        shell: bash
        run: |
          set -euo pipefail
          html=/tmp/pitch.html
          webpack_src="$(grep -oE 'src="[^"]+webpack-[^"]+\.js[^"]*"' "$html" | head -1 | sed 's/^src="//;s/"$//')"
          echo "webpack_src=$webpack_src"
          curl -L --max-time 20 -fsS "https://www.inthedex.io$webpack_src" -o /tmp/webpack.js
          echo "webpack_bytes=$(wc -c < /tmp/webpack.js)"
          head -c 16000 /tmp/webpack.js
          echo
