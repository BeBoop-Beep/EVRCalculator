name: Probe live Rankings backend 503

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Probe backend through local app service
        shell: bash
        run: |
          set -euo pipefail

          echo "=== listening services ==="
          ss -ltnp | grep -E ':8000|:8080|:3000|:5000' || true

          for port in 8000 8080; do
            for lens in sets eras products; do
              echo "=== port=$port lens=$lens ==="
              set +e
              curl -sS --max-time 30 -D /tmp/h.$$ -o /tmp/b.$$ "http://127.0.0.1:$port/explore/rankings/lens/$lens?limit=60"
              code=$?
              set -e
              echo "curl_exit=$code"
              cat /tmp/h.$$ 2>/dev/null || true
              echo "body:"
              cat /tmp/b.$$ 2>/dev/null || true
              echo
            done
          done

      - name: Probe reader directly in-process
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          ./.venv/bin/python - <<'PY'
          import json, time, traceback
          from backend.db.services.pokemon_public_snapshot_service import get_pokemon_explore_rankings_lens_payload
          from backend.db.services.public_rip_publication_contract import canonical_publication_identity

          print("canonical_identity=" + json.dumps(canonical_publication_identity(), sort_keys=True))
          for lens in ("sets","eras","products"):
              started=time.time()
              try:
                  payload=get_pokemon_explore_rankings_lens_payload(lens=lens, limit=60)
                  print(json.dumps({
                      "lens":lens,
                      "status":"ok",
                      "elapsed":round(time.time()-started,3),
                      "target_count":len(payload.get("targets") or []),
                      "era_count":len(((payload.get("eraSetStrengthV1") or {}).get("eras") or [])),
                      "family_keys":len((payload.get("productFamilyRankings") or {})),
                      "meta":payload.get("meta"),
                  },default=str))
              except Exception as exc:
                  print(json.dumps({
                      "lens":lens,
                      "status":"error",
                      "elapsed":round(time.time()-started,3),
                      "type":type(exc).__name__,
                      "status_code":getattr(exc,"status_code",None),
                      "code":getattr(exc,"code",None),
                      "message":str(exc),
                  },default=str))
                  traceback.print_exc()
          PY
