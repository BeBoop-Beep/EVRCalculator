name: ME30th subset lifecycle tests

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Test 30th Celebration subset lifecycle branch
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/home/ubuntu/repos/me30th-subset-lifecycle-test
          BRANCH=fix/me30th-subset-lifecycle-20260920

          cd "$REPO"
          git fetch origin "$BRANCH"
          if [ -d "$WT" ]; then
            git worktree remove --force "$WT" || true
          fi
          git worktree add --detach "$WT" "origin/$BRANCH"
          ln -s /home/ubuntu/repos/EVRCalculator/backend/.env "$WT/backend/.env"

          cd "$WT"
          /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m py_compile             backend/constants/tcg/pokemon/otherEra/me30thCelebration.py             backend/constants/tcg/pokemon/megaEvolutionEra/me30thCelebrationClassicCollection.py             backend/scripts/build_pokemon_set_desirability_inputs.py

          /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m pytest -q             backend/tests/unit/db/test_pokemon_subset_structural_registry.py             backend/tests/unit/scripts/test_build_pokemon_set_desirability_inputs.py             backend/tests/unit/db/test_set_lifecycle_migration_contract.py

          rm -f "$WT/backend/.env"
          cd "$REPO"
          git worktree remove --force "$WT"
