name: Pokemon Onboarding Autonomy branch tests

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Test autonomy feature branch in isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/home/ubuntu/repos/pokemon-onboarding-autonomy-test
          BRANCH=fix/pokemon-onboarding-autonomy-20260920

          cd "$REPO"
          git fetch origin "$BRANCH"
          if [ -d "$WT" ]; then
            git worktree remove --force "$WT" || true
          fi
          git worktree add --detach "$WT" "origin/$BRANCH"
          ln -s /home/ubuntu/repos/EVRCalculator/backend/.env "$WT/backend/.env"

          cd "$WT"
          /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m py_compile             backend/services/pokemon_onboarding_git_service.py             backend/services/pokemon_set_onboarding_recheck_service.py             backend/scripts/refresh_due_pokemon_catalog_sets.py

          /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m pytest -q             backend/tests/unit/services/test_pokemon_onboarding_git_service.py             backend/tests/unit/services/test_pokemon_set_onboarding_recheck_service.py             backend/tests/unit/scripts/test_refresh_due_pokemon_catalog_sets.py             backend/tests/unit/services/test_pokemon_onboarding_end_to_end.py             backend/tests/unit/scripts/test_run_pending_pokemon_set_onboarding.py

          rm -f "$WT/backend/.env"
          cd "$REPO"
          git worktree remove --force "$WT"
