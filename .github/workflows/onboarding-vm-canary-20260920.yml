name: Pokemon onboarding final nonmutating proof

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: write

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Sync current main and verify Actions write path
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git fetch origin main
          git switch main
          git reset --hard origin/main
          gh auth setup-git
          git push --dry-run origin HEAD:main
          echo "MAIN_PUSH_DRY_RUN=true"

      - name: Dry-run catalog recheck refresh
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          ./.venv/bin/python backend/scripts/refresh_due_pokemon_catalog_sets.py             --dry-run             --limit 25             --max-provider-requests 50

      - name: Verify scheduler and checkout
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          echo "dirty_count=$(git status --porcelain | wc -l)"
          echo "legacy_onboarding_cron_count=$(crontab -l | grep -c 'run_pokemon_onboarding_worker.sh commit' || true)"
          echo "enable_marker=$(test -f /home/ubuntu/.pokemon_onboarding_enabled && echo present || echo absent)"
          test "$(crontab -l | grep -c 'run_pokemon_onboarding_worker.sh commit' || true)" -eq 0
          test ! -f /home/ubuntu/.pokemon_onboarding_enabled
