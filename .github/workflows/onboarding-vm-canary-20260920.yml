name: Provider fallback identity hosted unit tests

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-fallback-card-identity-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Run focused identity suites
        run: |
          python -m py_compile backend/scripts/build_pokemon_set_desirability_inputs.py
          python -m pytest -q             backend/tests/unit/scripts/test_build_pokemon_set_desirability_inputs.py             backend/tests/unit/scripts/test_build_pokemon_card_desirability_links.py
