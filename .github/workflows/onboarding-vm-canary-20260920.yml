name: Public route probe after slim directory repair

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe live public routes
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            label="$1"
            url="$2"
            echo "=== $label ==="
            rm -f body.out headers.out
            set +e
            curl -sS -L -D headers.out -o body.out               --connect-timeout 5               --max-time 40               -w 'http=%{http_code} start=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}\n'               "$url"
            code=$?
            set -e
            echo "curl_exit=$code"
            grep -Ei '^(HTTP/|x-vercel|x-matched-path|cache-control|content-type|server:|date:)' headers.out | tail -n 30 || true
            if [ -f body.out ]; then
              echo "body_bytes=$(wc -c < body.out)"
              echo "contains_pitch=$(grep -qi 'Pitch Black' body.out && echo true || echo false)"
              echo "contains_delta=$(grep -qi 'Delta Reign' body.out && echo true || echo false)"
              echo "contains_30th=$(grep -qi '30th Celebration' body.out && echo true || echo false)"
              echo "contains_route_loader=$(grep -qi 'Loading Rip Statistics' body.out && echo true || echo false)"
              echo "contains_set_client=$(grep -qi 'Loading set intelligence\|set-detail-glass-scope\|RIP Statistics unavailable' body.out && echo true || echo false)"
              head -c 300 body.out | tr '\n' ' ' || true
              echo
            fi
          }

          probe pitch "https://inthedex.io/TCGs/Pokemon/Sets/pitch-black"
          probe delta "https://inthedex.io/TCGs/Pokemon/Sets/me06-delta-reign"
          probe celebration "https://inthedex.io/TCGs/Pokemon/Sets/me-30th-celebration"
          probe explorer "https://inthedex.io/Explorer"
