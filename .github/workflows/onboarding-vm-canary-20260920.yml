name: ME30th subset production cutover

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  cutover:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Sync VM to merged main
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git restore -- payload_debug.json backend/constants/tcg/pokemon/pokemon_era_set_sync_report.json 2>/dev/null || true
          git fetch origin main
          git switch main
          git reset --hard origin/main
          echo "VM_SHA=$(git rev-parse HEAD)"
          git status --short

      - name: Sync root and subset lifecycle to production DB
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          ./.venv/bin/python backend/scripts/sync_pokemon_eras_and_sets.py --set me30thCelebration --apply
          ./.venv/bin/python backend/scripts/sync_pokemon_eras_and_sets.py --set me30thCelebrationClassicCollection --apply

      - name: Refresh parent and subset market data
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          ./.venv/bin/python backend/scripts/run_pokemon_set_scrape.py --run --set me30thCelebration
          ./.venv/bin/python backend/scripts/run_pokemon_set_scrape.py --run --set me30thCelebrationClassicCollection

      - name: Normalize canonical root and subset roles
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          ./.venv/bin/python backend/scripts/build_pokemon_set_desirability_inputs.py             --set me30thCelebration --commit --canonical-only
          ./.venv/bin/python backend/scripts/build_pokemon_set_desirability_inputs.py             --set me30thCelebrationClassicCollection --commit --canonical-only

      - name: Refresh parent market authority inputs and snapshots
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator

          ./.venv/bin/python -m backend.scripts.run_pokemon_market_set_authority             --commit             --set-name "ME: 30th Celebration"             --show-blockers || true

          ./.venv/bin/python backend/scripts/backfill_pokemon_set_value_daily_history.py             --set me30thCelebration             --commit

          ./.venv/bin/python backend/scripts/build_pokemon_set_cards_snapshots.py             --set-id me30thCelebration             --commit             --market-date 2026-09-20

          ./.venv/bin/python backend/scripts/build_pokemon_set_sealed_market_snapshots.py             --set-id me30thCelebration             --commit

          ./.venv/bin/python backend/scripts/build_pokemon_set_page_snapshots.py             --set-id me30thCelebration             --commit

      - name: Final VM state
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          git status --short
