name: Pokemon catalog refresh final commit canary

on:
  push:
    branches:
      - ops/onboarding-vm-canary-20260920

permissions:
  contents: read

jobs:
  refresh:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Sync current main
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          git fetch origin main
          git switch main
          git reset --hard origin/main
          echo "VM_SHA=$(git rev-parse HEAD)"
          git status --short

      - name: Wait for scrape and publication locks, then refresh
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator

          for n in $(seq 1 40); do
            echo "lock attempt $n/40"
            exec 8>/tmp/pokemon-scrape-dispatcher.lock
            exec 7>/tmp/pokemon-post-scrape-publication.lock

            if flock -n 8 && flock -n 7; then
              echo "LOCKS_ACQUIRED=true"
              ./.venv/bin/python backend/scripts/refresh_due_pokemon_catalog_sets.py                 --commit                 --limit 25                 --max-provider-requests 50
              exit $?
            fi

            # Close and reopen the descriptors on the next loop so a partially
            # acquired lock is never held while waiting.
            exec 8>&-
            exec 7>&-
            sleep 15
          done

          echo "Timed out waiting for scrape/publication locks" >&2
          exit 75

      - name: Final VM state
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          echo "dirty_count=$(git status --porcelain | wc -l)"
          git status --short
