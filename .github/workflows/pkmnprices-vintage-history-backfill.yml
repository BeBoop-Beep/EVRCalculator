name: PkmnPrices Vintage History Backfill

on:
  push:
    branches:
      - feat/pkmnprices-sold-evidence-v1-20260929
    paths:
      - ".github/workflows/pkmnprices-vintage-history-backfill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Backfill bounded sold history
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          PY="$REPO/.venv/bin/python"
          WT=/tmp/EVRCalculator-pkmnprices-history-backfill
          REF=origin/feat/pkmnprices-sold-evidence-v1-20260929

          cd "$REPO"
          git fetch origin feat/pkmnprices-sold-evidence-v1-20260929 --quiet
          rm -rf "$WT"
          git worktree add --detach "$WT" "$REF"
          trap 'git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true; rm -rf "$WT"' EXIT

          set -a
          . "$REPO/backend/.env"
          set +a
          test -n "${PKMNPRICES_API_KEY:-}" || { echo "PKMNPRICES_API_KEY missing on VM"; exit 20; }

          export PYTHONPATH="$WT"
          cd "$WT"

          "$PY" backend/scripts/run_pkmnprices_sold_evidence.py             --commit             --market-date 2026-09-28             --sync-mode historical_backfill             --item-credit-cap 2500             --max-sold-per-card 200

          echo "PKMNPRICES_VINTAGE_HISTORY_BACKFILL=PASS"
