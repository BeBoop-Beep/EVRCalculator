name: Temporary V2 vintage debug

on:
  push:
    branches:
      - fix/market-explorer-v2-runtime-cutover-20260910
    paths:
      - .github/workflows/tmp-v2-vintage-debug.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-explorer-v2-runtime-cutover-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            pytest supabase==2.28.3 python-dotenv==1.2.2
      - name: Fix vintage V2 tests and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/tests/unit/scripts/test_repair_market_explorer_vintage_predecessor_identities.py')
          s = p.read_text()
          bad = '        assert reproject_calls[0][1]["p_through_date"] == str(date(2026, 9, 1))'
          count = s.count(bad)
          assert count == 2, f'expected 2 bad indent lines, found {count}'
          s = s.replace(
              bad,
              '    assert reproject_calls[0][1]["p_through_date"] == str(date(2026, 9, 1))',
          )
          p.write_text(s)
          PY

          python -m py_compile \
            backend/scripts/repair_market_explorer_vintage_predecessor_identities.py \
            backend/tests/unit/scripts/test_repair_market_explorer_vintage_predecessor_identities.py
          git diff --check

          export SUPABASE_URL='https://example.supabase.co'
          export SUPABASE_SERVICE_ROLE_KEY='dummy-service-role-key'
          export SUPABASE_ANON_KEY='dummy-anon-key'
          python -m pytest -q \
            backend/tests/unit/scripts/test_repair_market_explorer_vintage_predecessor_identities.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/unit/scripts/test_repair_market_explorer_vintage_predecessor_identities.py
          git commit -m 'Fix vintage V2 repair acceptance tests'
          git push origin HEAD:fix/market-explorer-v2-runtime-cutover-20260910
