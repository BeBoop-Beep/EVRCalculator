name: Temporary V2 vintage debug

on:
  push:
    branches:
      - fix/market-explorer-v2-runtime-cutover-20260910
    paths:
      - .github/workflows/tmp-v2-vintage-debug.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-explorer-v2-runtime-cutover-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            pytest supabase==2.28.3 python-dotenv==1.2.2
      - name: Apply cutover and capture focused failure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/tmp-v2-vintage-repair-cutover.yml').read_text().splitlines()
          marker = '      - name: Cut vintage repair to V2-only'
          start = src.index(marker)
          run_idx = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
          body = []
          for line in src[run_idx + 1:]:
              if line and not line.startswith('          '):
                  break
              body.append(line[10:] if line.startswith('          ') else '')
          script = '\n'.join(body) + '\n'
          script = script.replace(
              'python -m pytest -q backend/tests/unit/scripts/test_repair_market_explorer_vintage_predecessor_identities.py',
              'python -m pytest -q backend/tests/unit/scripts/test_repair_market_explorer_vintage_predecessor_identities.py || true',
          )
          Path('/tmp/cutover.sh').write_text(script)
          PY

          export SUPABASE_URL='https://example.supabase.co'
          export SUPABASE_SERVICE_ROLE_KEY='dummy-service-role-key'
          export SUPABASE_ANON_KEY='dummy-anon-key'
          bash /tmp/cutover.sh

          set +e
          python -m pytest -q backend/tests/unit/scripts/test_repair_market_explorer_vintage_predecessor_identities.py > /tmp/vintage-v2-test.log 2>&1
          status=$?
          set -e
          cat /tmp/vintage-v2-test.log
          mkdir -p backend/artifacts/market_explorer_acceptance
          cp /tmp/vintage-v2-test.log backend/artifacts/market_explorer_acceptance/tmp_vintage_v2_test.log
          printf '\nexit_code=%s\n' "$status" >> backend/artifacts/market_explorer_acceptance/tmp_vintage_v2_test.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/artifacts/market_explorer_acceptance/tmp_vintage_v2_test.log
          git commit -m 'Capture vintage V2 cutover test result' || true
          git push origin HEAD:fix/market-explorer-v2-runtime-cutover-20260910
