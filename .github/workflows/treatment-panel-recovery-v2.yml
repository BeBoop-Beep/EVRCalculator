name: Treatment Panel Recovery V2 Preflight

on:
  push:
    branches:
      - research/treatment-panel-recovery-v2-current-20261001
    paths:
      - 'backend/scripts/research_treatment_panel_recovery_v2.py'
      - 'backend/tests/unit/scripts/test_research_treatment_panel_recovery_v2.py'
      - '.github/workflows/treatment-panel-recovery-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PKMNPRICES_API_KEY: ${{ secrets.PkmnPrices_Secret }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q pytest==8.3.5 numpy==2.4.3 python-dotenv==1.2.2 supabase==2.28.3
      - name: Verify secret availability without disclosure
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python - <<'PY'
          import os
          print("pkmnprices_secret_present=" + str(bool(os.environ.get("PKMNPRICES_API_KEY"))).lower())
          PY
      - name: Unit tests
        run: python -m pytest -q backend/tests/unit/scripts/test_research_treatment_panel_recovery_v2.py
      - name: Live DB preflight (zero provider calls / zero writes)
        run: |
          python backend/scripts/research_treatment_panel_recovery_v2.py \
            --market-date 2026-09-29 \
            --period 180d \
            --credit-cap 9000 \
            --output backend/artifacts/treatment_panel_recovery_v2/preflight.json
      - name: Upload preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: treatment-panel-recovery-v2-preflight
          path: backend/artifacts/treatment_panel_recovery_v2/preflight.json
          if-no-files-found: error
