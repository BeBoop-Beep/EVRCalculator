name: Treatment Panel Recovery V2 VM

on:
  push:
    branches:
      - vm-ops-control
    paths:
      - '.vm-ops/treatment-panel-recovery-v2.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: treatment-panel-recovery-v2-vm
  cancel-in-progress: false

jobs:
  capture:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 45
    steps:
      - name: Checkout pinned research branch
        uses: actions/checkout@v4
        with:
          ref: research/treatment-panel-recovery-v2-current-20261001
          fetch-depth: 1
      - name: Verify pinned research SHA
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="909fc50b4c6bce4723745b6f364ae7550e7e1887"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "research_sha=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Download frozen SIR-Ultra gate artifact
        uses: actions/download-artifact@v4
        with:
          name: treatment-panel-gate-expansion-v2-vm
          path: backend/artifacts/treatment_panel_recovery_v2/base
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 36961641617
      - name: Capture Double-Ultra-SIR three-level bridge
        shell: bash
        run: |
          set -euo pipefail
          PROD_REPO="/home/ubuntu/repos/EVRCalculator"
          PY="$PROD_REPO/.venv/bin/python"
          test -x "$PY"
          test -f "$PROD_REPO/backend/.env"
          set -a
          . "$PROD_REPO/backend/.env"
          set +a
          test -n "${PKMNPRICES_API_KEY:-}"
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          mkdir -p backend/artifacts/treatment_panel_recovery_v2
          "$PY" backend/scripts/research_treatment_three_level_bridge_v1.py \
            --base-gate-artifact backend/artifacts/treatment_panel_recovery_v2/base/gate_expansion.json \
            --market-date 2026-09-29 \
            --period 180d \
            --credit-cap 3000 \
            --output backend/artifacts/treatment_panel_recovery_v2/three_level_bridge_v1.json
      - name: Upload three-level bridge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treatment-three-level-bridge-v1-vm
          path: backend/artifacts/treatment_panel_recovery_v2/three_level_bridge_v1.json
          if-no-files-found: warn
