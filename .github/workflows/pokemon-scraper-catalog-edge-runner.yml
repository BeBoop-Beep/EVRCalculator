name: Pokemon sealed-only catalog scraper gate

on:
  push:
    branches:
      - fix/pokemon-new-set-catalog-20260920

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog-only scraper postcondition
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          eval "$("$PY" - <<'PY'
          from dotenv import dotenv_values
          import shlex
          values = dotenv_values("/home/ubuntu/repos/EVRCalculator/backend/.env")
          for name in ("SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_ANON_KEY"):
              value = str(values.get(name) or "").strip()
              if not value:
                  raise SystemExit(f"missing required VM env: {name}")
              print(f"export {name}={shlex.quote(value)}")
          PY
          )"
          "$PY" -m py_compile backend/scripts/run_pokemon_set_scrape.py
          "$PY" -m pytest -q             backend/tests/unit/scripts/test_scrape_postcondition_market_date.py             backend/tests/unit/scraper/test_tcgplayer_parser_dto.py             backend/tests/unit/scraper/test_tcgplayer_external_identity.py
