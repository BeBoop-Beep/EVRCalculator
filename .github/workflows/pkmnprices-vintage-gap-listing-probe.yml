name: PkmnPrices Vintage Gap Listing Probe

on:
  push:
    branches:
      - research/pkmnprices-vintage-gap-calibration-20260929
    paths:
      - ".github/workflows/pkmnprices-vintage-gap-listing-probe.yml"
      - "backend/pricing_pipeline/pkmnprices_client.py"
      - "backend/scripts/probe_pkmnprices_vintage_gap_listings.py"
      - "backend/tests/unit/pricing_pipeline/test_pkmnprices.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused unit tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q backend/tests/unit/pricing_pipeline/test_pkmnprices.py

  probe:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Probe exact Near Mint TCGplayer listings
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          PY="$REPO/.venv/bin/python"
          WT=/tmp/EVRCalculator-pkmnprices-gap-listing-probe
          REF=origin/research/pkmnprices-vintage-gap-calibration-20260929

          cd "$REPO"
          git fetch origin research/pkmnprices-vintage-gap-calibration-20260929 --quiet
          rm -rf "$WT"
          git worktree add --detach "$WT" "$REF"
          trap 'git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true; rm -rf "$WT"' EXIT

          set -a
          . "$REPO/backend/.env"
          set +a
          test -n "${PKMNPRICES_API_KEY:-}" || { echo "PKMNPRICES_API_KEY missing on VM"; exit 20; }

          export PYTHONPATH="$WT"
          cd "$WT"
          "$PY" backend/scripts/probe_pkmnprices_vintage_gap_listings.py --market-date 2026-09-28
