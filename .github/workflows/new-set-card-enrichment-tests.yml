name: New Set Card Enrichment Tests

on:
  push:
    branches: [fix/new-set-card-enrichment-20260922]
    paths:
      - '.github/workflows/new-set-card-enrichment-tests.yml'
      - 'backend/db/clients/scrydex_pokemon_client.py'
      - 'backend/db/services/pokemon_tcg_image_sync_service.py'
      - 'backend/scripts/sync_pokemon_images.py'
      - 'backend/services/pokemon_set_onboarding_service.py'
      - 'backend/tests/unit/db/clients/test_scrydex_pokemon_client.py'
      - 'backend/tests/unit/services/test_pokemon_tcg_image_sync_catalog_sources.py'
      - 'backend/tests/unit/services/test_pokemon_set_onboarding_service.py'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests python-dotenv supabase
      - name: Run targeted enrichment tests
        run: |
          pytest -q \
            backend/tests/unit/db/clients/test_scrydex_pokemon_client.py \
            backend/tests/unit/services/test_pokemon_tcg_image_sync_catalog_sources.py \
            backend/tests/unit/services/test_pokemon_set_onboarding_service.py
