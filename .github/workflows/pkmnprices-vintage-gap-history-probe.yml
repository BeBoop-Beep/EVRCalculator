name: PkmnPrices Vintage Gap History Probe

on:
  push:
    branches:
      - research/pkmnprices-vintage-history-gap-20260929
    paths:
      - ".github/workflows/pkmnprices-vintage-gap-history-probe.yml"
      - "backend/pricing_pipeline/pkmnprices_client.py"
      - "backend/scripts/probe_pkmnprices_vintage_gap_history.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Probe historical exact Near Mint variants
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          PY="$REPO/.venv/bin/python"
          WT=/tmp/EVRCalculator-pkmnprices-gap-history-probe
          REF=origin/research/pkmnprices-vintage-history-gap-20260929

          exec 9>/tmp/pkmnprices-api.lock
          flock -w 300 9 || { echo "PkmnPrices API lock remained held"; exit 21; }

          cd "$REPO"
          git fetch origin research/pkmnprices-vintage-history-gap-20260929 --quiet
          rm -rf "$WT"
          git worktree add --detach "$WT" "$REF"
          trap 'git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true; rm -rf "$WT"' EXIT

          set -a
          . "$REPO/backend/.env"
          set +a
          test -n "${PKMNPRICES_API_KEY:-}" || { echo "PKMNPRICES_API_KEY missing on VM"; exit 20; }

          export PYTHONPATH="$WT"
          cd "$WT"
          "$PY" -m py_compile backend/pricing_pipeline/pkmnprices_client.py backend/scripts/probe_pkmnprices_vintage_gap_history.py
          "$PY" backend/scripts/probe_pkmnprices_vintage_gap_history.py --market-date 2026-09-28
