name: Incident Actions Status
# refresh 2026-09-21 23:39 Phoenix

on:
  push:
    branches: [ops/incident-status-20260921]
    paths:
      - '.github/workflows/incident-actions-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/incident-status-20260921
          fetch-depth: 1
      - name: Capture recent workflow runs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=60" > /tmp/runs.json
          mkdir -p ops/assistant
          python -c 'import json; from pathlib import Path; p=json.loads(Path("/tmp/runs.json").read_text()); rows=[{"id":r.get("id"),"name":r.get("name"),"status":r.get("status"),"conclusion":r.get("conclusion"),"run_number":r.get("run_number"),"head_sha":r.get("head_sha"),"head_branch":r.get("head_branch"),"event":r.get("event"),"created_at":r.get("created_at"),"updated_at":r.get("updated_at")} for r in (p.get("workflow_runs") or []) if r.get("status")!="completed"]; print(json.dumps(rows,indent=2,sort_keys=True)); Path("ops/assistant/incident-actions-status.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n")'
          git config user.name "inDex incident status"
          git config user.email "actions@users.noreply.github.com"
          git add ops/assistant/incident-actions-status.json
          git commit -m "ops: capture current workflow status"
          git push origin HEAD:ops/incident-status-20260921
