name: Treatment Triangle Joint Model V1

on:
  push:
    branches:
      - research/treatment-panel-recovery-v2-current-20261001
    paths:
      - 'backend/scripts/research_treatment_triangle_joint_model_v1.py'
      - '.github/workflows/treatment-triangle-joint-model-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q numpy==2.4.3 python-dotenv==1.2.2 supabase==2.28.3
      - name: Download frozen triangle artifact
        uses: actions/download-artifact@v4
        with:
          name: treatment-triangle-dr-ur-sir-v1-vm
          path: backend/artifacts/treatment_panel_recovery_v2/input_triangle
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 37038152244
      - name: Fit joint treatment triangle
        run: |
          python backend/scripts/research_treatment_triangle_joint_model_v1.py \
            --artifact backend/artifacts/treatment_panel_recovery_v2/input_triangle/triangle_dr_ur_sir_v1.json \
            --output backend/artifacts/treatment_panel_recovery_v2/treatment_triangle_joint_v1.json \
            --report backend/artifacts/treatment_panel_recovery_v2/TREATMENT_TRIANGLE_JOINT_V1.md
      - name: Upload joint model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: treatment-triangle-joint-v1
          path: |
            backend/artifacts/treatment_panel_recovery_v2/treatment_triangle_joint_v1.json
            backend/artifacts/treatment_panel_recovery_v2/TREATMENT_TRIANGLE_JOINT_V1.md
          if-no-files-found: error
