name: Pokemon onboarding fix runner

on:
  push:
    branches:
      - fix/pokemon-new-set-catalog-20260920
  workflow_dispatch:

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Pokemon onboarding repair
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          "$PY" -m pip install -q pytest
          eval "$("$PY" - <<'PY'
          from dotenv import dotenv_values
          import shlex
          values = dotenv_values("/home/ubuntu/repos/EVRCalculator/backend/.env")
          for name in ("SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_ANON_KEY"):
              value = str(values.get(name) or "").strip()
              if not value:
                  raise SystemExit(f"missing required VM env: {name}")
              print(f"export {name}={shlex.quote(value)}")
          PY
          )"
          "$PY" -m py_compile             backend/db/repositories/pokemon_set_onboarding_repository.py             backend/services/pokemon_set_config_generation_service.py             backend/services/pokemon_set_onboarding_service.py             backend/db/services/pokemon_era_set_sync_service.py             backend/constants/tcg/pokemon/megaEvolutionEra/me06DeltaReign.py             backend/constants/tcg/pokemon/megaEvolutionEra/me30thCelebrationClassicCollection.py             backend/constants/tcg/pokemon/otherEra/me30thCelebration.py
          "$PY" -m pytest -q             backend/tests/unit/db/test_pokemon_set_onboarding_repository_v2.py             backend/tests/unit/services/test_pokemon_set_config_generation_service.py             backend/tests/unit/services/test_pokemon_set_onboarding_service.py             backend/tests/unit/services/test_pokemon_era_set_sync_targeted.py             backend/tests/unit/services/test_pokemon_onboarding_end_to_end.py \
            backend/tests/unit/db/services/test_pokemon_set_performance_projections.py
