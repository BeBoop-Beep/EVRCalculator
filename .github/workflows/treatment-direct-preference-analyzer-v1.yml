name: Treatment Direct Preference Analyzer V1

on:
  push:
    branches:
      - research/treatment-panel-recovery-v2-current-20261001
    paths:
      - 'backend/scripts/research_treatment_direct_preference_analyzer_v1.py'
      - 'backend/tests/unit/scripts/test_research_treatment_direct_preference_analyzer_v1.py'
      - '.github/workflows/treatment-direct-preference-analyzer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q pytest==8.3.5 numpy==2.4.3
      - name: Run direct-preference analyzer tests
        run: |
          python -m pytest -q             backend/tests/unit/scripts/test_research_treatment_direct_preference_analyzer_v1.py
