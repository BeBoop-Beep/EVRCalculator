name: Bucket B4 Ramp VM Activation

on:
  push:
    branches:
      - ops/b4-ramp-vm-activation-20260929
    paths:
      - ".bucket-b4-ramp-vm/request.txt"
      - ".github/workflows/bucket-b4-ramp-vm.yml"

permissions:
  contents: read

concurrency:
  group: bucket-b4-ramp-vm
  cancel-in-progress: false

jobs:
  vm:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 90
    env:
      RELEASE_SHA: 28dd2736cd508f6e1c7f482b1f9440726222b1cf
      VM_REQUEST_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Resolve fixed operation
        shell: bash
        run: |
          set -euo pipefail
          case "$VM_REQUEST_MESSAGE" in
            "bucket-b4-ramp: noop") OP=noop ;;
            "bucket-b4-ramp: apply") OP=apply ;;
            "bucket-b4-ramp: repin") OP=repin ;;
            "bucket-b4-ramp: run") OP=run ;;
            "bucket-b4-ramp: status") OP=status ;;
            *) echo "REFUSING: invalid fixed operation"; exit 2 ;;
          esac
          echo "OP=$OP" >> "$GITHUB_ENV"
          echo "operation=$OP release_sha=$RELEASE_SHA"

      - name: Execute fixed operation
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          WT=/tmp/EVRCalculator-b4-ramp-activation
          STATE=/home/ubuntu/state/market_microstructure_b4
          PY="$REPO/.venv/bin/python"

          cleanup() {
            if [ -d "$WT" ]; then
              git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true
              rm -rf "$WT" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          prepare_release() {
            test -d "$REPO/.git" || { echo "REFUSING: production repo missing"; exit 2; }
            test -x "$PY" || { echo "REFUSING: shared Python runtime missing"; exit 2; }
            git -C "$REPO" fetch origin develop --quiet
            git -C "$REPO" cat-file -e "$RELEASE_SHA^{commit}" || {
              echo "REFUSING: reviewed ramp release unavailable"; exit 2;
            }
            if [ -e "$WT" ]; then
              git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || rm -rf "$WT"
            fi
            git -C "$REPO" worktree add --detach "$WT" "$RELEASE_SHA"
            test "$(git -C "$WT" rev-parse HEAD)" = "$RELEASE_SHA" || {
              echo "REFUSING: ramp worktree SHA mismatch"; exit 2;
            }
          }

          case "$OP" in
            noop)
              echo "BUCKET_B4_RAMP_NOOP=PASS"
              ;;

            apply)
              prepare_release
              MARKET_B4_ENV_REPO="$REPO"                 /bin/bash "$WT/infra/oracle/install_market_microstructure_bucket_b4_cron.sh" --apply
              ;;

            repin)
              prepare_release
              exec 6>/tmp/active-supply-panel.lock
              /usr/bin/flock -n 6 || { echo "REFUSING: active-supply busy"; exit 75; }
              exec 8>/tmp/pkmnprices-api.lock
              /usr/bin/flock -n 8 || { echo "REFUSING: provider busy"; exit 75; }
              exec 9>/tmp/pokemon-post-scrape-publication.lock
              /usr/bin/flock -n 9 || { echo "REFUSING: publication busy"; exit 75; }

              RUNTIME="$STATE/runtime"
              git -C "$REPO" worktree prune
              if [ -e "$RUNTIME" ]; then
                git -C "$REPO" worktree remove --force "$RUNTIME" >/dev/null 2>&1 || rm -rf "$RUNTIME"
              fi
              git -C "$REPO" worktree add --detach "$RUNTIME" "$RELEASE_SHA"
              [ "$(git -C "$RUNTIME" rev-parse HEAD)" = "$RELEASE_SHA" ] || {
                echo "REFUSING: detached runtime SHA mismatch"; exit 2;
              }
              printf '%s\n' "$RELEASE_SHA" > "$STATE/release.sha.tmp"
              chmod 600 "$STATE/release.sha.tmp"
              mv "$STATE/release.sha.tmp" "$STATE/release.sha"
              echo "BUCKET_B4_RUNTIME_REPINNED source_sha=$RELEASE_SHA runtime=$RUNTIME"
              ;;

            run)
              [ -r "$STATE/release.sha" ] || {
                echo "REFUSING: B4 release pin missing"; exit 2;
              }
              PIN="$(tr -d '[:space:]' < "$STATE/release.sha")"
              [ "$PIN" = "$RELEASE_SHA" ] || {
                echo "REFUSING: B4 release pin mismatch expected=$RELEASE_SHA actual=$PIN"; exit 2;
              }
              /bin/bash "$STATE/runtime/infra/oracle/run_market_microstructure_bucket_b4.sh"
              ;;

            status)
              echo "reviewed_release_sha=$RELEASE_SHA"
              if [ -r "$STATE/release.sha" ]; then
                PIN="$(tr -d '[:space:]' < "$STATE/release.sha")"
                echo "release_pin_present=true"
                [ "$PIN" = "$RELEASE_SHA" ] && echo "release_pin_matches_reviewed=true" || echo "release_pin_matches_reviewed=false"
              else
                echo "release_pin_present=false"
                echo "release_pin_matches_reviewed=false"
              fi
              crontab -l 2>/dev/null | grep 'run_market_microstructure_bucket_b4.sh' || true
              ;;
          esac
