name: Restart Sep22 Repair With Stale-Lock Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-sep21-repair.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Force-cancel superseded Sep22 repair run
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=35779925714
          CODE="$(curl --silent --show-error -o /tmp/force.txt -w '%{http_code}' -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/force-cancel" || true)"
          echo "force_cancel_run=$RUN_ID http=$CODE body=$(cat /tmp/force.txt 2>/dev/null || true)"
          if [ "$CODE" != "202" ] && [ "$CODE" != "409" ]; then
            exit 1
          fi
