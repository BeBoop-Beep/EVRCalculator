name: Best-Open final read-coherence validation
on:
  push:
    branches: [fix/best-open-review]
    paths: ['.github/workflows/best-open-review-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply checksum-verified read-coherence corrections
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib
          raw=lzma.decompress(base64.b64decode(pathlib.Path('.review-transport/extra.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest()=='32ec5bd3d47cbc169d297575bf97afc72cd773072560450a07e904684c7d2df3'
          ops=json.loads(raw)
          for op in ops:
              p=pathlib.Path(op['path']);before=p.read_bytes()
              assert hashlib.sha256(before).hexdigest()==op['old'],str(p)
              lines=before.decode().splitlines(keepends=True)
              for a,b,t in sorted(op['edits'],reverse=True):lines[a:b]=[t]
              after=''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest()==op['new'],str(p)
              p.write_bytes(after)
          pathlib.Path('/tmp/extra-ops.json').write_bytes(raw)
          PY
      - run: python -m pip install -q pytest numpy==2.4.3 pandas==2.2.3 scipy psutil supabase==2.28.3 python-dotenv==1.2.2
      - name: Run affected backend matrix
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          paths=sorted({str(p) for p in Path('backend/tests/unit').rglob('test_*.py') if any(t in p.name for t in ('best_open','budget_normalized_product_ranking','budget_product_ranking','financial_rip_v3','financial_rip_v4','overall_rip_v12'))})
          paths+=['backend/tests/unit/db/services/test_pokemon_sealed_product_detail_service.py','backend/tests/unit/db/services/test_public_overall_product_rankings_service.py']
          raise SystemExit(subprocess.call([sys.executable,'-m','pytest','-q',*paths]))
          PY
      - name: Export validated tree; no workflow writes or ref mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,urllib.request
          ops=json.loads(pathlib.Path('/tmp/extra-ops.json').read_text())
          entries=[{'path':o['path'],'mode':'100644','type':'blob','content':pathlib.Path(o['path']).read_text()} for o in ops]
          entries.append({'path':'.review-transport/extra.b64','mode':'100644','type':'blob','sha':None})
          payload={'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip(),'tree':entries}
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req) as resp:tree=json.load(resp)['sha']
          pathlib.Path('review-result.json').write_text(json.dumps({'tree':tree,'parent':os.environ['GITHUB_SHA']},indent=2))
          print('VALIDATED_TREE='+tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: best-open-review-final-tree
          path: review-result.json
          retention-days: 1
