name: Price Projection Transient Retry Validation

on:
  pull_request:
    branches: [main]
    paths:
      - backend/db/services/price_storage_v2_projection_gate.py
      - backend/tests/unit/db/services/test_price_storage_v2_projection_gate.py
      - .github/workflows/price-projection-transient-retry-validation.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install -q pytest supabase==2.28.3 python-dotenv==1.2.2
      - name: Compile changed modules
        run: |
          python -m py_compile             backend/db/services/price_storage_v2_projection_gate.py             backend/tests/unit/db/services/test_price_storage_v2_projection_gate.py
      - name: Run focused projection gate tests
        run: python -m pytest -q backend/tests/unit/db/services/test_price_storage_v2_projection_gate.py
