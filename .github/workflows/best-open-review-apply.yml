name: Apply checksum-verified Best-Open review corrections
on:
  push:
    branches: [fix/best-open-review]
    paths: ['.github/workflows/best-open-review-apply.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: best_open_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d best_open_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      BEST_OPEN_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/best_open_test
      BEST_OPEN_ACK_DISPOSABLE: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct reviewed changes with old/new SHA-256 gates
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          expected=['ece0763ba83b092e2e2419a9ed8c09d3ada797a2','7c28a6d32f1a8ec5a4e66989c260e11fef4dc1bd','69c49484f71abeb9e59d7e3a96478198195ca848','d46dc4d599c79a9b1e7b1a94215d666e7a402659','40197c72b5fae9595215ea0a492782f32b62913e','2a15e31fd8ce6029a0cffb0fa143f551599a597a']
          chunks=[]
          for i,want in enumerate(expected):
              data=pathlib.Path(f'.review-transport/part{i}').read_bytes()
              if i==0:
                  text=base64.b64encode(data).decode()
                  assert text.count('CfVU2U2Wqp')==1
                  data=base64.b64decode(text.replace('CfVU2U2Wqp','CfVU2U1Wqp'))
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==want
              chunks.append(data)
          raw=lzma.decompress(b''.join(chunks))
          assert hashlib.sha256(raw).hexdigest()=='862194240e96ea5bc5f47b703d7ab045c710bbfe0b75333dad1f221e5f1a6114'
          ops=json.loads(raw)
          for op in ops:
              p=pathlib.Path(op['path'])
              assert not p.is_absolute() and '..' not in p.parts
              before=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None)==op['old'],str(p)
              if op['new'] is None:
                  p.unlink()
              else:
                  lines=(before.decode('utf-8') if before else '').splitlines(keepends=True)
                  for start,end,replacement in sorted(op['edits'],reverse=True):
                      lines[start:end]=[replacement]
                  after=''.join(lines).encode('utf-8')
                  assert hashlib.sha256(after).hexdigest()==op['new'],str(p)
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(after)
          pathlib.Path('/tmp/review-ops.json').write_bytes(raw)
          print('Verified and applied',len(ops),'review corrections.')
          PY
      - run: python -m pip install -q pytest numpy==2.4.3 pandas==2.2.3 scipy psutil supabase==2.28.3 python-dotenv==1.2.2 fastapi==0.135.3 PyJWT==2.12.1 requests==2.32.5 stripe==15.4.0 'psycopg[binary]'
      - name: Real PostgreSQL concurrency and migration tests
        run: python -m pytest -q backend/tests/integration/test_best_open_publication_postgres.py
      - name: Backend regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          paths=sorted({str(p) for p in Path('backend/tests').rglob('test_*.py') if any(x in p.name for x in ('best_open','prepared_financial','financial_rip_v3','financial_rip_v4','budget_product','budget_normalized_product')) and 'integration' not in p.parts})
          paths.append('backend/tests/unit/db/services/test_pokemon_sealed_product_detail_service.py')
          raise SystemExit(subprocess.call([sys.executable,'-m','pytest','-q',*paths]))
          PY
          bash -n infra/local/run_simulations.sh
          bash -n infra/local/run_best_open_price.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend behavior and contracts
        working-directory: frontend
        run: node --test lib/rankings/*.test.mjs components/explore/rankingsProductLensModel.test.mjs components/explore/BestOpenPriceRankings.contract.test.mjs lib/access/bestOpenPriceAccess.test.mjs components/pokemon/sealed-product-detail/*.test.mjs
      - name: Export application tree only; never update refs or workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,urllib.request,urllib.error
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def call(path,payload):
              req=urllib.request.Request(api+path,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req) as response: return json.load(response)
              except urllib.error.HTTPError as exc:
                  print('Git object export refused:',exc.code,exc.read().decode())
                  raise
          ops=json.loads(pathlib.Path('/tmp/review-ops.json').read_text())
          entries=[]
          for op in ops:
              if op['path'].startswith('.github/'):
                  continue
              p=pathlib.Path(op['path'])
              oldmode=subprocess.check_output(['git','ls-files','--stage','--',str(p)]).decode().split()
              entry={'path':str(p),'mode':oldmode[0] if oldmode else '100644','type':'blob'}
              if p.exists(): entry['content']=p.read_text()
              else: entry['sha']=None
              entries.append(entry)
          for i in range(6):
              entries.append({'path':f'.review-transport/part{i}','mode':'100644','type':'blob','sha':None})
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()
          tree=call('/git/trees',{'base_tree':base,'tree':entries})['sha']
          pathlib.Path('review-result.json').write_text(json.dumps({'tree':tree,'parent':os.environ['GITHUB_SHA'],'files':[o['path'] for o in ops],'workflow_changes_pending':True},indent=2))
          print('VALIDATED_APPLICATION_TREE='+tree)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: best-open-review-validated
          path: review-result.json
          if-no-files-found: ignore
          retention-days: 1
