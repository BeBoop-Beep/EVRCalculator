name: FMA-5 Live Adapter Validation

on:
  push:
    branches:
      - ops/fma5-live-adapter-validation-20260930
    paths:
      - ".github/workflows/fma5-live-adapter-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check -q             pytest==8.3.5 supabase==2.28.3 python-dotenv==1.2.2

      - name: Run live adapter and projection regressions
        run: |
          python -m pytest             backend/tests/unit/db/services/test_market_activity_projection_repository.py             backend/tests/unit/pricing_pipeline/test_market_activity_projection.py             backend/tests/unit/domain/pokemon/test_market_activity.py             backend/tests/unit/domain/pokemon/test_market_activity_review_closure.py             -q -p no:cacheprovider
          echo "FMA5_LIVE_ADAPTER_VALIDATION_OK"
