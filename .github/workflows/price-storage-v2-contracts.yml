name: Price Storage V2 isolated contracts

on:
  pull_request:
    paths:
      - '.github/workflows/price-storage-v2-contracts.yml'
      - 'backend/db/proposals/price_storage_v2_scoped_publication.sql'
      - 'backend/db/services/price_storage_v2_integration.py'
      - 'backend/db/services/pokemon_market_rollout_index.py'
      - 'backend/scripts/*price_storage_v2*'
      - 'backend/tests/*price_storage_v2*'
      - 'docs/price_storage_v2/applied_migration_manifest.psv'
      - 'docs/price_storage_v2/applied_migrations/**'

permissions:
  contents: read

concurrency:
  group: price-storage-v2-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-postgres:
    name: PostgreSQL 17.6 scope transaction tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: price_storage_v2_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
          PGUSER: postgres
          PGDATABASE: price_storage_v2_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit and compile checks
        run: |
          python3 backend/tests/run_price_storage_v2_unit.py
          python3 -m py_compile backend/tests/test_price_storage_v2_postgres.py
      - name: Verify original SQL archive and report remaining migration gaps
        run: |
          python3 backend/scripts/audit_price_storage_v2_migration_sources.py > /tmp/price-storage-v2-migration-audit.json
          python3 - <<'PY'
          import json
          report=json.load(open('/tmp/price-storage-v2-migration-audit.json'))
          print('MIGRATION_SOURCE_INVENTORY='+json.dumps({k:v for k,v in report.items() if k!='records'},sort_keys=True))
          print('MIGRATION_SOURCE_CONFLICTS='+json.dumps([r for r in report['records'] if r['status']=='alias_or_content_conflict'],sort_keys=True))
          PY
      - name: Execute proposal on disposable PostgreSQL, never Supabase
        env:
          PRICE_STORAGE_V2_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 -m backend.tests.test_price_storage_v2_postgres
