name: Treatment Set-Relative Hierarchy V2

on:
  push:
    branches:
      - research/treatment-panel-recovery-v2-current-20261001
    paths:
      - 'backend/scripts/research_treatment_set_relative_hierarchy_v2.py'
      - 'backend/tests/unit/scripts/test_research_treatment_set_relative_hierarchy_v2.py'
      - '.github/workflows/treatment-set-relative-hierarchy-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: treatment-set-relative-hierarchy-v2
  cancel-in-progress: false

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q pytest==8.3.5 numpy==2.4.3 python-dotenv==1.2.2 supabase==2.28.3
      - name: Unit tests
        run: python -m pytest -q backend/tests/unit/scripts/test_research_treatment_set_relative_hierarchy_v2.py
      - name: Wait for frozen fresh capture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          run_id = 37061908972
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "inDex-Treatment-V2-estimator",
          }
          while True:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              status = str(payload.get("status") or "")
              conclusion = payload.get("conclusion")
              print(f"fresh_capture_run={run_id} status={status} conclusion={conclusion}", flush=True)
              if status == "completed":
                  break
              time.sleep(30)
          PY
      - name: Download frozen fresh expansion capture
        uses: actions/download-artifact@v4
        with:
          name: treatment-set-relative-expansion-v2-capture
          path: backend/artifacts/treatment_set_relative_v2/fresh
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 37061908972
      - name: Download frozen prior independent replication panel
        uses: actions/download-artifact@v4
        with:
          name: treatment-joint-replication-v1-panel
          path: backend/artifacts/treatment_set_relative_v2/prior
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 36971438903
      - name: Fit preregistered Set-relative Treatment V2
        run: |
          python backend/scripts/research_treatment_set_relative_hierarchy_v2.py \
            --prior-panel backend/artifacts/treatment_set_relative_v2/prior/panel.json \
            --fresh-panel backend/artifacts/treatment_set_relative_v2/fresh/capture.json \
            --output backend/artifacts/treatment_set_relative_v2/result.json \
            --report backend/artifacts/treatment_set_relative_v2/FINAL_REPORT.md
      - name: Upload V2 estimator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treatment-set-relative-hierarchy-v2
          path: |
            backend/artifacts/treatment_set_relative_v2/result.json
            backend/artifacts/treatment_set_relative_v2/FINAL_REPORT.md
          if-no-files-found: warn
