name: FV Shadow Forward Outcomes Validation

on:
  push:
    branches:
      - ci/fv-shadow-forward-outcomes-v1-20261002

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fv_forward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fv_forward_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fv_forward_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -q pytest numpy==2.4.3 supabase==2.28.3 python-dotenv==1.2.2
      - name: Syntax and mirrors
        run: |
          python -m py_compile backend/scripts/run_index_fair_value_forward_outcomes_v1.py backend/scripts/index_fair_value_shadow_ledger_v1.py
          cmp -s backend/db/migrations/20261002214500_fair_value_shadow_market_binding_v1.sql supabase/migrations/20261002214500_fair_value_shadow_market_binding_v1.sql
      - name: Unit tests
        run: |
          python -m pytest -q \
            backend/tests/unit/scripts/test_index_fair_value_forward_outcomes_v1.py \
            backend/tests/unit/scripts/test_index_fair_value_shadow_s3.py \
            backend/tests/unit/scripts/test_index_fair_value_prospective_shadow_v1.py
      - name: Postgres migration smoke
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE public.pokemon_canonical_cards(id uuid primary key);
          CREATE TABLE public.card_variants(id uuid primary key);
          CREATE TABLE public.pkmnprices_ebay_sold_evidence_v1(provider_listing_id bigint, provider_card_id bigint, primary key(provider_listing_id,provider_card_id));
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261002060000_fair_value_shadow_ledger_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261002214500_fair_value_shadow_market_binding_v1.sql
          psql -Atc "select to_regclass('public.fair_value_shadow_market_bindings_v1')"
