name: Vintage Edition History Repair
on:
  push:
    branches: [fix/vintage-edition-history-recovery-20260926]
    paths: ['.vm-ops/prepare-vintage-history.json']
permissions:
  contents: write
concurrency:
  group: vintage-edition-history-offline-tests
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: edition_test
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d edition_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
      EDITION_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:15432/edition_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/vintage-edition-history-recovery-20260926
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install -q pytest supabase==2.28.3 python-dotenv==1.2.2 pandas 'psycopg[binary]'
      - name: Prepare exact-source integration and migration mirror
        run: python .vm-ops/prepare_vintage_history_fix.py
      - name: Test complete reads and existing vintage behavior
        run: |
          python -m pytest -q \
            backend/tests/unit/db/services/test_pokemon_edition_history.py \
            backend/tests/unit/scripts/test_market_vintage_scope_override.py \
            backend/tests/unit/db/services/test_pokemon_explore_set_value_service.py \
            backend/tests/unit/scripts/test_audit_pokemon_market_publication.py \
            backend/tests/unit/db/services/test_pokemon_set_market_scope_sanitizer.py \
            backend/tests/unit/db/test_explicit_vintage_market_scopes_migration.py
      - name: Verify database migration and as-of isolation on disposable PostgreSQL
        run: python -m pytest -q backend/tests/integration/test_edition_history_dated_repair.py
      - name: Persist the tested integration changes
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile backend/db/services/pokemon_edition_history.py backend/scripts/build_pokemon_explore_set_value_snapshot.py
          git add backend/scripts/build_pokemon_explore_set_value_snapshot.py backend/tests/unit/scripts/test_market_vintage_scope_override.py backend/db/migrations/20260927014000_add_dated_edition_history_refresh.sql
          if ! git diff --cached --quiet; then
            git -c user.name=index-repair-ci -c user.email=repair-ci@index.invalid commit -m 'fix(market): integrate tested dated edition materialization and complete history paging'
            git push origin HEAD:fix/vintage-edition-history-recovery-20260926
          fi
          echo "TESTED_CANDIDATE_SHA=$(git rev-parse HEAD)"
