name: Sep22 Repair Status Probe

on:
  push:
    branches: [ops/sep22-repair-status-probe]
    paths:
      - '.github/workflows/sep22-repair-status-probe.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/sep22-repair-status-probe
          fetch-depth: 1
      - name: Capture Sep22 repair run
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100"             > /tmp/runs.json
          mkdir -p ops/assistant
          python - <<'PY'
import json
from pathlib import Path
p=json.loads(Path("/tmp/runs.json").read_text())
rows=[]
for r in p.get("workflow_runs") or []:
    if r.get("name") in {
        "Sep22 Market Publication Repair",
        "Pokemon Catalog Recheck Refresh",
        "Opening Simulation Recovery Watchdog",
    }:
        rows.append({
            "id":r.get("id"),
            "name":r.get("name"),
            "status":r.get("status"),
            "conclusion":r.get("conclusion"),
            "head_sha":r.get("head_sha"),
            "head_branch":r.get("head_branch"),
            "event":r.get("event"),
            "created_at":r.get("created_at"),
            "updated_at":r.get("updated_at"),
            "run_attempt":r.get("run_attempt"),
        })
Path("ops/assistant/sep22-repair-status.json").write_text(json.dumps(rows[:30],indent=2,sort_keys=True)+"\n")
print(json.dumps(rows[:30],indent=2,sort_keys=True))
PY
          git config user.name "inDex Sep22 status"
          git config user.email "actions@users.noreply.github.com"
          git add ops/assistant/sep22-repair-status.json
          git commit -m "ops: capture Sep22 repair status"
          git push origin HEAD:ops/sep22-repair-status-probe
