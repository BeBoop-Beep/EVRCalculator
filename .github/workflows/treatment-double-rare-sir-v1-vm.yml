name: Treatment Double Rare SIR V1 VM

on:
  push:
    branches:
      - vm-ops-control
    paths:
      - '.vm-ops/treatment-double-rare-sir-v1.json'

permissions:
  contents: read

concurrency:
  group: treatment-double-rare-sir-v1-vm
  cancel-in-progress: false

jobs:
  capture:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 45
    steps:
      - name: Checkout exact research SHA
        uses: actions/checkout@v4
        with:
          ref: 90a9e618945f641de4428a56b2af9ae2f63568d7
          fetch-depth: 1
      - name: Verify exact research SHA
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="90a9e618945f641de4428a56b2af9ae2f63568d7"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "research_sha=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Capture Double Rare to SIR NM history
        shell: bash
        run: |
          set -euo pipefail
          PROD_REPO="/home/ubuntu/repos/EVRCalculator"
          PY="$PROD_REPO/.venv/bin/python"
          test -x "$PY"
          test -f "$PROD_REPO/backend/.env"
          set -a
          . "$PROD_REPO/backend/.env"
          set +a
          test -n "${PKMNPRICES_API_KEY:-}"
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          mkdir -p backend/artifacts/treatment_panel_recovery_v2
          "$PY" backend/scripts/research_treatment_gate_expansion_double_rare_sir_v1.py \
            --market-date 2026-09-29 \
            --period 180d \
            --credit-cap 3000 \
            --capture \
            --output backend/artifacts/treatment_panel_recovery_v2/gate_expansion_double_rare_sir.json
      - name: Upload Double Rare to SIR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treatment-double-rare-sir-v1-vm
          path: backend/artifacts/treatment_panel_recovery_v2/gate_expansion_double_rare_sir.json
          if-no-files-found: warn
