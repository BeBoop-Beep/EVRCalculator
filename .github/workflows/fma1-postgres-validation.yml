name: FMA-1 PostgreSQL validation
on:
  pull_request:
    branches: [develop]
    paths:
      - 'backend/db/migrations/20260930210000_market_activity_projection_v1.sql'
      - 'supabase/migrations/20260930210000_market_activity_projection_v1.sql'
      - 'backend/db/migrations/20260930220000_market_activity_per_market_serving_v1.sql'
      - 'supabase/migrations/20260930220000_market_activity_per_market_serving_v1.sql'
      - 'backend/tests/integration/market_activity_v1_postgres_*.sql'
      - '.github/workflows/fma1-postgres-validation.yml'
  workflow_dispatch:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify mirrored migrations
        run: |
          cmp backend/db/migrations/20260930210000_market_activity_projection_v1.sql supabase/migrations/20260930210000_market_activity_projection_v1.sql
          cmp backend/db/migrations/20260930220000_market_activity_per_market_serving_v1.sql supabase/migrations/20260930220000_market_activity_per_market_serving_v1.sql
      - name: Apply relevant baseline and FMA-1 migration
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/tests/integration/market_activity_v1_postgres_baseline.sql
          psql -v ON_ERROR_STOP=1 -f backend/db/migrations/20260930210000_market_activity_projection_v1.sql
          psql -v ON_ERROR_STOP=1 -f backend/db/migrations/20260930220000_market_activity_per_market_serving_v1.sql
      - name: Validate publication, RLS, RPCs, promotion, EXPLAIN, rollback
        run: |
          set -o pipefail
          psql -f backend/tests/integration/market_activity_v1_postgres_validation.sql 2>&1 | tee fma1-postgres-validation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fma1-postgres-validation
          path: fma1-postgres-validation.txt
