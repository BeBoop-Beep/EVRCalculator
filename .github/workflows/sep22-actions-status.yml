name: Sep22 Actions Status
# trigger

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sep22-actions-status.yml'

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List relevant active runs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > /tmp/runs.json
          python - <<'PY'
import json
p=json.load(open("/tmp/runs.json"))
for r in p.get("workflow_runs") or []:
    if r.get("name") in {"Sep22 Market Publication Repair","Pokemon Catalog Recheck Refresh","Opening Simulation Recovery Watchdog","RIP Recovery Diagnostic 2026-09-22"} or r.get("status") in {"queued","in_progress","pending","waiting"}:
        print(json.dumps({"id":r.get("id"),"name":r.get("name"),"status":r.get("status"),"conclusion":r.get("conclusion"),"head_branch":r.get("head_branch"),"head_sha":r.get("head_sha"),"event":r.get("event"),"created_at":r.get("created_at"),"updated_at":r.get("updated_at"),"run_attempt":r.get("run_attempt")},sort_keys=True))
PY
