name: Sep22 Actions Status

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sep22-actions-status.yml'

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List relevant active runs
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/all-runs.jsonl
          for STATUS in in_progress queued pending waiting; do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?status=$STATUS&per_page=100" > "/tmp/runs-$STATUS.json"
            STATUS="$STATUS" python - <<'PY' >> /tmp/all-runs.jsonl
          import json,os
          p=json.load(open("/tmp/runs-"+os.environ["STATUS"]+".json"))
          for r in p.get("workflow_runs") or []:
              print(json.dumps({"id":r.get("id"),"name":r.get("name"),"status":r.get("status"),"conclusion":r.get("conclusion"),"head_branch":r.get("head_branch"),"head_sha":r.get("head_sha"),"event":r.get("event"),"created_at":r.get("created_at"),"updated_at":r.get("updated_at"),"run_attempt":r.get("run_attempt")},sort_keys=True))
          PY
          done
          sort -u /tmp/all-runs.jsonl
