name: Sep 21 Public Market Cutover Watch
# Retriggered alongside foreground repair at 2026-09-21 21:08 Phoenix.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sep21-public-market-cutover-watch.yml'

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/incident-status-20260921
          fetch-depth: 1
      - name: Capture current incident status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=50" \
            > /tmp/runs.json
          curl --silent --show-error --max-time 45 \
            https://evrcalculator.onrender.com/explore/set-value-market \
            > /tmp/market.json || true
          python - <<'PY'
import json
from pathlib import Path
runs=json.loads(Path("/tmp/runs.json").read_text()).get("workflow_runs") or []
names={
    "Sep 21 Coordinated Publication Repair",
    "Sentinel VM Repair",
    "Market Explorer Targeted Finish 2026-09-21",
    "Sep 21 Public Market Cutover Watch",
}
selected=[]
for r in runs:
    if r.get("name") in names:
        selected.append({
            "id":r.get("id"),
            "name":r.get("name"),
            "status":r.get("status"),
            "conclusion":r.get("conclusion"),
            "run_number":r.get("run_number"),
            "head_sha":r.get("head_sha"),
            "created_at":r.get("created_at"),
            "updated_at":r.get("updated_at"),
        })
payload={}
try:
    payload=json.loads(Path("/tmp/market.json").read_text())
except Exception:
    pass
meta=payload.get("meta") or {}
snap=meta.get("snapshot") or {}
market_date=payload.get("marketDate") or meta.get("marketDate") or snap.get("marketDate") or payload.get("market_date")
sets=payload.get("sets")
out={
    "market_date":market_date,
    "market_set_count":len(sets) if isinstance(sets,list) else None,
    "runs":selected[:20],
}
print(json.dumps(out,indent=2,sort_keys=True))
Path("ops/assistant").mkdir(parents=True,exist_ok=True)
Path("ops/assistant/current-incident-status.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
PY
          git config user.name "inDex incident status"
          git config user.email "actions@users.noreply.github.com"
          git add ops/assistant/current-incident-status.json
          git commit -m "ops: capture current incident status"
          git push origin HEAD:ops/incident-status-20260921

  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/sentinel-continuation-20260921
          fetch-depth: 1

      - name: Wait for Sep 21 public Market authority
        shell: bash
        run: |
          set -euo pipefail
          TARGET=2026-09-21
          RESULT=""
          for i in $(seq 1 40); do
            DATE="$(curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 45 https://evrcalculator.onrender.com/explore/set-value-market | python -c 'import json,sys; p=json.load(sys.stdin); m=p.get("meta") or {}; s=m.get("snapshot") or {}; print(str(p.get("marketDate") or m.get("marketDate") or s.get("marketDate") or p.get("market_date") or ""))' 2>/dev/null || true)"
            echo "poll=$i public_market_date=$DATE"
            if [ "$DATE" = "$TARGET" ]; then
              RESULT="PASS"
              break
            fi
            sleep 30
          done

          mkdir -p ops/assistant
          printf 'result=%s\ntarget=%s\nobserved=%s\nutc=%s\n' "$RESULT" "$TARGET" "$DATE" "$(date -u +%FT%TZ)" > ops/assistant/public-market-cutover.txt

          git config user.name "inDex public cutover watch"
          git config user.email "actions@users.noreply.github.com"
          git add ops/assistant/public-market-cutover.txt
          git commit -m "ops: record Sep 21 public Market cutover"
          git push origin HEAD:ops/sentinel-continuation-20260921

          [ "$RESULT" = "PASS" ]
