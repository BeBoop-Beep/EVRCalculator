name: Market Explorer V2 Runtime

on:
  push:
    paths:
      - 'backend/db/services/pokemon_market_explorer_query_service.py'
      - 'backend/db/services/market_explorer_constituent_movement.py'
      - 'backend/scripts/publish_market_explorer_daily_projection.py'
      - 'backend/scripts/run_market_explorer_daily_publication.py'
      - 'backend/scripts/check_market_explorer_maintained_cache_health.py'
      - 'backend/scripts/backfill_market_explorer_variant_intervals.py'
      - 'backend/scripts/repair_market_explorer_vintage_predecessor_identities.py'
      - 'backend/tests/unit/db/services/test_pokemon_market_explorer_query_service.py'
      - 'backend/tests/unit/db/services/test_market_explorer_constituent_movement.py'
      - 'backend/tests/unit/scripts/test_publish_market_explorer_daily_projection.py'
      - 'backend/tests/unit/scripts/test_run_market_explorer_daily_publication.py'
      - 'backend/tests/unit/scripts/test_check_market_explorer_maintained_cache_health.py'
      - 'backend/tests/unit/scripts/test_backfill_market_explorer_variant_intervals.py'
      - 'backend/tests/unit/scripts/test_repair_market_explorer_vintage_predecessor_identities.py'
      - 'backend/tests/unit/test_market_explorer_v2_runtime_cutover.py'
      - '.github/workflows/market-explorer-v2-runtime.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'backend/db/services/pokemon_market_explorer_query_service.py'
      - 'backend/db/services/market_explorer_constituent_movement.py'
      - 'backend/scripts/publish_market_explorer_daily_projection.py'
      - 'backend/scripts/run_market_explorer_daily_publication.py'
      - 'backend/scripts/check_market_explorer_maintained_cache_health.py'
      - 'backend/scripts/backfill_market_explorer_variant_intervals.py'
      - 'backend/scripts/repair_market_explorer_vintage_predecessor_identities.py'
      - 'backend/tests/unit/**'
      - '.github/workflows/market-explorer-v2-runtime.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            pytest supabase==2.28.3 python-dotenv==1.2.2
      - name: Compile V2 runtime
        run: |
          python -m py_compile \
            backend/db/services/pokemon_market_explorer_query_service.py \
            backend/db/services/market_explorer_constituent_movement.py \
            backend/scripts/publish_market_explorer_daily_projection.py \
            backend/scripts/run_market_explorer_daily_publication.py \
            backend/scripts/check_market_explorer_maintained_cache_health.py \
            backend/scripts/backfill_market_explorer_variant_intervals.py \
            backend/scripts/repair_market_explorer_vintage_predecessor_identities.py
      - name: Run focused V2 suite
        run: |
          python -m pytest -q \
            backend/tests/unit/db/services/test_pokemon_market_explorer_query_service.py \
            backend/tests/unit/db/services/test_market_explorer_constituent_movement.py \
            backend/tests/unit/scripts/test_publish_market_explorer_daily_projection.py \
            backend/tests/unit/scripts/test_run_market_explorer_daily_publication.py \
            backend/tests/unit/scripts/test_check_market_explorer_maintained_cache_health.py \
            backend/tests/unit/scripts/test_backfill_market_explorer_variant_intervals.py \
            backend/tests/unit/scripts/test_repair_market_explorer_vintage_predecessor_identities.py \
            backend/tests/unit/test_market_explorer_v2_runtime_cutover.py
