name: Deploy batch fallback schedule

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Sync code and compare cron
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo '=== BEFORE ==='
          git rev-parse HEAD
          git status --short
          EXTRA_DIRTY="$(git status --porcelain | grep -v 'payload_debug.json' || true)"
          if [ -n "$EXTRA_DIRTY" ]; then
            echo 'Refusing to deploy: unexpected dirty paths:'
            echo "$EXTRA_DIRTY"
            exit 2
          fi
          if git status --porcelain -- payload_debug.json | grep -q .; then
            git stash push -m 'payload-debug-before-main-1d9951d2-20260920' -- payload_debug.json
          fi
          git fetch origin
          git switch main
          git pull --ff-only origin main
          echo
          echo '=== AFTER ==='
          git rev-parse HEAD
          git status --short
          git merge-base --is-ancestor 1d9951d2b4b331bd5f59983c977ccbc7d547d8d6 HEAD
          echo 'BATCH_FALLBACK_PRESENT=true'
          echo
          echo '=== INSTALLED CRON ==='
          crontab -l > /tmp/index-installed.cron
          cat /tmp/index-installed.cron
          echo
          echo '=== CANONICAL CRON ==='
          cat infra/oracle/tcgplayer-scraper-pokemon.crontab
          echo
          echo '=== DIFF ==='
          diff -u /tmp/index-installed.cron infra/oracle/tcgplayer-scraper-pokemon.crontab || true
