name: Verify watchdog code before cron install

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify current checkout and cron
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          date
          echo -n 'head='; git rev-parse HEAD
          echo -n 'branch='; git branch --show-current || true
          echo 'status:'; git status --short || true
          echo
          echo 'watchdog_file:'
          test -f backend/alerts/post_scrape_publication_watchdog.py && echo present || echo missing
          echo 'canonical_watchdog_cron:'
          grep 'post-scrape-publication-watchdog' infra/oracle/tcgplayer-scraper-pokemon.crontab 2>/dev/null || true
          echo 'installed_watchdog_cron:'
          crontab -l | grep 'post-scrape-publication-watchdog' || true
          echo
          echo 'publisher:'
          ps -eo pid,ppid,etime,time,%cpu,%mem,state,args | grep -E 'rebuild_snapshots_after_scrape|refresh_stale_public_snapshots' | grep -v grep || true
          echo 'lock:'
          fuser -v /tmp/pokemon-post-scrape-publication.lock 2>&1 || true
