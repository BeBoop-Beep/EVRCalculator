name: Validate publication liveness watchdog

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - name: Checkout liveness branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/publication-liveness-watchdog-20260920
          persist-credentials: false
      - name: Compile and exercise liveness boundaries
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          "$PY" -m py_compile \
            backend/alerts/post_scrape_publication_watchdog.py \
            backend/tests/unit/alerts/test_post_scrape_publication_watchdog.py
          "$PY" - <<'PY'
          from backend.tests.unit.alerts import test_post_scrape_publication_watchdog as t
          t.test_locked_publisher_with_recent_progress_is_healthy()
          print('locked_recent_progress=PASS')
          t.test_locked_publisher_without_progress_is_stalled_and_never_relaunched()
          print('held_lock_stall_no_kill=PASS')
          t.test_missing_publisher_relaunches_through_existing_detached_trigger()
          print('missing_publisher_relaunch=PASS')
          t.test_missing_publisher_currency_failure_is_unhealthy_not_success()
          print('relaunch_failure_unhealthy=PASS')
          t.test_gate_authority_failure_blocks_relaunch()
          print('gate_authority_blocks_relaunch=PASS')
          PY
          grep -F 'post_scrape_publication_watchdog' infra/oracle/tcgplayer-scraper-pokemon.crontab
