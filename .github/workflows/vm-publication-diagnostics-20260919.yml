name: Validate publication gate tri-state fix

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - name: Checkout tri-state fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/publication-gate-tristate-20260920
          persist-credentials: false
      - name: Compile and exercise gate classifications
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          "$PY" -m py_compile \
            backend/scripts/publish_post_scrape_if_needed.py \
            backend/sentinel/recovery/runbooks.py \
            backend/tests/unit/scripts/test_publish_post_scrape_gate_tristate.py
          "$PY" - <<'PY'
          from backend.tests.unit.scripts import test_publish_post_scrape_gate_tristate as t
          t.test_batch_gate_retries_authority_unavailable_with_fresh_client()
          print('authority_retry_fresh_client=PASS')
          t.test_publish_if_needed_returns_nonzero_status_when_gate_authority_stays_unknown()
          print('authority_unknown_nonzero=PASS')
          t.test_publish_if_needed_keeps_genuine_incomplete_batch_as_noop()
          print('genuine_incomplete_noop=PASS')
          t.test_publish_if_needed_fails_closed_on_invalid_batch_contract()
          print('invalid_contract_nonzero=PASS')
          PY
