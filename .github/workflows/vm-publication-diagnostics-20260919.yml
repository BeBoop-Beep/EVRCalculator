name: Install current publication liveness watchdog

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Install current-head canonical cron
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          test "$(git rev-parse HEAD)" = "4f4920088e0b1043cc3031429fda86d6a56ecd64"
          echo '=== DIFF BEFORE ==='
          crontab -l > /tmp/cron-before-liveness
          diff -u /tmp/cron-before-liveness infra/oracle/tcgplayer-scraper-pokemon.crontab || true
          crontab infra/oracle/tcgplayer-scraper-pokemon.crontab
          echo '=== INSTALLED LIVENESS LINE ==='
          crontab -l | grep 'post-scrape-publication-watchdog'
          echo '=== CURRENT WATCHDOG HEALTH ==='
          /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m backend.alerts.post_scrape_publication_watchdog --health || true
