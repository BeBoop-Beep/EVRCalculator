name: Validate null RIP rank fix

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/set-page-null-rip-rank-20260920
          persist-credentials: false
      - name: Run focused frontend architecture test
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          node --test components/pokemon/set-page/runtime/PokemonSetRuntimeArchitecture.test.mjs
