name: Sentinel observation canary

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  canary:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Run Sentinel Fast and Public observation canaries
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          set -a
          . backend/.env
          set +a
          export SENTINEL_RECOVERY_ENABLED=false
          export SENTINEL_RECOVERY_EXECUTION_READY=false
          echo '=== CONFIG ==='
          printf 'state=%s schema=%s recovery=%s backend=%s\n' \
            "${SENTINEL_STATE_WRITES_ENABLED:-unset}" \
            "${SENTINEL_PERSISTENCE_SCHEMA_READY:-unset}" \
            "${SENTINEL_RECOVERY_ENABLED:-unset}" \
            "${SENTINEL_BACKEND_BASE_URL:-unset}"
          echo
          echo '=== FAST ==='
          set +e
          /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m backend.sentinel.operational --profile fast >/tmp/sentinel-fast-canary.json 2>/tmp/sentinel-fast-canary.err
          FAST_RC=$?
          set -e
          cat /tmp/sentinel-fast-canary.err || true
          cat /tmp/sentinel-fast-canary.json || true
          echo "FAST_RC=$FAST_RC"
          echo
          echo '=== PUBLIC ==='
          set +e
          SENTINEL_RECOVERY_ENABLED=false SENTINEL_RECOVERY_EXECUTION_READY=false \
            /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m backend.sentinel.operational --profile public >/tmp/sentinel-public-canary.json 2>/tmp/sentinel-public-canary.err
          PUBLIC_RC=$?
          set -e
          cat /tmp/sentinel-public-canary.err || true
          cat /tmp/sentinel-public-canary.json || true
          echo "PUBLIC_RC=$PUBLIC_RC"
          echo
          echo '=== HEARTBEAT STATE ==='
          /home/ubuntu/repos/EVRCalculator/.venv/bin/python - <<'PY'
          import json
          from backend.db.clients.supabase_client import supabase
          rows=(supabase.table('sentinel_component_heartbeats')
                .select('component,host,last_seen_at,last_run_status,build_sha')
                .order('last_seen_at',desc=True).limit(5).execute().data or [])
          print(json.dumps(rows,indent=2,default=str))
          PY
          exit 0
