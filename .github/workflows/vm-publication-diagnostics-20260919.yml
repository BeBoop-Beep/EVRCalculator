name: Configure Sentinel observation mode

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Configure non-secret Sentinel env
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          ENV_FILE=backend/.env
          test -f "$ENV_FILE"
          update_env() {
            key="$1"; value="$2"
            tmp="$(mktemp)"
            awk -v k="$key" -F= '$1 != k {print}' "$ENV_FILE" > "$tmp"
            printf '%s=%s\n' "$key" "$value" >> "$tmp"
            cat "$tmp" > "$ENV_FILE"
            rm -f "$tmp"
          }
          update_env SENTINEL_STATE_WRITES_ENABLED true
          update_env SENTINEL_PERSISTENCE_SCHEMA_READY true
          update_env SENTINEL_RECOVERY_ENABLED false
          update_env SENTINEL_RECOVERY_EXECUTION_READY false
          update_env SENTINEL_BACKEND_BASE_URL https://evrcalculator.onrender.com
          update_env SENTINEL_COMPONENT sentinel_vm
          echo '=== SENTINEL CONFIG (NON-SECRET) ==='
          grep -E '^SENTINEL_(STATE_WRITES_ENABLED|PERSISTENCE_SCHEMA_READY|RECOVERY_ENABLED|RECOVERY_EXECUTION_READY|BACKEND_BASE_URL|COMPONENT)=' "$ENV_FILE"
