name: Check current Sep 20 publisher

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect active publisher
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          date
          echo '=== PROCESS ==='
          ps -eo pid,ppid,etime,time,%cpu,%mem,state,args | grep -E 'rebuild_snapshots_after_scrape|refresh_stale_public_snapshots|audit_pokemon_market_publication|run_market_explorer_daily_publication' | grep -v grep || true
          echo '=== LOCK ==='
          fuser -v /tmp/pokemon-post-scrape-publication.lock 2>&1 || true
          echo '=== CURRENT RUN MARKERS ==='
          START="$(grep -n '\[post-scrape-publication\].*started_at=' publication.log | tail -1 | cut -d: -f1)"
          if [ -n "${START:-}" ]; then
            tail -n +"$START" publication.log > /tmp/current-pub.log
            echo "cards_upserts=$(grep -c 'upserted pokemon_set_cards_snapshot_latest' /tmp/current-pub.log || true)"
            echo "dashboard_upserts=$(grep -c 'upserted pokemon_set_market_dashboard_snapshot_latest' /tmp/current-pub.log || true)"
            echo "set_page_upserts=$(grep -c 'upserted pokemon_set_page_snapshot_latest' /tmp/current-pub.log || true)"
            grep -E '\[refresh-phase\]|refresh exit_status|audit exit_status|market explorer projection exit_status|post-scrape publication COMPLETE|final exit_status' /tmp/current-pub.log | tail -30 || true
            echo '=== TAIL ==='
            tail -80 /tmp/current-pub.log
          fi
