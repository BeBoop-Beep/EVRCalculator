name: Sync VM after Sep 20 publication

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Sync production checkout to current main
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo '=== BEFORE ==='
          git rev-parse HEAD
          git status --short || true
          echo
          echo '=== ACTIVE PUBLICATION ==='
          if ps -ef | grep -E 'rebuild_snapshots_after_scrape|refresh_stale_public_snapshots' | grep -v grep; then
            echo 'Refusing sync: publication still active'
            exit 3
          fi
          EXTRA_DIRTY="$(git status --porcelain | grep -v 'payload_debug.json' || true)"
          if [ -n "$EXTRA_DIRTY" ]; then
            echo 'Refusing sync: unexpected dirty paths:'
            echo "$EXTRA_DIRTY"
            exit 2
          fi
          if git status --porcelain -- payload_debug.json | grep -q .; then
            git stash push -m 'payload-debug-before-main-c6a97c12-20260920' -- payload_debug.json
          fi
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          echo
          echo '=== AFTER ==='
          git rev-parse HEAD
          git status --short || true
          git merge-base --is-ancestor c6a97c1216ece492eb56f28ce470aa0d663aeb83 HEAD
          echo 'VM_CURRENT_MAIN=true'
          echo
          echo '=== CRON BATCH/PUBLICATION LINES ==='
          crontab -l | grep -E 'create_daily_scrape_batch|publish_post_scrape_if_needed|market-freshness-watchdog' || true
