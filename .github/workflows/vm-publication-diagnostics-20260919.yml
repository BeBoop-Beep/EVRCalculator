name: Inspect final stale tail progress

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect publisher tail and watchdog
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          date
          echo '=== PROCESS ==='
          ps -eo pid,ppid,etime,time,%cpu,%mem,state,wchan:32,args | grep -E 'rebuild_snapshots_after_scrape|refresh_stale_public_snapshots' | grep -v grep || true
          echo '=== LOG STAT ==='
          stat -c 'mtime=%y size=%s' publication.log || true
          echo '=== LIVE TAIL ==='
          tail -120 publication.log || true
          echo '=== WATCHDOG LOG ==='
          tail -100 backend/logs/post_scrape_publication_watchdog.log 2>/dev/null || true
          echo '=== SENTINEL CRON ==='
          crontab -l | grep -E 'post-scrape-publication-watchdog|index-sentinel-(fast|public)' || true
