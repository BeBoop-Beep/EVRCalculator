name: Validate publication watchdog authority retry

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - name: Checkout watchdog fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/publication-watchdog-authority-retry-20260920
          persist-credentials: false
      - name: Compile and exercise retry policy
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          "$PY" -m py_compile backend/alerts/post_scrape_publication_watchdog.py
          "$PY" - <<'PY'
          from types import SimpleNamespace
          from backend.alerts import post_scrape_publication_watchdog as watchdog

          BATCH={'id':57,'market_date':'2026-09-20','status':'complete','promoted_at':'2026-09-20T23:21:43+00:00'}
          class T522(Exception): code=522
          class T42(Exception): code='42P01'
          class Q:
              def __init__(self,c): self.c=c
              def select(self,*_): return self
              def eq(self,*_): return self
              def order(self,*_,**__): return self
              def limit(self,*_): return self
              def execute(self):
                  if self.c.error: raise self.c.error
                  return SimpleNamespace(data=[dict(BATCH)])
          class C:
              def __init__(self,error=None): self.error=error
              def table(self,name): assert name=='pokemon_scrape_batches'; return Q(self)

          clients=[C(T522('522 timeout')),C()]
          n={'v':0}
          def factory():
              c=clients[n['v']]; n['v']+=1; return c
          out=watchdog._latest_complete_batch(object(),client_factory=factory,sleep=lambda _s:None)
          assert n['v']==2 and out['id']==57
          print('watchdog_transient_retry=PASS')

          n={'v':0}
          def deterministic_factory():
              n['v']+=1; return C(T42('relation does not exist'))
          try:
              watchdog._latest_complete_batch(object(),client_factory=deterministic_factory,sleep=lambda _s:None)
          except T42:
              pass
          else:
              raise AssertionError('deterministic failure must propagate')
          assert n['v']==1
          print('watchdog_deterministic_fail_closed=PASS')
          PY
