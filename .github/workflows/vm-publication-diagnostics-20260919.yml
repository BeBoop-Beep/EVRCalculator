name: Validate publication planner fast path

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - name: Checkout fast-path branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/publication-planner-target-date-fastpath-20260920
          persist-credentials: false
      - name: Compile and exercise planner fast path
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          "$PY" -m py_compile \
            backend/scripts/refresh_stale_public_snapshots.py \
            backend/tests/unit/scripts/test_refresh_target_date_fastpath.py
          "$PY" - <<'PY'
          from backend.tests.unit.scripts import test_refresh_target_date_fastpath as t
          t.test_target_date_fast_result_proves_stale_on_date_mismatch()
          print('date_mismatch_proves_stale=PASS')
          t.test_target_date_fast_result_defers_to_deep_audit_when_already_current()
          print('current_date_deep_audit=PASS')
          t.test_build_plan_skips_expensive_dependency_scans_when_target_date_is_proven_stale()
          print('proven_stale_skips_deep_scan=PASS')
          t.test_build_plan_deep_audits_when_snapshot_dates_are_already_current()
          print('current_snapshot_deep_scan=PASS')
          t.test_build_plan_falls_back_to_deep_audit_when_bulk_preload_is_unreadable()
          print('unreadable_preload_falls_back=PASS')
          PY
