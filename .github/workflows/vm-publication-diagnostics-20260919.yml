name: VM publication diagnostics 2026-09-19

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Read live publication log
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          echo "=== HOST/TIME ==="
          hostname
          date
          echo
          echo "=== PROCESS ==="
          ps -p 112194 -o pid,ppid,etime,time,%cpu,%mem,state,wchan:32,args || true
          echo
          echo "=== PUBLICATION LOG STAT ==="
          stat -c 'size=%s mtime=%y' publication.log 2>/dev/null || true
          echo
          echo "=== PUBLICATION LOG TAIL ==="
          tail -220 publication.log 2>/dev/null || true
