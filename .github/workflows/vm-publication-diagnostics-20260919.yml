name: Validate daily Top Chase current-date writes

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - name: Checkout daily history fix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/daily-top-chase-current-date-write-20260920
          persist-credentials: false
      - name: Compile and exercise current-date contract
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          "$PY" -m py_compile backend/scripts/refresh_stale_public_snapshots.py
          "$PY" - <<'PY'
          from backend.scripts import refresh_stale_public_snapshots as r

          dashboard={'latest_market_date':'2026-09-20','top_chase_cards_json':[{'id':f'c{i}'} for i in range(1,11)]}
          rows=[]
          for day in ('2026-09-18','2026-09-19','2026-09-20'):
              rows += [{'set_id':'s','snapshot_date':day,'rank':i,'card_id':f'c{i}'} for i in range(1,11)]
          current=r._daily_top_chase_history_rows(dashboard,rows)
          assert len(current)==10
          assert {x['snapshot_date'] for x in current}=={'2026-09-20'}
          assert {x['rank'] for x in current}==set(range(1,11))
          print('current_date_slice=PASS')

          try:
              r._daily_top_chase_history_rows(dashboard,[{'snapshot_date':'2026-09-20','rank':i} for i in range(1,10)])
          except RuntimeError as exc:
              assert 'current-date slice is incomplete' in str(exc)
          else:
              raise AssertionError('incomplete slice must fail closed')
          print('incomplete_slice_fail_closed=PASS')

          assert r._daily_top_chase_history_rows({'latest_market_date':'2026-09-20','top_chase_cards_json':[]},[])==[]
          print('zero_top_chase=PASS')
          PY
          grep -F "DELETE FROM public.pokemon_set_top_chase_card_daily_history h" supabase/migrations/20260906003757_use_current_canonical_value_for_rollout_snapshots.sql >/dev/null
          grep -F "WHERE h.snapshot_date = v_market_date" supabase/migrations/20260906003757_use_current_canonical_value_for_rollout_snapshots.sql >/dev/null
          echo 'canonical_sql_current_date_contract=PASS'
