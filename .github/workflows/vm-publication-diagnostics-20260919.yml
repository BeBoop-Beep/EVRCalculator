name: Validate V2 readiness CLI import

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - name: Checkout fix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/price-projection-cli-import-20260920
          persist-credentials: false
      - name: Execute CLI by file path
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          env -u PYTHONPATH "$PY" backend/scripts/check_price_storage_v2_projection_ready.py --help >/tmp/help.txt
          grep -F -- '--market-date' /tmp/help.txt
          echo 'file_path_import=PASS'
