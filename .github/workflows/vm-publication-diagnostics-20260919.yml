name: Install Sentinel observation cron safely

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Replace only Sentinel cron entries
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          /home/ubuntu/repos/EVRCalculator/.venv/bin/python - <<'PY'
          from pathlib import Path
          import subprocess

          env_path = Path('backend/.env')
          text = env_path.read_text()
          updates = {
              'SENTINEL_RUNNER_HOST': 'tcgplayer-scraper-pokemon-v2',
              'SENTINEL_RECOVERY_ENABLED': 'false',
              'SENTINEL_RECOVERY_EXECUTION_READY': 'false',
          }
          lines = [line for line in text.splitlines() if line.split('=',1)[0] not in updates]
          lines.extend(f'{k}={v}' for k,v in updates.items())
          env_path.write_text('\n'.join(lines) + '\n')

          current = subprocess.run(['crontab','-l'], text=True, capture_output=True, check=True).stdout.splitlines()
          current = [
              line for line in current
              if 'index-sentinel-fast.lock' not in line and 'index-sentinel-public.lock' not in line
          ]
          fast = "1-59/5 * * * * /usr/bin/flock -n /tmp/index-sentinel-fast.lock -c 'cd /home/ubuntu/repos/EVRCalculator && set -a && . backend/.env && set +a && SENTINEL_RUNNER_BUILD_SHA=$(git rev-parse HEAD) /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m backend.sentinel.operational --profile fast' >> /home/ubuntu/repos/EVRCalculator/backend/logs/sentinel_fast.log 2>&1"
          public = "4-59/10 * * * * /usr/bin/flock -n /tmp/index-sentinel-public.lock -c 'cd /home/ubuntu/repos/EVRCalculator && set -a && . backend/.env && set +a && SENTINEL_RUNNER_BUILD_SHA=$(git rev-parse HEAD) SENTINEL_RECOVERY_ENABLED=false SENTINEL_RECOVERY_EXECUTION_READY=false /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m backend.sentinel.operational --profile public' >> /home/ubuntu/repos/EVRCalculator/backend/logs/sentinel_public.log 2>&1"
          current += ['# Sentinel operational profiles', fast, public]
          path = Path('/tmp/index-cron-sentinel-observe')
          path.write_text('\n'.join(current) + '\n')
          subprocess.run(['crontab', str(path)], check=True)
          print('installed=true')
          PY
          echo '=== INSTALLED SENTINEL CRON ==='
          crontab -l | grep -E 'index-sentinel-(fast|public)'
          echo '=== RECOVERY GATES ==='
          grep -E '^SENTINEL_(STATE_WRITES_ENABLED|PERSISTENCE_SCHEMA_READY|RECOVERY_ENABLED|RECOVERY_EXECUTION_READY|RUNNER_HOST)=' backend/.env
