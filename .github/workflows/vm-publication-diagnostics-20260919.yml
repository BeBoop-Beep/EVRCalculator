name: Validate publish lock status fix

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/publish-if-needed-lock-status-20260920
          persist-credentials: false
      - name: Run focused wrapper tests
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          "$PY" -m py_compile backend/scripts/publish_post_scrape_if_needed.py backend/sentinel/recovery/runbooks.py
          "$PY" -m pytest -q backend/tests/unit/scripts/test_publish_post_scrape_if_needed.py backend/tests/unit/sentinel/test_safe_recovery.py
