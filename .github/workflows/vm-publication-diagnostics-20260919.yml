name: VM Sep 20 batch recovery

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Diagnose and recover Sep 20 batch
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          echo '=== HOST/TIME ==='
          hostname
          date
          echo
          echo '=== PRODUCTION REPO ==='
          git rev-parse HEAD
          git branch --show-current || true
          git status --short || true
          echo
          echo '=== ACTIVE PIPELINE PROCESSES ==='
          ps -ef | grep -E 'create_daily_scrape_batch|run_next_scrape_job|rebuild_snapshots_after_scrape|refresh_stale_public_snapshots|publish_post_scrape' | grep -v grep || true
          echo
          echo '=== BATCH CREATE LOG TAIL ==='
          tail -120 backend/logs/create_daily_scrape_batch.log 2>/dev/null || true
          echo
          echo '=== SEP 20 RECOVERY ==='
          ./.venv/bin/python backend/scripts/create_daily_scrape_batch.py \
            --market-date 2026-09-20 \
            --trigger-source manual \
            --skip-new-set-detection
