name: Check publisher exit and VM sync readiness

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check publication owner
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          date
          echo '=== PROCESS ==='
          ps -eo pid,ppid,etime,time,%cpu,%mem,state,args | grep -E 'rebuild_snapshots_after_scrape|refresh_stale_public_snapshots' | grep -v grep || true
          echo '=== LOCK ==='
          fuser -v /tmp/pokemon-post-scrape-publication.lock 2>&1 || true
          echo '=== HEADS ==='
          echo -n 'head='; git rev-parse HEAD
          git fetch origin >/dev/null 2>&1 || true
          echo -n 'origin_main='; git rev-parse origin/main
          echo '=== LOG TAIL ==='
          START="$(grep -n '\[post-scrape-publication\].*started_at=' publication.log | tail -1 | cut -d: -f1)"
          if [ -n "${START:-}" ]; then tail -n +"$START" publication.log | tail -100; fi
