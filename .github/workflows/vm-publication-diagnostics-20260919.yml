name: VM Sep 20 scheduler diagnosis

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Diagnose automatic batch creation failures
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          echo '=== TIME / HEAD ==='
          date
          git rev-parse HEAD
          echo
          echo '=== CRON ==='
          crontab -l | grep -E 'create_daily_scrape_batch|market_freshness_watchdog|run_next_scrape_job' || true
          echo
          echo '=== BATCH CREATE FAILURE SUMMARY ==='
          grep -E '\[scrape-runtime-preflight\]|\[scrape-jobs\] create_daily_scrape_batch failed|\[scrape-batch-create\] batch creation failed|PreflightFailedError|APIError:|ReadTimeout' backend/logs/create_daily_scrape_batch.log 2>/dev/null | tail -120 || true
          echo
          echo '=== LOG MTIME ==='
          stat -c 'size=%s mtime=%y' backend/logs/create_daily_scrape_batch.log 2>/dev/null || true
