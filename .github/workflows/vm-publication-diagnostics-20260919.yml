name: Deploy daily batch retry fix

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Sync production VM to merged main
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo '=== BEFORE ==='
          git rev-parse HEAD
          git status --short
          EXTRA_DIRTY="$(git status --porcelain | grep -vE '^[ MARC?]{2} payload_debug\.json$' || true)"
          if [ -n "$EXTRA_DIRTY" ]; then
            echo 'Refusing to deploy: unexpected dirty paths:'
            printf '%s\n' "$EXTRA_DIRTY"
            exit 2
          fi
          if git status --porcelain -- payload_debug.json | grep -q .; then
            git stash push -m 'payload-debug-before-main-e362369a-20260920' -- payload_debug.json
          fi
          git fetch origin
          git switch main
          git pull --ff-only origin main
          echo
          echo '=== AFTER ==='
          git rev-parse HEAD
          git status --short
          git merge-base --is-ancestor e362369ab9faa5aea8355a5533dcb4975b8a7ca0 HEAD
          echo 'DAILY_BATCH_TRANSIENT_RETRY_PRESENT=true'
          echo
          echo '=== STASH TOP ==='
          git stash list | head -5
