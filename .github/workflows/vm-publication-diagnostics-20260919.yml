name: Inspect publication fastpath

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect current publication fastpath
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          date
          START="$(grep -n '\[post-scrape-publication\].*started_at=' publication.log 2>/dev/null | tail -1 | cut -d: -f1)"
          if [ -n "${START:-}" ]; then
            tail -n +"$START" publication.log > /tmp/current-pub.log
            echo '=== FASTPATH ==='
            grep -E '\[refresh-plan-fastpath\]' /tmp/current-pub.log | head -30 || true
            echo '=== PROCESS ==='
            ps -eo pid,ppid,etime,time,%cpu,%mem,state,args | grep -E 'rebuild_snapshots_after_scrape|refresh_stale_public_snapshots' | grep -v grep || true
            echo '=== PROGRESS ==='
            grep '\[refresh-plan\] checked' /tmp/current-pub.log | tail -5 || true
            stat -c 'log_mtime=%y size=%s' publication.log || true
          fi
