name: Install Sentinel observation schedules

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Install observation-only Sentinel cron
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          ENV_FILE=backend/.env
          update_env() {
            key="$1"; value="$2"
            tmp="$(mktemp)"
            awk -v k="$key" -F= '$1 != k {print}' "$ENV_FILE" > "$tmp"
            printf '%s=%s\n' "$key" "$value" >> "$tmp"
            cat "$tmp" > "$ENV_FILE"
            rm -f "$tmp"
          }
          update_env SENTINEL_RUNNER_HOST tcgplayer-scraper-pokemon-v2
          update_env SENTINEL_RECOVERY_ENABLED false
          update_env SENTINEL_RECOVERY_EXECUTION_READY false
          crontab -l | grep -v 'index-sentinel-fast.lock' | grep -v 'index-sentinel-public.lock' > /tmp/cron-sentinel-observe
          cat >> /tmp/cron-sentinel-observe <<'EOF'
# Fast Sentinel observation canary schedule; recovery remains disabled in backend/.env.
1-59/5 * * * * /usr/bin/flock -n /tmp/index-sentinel-fast.lock -c 'cd /home/ubuntu/repos/EVRCalculator && set -a && . backend/.env && set +a && SENTINEL_RUNNER_BUILD_SHA=$(git rev-parse HEAD) /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m backend.sentinel.operational --profile fast' >> /home/ubuntu/repos/EVRCalculator/backend/logs/sentinel_fast.log 2>&1
# Public semantic checks are always observation-only.
4-59/10 * * * * /usr/bin/flock -n /tmp/index-sentinel-public.lock -c 'cd /home/ubuntu/repos/EVRCalculator && set -a && . backend/.env && set +a && SENTINEL_RUNNER_BUILD_SHA=$(git rev-parse HEAD) SENTINEL_RECOVERY_ENABLED=false SENTINEL_RECOVERY_EXECUTION_READY=false /home/ubuntu/repos/EVRCalculator/.venv/bin/python -m backend.sentinel.operational --profile public' >> /home/ubuntu/repos/EVRCalculator/backend/logs/sentinel_public.log 2>&1
EOF
          crontab /tmp/cron-sentinel-observe
          echo '=== SENTINEL CRON ==='
          crontab -l | grep -E 'index-sentinel-(fast|public)'
          echo '=== SENTINEL ENV ==='
          grep -E '^SENTINEL_(STATE_WRITES_ENABLED|PERSISTENCE_SCHEMA_READY|RECOVERY_ENABLED|RECOVERY_EXECUTION_READY|BACKEND_BASE_URL|COMPONENT|RUNNER_HOST)=' "$ENV_FILE"
