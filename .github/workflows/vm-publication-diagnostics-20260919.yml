name: Install resilient batch cron

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Install canonical production cron
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          crontab -l > /tmp/index-cron-before-20260920
          crontab infra/oracle/tcgplayer-scraper-pokemon.crontab
          echo '=== INSTALLED BATCH LINES ==='
          crontab -l | grep -E 'pokemon-batch-create|create_daily_scrape_batch'
          echo
          echo '=== FULL DIFF VS CANONICAL ==='
          crontab -l > /tmp/index-cron-after-20260920
          diff -u infra/oracle/tcgplayer-scraper-pokemon.crontab /tmp/index-cron-after-20260920
          echo 'CRON_MATCHES_CANONICAL=true'
