name: Validate vintage Market scope branch

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - name: Checkout vintage fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/market-vintage-unlimited-scope-20260920
          persist-credentials: false
      - name: Compile and run focused vintage tests
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/ubuntu/repos/EVRCalculator/.venv/bin/python
          "$PY" -m py_compile \
            backend/scripts/build_pokemon_explore_set_value_snapshot.py \
            backend/tests/unit/scripts/test_market_vintage_scope_override.py
          "$PY" - <<'PY'
          from backend.tests.unit.scripts import test_market_vintage_scope_override as t
          t.test_scope_overrides_apply_only_to_registered_vintage_profiles()
          print('scope_override_profiles=PASS')
          t.test_scoped_history_keeps_only_requested_certified_scope()
          print('scoped_certification_filter=PASS')
          t.test_post_cutover_override_replaces_only_vintage_standard_history()
          print('vintage_replaces_mixed_standard_only=PASS')
          PY
