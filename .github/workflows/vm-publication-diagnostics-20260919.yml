name: Check publisher exit for deployment

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check canonical publisher lock and final markers
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          date
          echo '=== PROCESS ==='
          ps -eo pid,ppid,etime,time,%cpu,%mem,state,args | grep -E 'rebuild_snapshots_after_scrape|refresh_stale_public_snapshots|audit_pokemon_market_publication|run_market_explorer_daily_publication' | grep -v grep || true
          echo '=== LOCK ==='
          fuser -v /tmp/pokemon-post-scrape-publication.lock 2>&1 || true
          echo '=== FINAL MARKERS ==='
          START="$(grep -n '\[post-scrape-publication\].*resolved market_date=2026-09-20' publication.log 2>/dev/null | tail -1 | cut -d: -f1)"
          if [ -n "${START:-}" ]; then
            tail -n +"$START" publication.log > /tmp/sep20-final-check.log
            grep -E 'refresh exit_status=|audit exit_status=|market explorer projection exit_status=|post-scrape publication COMPLETE|final exit_status=|public snapshot refresh summary|cards failed:|market_dashboard failed:|global failed:|Rankings:' /tmp/sep20-final-check.log | tail -100 || true
            tail -30 /tmp/sep20-final-check.log
          fi
