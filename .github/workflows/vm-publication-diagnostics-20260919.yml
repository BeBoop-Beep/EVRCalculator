name: Diagnose Sep 20 publication handoff

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect Sep 20 post-scrape publication
        shell: bash
        run: |
          set -u
          cd /home/ubuntu/repos/EVRCalculator
          echo '=== HOST/TIME/HEAD ==='
          hostname
          date
          git rev-parse HEAD
          git status --short || true
          echo
          echo '=== PUBLICATION PROCESSES ==='
          ps -eo user,pid,ppid,etime,time,%cpu,%mem,state,args | grep -E 'rebuild_snapshots_after_scrape|refresh_stale_public_snapshots|publish_post_scrape_if_needed|audit_pokemon_market_publication|run_market_explorer_daily_publication' | grep -v grep || true
          echo
          echo '=== LOCK ==='
          ls -l /tmp/pokemon-post-scrape-publication.lock 2>/dev/null || echo no-lock-file
          fuser -v /tmp/pokemon-post-scrape-publication.lock 2>&1 || true
          echo
          echo '=== PUBLICATION LOG ==='
          stat -c 'size=%s mtime=%y' publication.log 2>/dev/null || true
          tail -180 publication.log 2>/dev/null || true
          echo
          echo '=== DISPATCHER TAIL ==='
          tail -140 backend/logs/cron_dispatcher.log 2>/dev/null || true
          echo
          echo '=== FALLBACK PUBLICATION CRON LOG ==='
          tail -100 backend/logs/rebuild_snapshots_after_scrape.cron.log 2>/dev/null || true
