name: Deploy stalled publication recovery

on:
  push:
    branches:
      - 'ops/vm-publication-diagnostics-20260919'
    paths:
      - '.github/workflows/vm-publication-diagnostics-20260919.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Sync merged main and install canonical cron
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repos/EVRCalculator
          echo '=== BEFORE ==='
          git rev-parse HEAD
          git status --short || true
          echo
          echo '=== ACTIVE PUBLICATION ==='
          if ps -ef | grep -E 'rebuild_snapshots_after_scrape|refresh_stale_public_snapshots' | grep -v grep; then
            echo 'Refusing deploy: publication still active'
            exit 3
          fi
          EXTRA_DIRTY="$(git status --porcelain | grep -v 'payload_debug.json' || true)"
          if [ -n "$EXTRA_DIRTY" ]; then
            echo 'Refusing deploy: unexpected dirty paths:'
            echo "$EXTRA_DIRTY"
            exit 2
          fi
          if git status --porcelain -- payload_debug.json | grep -q .; then
            git stash push -m 'payload-debug-before-main-faa35538-20260920' -- payload_debug.json
          fi
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          git merge-base --is-ancestor faa35538e0a79990499d94fd6f16fa2f835f1ef8 HEAD
          echo
          echo '=== INSTALL CANONICAL CRON ==='
          crontab infra/oracle/tcgplayer-scraper-pokemon.crontab
          crontab -l > /tmp/index-cron-after-stall-recovery
          diff -u infra/oracle/tcgplayer-scraper-pokemon.crontab /tmp/index-cron-after-stall-recovery
          echo
          echo '=== AFTER ==='
          git rev-parse HEAD
          git status --short || true
          crontab -l | grep -E 'post-scrape-publication-watchdog|create_daily_scrape_batch|publish_post_scrape_if_needed' || true
          echo 'STALL_RECOVERY_DEPLOYED=true'
