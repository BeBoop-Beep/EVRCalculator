name: Treatment Set-Relative Hierarchy V1

on:
  push:
    branches:
      - research/treatment-panel-recovery-v2-current-20261001
    paths:
      - 'backend/scripts/research_treatment_set_relative_hierarchy_v1.py'
      - 'backend/tests/unit/scripts/test_research_treatment_set_relative_hierarchy_v1.py'
      - '.github/workflows/treatment-set-relative-hierarchy-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q pytest==8.3.5 numpy==2.4.3 python-dotenv==1.2.2 supabase==2.28.3
      - name: Unit tests
        run: python -m pytest -q backend/tests/unit/scripts/test_research_treatment_set_relative_hierarchy_v1.py
      - name: Download independent replication panel
        uses: actions/download-artifact@v4
        with:
          name: treatment-joint-replication-v1-panel
          path: backend/artifacts/treatment_set_relative_v1/input
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 36971438903
      - name: Fit Set-relative Treatment hierarchy
        run: |
          python backend/scripts/research_treatment_set_relative_hierarchy_v1.py \
            --panel backend/artifacts/treatment_set_relative_v1/input/panel.json \
            --output backend/artifacts/treatment_set_relative_v1/result.json \
            --report backend/artifacts/treatment_set_relative_v1/FINAL_REPORT.md
      - name: Upload Set-relative artifacts
        uses: actions/upload-artifact@v4
        with:
          name: treatment-set-relative-hierarchy-v1
          path: |
            backend/artifacts/treatment_set_relative_v1/result.json
            backend/artifacts/treatment_set_relative_v1/FINAL_REPORT.md
          if-no-files-found: error
