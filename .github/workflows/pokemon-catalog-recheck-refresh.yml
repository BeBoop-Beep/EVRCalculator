name: Pokemon Catalog Recheck Refresh

on:
  schedule:
    # Recovery slots from 09:05 through 16:05 America/Phoenix (UTC-7 year-round).
    # If the first run is deferred by an active scrape/publication lock, later
    # slots retry. After a successful recheck, provider_next_check_at advances
    # 24h, so the remaining slots become cheap no-ops.
    - cron: '5 16-23 * * *'
  workflow_dispatch:
    inputs:
      run_30th_collector_repair:
        description: "Run the retired one-time 30th Collector repair"
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pokemon-catalog-recheck-refresh.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pokemon-catalog-recheck-refresh.yml'
      - 'backend/scripts/refresh_due_pokemon_catalog_sets.py'
      - 'backend/services/pokemon_set_onboarding_recheck_service.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: pokemon-catalog-recheck-refresh
  # Temporary recovery preemption: this maintenance push must be able to cancel
  # the stale scheduled one-time repair that is occupying the production runner.
  # Restore to false after the blocked pricing recovery is complete.
  cancel-in-progress: true

jobs:
  refresh:
    # Do not let this specific maintenance push replace the stale repair with a
    # fresh self-hosted refresh job. Normal future push/schedule/manual behavior
    # remains unchanged.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[catalog-runner-preempt]') }}
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Recheck and refresh changed catalog sets
        shell: bash
        run: |
          set -euo pipefail
          exec 9>/tmp/pokemon-catalog-recheck.lock
          flock -n 9 || { echo "catalog recheck already active; safe no-op"; exit 0; }

          # Do not overlap a REAL card-price scrape or the post-scrape publisher.
          # The every-minute dispatcher can spend several minutes doing idle
          # completion/publication audits even when no scrape job exists, so its
          # process lock is not a reliable proxy for scraping activity.
          REPO=/home/ubuntu/repos/EVRCalculator
          cd "$REPO"

          set +e
          ./.venv/bin/python - <<'PY'
          from backend.db.clients.supabase_client import create_service_role_client

          client = create_service_role_client()
          active_jobs = list(
              client.table("scrape_jobs")
              .select("id,status,batch_id,market_date")
              .in_("status", ["pending", "running"])
              .limit(5)
              .execute()
              .data
              or []
          )
          active_runs = list(
              client.table("scrape_job_runs")
              .select("id,status,job_type,market_date,batch_id")
              .eq("status", "running")
              .eq("job_type", "price_scrape")
              .limit(5)
              .execute()
              .data
              or []
          )
          if active_jobs or active_runs:
              print(
                  "active price scrape detected; defer catalog refresh "
                  f"jobs={len(active_jobs)} runs={len(active_runs)}"
              )
              raise SystemExit(75)
          print("active price scrape jobs=0 runs=0")
          PY
          guard_code=$?
          set -e
          if [ "$guard_code" -eq 75 ]; then
            exit 0
          fi
          test "$guard_code" -eq 0

          exec 7>/tmp/pokemon-post-scrape-publication.lock
          flock -n 7 || { echo "post-scrape publisher active; defer catalog refresh"; exit 0; }

          git restore -- payload_debug.json backend/constants/tcg/pokemon/pokemon_era_set_sync_report.json 2>/dev/null || true
          git fetch origin main
          git switch main
          if [ -n "$(git status --porcelain)" ]; then
            echo "Refusing catalog refresh: unexpected dirty production checkout" >&2
            git status --short >&2
            exit 2
          fi
          git pull --ff-only origin main

          ./.venv/bin/python backend/scripts/refresh_due_pokemon_catalog_sets.py             --commit             --limit 25             --max-provider-requests 50

  repair_30th_collector:
    # This was a one-time Sep 23 repair. It must never run on the hourly schedule.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_30th_collector_repair }}
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Repair 30th static desirability and Collector V7 membership
        shell: bash
        run: |
          set -euo pipefail

          REPO=/home/ubuntu/repos/EVRCalculator
          PY="$REPO/.venv/bin/python"

          exec 8>/tmp/pokemon-scrape-dispatcher.lock
          flock -w 300 8
          exec 7>/tmp/pokemon-post-scrape-publication.lock
          flock -w 300 7
          exec 6>/tmp/pokemon-catalog-recheck.lock
          flock -w 300 6

          cd "$REPO"
          git restore -- payload_debug.json backend/constants/tcg/pokemon/pokemon_era_set_sync_report.json 2>/dev/null || true
          git fetch origin main --quiet
          git switch main
          git reset --hard origin/main
          test -z "$(git status --porcelain --untracked-files=no)"

          set -a
          . backend/.env
          set +a

          "$PY" -m pytest -q \
            backend/tests/unit/scripts/test_build_pokemon_set_desirability_inputs.py \
            backend/tests/unit/scripts/test_build_pokemon_collector_appeal_v6_corrected_successor.py \
            backend/tests/unit/scripts/test_operationalize_historical_rip.py \
            backend/tests/unit/services/test_pokemon_set_onboarding_service.py

          "$PY" backend/scripts/build_pokemon_set_desirability_inputs.py             --set me30thCelebration --commit --log-level INFO

          "$PY" backend/scripts/build_pokemon_set_desirability_inputs.py             --set me30thCelebrationClassicCollection --commit --log-level INFO

          "$PY" backend/scripts/operationalize_historical_rip.py             --as-of-date 2026-09-22 --commit --force-model-rebuild --reuse-current-source-authority

          "$PY" backend/scripts/build_pokemon_set_cards_snapshots.py             --set-id me30thCelebration --commit
          "$PY" backend/scripts/build_pokemon_set_cards_snapshots.py             --set-id me30thCelebrationClassicCollection --commit

          "$PY" backend/scripts/build_pokemon_set_page_snapshots.py             --set-id me30thCelebration --commit
          "$PY" backend/scripts/build_pokemon_set_page_snapshots.py             --set-id me30thCelebrationClassicCollection --commit

          echo "REPAIR_30TH_COLLECTOR_ENRICHMENT=PASS"

  probe_repair_status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record live runner and repair workflow status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners"             > /tmp/runners.json
          curl -fsS             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100"             > /tmp/runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          runners=json.load(open("/tmp/runners.json"))
          runs=json.load(open("/tmp/runs.json"))
          selected=[]
          for r in runs.get("workflow_runs") or []:
              if r.get("name") == "Pokemon Catalog Recheck Refresh" or r.get("status") in {"queued","in_progress","waiting","pending"}:
                  selected.append({
                      "id":r.get("id"),
                      "name":r.get("name"),
                      "status":r.get("status"),
                      "conclusion":r.get("conclusion"),
                      "head_sha":r.get("head_sha"),
                      "head_branch":r.get("head_branch"),
                      "event":r.get("event"),
                      "created_at":r.get("created_at"),
                      "updated_at":r.get("updated_at"),
                      "run_attempt":r.get("run_attempt"),
                  })
          out={
              "runners":[{
                  "id":x.get("id"),
                  "name":x.get("name"),
                  "status":x.get("status"),
                  "busy":x.get("busy"),
                  "labels":[y.get("name") for y in (x.get("labels") or [])],
              } for x in (runners.get("runners") or [])],
              "runs":selected[:25],
          }
          Path("ops/assistant").mkdir(parents=True,exist_ok=True)
          Path("ops/assistant/collector-repair-runner-status.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          PY
          git config user.name "inDex hosted probe"
          git config user.email "actions@users.noreply.github.com"
          git add ops/assistant/collector-repair-runner-status.json
          git commit -m "ops: record collector repair runner status" || true
          git push origin HEAD:main
