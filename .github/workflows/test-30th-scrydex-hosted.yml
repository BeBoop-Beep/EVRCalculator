name: 30th Scrydex Hosted Unit Tests
# source-fix rerun

on:
  push:
    branches: [fix/30th-scrydex-market-sync-20260922]
    paths:
      - '.github/workflows/test-30th-scrydex-hosted.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/30th-scrydex-market-sync-20260922
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: |
          python -m pip install pytest
          python -m pip install -r backend/requirements.txt
      - name: Run focused tests
        run: |
          python -m pytest -q             backend/tests/unit/db/clients/test_scrydex_pokemon_client.py             backend/tests/unit/db/clients/test_pokemon_tcg_api_client.py             backend/tests/unit/db/services/test_pokemon_tcg_image_sync_service.py             backend/tests/unit/services/test_pokemon_tcg_api_set_service.py             backend/tests/unit/services/test_pokemon_set_onboarding_service.py             backend/tests/unit/scripts/test_build_pokemon_set_desirability_inputs.py
