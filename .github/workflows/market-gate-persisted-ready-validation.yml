name: Market Gate Persisted READY Validation

on:
  push:
    branches: [fix/market-gate-persisted-ready-20260922]
    paths:
      - '.github/workflows/market-gate-persisted-ready-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/db/services/market_publication_gate.py'
      - 'backend/tests/unit/db/services/test_market_publication_gate.py'
      - '.github/workflows/market-gate-persisted-ready-validation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      JWT_SECRET: ci-placeholder-jwt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -q pytest supabase python-dotenv
      - run: python -m pytest -q backend/tests/unit/db/services/test_market_publication_gate.py
