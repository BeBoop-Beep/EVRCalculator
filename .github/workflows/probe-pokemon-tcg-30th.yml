name: Probe Pokemon TCG 30th Catalog

on:
  push:
    branches: [fix/scrape-image-enrichment-20260921]
    paths:
      - '.github/workflows/probe-pokemon-tcg-30th.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe keyless Pokemon TCG API set catalog
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request

          base = "https://api.pokemontcg.io/v2/sets"
          params = urllib.parse.urlencode({
              "page": 1,
              "pageSize": 250,
              "orderBy": "-releaseDate",
              "select": "id,name,series,releaseDate,printedTotal,total,images",
          })
          req = urllib.request.Request(
              base + "?" + params,
              headers={"Accept":"application/json","User-Agent":"EVRCalculator/1.0"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          rows = list(payload.get("data") or [])
          needles = ("30th", "celebr", "classic", "mega")
          matches = [
              row for row in rows
              if any(n in (str(row.get("name") or "") + " " + str(row.get("series") or "")).lower()
                     for n in needles)
          ]
          print("totalCount=", payload.get("totalCount"))
          print("matches=", json.dumps(matches[:100], indent=2, sort_keys=True))
          print("newest30=", json.dumps(rows[:30], indent=2, sort_keys=True))
          PY
