name: Active Branch Consolidation Diagnose

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/active-branch-consolidation-trial.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Diagnose active branch merges without pushing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "inDex consolidation"
          git config user.email "actions@users.noreply.github.com"
          branches=(
            fix/pokemon-market-membership-api-images-20260921
            ui/market-explorer-final-ux-20260921
          )
          git fetch origin "${branches[@]}" develop
          failed=0
          for branch in "${branches[@]}"; do
            echo "=== DIAGNOSE $branch ==="
            if git merge-base --is-ancestor "origin/$branch" HEAD; then
              echo "ALREADY_CONSOLIDATED $branch"
              continue
            fi
            if git merge --no-ff --no-commit "origin/$branch"; then
              echo "CLEAN_MERGE $branch"
              git reset --hard HEAD
            else
              echo "CONFLICTS $branch"
              git diff --name-only --diff-filter=U
              git status --short
              git merge --abort || true
              failed=1
            fi
          done
          exit "$failed"
