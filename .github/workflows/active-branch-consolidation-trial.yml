name: Superseded Branch Consolidation

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/active-branch-consolidation-trial.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Mark superseded active pipeline histories merged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "inDex consolidation"
          git config user.email "actions@users.noreply.github.com"
          branches=(
            fix/market-explorer-pipeline-runtime-20260921
            fix/market-explorer-v2-publication-currency-20260921
            fix/publication-fastpath-adaptive-split-20260921
            ops/market-explorer-finish-20260921
            ops/vm-market-explorer-consolidated-runtime-20260921
            ops/vm-market-explorer-post-sentinel-20260921
          )
          git fetch origin "${branches[@]}" develop
          for branch in "${branches[@]}"; do
            if git merge-base --is-ancestor "origin/$branch" HEAD; then
              echo "ALREADY_CONSOLIDATED $branch"
            else
              echo "MARK_SUPERSEDED_MERGED $branch"
              git merge -s ours --no-ff --no-edit "origin/$branch"
            fi
          done
          git diff --check origin/develop...HEAD
      - name: Reconcile concurrent develop and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop
          if ! git merge-base --is-ancestor origin/develop HEAD; then
            git merge --no-edit -X theirs origin/develop
          fi
          git push origin HEAD:develop
          echo "pushed=$(git rev-parse HEAD)"
