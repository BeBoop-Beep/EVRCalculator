name: Active Branch Consolidation

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/active-branch-consolidation-trial.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge active substantive branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "inDex consolidation"
          git config user.email "actions@users.noreply.github.com"
          branches=(
            fix/new-set-card-enrichment-20260922
            fix/market-explorer-durable-pipeline-20260921
            fix/market-explorer-ui-closure-20260921
            fix/market-explorer-direct-db-worker-20260920
            ops/pokemon-new-set-onboarding-20260920-r2
            fix/price-projection-transient-retry-20260921
            fix/publication-currency-stale-fastpath-20260921
            fix/publication-fastpath-preload-chunking-20260921
            fix/pokemon-tcg-optional-auth-20260921
          )
          git fetch origin "${branches[@]}" develop
          echo "start=$(git rev-parse HEAD)"
          for branch in "${branches[@]}"; do
            echo "=== MERGE: $branch ==="
            if git merge --no-ff --no-edit -X ours "origin/$branch"; then
              echo "MERGE_OK $branch"
            else
              echo "MERGE_CONFLICT $branch"
              git status --short
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              unresolved=0
              for path in "${conflicts[@]}"; do
                case "$path" in
                  .github/workflows/*)
                    echo "keeping develop deletion for superseded workflow conflict: $path"
                    git rm -f -- "$path"
                    ;;
                  *)
                    echo "UNRESOLVED_CONFLICT $path"
                    unresolved=1
                    ;;
                esac
              done
              if [ "$unresolved" -ne 0 ]; then
                exit 20
              fi
              git commit --no-edit
              echo "MERGE_OK_WITH_DEVELOP_WORKFLOW_DELETION $branch"
            fi
          done
          echo "merged_head=$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/tests/unit/scripts/test_run_market_explorer_daily_publication.py")
          if p.exists():
              text = p.read_text(encoding="utf-8")
              normalized = text.rstrip() + "\n"
              if normalized != text:
                  p.write_text(normalized, encoding="utf-8")
          p = Path("backend/tests/unit/db/test_market_explorer_prepared_directory_service.py")
          if p.exists():
              text = p.read_text(encoding="utf-8")
              old = 'assert market["window_movements"]["SinceTracking"]["percent"] == 20.0'
              new = 'assert abs(market["window_movements"]["SinceTracking"]["percent"] - 20.0) < 1e-9'
              if old in text:
                  p.write_text(text.replace(old, new), encoding="utf-8")
          PY
          if ! git diff --quiet; then
            git add backend/tests/unit/scripts/test_run_market_explorer_daily_publication.py backend/tests/unit/db/test_market_explorer_prepared_directory_service.py
            git commit -m "chore: normalize consolidation test precision"
          fi
          git diff --check origin/develop...HEAD
      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Run consolidation regression tests
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_ANON_KEY: test-anon-key
        run: |
          pytest -q             backend/tests/unit/db/clients/test_scrydex_pokemon_client.py             backend/tests/unit/services/test_pokemon_tcg_image_sync_catalog_sources.py             backend/tests/unit/services/test_pokemon_set_onboarding_service.py             backend/tests/unit/db/services/test_market_explorer_direct_publisher.py             backend/tests/unit/scripts/test_run_market_explorer_daily_publication.py             backend/tests/unit/db/test_market_explorer_prepared_directory_service.py             backend/tests/unit/db/services/test_price_storage_v2_projection_gate.py             backend/tests/unit/scripts/test_refresh_target_date_fastpath.py             backend/tests/unit/services/test_pokemon_tcg_api_set_service.py
      - name: Reconcile concurrent develop and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop
          if [ "$(git rev-parse origin/develop)" != "$(git merge-base HEAD origin/develop)" ]; then
            echo "develop advanced during consolidation; merging latest develop and favoring its concurrent edits on conflicts"
            git merge --no-edit -X theirs origin/develop
          fi
          git diff --check origin/develop...HEAD
          git push origin HEAD:develop
          echo "pushed=$(git rev-parse HEAD)"
