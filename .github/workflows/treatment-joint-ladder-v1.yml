name: Treatment Joint Ladder V1

on:
  push:
    branches:
      - research/treatment-panel-recovery-v2-current-20261001
    paths:
      - 'backend/scripts/research_treatment_joint_ladder_v1.py'
      - 'backend/tests/unit/scripts/test_research_treatment_joint_ladder_v1.py'
      - '.github/workflows/treatment-joint-ladder-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q pytest==8.3.5 numpy==2.4.3 python-dotenv==1.2.2 supabase==2.28.3
      - name: Unit tests
        run: python -m pytest -q backend/tests/unit/scripts/test_research_treatment_joint_ladder_v1.py

      - name: Download SIR-Ultra gate
        uses: actions/download-artifact@v4
        with:
          name: treatment-panel-gate-expansion-v2-vm
          path: backend/artifacts/treatment_joint_v1/sir_ultra
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 36961641617

      - name: Download SIR-Double Rare gate
        uses: actions/download-artifact@v4
        with:
          name: treatment-double-rare-sir-v1-vm
          path: backend/artifacts/treatment_joint_v1/sir_double
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 36970015045

      - name: Download Ultra-Double Rare gate
        uses: actions/download-artifact@v4
        with:
          name: treatment-double-rare-ultra-v1-vm
          path: backend/artifacts/treatment_joint_v1/ultra_double
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 36970310139

      - name: Fit joint Treatment ladder
        run: |
          python backend/scripts/research_treatment_joint_ladder_v1.py \
            --sir-ultra backend/artifacts/treatment_joint_v1/sir_ultra/gate_expansion.json \
            --sir-double backend/artifacts/treatment_joint_v1/sir_double/gate_expansion_double_rare_sir.json \
            --ultra-double backend/artifacts/treatment_joint_v1/ultra_double/gate_expansion_double_rare_ultra.json \
            --output backend/artifacts/treatment_joint_v1/joint_treatment_ladder_v1.json \
            --report backend/artifacts/treatment_joint_v1/JOINT_TREATMENT_LADDER_V1.md

      - name: Upload joint Treatment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joint-treatment-ladder-v1
          path: |
            backend/artifacts/treatment_joint_v1/joint_treatment_ladder_v1.json
            backend/artifacts/treatment_joint_v1/JOINT_TREATMENT_LADDER_V1.md
          if-no-files-found: error
