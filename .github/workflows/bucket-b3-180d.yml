name: Bucket B3 180D Calibration

on:
  push:
    branches:
      - issue-480-bucket-b3-180d
    paths:
      - "backend/scripts/run_market_microstructure_bucket_b3.py"
      - "backend/tests/unit/scripts/test_market_microstructure_bucket_b3.py"
      - ".github/workflows/bucket-b3-180d.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest==8.3.5
      - name: Compile B3 runner
        run: |
          python -m py_compile backend/scripts/run_market_microstructure_bucket_b3.py
      - name: Run B3 contract tests
        run: |
          python -m pytest -q backend/tests/unit/scripts/test_market_microstructure_bucket_b3.py
