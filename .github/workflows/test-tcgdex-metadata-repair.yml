name: TCGdex Metadata Repair Tests

on:
  push:
    branches: [fix/tcgdex-free-metadata-fallback-20260922]
    paths:
      - '.github/workflows/test-tcgdex-metadata-repair.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tcgdex-free-metadata-fallback-20260922
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r backend/requirements.txt
      - name: Run focused backend tests
        run: |
          python -m pytest -q             backend/tests/unit/db/clients/test_tcgdex_pokemon_client.py             backend/tests/unit/db/clients/test_pokemon_tcg_api_client.py             backend/tests/unit/db/services/test_pokemon_tcg_image_sync_service.py             backend/tests/unit/scripts/test_build_pokemon_set_desirability_inputs.py             backend/tests/unit/services/test_pokemon_set_onboarding_service.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tcgdex-free-metadata-fallback-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test lib/images/remoteImageDelivery.test.mjs
