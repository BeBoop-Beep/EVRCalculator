name: Bounded Collection Recovery
on:
  push:
    branches: [vm-ops-control]
    paths: ['.vm-ops/collection-recovery-request.json']
permissions:
  contents: read
concurrency:
  group: index-production-vm-ops-v2
  cancel-in-progress: false
jobs:
  collection:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 7
    steps:
      - name: Test, install collection-only schedule, and verify bounded progress
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          STATE=/home/ubuntu/state/db-safety
          PY="$REPO/.venv/bin/python"
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          git -C "$REPO" fetch --quiet origin vm-ops-control
          for NAME in collection_recovery.py test_collection_recovery.py; do
            git -C "$REPO" show "$SOURCE_SHA:.vm-ops/$NAME" > "$TMP/$NAME"
          done
          (cd "$TMP" && "$PY" -m unittest -v test_collection_recovery)
          "$PY" -m py_compile "$TMP/collection_recovery.py"
          git -C "$REPO" show "$SOURCE_SHA:.vm-ops/collection-recovery-request.json" > "$TMP/request.json"
          "$PY" - "$TMP/request.json" <<'PY'
          import json,sys
          request=json.load(open(sys.argv[1]))
          assert request['operation']=='restore-bounded-collection'
          assert request['preserve_publication_hold'] is True
          PY
          "$PY" "$TMP/collection_recovery.py" --install
          mkdir -p "$STATE/collection"
          umask 077
          set +e
          "$PY" "$STATE/collection_recovery.py" --tick > "$STATE/collection/first-tick.log" 2>&1
          RC=$?
          set -e
          "$PY" - "$RC" <<'PY'
          import json,sys,subprocess,re
          from pathlib import Path
          state=Path('/home/ubuntu/state/db-safety')
          lane=state/'collection'
          print(json.dumps({'first_tick_exit_code':int(sys.argv[1]),'global_hold_preserved':(state/'hold.json').exists()}))
          for name in ('authorization.json','latest_resources.json','last_stop_evidence.json','hold.json'):
            path=lane/name
            if path.exists():
              value=json.loads(path.read_text())
              value.pop('approved_incident_hold_sha256',None)
              print(json.dumps({'file':name,'state':value}))
          for path in lane.glob('*.progress.json'):
            print(json.dumps({'progress':json.loads(path.read_text())}))
          for name in ('first-tick.log','cron.log'):
            path=lane/name
            if not path.exists():continue
            with path.open('rb') as f:
              f.seek(max(0,path.stat().st_size-20000))
              text=f.read().decode(errors='replace')
            lines=[l for l in text.splitlines() if 'final status update' in l or 'batch ready' in l or l.startswith('{') or 'Traceback' in l or 'Error:' in l or 'FAILED' in l]
            print(json.dumps({'log':name,'events':[re.sub(r'eyJ[A-Za-z0-9_.-]+','<REDACTED>',l[:600]) for l in lines[-16:]]}))
          cron=subprocess.check_output(['crontab','-l'],text=True)
          print(json.dumps({'active_collection_entries':sum('collection_recovery.py --tick' in l and not l.lstrip().startswith('#') for l in cron.splitlines()),'old_disabled_entries':sum(l.startswith('# CODE_RED_DISABLED ') for l in cron.splitlines())}))
          PY
          test "$RC" = 0 -o "$RC" = 75
