name: P0 Performance Guardrails

on:
  pull_request:
    branches:
      - feature/ui_updates_and_set_market
    paths:
      - "frontend/**"
      - ".github/workflows/p0-performance-guardrails.yml"

permissions:
  contents: read

jobs:
  architecture-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run P0 architecture contracts
        run: npx tsx --test components/explore/P0PerformanceArchitecture.contract.test.mjs
      - name: Build frontend for production
        run: npm run build
      - name: Parse P0 soak script
        run: node --check .perf-audit/p0-renderer-soak.mjs
