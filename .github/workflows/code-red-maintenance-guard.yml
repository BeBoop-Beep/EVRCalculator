name: Code Red Maintenance Guard
on:
  push:
    branches: [vm-ops-control]
    paths: [".vm-ops/install-maintenance-guard.json"]
permissions:
  contents: read
concurrency:
  group: index-production-vm-ops-v2
  cancel-in-progress: false
jobs:
  contain:
    runs-on: [self-hosted, Linux, ARM64, index-production-vm]
    timeout-minutes: 5
    steps:
      - name: Test and install latched maintenance hold
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repos/EVRCalculator
          PY="$REPO/.venv/bin/python"
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          git -C "$REPO" fetch --quiet origin vm-ops-control
          for FILE in db_workload_guard.py test_db_workload_guard.py; do
            git -C "$REPO" show "$SOURCE_SHA:.vm-ops/$FILE" > "$TMP/$FILE"
          done
          (cd "$TMP" && "$PY" -m unittest -v test_db_workload_guard)
          "$PY" "$TMP/db_workload_guard.py" --install-hold
          echo '== VM deployment identity =='
          git -C "$REPO" log -3 --format='%h %cI %s'
          echo '== recent controlled operations =='
          git -C "$REPO" log origin/vm-ops-control -35 --format='%h %cI %s' -- .vm-ops/request.json
          "$PY" - <<'PY'
          import json, re, subprocess, time, os
          from pathlib import Path
          import httpx
          from dotenv import dotenv_values
          repo=Path('/home/ubuntu/repos/EVRCalculator')
          state=Path('/home/ubuntu/state/db-safety')
          def emit(k,v): print(json.dumps({'check':k,'value':v},sort_keys=True),flush=True)
          for name in ['publication.log','backend/logs/post_scrape_publication_watchdog.log']:
              path=repo/name
              if path.is_file():
                  with path.open('rb') as f:
                      f.seek(max(0,path.stat().st_size-120000))
                      text=f.read().decode(errors='replace')
                  lines=[l for l in text.splitlines() if re.search('started_at=|final exit_status=|refresh exit_status=|FAILED|ERROR|refresh-plan|rss_|relaunch|stall_|publication COMPLETE',l)]
                  sanitized=[re.sub(r'eyJ[A-Za-z0-9_.-]+','<REDACTED>',l[:400]) for l in lines[-25:]]
                  emit(name,sanitized)
          markers=('run_next_scrape_job.py','refresh_stale_public_snapshots.py','rebuild_snapshots_after_scrape.sh','backend.scripts.run_all_v2_sets','backend.scripts.run_daily_opening_publication','backend.scripts.run_market_explorer_maintained_cache_prewarm')
          found=[]
          for path in Path('/proc').iterdir():
              if path.name.isdigit() and int(path.name)!=os.getpid():
                  try:
                      if path.stat().st_uid!=os.getuid(): continue
                      args=(path/'cmdline').read_bytes().replace(b'\0',b' ').decode(errors='replace')
                      hits=[m for m in markers if m in args]
                      if hits: found.append({'pid':int(path.name),'workloads':hits})
                  except OSError: pass
          emit('remaining_known_workers',found)
          config=dotenv_values(repo/'backend/.env',interpolate=False)
          key=config.get('SUPABASE_SERVICE_ROLE_KEY')
          base='https://zwxzxuuawalvwioadhmf.supabase.co'
          if not key: raise SystemExit('metrics credential missing')
          samples=[]
          with httpx.Client(timeout=8) as c:
              for index in range(2):
                  if index: time.sleep(30)
                  started=time.monotonic()
                  r=c.get(base+'/customer/v1/privileged/metrics',auth=('service_role',key))
                  emit('metrics_status',r.status_code)
                  if r.status_code!=200: break
                  metrics={}
                  interesting=[]
                  for line in r.text.splitlines():
                      if not line or line.startswith('#'): continue
                      metric,sep,value=line.rpartition(' ')
                      try: v=float(value)
                      except ValueError: continue
                      metrics[metric]=v
                      if re.search('oom|pg_up|node_boot_time',metric): interesting.append([metric.split('{')[0],v])
                  def scalar(name):
                      return next((v for k,v in metrics.items() if k.split('{')[0]==name),None)
                  total=scalar('node_memory_MemTotal_bytes')
                  available=scalar('node_memory_MemAvailable_bytes')
                  swap=scalar('node_memory_SwapTotal_bytes')
                  free=scalar('node_memory_SwapFree_bytes')
                  committed=scalar('node_memory_Committed_AS_bytes')
                  limit=scalar('node_memory_CommitLimit_bytes')
                  report={'sample':index,'unix_time':time.time(),'available_memory_mib':round(available/1048576,1) if available else None,
                          'memory_total_mib':round(total/1048576,1) if total else None,
                          'swap_used_mib':round((swap-free)/1048576,1) if swap is not None and free is not None else None,
                          'commitment_ratio':round(committed/limit,3) if committed and limit else None,'other_metrics':interesting[:10]}
                  emit('database_resource_sample',report)
                  samples.append(report)
              for label,path in [('rest','/rest/v1/sets?select=id&limit=1'),('auth','/auth/v1/health'),('storage','/storage/v1/bucket')]:
                  t=time.monotonic()
                  try:
                      r=c.get(base+path,headers={'apikey':key,'Authorization':'Bearer '+key})
                      emit(label,{'status':r.status_code,'milliseconds':round((time.monotonic()-t)*1000)})
                  except Exception as exc: emit(label,{'error_type':type(exc).__name__})
          (state/'incident_resource_samples.json').write_text(json.dumps(samples)+'\n')
          os.chmod(state/'incident_resource_samples.json',0o600)
          PY
