name: TCGdex 30th Probe

on:
  push:
    branches: [fix/30th-scrydex-market-sync-20260922]
    paths:
      - '.github/workflows/probe-tcgdex-30th.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe free TCGdex for 30th Celebration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          base="https://api.tcgdex.net/v2/en"
          with urllib.request.urlopen(base+"/sets", timeout=20) as r:
              sets=json.load(r)
          matches=[x for x in sets if "30th celebration" in str(x.get("name") or "").casefold()]
          print("matches="+json.dumps(matches,sort_keys=True))
          assert matches, "TCGdex has no 30th Celebration match"
          for item in matches:
              sid=item["id"]
              with urllib.request.urlopen(base+"/sets/"+sid, timeout=20) as r:
                  detail=json.load(r)
              cards=detail.get("cards") or []
              print("set_detail="+json.dumps({
                  "id":sid,
                  "name":detail.get("name"),
                  "series":(detail.get("serie") or {}).get("name"),
                  "releaseDate":detail.get("releaseDate"),
                  "cardCount":detail.get("cardCount"),
                  "cardBriefCount":len(cards),
                  "logo":detail.get("logo"),
                  "symbol":detail.get("symbol"),
                  "sample":cards[:3],
              },sort_keys=True))
              if cards:
                  cid=cards[0]["id"]
                  with urllib.request.urlopen(base+"/cards/"+cid, timeout=20) as r:
                      card=json.load(r)
                  print("card_detail="+json.dumps({
                      "id":card.get("id"),
                      "name":card.get("name"),
                      "localId":card.get("localId"),
                      "category":card.get("category"),
                      "rarity":card.get("rarity"),
                      "illustrator":card.get("illustrator"),
                      "dexId":card.get("dexId"),
                      "image":card.get("image"),
                      "set":card.get("set"),
                  },sort_keys=True))
          PY
