name: Treatment PURE_TREATMENT Double Rare Ultra V1

on:
  push:
    branches:
      - research/treatment-panel-recovery-v2-current-20261001
    paths:
      - 'backend/scripts/research_treatment_pure_estimator_double_ultra_v1.py'
      - '.github/workflows/treatment-pure-estimator-double-ultra-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q pytest==8.3.5 numpy==2.4.3 python-dotenv==1.2.2 supabase==2.28.3
      - name: Reuse estimator math tests
        run: python -m pytest -q backend/tests/unit/scripts/test_research_treatment_pure_estimator_v1.py
      - name: Download frozen Double Rare Ultra gate artifact
        uses: actions/download-artifact@v4
        with:
          name: treatment-double-ultra-gate-v1-vm
          path: backend/artifacts/treatment_panel_recovery_v2/input_double_ultra
          github-token: ${{ github.token }}
          repository: BeBoop-Beep/EVRCalculator
          run-id: 37037611618
      - name: Estimate PURE_TREATMENT Double Rare Ultra
        run: |
          python backend/scripts/research_treatment_pure_estimator_double_ultra_v1.py \
            --gate-artifact backend/artifacts/treatment_panel_recovery_v2/input_double_ultra/double_ultra_gate.json \
            --output backend/artifacts/treatment_panel_recovery_v2/pure_treatment_ultra_double_v1.json \
            --report backend/artifacts/treatment_panel_recovery_v2/PURE_TREATMENT_ULTRA_DOUBLE_V1.md
      - name: Upload estimator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pure-treatment-ultra-double-v1
          path: |
            backend/artifacts/treatment_panel_recovery_v2/pure_treatment_ultra_double_v1.json
            backend/artifacts/treatment_panel_recovery_v2/PURE_TREATMENT_ULTRA_DOUBLE_V1.md
          if-no-files-found: error
